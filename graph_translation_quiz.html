<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運動學圖形 (x-t / v-t / a-t) 轉換測驗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .hidden { display: none !important; }
        /* 專門為座標軸標籤設定斜體與襯線字體，模擬物理課本數學公式風格 */
        .math-var {
            font-family: 'Times New Roman', Times, serif;
            font-style: italic;
        }
        /* 移除點擊時的預設外框 */
        button:focus { outline: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- 開始畫面 -->
    <div id="start-screen" class="flex flex-col items-center justify-center min-h-screen px-4">
        <h1 class="text-3xl sm:text-4xl font-extrabold text-indigo-700 mb-6 text-center tracking-wide">運動學圖形轉換測驗</h1>
        <p class="text-slate-600 mb-8 text-center max-w-lg leading-relaxed text-sm sm:text-base">
            系統會隨機顯示一種運動學圖形（<span class="math-var">x-t</span>、<span class="math-var">v-t</span> 或 <span class="math-var">a-t</span>）。<br>
            請觀察其特徵（不需要計算數字），並在下方分開選出對應的另外兩種圖形。
        </p>
        <button onclick="startGame()" class="text-xl px-8 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition-all duration-300 transform hover:-translate-y-1 hover:shadow-indigo-500/50">
            開始挑戰
        </button>
    </div>

    <!-- 遊戲畫面 -->
    <div id="game-screen" class="hidden max-w-5xl mx-auto p-3 sm:p-6">
        
        <!-- 計分板 -->
        <div class="mb-4 flex justify-between items-center bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200">
            <p class="text-sm sm:text-base"><span class="font-bold text-indigo-600">分數:</span> <span id="score-display" class="font-mono text-lg font-bold">0</span></p>
            <p class="text-sm sm:text-base"><span class="font-bold text-indigo-600">題數:</span> <span id="question-count-display" class="font-mono text-lg font-bold">0</span></p>
            <p class="text-sm sm:text-base"><span class="font-bold text-indigo-600">時間:</span> <span id="time-display" class="font-mono text-lg font-bold">0.0</span> <span class="text-xs text-slate-500">秒</span></p>
        </div>

        <!-- 題目區塊 -->
        <div class="mb-6 bg-white rounded-xl shadow-md border border-slate-200 p-4 flex flex-col items-center">
            <h2 class="text-lg sm:text-xl font-bold mb-3 text-slate-700">請觀察此圖形，找出對應的其他兩圖：</h2>
            <div class="h-56 sm:h-72 w-full max-w-2xl relative">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <!-- 提示訊息 -->
        <div id="alert-correct" class="hidden bg-emerald-50 border border-emerald-200 text-emerald-700 rounded-lg mb-4 p-3 shadow-sm transition-all">
            <div class="flex justify-between items-center">
                <span class="font-bold">🎉 答案正確！獲得 10 分</span>
                <button onclick="handleNextQuestion()" class="bg-emerald-500 hover:bg-emerald-600 text-white rounded font-bold text-sm py-1.5 px-4 transition-colors">下一題</button>
            </div>
        </div>
        <div id="alert-error" class="hidden bg-rose-50 border border-rose-200 text-rose-700 rounded-lg mb-4 p-3 shadow-sm transition-all">
            <div class="flex justify-between items-center mb-2">
                <span class="font-bold">❌ 答案錯誤，扣 5 分。</span>
                <button onclick="handleNextQuestion()" class="bg-rose-500 hover:bg-rose-600 text-white rounded font-bold text-sm py-1.5 px-4 transition-colors">下一題</button>
            </div>
            <p id="error-message" class="text-sm bg-white p-2 rounded border border-rose-100"></p>
        </div>

        <!-- 選項區塊：需要選擇兩種圖 -->
        <div class="grid md:grid-cols-2 gap-4 sm:gap-6">
            
            <!-- 選項群組 1 -->
            <div class="bg-slate-100 rounded-xl p-3 sm:p-4 border border-slate-200">
                <h3 id="group1-title" class="font-bold text-slate-700 mb-3 text-center sm:text-left">請選擇對應的 圖形 1：</h3>
                <div class="grid grid-cols-2 gap-2 sm:gap-3" id="group1-options">
                    <!-- 動態生成的 Canvas 放這裡 -->
                </div>
            </div>

            <!-- 選項群組 2 -->
            <div class="bg-slate-100 rounded-xl p-3 sm:p-4 border border-slate-200">
                <h3 id="group2-title" class="font-bold text-slate-700 mb-3 text-center sm:text-left">請選擇對應的 圖形 2：</h3>
                <div class="grid grid-cols-2 gap-2 sm:gap-3" id="group2-options">
                    <!-- 動態生成的 Canvas 放這裡 -->
                </div>
            </div>

        </div>
    </div>

    <!-- 結算畫面 -->
    <div id="game-over-screen" class="hidden flex-col items-center justify-center min-h-screen px-4">
        <h1 class="text-4xl font-extrabold mb-6 text-indigo-700">測驗完成！</h1>
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-slate-100 mb-8 w-full max-w-sm text-center">
            <p class="mb-3 text-lg text-slate-600">答題總數：<span id="final-question-count" class="font-bold text-indigo-600 text-xl"></span> 題</p>
            <p class="mb-3 text-lg text-slate-600">最終分數：<span class="font-bold text-emerald-500 text-2xl">100</span> 分</p>
            <p class="text-lg text-slate-600">總用時：<span id="final-time" class="font-bold text-indigo-600 text-xl"></span> 秒</p>
        </div>
        <button onclick="window.location.reload()" class="px-8 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg transition-all text-lg transform hover:-translate-y-1">
            再挑戰一次
        </button>
    </div>

    <script>
        // 遊戲狀態
        let score = 0;
        let questionCount = 0;
        let timer = 0;
        let timerInterval = null;
        
        let targetMotionId = -1;
        let mainType = '';
        let type1 = '';
        let type2 = '';
        
        // 玩家選擇狀態
        let selectedT1 = -1;
        let selectedT2 = -1;
        let hasAnswered = false;

        // 儲存所有 Chart.js 實例以便更新與銷毀
        let chartInstances = {};

        // 運動狀態名稱對照表 (僅作解答提示用)
        const motionNames = [
            "靜止", "向前等速", "向後等速", 
            "向前加速", "向前減速", "向後加速", "向後減速",
            "干擾項A", "干擾項B"
        ];

        // 產生無數字的純形狀數據 (供 x, v, a 使用)
        const getGraphData = (motionId, type) => {
            const data = [];
            for (let t = 0; t <= 10; t += 0.1) {
                let y = 0;
                if (type === 'x') {
                    // 為了在寬螢幕比例下讓弧度更明顯，使用 2.5 次方，呈現「平緩後急劇彎曲」
                    const p = 2.5; 
                    const t_norm = t / 10; 
                    
                    if (motionId === 0) y = 40;
                    if (motionId === 1) y = 80 * t_norm;
                    if (motionId === 2) y = -80 * t_norm;
                    if (motionId === 3) y = 80 * Math.pow(t_norm, p); 
                    if (motionId === 4) y = 80 * (1 - Math.pow(1 - t_norm, p)); 
                    if (motionId === 5) y = -80 * Math.pow(t_norm, p); 
                    if (motionId === 6) y = -80 * (1 - Math.pow(1 - t_norm, p)); 
                    if (motionId === 7) y = 80 * Math.pow(t_norm, 4); 
                    if (motionId === 8) y = -80 * Math.pow(t_norm, 4); 
                }
                if (type === 'v') {
                    const t_norm = t / 10;
                    if (motionId === 0) y = 0;
                    if (motionId === 1) y = 60;
                    if (motionId === 2) y = -60;
                    if (motionId === 3) y = 80 * t_norm;
                    if (motionId === 4) y = 80 * (1 - t_norm);
                    if (motionId === 5) y = -80 * t_norm;
                    if (motionId === 6) y = -80 * (1 - t_norm);
                    if (motionId === 7) y = 80 * Math.pow(t_norm, 2); 
                    if (motionId === 8) y = -80 * Math.pow(t_norm, 2); 
                }
                if (type === 'a') {
                    if ([0, 1, 2].includes(motionId)) y = 0;
                    if ([3, 6].includes(motionId)) y = 60;  // 加速度為正
                    if ([4, 5].includes(motionId)) y = -60; // 加速度為負
                    if (motionId === 7) y = 80 * (t/10); 
                    if (motionId === 8) y = -80 * (t/10); 
                }
                data.push({ time: t, value: y });
            }
            return data;
        };

        // 渲染圖表的共用函數
        const renderChart = (canvasId, type, data, isMain = false) => {
            const ctx = document.getElementById(canvasId).getContext('2d');
            
            if (chartInstances[canvasId]) {
                chartInstances[canvasId].destroy();
            }

            // 依據類型決定顏色
            let color = '#3b82f6'; // 預設藍色
            if (type === 'x') color = '#e11d48'; // 玫瑰紅
            if (type === 'v') color = '#2563eb'; // 靛藍
            if (type === 'a') color = '#059669'; // 翠綠

            const typeLabel = type === 'x' ? 'x' : type === 'v' ? 'v' : 'a';

            chartInstances[canvasId] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.map(d => d.time),
                    datasets: [{
                        data: data.map(d => d.value),
                        borderColor: color,
                        borderWidth: isMain ? 4 : 2,
                        pointRadius: 0,
                        fill: false,
                        tension: 0.1 // 關閉過度平滑，保持物理真實感
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { 
                        legend: { display: false }, 
                        tooltip: { enabled: false } 
                    },
                    animation: false,
                    layout: { 
                        // 加大上方和右方的留白空間，確保標籤不會被切掉
                        padding: {
                            right: isMain ? 40 : 30,
                            top: isMain ? 35 : 25,
                            bottom: 10,
                            left: 10
                        }
                    },
                    scales: {
                        x: {
                            title: { display: false },
                            ticks: { 
                                display: true, 
                                callback: () => '', // 清空原本自動生成的 't'，避免重複
                                maxRotation: 0,
                                autoSkip: false
                            }, 
                            grid: { 
                                color: (ctx) => ctx.tick.value === 0 ? '#1e293b' : 'transparent', // 只顯示 x 軸黑線
                                lineWidth: (ctx) => ctx.tick.value === 0 ? 2 : 0,
                                drawBorder: false,
                                tickLength: 0 // 隱藏刻度線
                            }
                        },
                        y: {
                            title: { display: false }, // 徹底關閉原本旋轉的 Y 軸標題
                            min: -100,
                            max: 100,
                            ticks: { display: false }, // 隱藏數字
                            grid: { 
                                color: (ctx) => ctx.tick.value === 0 ? '#1e293b' : 'rgba(0,0,0,0.03)', // 顯示 y=0 中線與極淡的格線
                                lineWidth: (ctx) => ctx.tick.value === 0 ? 2 : 1,
                                drawBorder: false
                            }
                        }
                    }
                },
                plugins: [{
                    id: 'customAxisLabels',
                    afterDraw: (chart) => {
                        const { ctx, scales: { x, y } } = chart;
                        const isMainChart = chart.canvas.id === 'mainChart';
                        
                        ctx.save();
                        ctx.font = `bold italic ${isMainChart ? 22 : 16}px "Times New Roman", serif`;
                        ctx.fillStyle = '#1e293b';
                        
                        // 1. 繪製正向的 Y 軸標題 (完美對齊 Y 軸正上方)
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        ctx.fillText(typeLabel, y.right, y.top - 4);

                        // 2. 繪製 X 軸標題 't' (完美對齊 X 軸最右端)
                        ctx.textAlign = 'left';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('t', x.right + 6, y.getPixelForValue(0));
                        
                        ctx.restore();
                    }
                }]
            });
        };

        // 判斷兩個 motionId 在特定圖形下是否長得一模一樣
        const isEquivalent = (id1, id2, type) => {
            if (type !== 'a') return id1 === id2; // x-t 和 v-t 每個動作都長得不一樣
            
            // a-t 圖有共用的狀態
            if ([0, 1, 2].includes(id1) && [0, 1, 2].includes(id2)) return true; // 加速度皆為 0
            if ([3, 6].includes(id1) && [3, 6].includes(id2)) return true;       // 加速度皆為正
            if ([4, 5].includes(id1) && [4, 5].includes(id2)) return true;       // 加速度皆為負
            return id1 === id2;
        };

        // 打亂陣列
        const shuffleArray = (array) => {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        };

        const generateNewQuestion = () => {
            hasAnswered = false;
            selectedT1 = -1;
            selectedT2 = -1;
            document.getElementById('alert-correct').classList.add('hidden');
            document.getElementById('alert-error').classList.add('hidden');

            questionCount++;
            document.getElementById('question-count-display').innerText = questionCount;

            // 隨機決定主圖形與選項圖形
            const types = ['x', 'v', 'a'];
            shuffleArray(types);
            mainType = types[0];
            type1 = types[1];
            type2 = types[2];

            // 隨機決定正確的運動狀態 (0~6為基礎運動)
            targetMotionId = Math.floor(Math.random() * 7); 

            // 渲染主題目圖
            renderChart('mainChart', mainType, getGraphData(targetMotionId, mainType), true);

            // 設定選項標題
            document.getElementById('group1-title').innerHTML = `請選擇對應的 <span class="math-var">${type1}-t</span> 圖：`;
            document.getElementById('group2-title').innerHTML = `請選擇對應的 <span class="math-var">${type2}-t</span> 圖：`;

            // 產生干擾選項 (從 0~8 中挑選不同的形狀)
            const getOptions = (correctId, type) => {
                let options = [correctId];
                while(options.length < 4) {
                    let rand = Math.floor(Math.random() * 9);
                    // 確保不會選到長得一模一樣的圖形作為干擾
                    let isDuplicateShape = options.some(opt => isEquivalent(opt, rand, type));
                    if (!isDuplicateShape) {
                        options.push(rand);
                    }
                }
                return shuffleArray(options);
            };

            const options1 = getOptions(targetMotionId, type1);
            const options2 = getOptions(targetMotionId, type2);

            // 建立並渲染選項按鈕
            const buildOptions = (groupId, type, options, groupIndex) => {
                const container = document.getElementById(groupId);
                container.innerHTML = '';
                
                options.forEach((optId, idx) => {
                    const btn = document.createElement('button');
                    const canvasId = `canvas-${groupIndex}-${idx}`;
                    
                    btn.className = `opt-btn-${groupIndex} bg-white rounded-lg p-1 border-2 border-slate-200 shadow-sm transition transform hover:scale-105 h-32 relative overflow-hidden`;
                    btn.onclick = () => handleSelect(groupIndex, optId, btn);
                    
                    const canvas = document.createElement('canvas');
                    canvas.id = canvasId;
                    btn.appendChild(canvas);
                    container.appendChild(btn);

                    // 渲染該選項的圖
                    renderChart(canvasId, type, getGraphData(optId, type), false);
                });
            };

            buildOptions('group1-options', type1, options1, 1);
            buildOptions('group2-options', type2, options2, 2);
        };

        const handleSelect = (groupIndex, optId, btnElement) => {
            if (hasAnswered) return;

            if (groupIndex === 1) selectedT1 = optId;
            if (groupIndex === 2) selectedT2 = optId;

            // 樣式更新：移除該群組所有按鈕的高亮，並加上被選中的高亮 (藍色粗框)
            document.querySelectorAll(`.opt-btn-${groupIndex}`).forEach(btn => {
                btn.classList.remove('ring-4', 'ring-indigo-500', 'border-transparent');
                btn.classList.add('border-slate-200');
            });
            btnElement.classList.remove('border-slate-200');
            btnElement.classList.add('ring-4', 'ring-indigo-500', 'border-transparent');

            // 檢查是否兩個都選了
            if (selectedT1 !== -1 && selectedT2 !== -1) {
                checkSubmit();
            }
        };

        const checkSubmit = () => {
            hasAnswered = true;
            
            // 驗證邏輯：判斷選中的選項形狀是否與目標等效
            const isT1Correct = isEquivalent(selectedT1, targetMotionId, type1);
            const isT2Correct = isEquivalent(selectedT2, targetMotionId, type2);

            if (isT1Correct && isT2Correct) {
                score = Math.min(score + 10, 100);
                document.getElementById('score-display').innerText = score;
                document.getElementById('alert-correct').classList.remove('hidden');
                
                if (score >= 100) clearInterval(timerInterval);
            } else {
                score = Math.max(score - 5, 0);
                document.getElementById('score-display').innerText = score;
                
                let errorMsg = `原圖形為：「${motionNames[targetMotionId]}」。<br>`;
                if (!isT1Correct) errorMsg += `<span class="math-var">${type1}-t</span> 圖選擇錯誤。 `;
                if (!isT2Correct) errorMsg += `<span class="math-var">${type2}-t</span> 圖選擇錯誤。`;
                
                document.getElementById('error-message').innerHTML = errorMsg;
                document.getElementById('alert-error').classList.remove('hidden');
            }
        };

        const startGame = () => {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            timerInterval = setInterval(() => {
                timer += 0.1;
                document.getElementById('time-display').innerText = timer.toFixed(1);
            }, 100);

            generateNewQuestion();
        };

        const handleNextQuestion = () => {
            if (score >= 100) {
                document.getElementById('game-screen').classList.add('hidden');
                document.getElementById('game-over-screen').classList.remove('hidden');
                document.getElementById('game-over-screen').classList.add('flex');
                
                document.getElementById('final-question-count').innerText = questionCount;
                document.getElementById('final-time').innerText = timer.toFixed(1);
            } else {
                generateNewQuestion();
            }
        };
    </script>
</body>
</html>
