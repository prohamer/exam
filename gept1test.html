<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GEPT單字測驗</title>
<style>
* { box-sizing: border-box; }
body {
  font-family: 'Noto Sans TC', 'Microsoft JhengHei', Arial, sans-serif;
  margin: 10px;
  background-color: #f0f0f0;
  color: #2c3e50;
  font-weight: bold;
  font-size: 18px;
}
.hidden { display: none !important; }
#app {
  max-width: 800px;
  margin: 0 auto;
  background-color: #fff;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}
h1 { text-align: center; font-size: 1.35em; margin: 10px 0 15px; }
h2 { text-align: center; font-size: 1.15em; margin: 12px 0; }
h3 { font-size: 1.05em; margin: 14px 0 8px; }
button {
  font: inherit;
  font-size: 0.85em;
  padding: 8px 14px;
  background-color: #3498db;
  color: #fff;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  margin: 3px;
}
button:hover:not(:disabled) { background-color: #2980b9; }
button:disabled { background-color: #bdbdbd !important; cursor: not-allowed; }
button.secondary { background-color: #7f8c8d; }
button.secondary:hover:not(:disabled) { background-color: #6c7a7b; }
button.danger { background-color: #e74c3c; }
button.danger:hover:not(:disabled) { background-color: #c0392b; }
button.success { background-color: #2ecc71; }
button.success:hover:not(:disabled) { background-color: #27ae60; }
select, input[type=number] {
  font: inherit;
  font-size: 0.85em;
  padding: 7px;
  border: 1px solid #ccc;
  border-radius: 4px;
  margin: 3px;
  max-width: 100%;
}
input[type=number] { width: 7em; }
input[type=checkbox] { width: 1.1em; height: 1.1em; vertical-align: middle; }
.control-panel {
  margin-bottom: 12px;
  padding: 12px 15px;
  background-color: #f8f9fa;
  border-radius: 8px;
}
.control-panel > label:first-child { display: inline-block; min-width: 5em; }
.hint { font-size: 0.75em; color: #7f8c8d; font-weight: normal; margin-top: 6px; }
.banner { padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; font-size: 0.85em; }
.banner.warn { background: #fff3cd; color: #8a6d3b; }
.banner.error { background: #ffebee; color: #c62828; }
.banner button { font-size: 0.9em; padding: 4px 10px; }
.actions { text-align: center; margin: 12px 0; }
.big-btn {
  display: block;
  width: 80%;
  max-width: 300px;
  margin: 12px auto;
  padding: 12px;
  font-size: 1em;
}

/* ---------- 測驗畫面 ---------- */
.status-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  background-color: #f0f7ff;
  padding: 8px 10px;
  margin-bottom: 12px;
  border-radius: 8px;
  font-size: 0.85em;
}
.status-item { padding: 4px 8px; border-radius: 4px; white-space: nowrap; }
.sheet-name { color: #1565c0; background-color: #e3f2fd; }
.timer { color: #e53935; background-color: #ffebee; }
.progress { color: #2e7d32; background-color: #e8f5e9; }
.status-tools { margin-left: auto; display: flex; gap: 2px; }
.status-tools button { padding: 4px 10px; margin: 0; font-size: 0.9em; }
#questionText {
  font-size: 1.2em;
  margin: 12px 0;
  padding: 12px;
  text-align: center;
  background-color: #f8f9fa;
  border-radius: 8px;
}
.q-label { color: #0066cc; }
.option {
  display: block;
  width: 80%;
  max-width: 500px;
  margin: 10px auto;
  padding: 10px;
  font-size: 1.1em;
  text-align: center;
  transition: transform 0.15s ease;
}
.option:hover:not(:disabled) { transform: translateY(-1px); }
.option .key { opacity: 0.7; font-size: 0.75em; margin-right: 8px; }
.option.is-correct { background-color: #2ecc71 !important; }
.option.is-wrong { background-color: #e74c3c !important; }
.feedback-box { margin: 10px 0; padding: 12px; border-radius: 8px; text-align: center; }
.feedback-box.correct { background-color: #fff; color: green; border: 2px solid #c8e6c9; }
.feedback-box.incorrect { background-color: #ffdc35; color: red; }
.wb-note { margin-top: 6px; font-size: 0.85em; color: #6a1b9a; }

/* ---------- 結果與回顧 ---------- */
.summary p { margin: 6px 0; }
.review-item { padding: 12px 15px; margin: 10px 0; border-radius: 8px; text-align: left; }
.review-item:nth-child(odd) { background-color: #fff3e0; }
.review-item:nth-child(even) { background-color: #e3f2fd; }
.review-item p { margin: 4px 0; }
.review-question { color: #1a237e; }
.review-wrong { color: #d32f2f; }
.review-correct { color: #2e7d32; }
.review-explanation { color: #1a237e; font-weight: normal; }
.empty { text-align: center; color: #95a5a6; padding: 20px; font-weight: normal; }

/* ---------- 錯題管理 ---------- */
.tabs { display: flex; gap: 4px; border-bottom: 2px solid #3498db; margin-bottom: 12px; }
.tab { background-color: #ecf0f1; color: #2c3e50; border-radius: 6px 6px 0 0; margin: 0; }
.tab:hover:not(:disabled) { background-color: #d6dbdf; }
.tab.active, .tab.active:hover:not(:disabled) { background-color: #3498db; color: #fff; }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 0.9em; }
.wb-list { list-style: none; padding: 0; margin: 0; }
.wb-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-bottom: 1px solid #eee; }
.wb-row:nth-child(odd) { background: #fafafa; }
.wb-row input[type=checkbox] { margin-top: 5px; flex-shrink: 0; }
.wb-main { flex: 1; min-width: 0; }
.wb-word { font-size: 1.05em; color: #1a237e; }
.wb-meaning { font-weight: normal; margin-top: 2px; }
.wb-meta { font-size: 0.75em; color: #7f8c8d; font-weight: normal; margin-top: 3px; }
.wb-row > button { padding: 4px 10px; font-size: 0.75em; flex-shrink: 0; }
.badge { display: inline-block; padding: 1px 7px; border-radius: 10px; background: #ffebee; color: #c62828; font-size: 0.7em; margin-left: 4px; vertical-align: middle; }
.badge.streak { background: #e8f5e9; color: #2e7d32; }
#sessionSelect { flex: 1; min-width: 0; }
.info-lines { font-size: 0.8em; font-weight: normal; line-height: 1.7; word-break: break-all; }
</style>
</head>
<body>
<div id="app">

  <!-- ========== 設定頁 ========== -->
  <section id="screen-setup">
    <h1 id="titleText"></h1>
    <div id="setupBanners"></div>
    <div class="control-panel">
      <label for="sheetSelect">測驗範圍：</label>
      <select id="sheetSelect"></select>
      <div class="hint" id="poolHint"></div>
    </div>
    <div class="control-panel">
      <label for="startRow">起始題號：</label>
      <input type="number" id="startRow" min="1">
      <label for="endRow">結束題號：</label>
      <input type="number" id="endRow" min="1">
    </div>
    <div class="control-panel">
      <label for="randomCount">隨機題數：</label>
      <input type="number" id="randomCount" min="1" placeholder="留空＝全部">
      <div class="hint">留空＝依範圍全部出題（順序隨機）</div>
    </div>
    <div class="control-panel">
      <label for="timeSelect">測驗時間：</label>
      <select id="timeSelect">
        <option value="5">5 分鐘</option>
        <option value="10">10 分鐘</option>
      </select>
    </div>
    <div class="control-panel">
      <label>字體大小：</label>
      <button type="button" data-font="-2">A-</button>
      <button type="button" data-font="2">A+</button>
    </div>
    <button type="button" class="big-btn success" id="startBtn">開始測驗</button>
    <button type="button" class="big-btn secondary" id="manageBtn">錯題管理</button>
  </section>

  <!-- ========== 測驗頁 ========== -->
  <section id="screen-quiz" class="hidden">
    <div class="status-bar">
      <span class="status-item sheet-name" id="sheetTitle"></span>
      <span class="status-item timer" id="timer"></span>
      <span class="status-item progress" id="progress"></span>
      <span class="status-tools">
        <button type="button" data-font="-2">A-</button>
        <button type="button" data-font="2">A+</button>
        <button type="button" class="danger" id="quitBtn">交卷</button>
      </span>
    </div>
    <div id="questionText"></div>
    <div id="options"></div>
    <div id="feedback"></div>
    <button type="button" id="nextBtn" class="big-btn success" disabled>下一題</button>
    <div class="hint" style="text-align:center">鍵盤：1–4 選答，Enter 下一題</div>
  </section>

  <!-- ========== 結果頁 ========== -->
  <section id="screen-result" class="hidden">
    <div id="resultBody"></div>
    <div class="actions">
      <button type="button" class="success" id="retestLastBtn">重測本次錯題</button>
      <button type="button" id="backHomeBtn">回到首頁</button>
      <button type="button" class="secondary" id="resultManageBtn">錯題管理</button>
    </div>
    <div id="resultReview"></div>
  </section>

  <!-- ========== 錯題管理頁 ========== -->
  <section id="screen-manage" class="hidden">
    <h2>錯題管理</h2>
    <div class="tabs">
      <button type="button" class="tab active" data-tab="book">錯題本</button>
      <button type="button" class="tab" data-tab="sessions">測驗紀錄</button>
      <button type="button" class="tab" data-tab="backup">備份</button>
    </div>

    <div id="tab-book">
      <div class="toolbar">
        <label>工作表：<select id="bookFilter"></select></label>
        <label>排序：<select id="bookSort">
          <option value="count">錯誤次數</option>
          <option value="recent">最近答錯</option>
          <option value="alpha">單字 A–Z</option>
        </select></label>
      </div>
      <div class="toolbar">
        <label><input type="checkbox" id="bookSelectAll"> 全選</label>
        <button type="button" class="success" id="bookQuiz">測驗這些錯題</button>
        <button type="button" class="danger" id="bookDeleteSelected">刪除勾選</button>
        <button type="button" class="danger" id="bookClear">清空全部錯題</button>
      </div>
      <div class="hint" id="bookCount"></div>
      <ul class="wb-list" id="bookList"></ul>
    </div>

    <div id="tab-sessions" class="hidden">
      <div class="toolbar"><select id="sessionSelect"></select></div>
      <div class="actions">
        <button type="button" class="success" id="sessionRetest">重測此次錯題</button>
        <button type="button" class="danger" id="sessionDelete">刪除此筆紀錄</button>
        <button type="button" class="danger" id="sessionClear">清空全部紀錄</button>
      </div>
      <div id="sessionDetail"></div>
    </div>

    <div id="tab-backup" class="hidden">
      <div class="control-panel">
        <h3>匯出</h3>
        <div class="info-lines" id="exportInfo"></div>
        <button type="button" class="success" id="exportBtn">匯出備份檔（JSON）</button>
      </div>
      <div class="control-panel">
        <h3>匯入</h3>
        <input type="file" id="importFile" accept=".json,application/json">
        <div style="margin:8px 0"><label><input type="checkbox" id="importSessions" checked> 一併匯入測驗紀錄</label></div>
        <button type="button" id="importBtn">匯入並合併</button>
        <div class="hint">匯入會和目前資料合併，不會覆蓋。同一個單字取較多的錯誤次數、較少的連續答對次數。</div>
      </div>
      <div class="control-panel">
        <h3>儲存狀態</h3>
        <div class="info-lines" id="storageInfo"></div>
      </div>
    </div>

    <div class="actions"><button type="button" id="manageBackBtn">回到首頁</button></div>
  </section>
</div>

  var STORE_KEY = 'vocabQuiz:' + QUIZ.id;
  var WRONG_BOOK = '__WRONG_BOOK__';   // 下拉選單中「錯題本」的內部代號
  var STREAK_TO_REMOVE = 2;            // 連續答對幾次自動移出錯題本
  var MAX_SESSIONS = 50;               // 測驗紀錄保留筆數
  var BACKUP_REMIND_DAYS = 7;          // 幾天未備份就提醒

  // ===================== 工具函式 =====================
  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(w) { return String(w == null ? '' : w).trim().replace(/\s+/g, ' ').toLowerCase(); }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function pad2(n) { return String(n).padStart(2, '0'); }
  function fmtDate(iso, withYear) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '—';
    return (withYear ? d.getFullYear() + '/' : '') + pad2(d.getMonth() + 1) + '/' + pad2(d.getDate()) +
      ' ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }
  function daysSince(iso) {
    if (!iso) return null;
    var t = new Date(iso).getTime();
    return isNaN(t) ? null : Math.floor((Date.now() - t) / 86400000);
  }
  function fmtDuration(sec) { return Math.floor(sec / 60) + ' 分 ' + (sec % 60) + ' 秒'; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function line(k, v) { return '<p>' + esc(k) + '：' + esc(v) + '</p>'; }
  function sheetLabel(v) { return v === WRONG_BOOK ? '錯題本' : v; }

  // ===================== 儲存層 =====================
  var Store = (function () {
    var ok = true;
    var state = blank();

    function blank() {
      return { version: 1, quizName: QUIZ.name, wrongBook: {}, sessions: [], lastExport: null, prefs: {} };
    }
    function sanitize(d) {
      var s = blank();
      if (d && typeof d === 'object') {
        if (d.wrongBook && typeof d.wrongBook === 'object') s.wrongBook = d.wrongBook;
        if (Array.isArray(d.sessions)) s.sessions = d.sessions;
        if (d.lastExport) s.lastExport = d.lastExport;
        if (d.prefs && typeof d.prefs === 'object') s.prefs = d.prefs;
      }
      return s;
    }
    function load() {
      var raw = null;
      try { raw = window.localStorage.getItem(STORE_KEY); }
      catch (e) { ok = false; state = blank(); return; }
      if (!raw) { state = blank(); return; }
      try {
        state = sanitize(JSON.parse(raw));
      } catch (e) {
        // 資料損毀：另存一份原始內容後重新開始，不直接丟棄
        try { window.localStorage.setItem(STORE_KEY + ':corrupt:' + Date.now(), raw); } catch (e2) {}
        state = blank();
      }
    }
    function save() {
      if (!ok) return false;
      try {
        state.quizName = QUIZ.name;
        window.localStorage.setItem(STORE_KEY, JSON.stringify(state));
        return true;
      } catch (e) {
        ok = false;
        renderBanners();
        return false;
      }
    }
    return {
      load: load,
      save: save,
      get state() { return state; },
      get ok() { return ok; }
    };
  })();

  // ===================== 錯題本 =====================
  var WrongBook = {
    size: function () { return Object.keys(Store.state.wrongBook).length; },
    list: function () {
      var book = Store.state.wrongBook;
      return Object.keys(book).map(function (k) {
        var it = book[k];
        return {
          key: k, word: it.word, meaning: it.meaning, explanation: it.explanation || '', sheet: it.sheet || '',
          wrongCount: it.wrongCount || 1, streak: it.streak || 0, lastSelected: it.lastSelected || '',
          firstWrongAt: it.firstWrongAt || it.lastWrongAt || '', lastWrongAt: it.lastWrongAt || ''
        };
      });
    },
    recordWrong: function (q, selected) {
      var key = norm(q.word);
      var now = new Date().toISOString();
      var book = Store.state.wrongBook;
      var it = book[key];
      if (it) {
        it.wrongCount = (it.wrongCount || 0) + 1;
        it.streak = 0;
        // 以最近一次答錯的內容為準（試算表修改過的中文會自然同步）
        it.word = q.word; it.meaning = q.meaning; it.explanation = q.explanation; it.sheet = q.sheet;
        it.lastSelected = selected;
        it.lastWrongAt = now;
      } else {
        book[key] = {
          word: q.word, meaning: q.meaning, explanation: q.explanation, sheet: q.sheet,
          wrongCount: 1, streak: 0, lastSelected: selected, firstWrongAt: now, lastWrongAt: now
        };
      }
      Store.save();
      return book[key];
    },
    recordCorrect: function (q) {
      var key = norm(q.word);
      var it = Store.state.wrongBook[key];
      if (!it) return null;
      it.streak = (it.streak || 0) + 1;
      if (it.streak >= STREAK_TO_REMOVE) {
        delete Store.state.wrongBook[key];
        Store.save();
        return { removed: true };
      }
      Store.save();
      return { removed: false, streak: it.streak };
    },
    remove: function (keys) {
      keys.forEach(function (k) { delete Store.state.wrongBook[k]; });
      Store.save();
    }
  };

  // ===================== 測驗紀錄 =====================
  function sortAndTrimSessions() {
    Store.state.sessions.sort(function (a, b) { return String(b.at).localeCompare(String(a.at)); });
    if (Store.state.sessions.length > MAX_SESSIONS) Store.state.sessions.length = MAX_SESSIONS;
  }
  var Sessions = {
    all: function () { return Store.state.sessions; },
    get: function (id) { return Store.state.sessions.filter(function (s) { return s.id === id; })[0] || null; },
    add: function (s) { Store.state.sessions.unshift(s); sortAndTrimSessions(); Store.save(); },
    remove: function (id) {
      Store.state.sessions = Store.state.sessions.filter(function (s) { return s.id !== id; });
      Store.save();
    },
    clear: function () { Store.state.sessions = []; Store.save(); }
  };

  // ===================== 題庫 =====================
  function sheetQuestions(name) {
    return (QUIZ.sheets[name] || []).map(function (r) {
      return { word: r[0], meaning: r[1], explanation: r[2] || '', sheet: name };
    });
  }
  function itemToQuestion(it) {
    return { word: it.word, meaning: it.meaning, explanation: it.explanation || '', sheet: it.sheet };
  }
  function sortBook(list, mode) {
    var c = list.slice();
    if (mode === 'recent') {
      c.sort(function (a, b) { return String(b.lastWrongAt).localeCompare(String(a.lastWrongAt)); });
    } else if (mode === 'alpha') {
      c.sort(function (a, b) { return norm(a.word).localeCompare(norm(b.word)); });
    } else {
      c.sort(function (a, b) {
        return (b.wrongCount - a.wrongCount) || String(b.lastWrongAt).localeCompare(String(a.lastWrongAt));
      });
    }
    return c;
  }
  function getPool(value) {
    if (value === WRONG_BOOK) return sortBook(WrongBook.list(), 'count').map(itemToQuestion);
    return sheetQuestions(value);
  }

  var ALL_WORDS = null;   // 整個檔案不重複的單字 [[正規化, 原文], ...]
  function allWords() {
    if (!ALL_WORDS) {
      var seen = {};
      ALL_WORDS = [];
      QUIZ.sheetOrder.forEach(function (n) {
        QUIZ.sheets[n].forEach(function (r) {
          var k = norm(r[0]);
          if (!seen[k]) { seen[k] = true; ALL_WORDS.push([k, r[0]]); }
        });
      });
    }
    return ALL_WORDS;
  }

  // 錯誤選項：優先取自該字的來源工作表；不足 3 個（或工作表已移除）時從全部單字補足
  function buildOptions(q) {
    var seen = {};
    seen[norm(q.word)] = true;
    var picks = [];
    function addFrom(pairs) {
      shuffle(pairs).forEach(function (p) {
        if (picks.length < 3 && !seen[p[0]]) { seen[p[0]] = true; picks.push(p[1]); }
      });
    }
    if (QUIZ.sheets[q.sheet]) addFrom(QUIZ.sheets[q.sheet].map(function (r) { return [norm(r[0]), r[0]]; }));
    if (picks.length < 3) addFrom(allWords());
    var opts = [{ text: q.word, correct: true }].concat(picks.map(function (w) { return { text: w, correct: false }; }));
    return shuffle(opts);
  }

  // ===================== 畫面切換與字體 =====================
  function showScreen(name) {
    ['setup', 'quiz', 'result', 'manage'].forEach(function (n) {
      $('screen-' + n).classList.toggle('hidden', n !== name);
    });
    window.scrollTo(0, 0);
  }

  var fontSize = 18;
  function applyFont() { document.body.style.fontSize = fontSize + 'px'; }
  function adjustFont(d) {
    fontSize = Math.max(14, Math.min(28, fontSize + d));
    applyFont();
    Store.state.prefs.fontSize = fontSize;
    Store.save();
  }

  // ===================== 設定頁 =====================
  function refreshSheetSelect() {
    var sel = $('sheetSelect');
    var prev = sel.value;
    sel.innerHTML = '';
    QUIZ.sheetOrder.forEach(function (n) {
      sel.add(new Option(n + '（' + QUIZ.sheets[n].length + '題）', n));
    });
    var cnt = WrongBook.size();
    var opt = new Option('★ 錯題本（' + cnt + '題）', WRONG_BOOK);
    opt.disabled = cnt === 0;
    sel.add(opt);

    var valid = Array.prototype.some.call(sel.options, function (o) { return o.value === prev && !o.disabled; });
    sel.value = valid ? prev : QUIZ.sheetOrder[0];
    onPoolChange();
  }

  function onPoolChange() {
    var v = $('sheetSelect').value;
    var n = getPool(v).length;
    $('startRow').value = 1;
    $('endRow').value = n;
    $('startRow').max = n;
    $('endRow').max = n;
    $('poolHint').textContent = v === WRONG_BOOK
      ? '錯題本依「錯誤次數由多到少」排序，例如第 1～10 題＝錯最多次的 10 題。'
      : '共 ' + n + ' 題';
  }

  function renderBanners() {
    var h = '';
    if (!Store.ok) {
      h += '<div class="banner error">⚠️ 這個瀏覽器無法使用本機儲存（可能是無痕模式），錯題記錄在關閉網頁後會消失。</div>';
    } else {
      var list = WrongBook.list();
      if (list.length) {
        var last = Store.state.lastExport;
        var days;
        if (last) {
          days = daysSince(last);
        } else {
          // 從未備份：從最早的錯題日期起算，避免第一次答錯就跳提醒
          var oldest = list.reduce(function (m, it) { return (!m || it.firstWrongAt < m) ? it.firstWrongAt : m; }, '');
          days = daysSince(oldest);
        }
        if (days !== null && days >= BACKUP_REMIND_DAYS) {
          h += '<div class="banner warn">錯題本有 ' + list.length + ' 題，' +
            (last ? '已 ' + days + ' 天未備份' : '尚未備份過') +
            '。<button type="button" class="secondary" id="bannerBackup">前往備份</button></div>';
        }
      }
    }
    $('setupBanners').innerHTML = h;
    var b = $('bannerBackup');
    if (b) b.addEventListener('click', function () { openManage('backup'); });
  }

  function startFromSetup() {
    var v = $('sheetSelect').value;
    var pool = getPool(v);
    if (!pool.length) { alert('這個範圍沒有題目。'); return; }

    var start = parseInt($('startRow').value, 10);
    var end = parseInt($('endRow').value, 10);
    if (isNaN(start) || isNaN(end) || start < 1 || end < start || end > pool.length) {
      alert('請輸入有效的題目範圍（1～' + pool.length + '）。');
      return;
    }

    var list = shuffle(pool.slice(start - 1, end));
    var rangeText = '第 ' + start + '～' + end + ' 題';
    var rc = parseInt($('randomCount').value, 10);
    if (!isNaN(rc) && rc > 0 && rc < list.length) {
      list = list.slice(0, rc);
      rangeText = '隨機 ' + list.length + ' 題（取自第 ' + start + '～' + end + ' 題）';
    }
    startQuiz(list, sheetLabel(v), rangeText);
  }

  // ===================== 測驗流程 =====================
  var S = { timer: null, ended: true, lastSession: null };

  function startQuiz(list, label, rangeText) {
    if (!list.length) { alert('沒有可測驗的題目。'); return; }
    clearInterval(S.timer);
    var mins = parseInt($('timeSelect').value, 10) || 5;
    S.questions = list;
    S.idx = 0;
    S.correct = 0;
    S.wrong = 0;
    S.answered = 0;
    S.wrongs = [];
    S.label = label;
    S.rangeText = rangeText;
    S.timeLimitMin = mins;
    S.startTime = new Date();
    S.endTime = new Date(S.startTime.getTime() + mins * 60000);
    S.ended = false;
    S.answeredCurrent = false;

    $('sheetTitle').textContent = label;
    showScreen('quiz');
    updateTimer();
    S.timer = setInterval(updateTimer, 1000);
    showQuestion();
  }

  function updateTimer() {
    var remain = Math.ceil((S.endTime.getTime() - Date.now()) / 1000);
    if (remain <= 0) {
      $('timer').textContent = '剩餘 0:00';
      endQuiz('timeup');
      return;
    }
    $('timer').textContent = '剩餘 ' + Math.floor(remain / 60) + ':' + pad2(remain % 60);
  }

  function updateProgress() {
    var shown = Math.min(S.idx + 1, S.questions.length);
    $('progress').textContent = '第 ' + shown + '/' + S.questions.length + ' 題｜對 ' + S.correct + '｜錯 ' + S.wrong;
  }

  function showQuestion() {
    if (S.idx >= S.questions.length) { endQuiz('done'); return; }
    var q = S.questions[S.idx];
    S.answeredCurrent = false;
    S.currentOptions = buildOptions(q);

    $('questionText').innerHTML = '<span class="q-label">Which is：</span>' + esc(q.meaning);
    var box = $('options');
    box.innerHTML = '';
    S.currentOptions.forEach(function (o, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'option';
      b.innerHTML = '<span class="key">' + (i + 1) + '</span>' + esc(o.text);
      b.addEventListener('click', function () { answer(i); });
      box.appendChild(b);
    });
    $('feedback').innerHTML = '';
    $('nextBtn').disabled = true;
    updateProgress();
  }

  function answer(i) {
    if (S.ended || S.answeredCurrent) return;
    var opt = S.currentOptions[i];
    if (!opt) return;
    var q = S.questions[S.idx];
    S.answeredCurrent = true;
    S.answered++;

    var buttons = $('options').children;
    S.currentOptions.forEach(function (o, j) {
      buttons[j].disabled = true;
      if (o.correct) buttons[j].classList.add('is-correct');
    });

    var note = '';
    if (opt.correct) {
      S.correct++;
      var r = WrongBook.recordCorrect(q);
      if (r && r.removed) note = '🎉 連續答對 ' + STREAK_TO_REMOVE + ' 次，已從錯題本移除';
      else if (r) note = '錯題本：連續答對 ' + r.streak + '/' + STREAK_TO_REMOVE;
    } else {
      S.wrong++;
      buttons[i].classList.add('is-wrong');
      var it = WrongBook.recordWrong(q, opt.text);
      S.wrongs.push({ word: q.word, meaning: q.meaning, explanation: q.explanation, sheet: q.sheet, selected: opt.text });
      note = '已記入錯題本（累計錯 ' + it.wrongCount + ' 次）';
    }

    $('feedback').innerHTML =
      '<div class="feedback-box ' + (opt.correct ? 'correct' : 'incorrect') + '">' +
      (opt.correct ? '答對了！' : '答錯了！') +
      '<br>正確答案：' + esc(q.word) +
      (q.explanation ? '<br>解釋：' + esc(q.explanation) : '') +
      (note ? '<div class="wb-note">' + esc(note) + '</div>' : '') +
      (Store.ok ? '' : '<div class="wb-note">（無法儲存，關閉網頁後記錄會消失）</div>') +
      '</div>';
    $('nextBtn').disabled = false;
    updateProgress();
  }

  function nextQuestion() {
    if (S.ended || !S.answeredCurrent) return;
    S.idx++;
    showQuestion();
  }

  function endQuiz(reason) {
    if (S.ended) return;
    S.ended = true;
    clearInterval(S.timer);

    var finish = new Date();
    var total = S.questions.length;
    var session = {
      id: uid(),
      at: finish.toISOString(),
      label: S.label,
      rangeText: S.rangeText,
      total: total,
      answered: S.answered,
      correct: S.correct,
      wrong: S.wrong,
      score: total ? Math.round(S.correct / total * 100) : 0,
      durationSec: Math.round((finish.getTime() - S.startTime.getTime()) / 1000),
      timeLimitMin: S.timeLimitMin,
      endReason: reason,
      wrongs: S.wrongs.slice()
    };
    if (session.answered > 0) Sessions.add(session);   // 一題都沒答就不留紀錄
    S.lastSession = session;

    renderResult(session);
    refreshSheetSelect();
    renderBanners();
    showScreen('result');
  }

  function summaryHtml(s) {
    var reasonText = { timeup: '時間到，自動交卷', quit: '提前交卷', done: '全部作答完畢' }[s.endReason] || '';
    return '<div class="summary">' +
      line('測驗日期時間', fmtDate(s.at, true)) +
      line('測驗範圍', s.label + '｜' + s.rangeText) +
      line('測驗時間', fmtDuration(s.durationSec) + (reasonText ? '（' + reasonText + '）' : '')) +
      line('總題數', s.total) +
      line('答對題數', s.correct) +
      line('答錯題數', s.wrong) +
      (s.total - s.answered > 0 ? line('未作答題數', s.total - s.answered) : '') +
      line('得分', s.score + ' 分') +
      '</div>';
  }

  function reviewHtml(s) {
    if (!s.wrongs.length) {
      return '<p class="empty">' + (s.answered === s.total ? '全部答對，太棒了！' : '作答的題目都沒有答錯。') + '</p>';
    }
    return '<h3>答錯題目回顧</h3>' + s.wrongs.map(function (w, i) {
      return '<div class="review-item">' +
        '<p class="review-question">題目 ' + (i + 1) + '：' + esc(w.meaning) + '</p>' +
        '<p class="review-wrong">您的答案：' + esc(w.selected) + '</p>' +
        '<p class="review-correct">正確答案：' + esc(w.word) + '</p>' +
        (w.explanation ? '<p class="review-explanation">解釋：' + esc(w.explanation) + '</p>' : '') +
        '</div>';
    }).join('');
  }

  function renderResult(s) {
    $('resultBody').innerHTML = '<h2>' + esc(s.label) + ' 測驗結果</h2>' + summaryHtml(s) +
      '<p class="hint" style="text-align:center">錯題本目前共 ' + WrongBook.size() + ' 題</p>';
    var btn = $('retestLastBtn');
    btn.classList.toggle('hidden', !s.wrongs.length);
    btn.textContent = '重測本次錯題（' + uniqueWrongs(s.wrongs).length + '題）';
    $('resultReview').innerHTML = reviewHtml(s);
  }

  function uniqueWrongs(wrongs) {
    var seen = {};
    return wrongs.filter(function (w) {
      var k = norm(w.word);
      if (seen[k]) return false;
      seen[k] = true;
      return true;
    });
  }

  function retestWrongs(wrongs, label) {
    var list = shuffle(uniqueWrongs(wrongs).map(itemToQuestion));
    startQuiz(list, label, '重測 ' + list.length + ' 題');
  }

  // ===================== 錯題管理 =====================
  var manageTab = 'book';
  var shownBook = [];

  function openManage(tab) {
    showScreen('manage');
    switchTab(tab || manageTab);
  }

  function switchTab(t) {
    manageTab = t;
    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === t);
    });
    ['book', 'sessions', 'backup'].forEach(function (n) {
      $('tab-' + n).classList.toggle('hidden', n !== t);
    });
    if (t === 'book') renderBook();
    else if (t === 'sessions') renderSessions();
    else renderBackup();
  }

  // ---- 錯題本 ----
  function renderBook() {
    var filterSel = $('bookFilter');
    var prev = filterSel.value;
    var list = WrongBook.list();

    var sheetSet = {};
    list.forEach(function (it) { sheetSet[it.sheet] = (sheetSet[it.sheet] || 0) + 1; });
    var sheetNames = Object.keys(sheetSet).sort(function (a, b) {
      var ia = QUIZ.sheetOrder.indexOf(a), ib = QUIZ.sheetOrder.indexOf(b);
      if (ia < 0) ia = 99999;
      if (ib < 0) ib = 99999;
      return (ia - ib) || a.localeCompare(b);
    });
    filterSel.innerHTML = '';
    filterSel.add(new Option('全部（' + list.length + '）', ''));
    sheetNames.forEach(function (s) {
      filterSel.add(new Option(s + (QUIZ.sheets[s] ? '' : '〔已移除〕') + '（' + sheetSet[s] + '）', s));
    });
    filterSel.value = sheetSet[prev] ? prev : '';

    var f = filterSel.value;
    shownBook = sortBook(f ? list.filter(function (it) { return it.sheet === f; }) : list, $('bookSort').value);

    $('bookClear').textContent = f ? '清空此工作表錯題' : '清空全部錯題';
    $('bookCount').textContent = '顯示 ' + shownBook.length + ' 題｜連續答對 ' + STREAK_TO_REMOVE + ' 次會自動移除';
    $('bookSelectAll').checked = false;
    ['bookQuiz', 'bookDeleteSelected', 'bookClear'].forEach(function (id) { $(id).disabled = !shownBook.length; });

    $('bookList').innerHTML = shownBook.length ? shownBook.map(function (it) {
      return '<li class="wb-row">' +
        '<input type="checkbox" class="bookChk" value="' + esc(it.key) + '">' +
        '<div class="wb-main">' +
          '<div class="wb-word">' + esc(it.word) +
            '<span class="badge">錯 ' + it.wrongCount + ' 次</span>' +
            (it.streak ? '<span class="badge streak">連對 ' + it.streak + '/' + STREAK_TO_REMOVE + '</span>' : '') +
          '</div>' +
          '<div class="wb-meaning">' + esc(it.meaning) + '</div>' +
          '<div class="wb-meta">' + esc(it.sheet) + '｜最近答錯 ' + fmtDate(it.lastWrongAt, true) +
            (it.lastSelected ? '｜曾誤選 ' + esc(it.lastSelected) : '') + '</div>' +
        '</div>' +
        '<button type="button" class="danger" data-del="' + esc(it.key) + '">刪除</button>' +
      '</li>';
    }).join('') : '<li class="empty">' + (list.length ? '這個工作表沒有錯題' : '錯題本是空的') + '</li>';
  }

  function checkedBookKeys() {
    return Array.prototype.filter.call(document.querySelectorAll('.bookChk'), function (c) { return c.checked; })
      .map(function (c) { return c.value; });
  }

  function afterBookChange() {
    renderBook();
    refreshSheetSelect();
    renderBanners();
  }

  // ---- 測驗紀錄 ----
  function renderSessions() {
    var sel = $('sessionSelect');
    var prev = sel.value;
    var list = Sessions.all();
    sel.innerHTML = '';
    if (!list.length) {
      sel.add(new Option('（尚無測驗紀錄）', ''));
      sel.disabled = true;
      $('sessionDetail').innerHTML = '<p class="empty">尚無測驗紀錄。最多保留最近 ' + MAX_SESSIONS + ' 筆。</p>';
      ['sessionRetest', 'sessionDelete', 'sessionClear'].forEach(function (id) { $(id).disabled = true; });
      return;
    }
    sel.disabled = false;
    list.forEach(function (s) {
      sel.add(new Option(fmtDate(s.at) + '｜' + s.label + '｜' + s.score + '分｜錯 ' + s.wrong + ' 題', s.id));
    });
    sel.value = Sessions.get(prev) ? prev : list[0].id;
    renderSessionDetail();
  }

  function renderSessionDetail() {
    var s = Sessions.get($('sessionSelect').value);
    if (!s) return;
    $('sessionDetail').innerHTML = '<div class="control-panel">' + summaryHtml(s) + '</div>' + reviewHtml(s) +
      '<p class="hint" style="text-align:center">共 ' + Sessions.all().length + ' 筆紀錄，最多保留最近 ' + MAX_SESSIONS + ' 筆</p>';
    $('sessionRetest').disabled = !s.wrongs.length;
    $('sessionRetest').textContent = '重測此次錯題' + (s.wrongs.length ? '（' + uniqueWrongs(s.wrongs).length + '題）' : '');
    $('sessionDelete').disabled = false;
    $('sessionClear').disabled = false;
  }

  // ---- 備份 ----
  var persistState = null;   // true / false / null(不支援)
  function requestPersist() {
    if (!(navigator.storage && navigator.storage.persisted)) return;
    navigator.storage.persisted()
      .then(function (p) { return p || (navigator.storage.persist ? navigator.storage.persist() : false); })
      .then(function (p) { persistState = !!p; })
      .catch(function () {});
  }

  function renderBackup() {
    var st = Store.state;
    var d = daysSince(st.lastExport);
    $('exportInfo').innerHTML =
      '錯題本 ' + WrongBook.size() + ' 題、測驗紀錄 ' + st.sessions.length + ' 筆<br>' +
      (st.lastExport ? '上次匯出：' + fmtDate(st.lastExport, true) + '（' + d + ' 天前）' : '尚未匯出過');
    $('storageInfo').innerHTML =
      '題庫：' + esc(QUIZ.name) + '<br>' +
      '儲存代號：' + esc(STORE_KEY) + '<br>' +
      '網頁產生時間：' + fmtDate(QUIZ.generatedAt, true) + '<br>' +
      '本機儲存：' + (Store.ok ? '可用' : '<span style="color:#c62828">無法使用</span>') + '<br>' +
      '長期保存：' + (persistState === true ? '已取得'
        : persistState === false ? '未取得（瀏覽器仍可能在長期未使用時清除資料，請定期匯出）'
        : '此瀏覽器不支援查詢') +
      '<br>資料只存在這台裝置的這個瀏覽器；換裝置請用匯出／匯入。';
  }

  function exportBackup() {
    var st = Store.state;
    var data = {
      format: 'vocabQuiz-backup',
      version: 1,
      quizId: QUIZ.id,
      quizName: QUIZ.name,
      exportedAt: new Date().toISOString(),
      wrongBook: st.wrongBook,
      sessions: st.sessions
    };
    var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var d = new Date();
    var a = document.createElement('a');
    a.href = url;
    a.download = '錯題備份_' + String(QUIZ.name).replace(/[\\/:*?"<>|]/g, '_') + '_' +
      d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);

    st.lastExport = data.exportedAt;
    Store.save();
    renderBackup();
    renderBanners();
  }

  function mergeBackup(data, withSessions) {
    var book = Store.state.wrongBook;
    var added = 0, merged = 0, sessionsAdded = 0;

    Object.keys(data.wrongBook).forEach(function (rawKey) {
      var inc = data.wrongBook[rawKey];
      if (!inc || !inc.word || !inc.meaning) return;
      var key = norm(inc.word);
      var cur = book[key];
      if (!cur) {
        book[key] = {
          word: inc.word, meaning: inc.meaning, explanation: inc.explanation || '', sheet: inc.sheet || '',
          wrongCount: inc.wrongCount || 1, streak: Math.min(inc.streak || 0, STREAK_TO_REMOVE - 1),
          lastSelected: inc.lastSelected || '', firstWrongAt: inc.firstWrongAt || inc.lastWrongAt || '',
          lastWrongAt: inc.lastWrongAt || ''
        };
        added++;
        return;
      }
      var newer = String(inc.lastWrongAt || '') > String(cur.lastWrongAt || '') ? inc : cur;
      var firsts = [cur.firstWrongAt, inc.firstWrongAt].filter(Boolean).sort();
      book[key] = {
        word: newer.word, meaning: newer.meaning, explanation: newer.explanation || '', sheet: newer.sheet || '',
        wrongCount: Math.max(cur.wrongCount || 1, inc.wrongCount || 1),
        streak: Math.min(cur.streak || 0, inc.streak || 0),
        lastSelected: newer.lastSelected || '',
        firstWrongAt: firsts[0] || newer.lastWrongAt || '',
        lastWrongAt: newer.lastWrongAt || ''
      };
      merged++;
    });

    if (withSessions && Array.isArray(data.sessions)) {
      var ids = {};
      Store.state.sessions.forEach(function (s) { ids[s.id] = true; });
      data.sessions.forEach(function (s) {
        if (s && s.id && s.at && !ids[s.id] && Array.isArray(s.wrongs)) {
          Store.state.sessions.push(s);
          ids[s.id] = true;
          sessionsAdded++;
        }
      });
      sortAndTrimSessions();
    }
    return { added: added, merged: merged, sessionsAdded: sessionsAdded };
  }

  function importBackup() {
    var f = $('importFile').files[0];
    if (!f) { alert('請先選擇備份檔。'); return; }
    var withSessions = $('importSessions').checked;
    var reader = new FileReader();
    reader.onload = function () {
      var data;
      try { data = JSON.parse(reader.result); }
      catch (e) { alert('檔案格式錯誤，無法讀取。'); return; }
      if (!data || data.format !== 'vocabQuiz-backup' || !data.wrongBook || typeof data.wrongBook !== 'object') {
        alert('這不是錯題備份檔。');
        return;
      }
      if (data.quizId !== QUIZ.id &&
          !confirm('這個備份來自另一份題庫「' + (data.quizName || '未知') + '」，和目前的題庫「' + QUIZ.name + '」不同。\n仍要合併匯入嗎？')) {
        return;
      }
      var r = mergeBackup(data, withSessions);
      Store.save();
      $('importFile').value = '';
      alert('匯入完成：\n錯題本新增 ' + r.added + ' 筆、合併 ' + r.merged + ' 筆' +
        (withSessions ? '\n測驗紀錄新增 ' + r.sessionsAdded + ' 筆' : ''));
      renderBackup();
      refreshSheetSelect();
      renderBanners();
    };
    reader.onerror = function () { alert('讀取檔案失敗。'); };
    reader.readAsText(f);
  }

  // ===================== 事件綁定 =====================
  function bindEvents() {
    Array.prototype.forEach.call(document.querySelectorAll('[data-font]'), function (b) {
      b.addEventListener('click', function () { adjustFont(parseInt(b.getAttribute('data-font'), 10)); });
    });

    $('sheetSelect').addEventListener('change', onPoolChange);
    $('timeSelect').addEventListener('change', function () {
      Store.state.prefs.timeMin = $('timeSelect').value;
      Store.save();
    });
    $('startBtn').addEventListener('click', startFromSetup);
    $('manageBtn').addEventListener('click', function () { openManage(); });

    $('nextBtn').addEventListener('click', nextQuestion);
    $('quitBtn').addEventListener('click', function () {
      if (confirm('確定要提前交卷嗎？未作答的題目不會記入錯題本。')) endQuiz('quit');
    });

    $('retestLastBtn').addEventListener('click', function () {
      if (S.lastSession && S.lastSession.wrongs.length) retestWrongs(S.lastSession.wrongs, S.lastSession.label + '（重測）');
    });
    $('backHomeBtn').addEventListener('click', function () { renderBanners(); showScreen('setup'); });
    $('resultManageBtn').addEventListener('click', function () { openManage(); });

    Array.prototype.forEach.call(document.querySelectorAll('.tab'), function (b) {
      b.addEventListener('click', function () { switchTab(b.getAttribute('data-tab')); });
    });
    $('manageBackBtn').addEventListener('click', function () { refreshSheetSelect(); renderBanners(); showScreen('setup'); });

    // 錯題本
    $('bookFilter').addEventListener('change', renderBook);
    $('bookSort').addEventListener('change', renderBook);
    $('bookSelectAll').addEventListener('change', function () {
      var on = $('bookSelectAll').checked;
      Array.prototype.forEach.call(document.querySelectorAll('.bookChk'), function (c) { c.checked = on; });
    });
    $('bookList').addEventListener('click', function (e) {
      var btn = e.target.closest('[data-del]');
      if (!btn) return;
      var key = btn.getAttribute('data-del');
      var it = Store.state.wrongBook[key];
      if (it && confirm('確定刪除「' + it.word + '」這筆錯題？')) {
        WrongBook.remove([key]);
        afterBookChange();
      }
    });
    $('bookDeleteSelected').addEventListener('click', function () {
      var keys = checkedBookKeys();
      if (!keys.length) { alert('請先勾選要刪除的錯題。'); return; }
      if (confirm('確定刪除勾選的 ' + keys.length + ' 筆錯題？')) {
        WrongBook.remove(keys);
        afterBookChange();
      }
    });
    $('bookClear').addEventListener('click', function () {
      var f = $('bookFilter').value;
      var keys = shownBook.map(function (it) { return it.key; });
      if (!keys.length) return;
      var msg = f ? '確定清空「' + f + '」的 ' + keys.length + ' 筆錯題？' : '確定清空全部 ' + keys.length + ' 筆錯題？此動作無法復原。';
      if (confirm(msg)) {
        WrongBook.remove(keys);
        afterBookChange();
      }
    });
    $('bookQuiz').addEventListener('click', function () {
      var keys = checkedBookKeys();
      var items = keys.length
        ? shownBook.filter(function (it) { return keys.indexOf(it.key) >= 0; })
        : shownBook;
      if (!items.length) return;
      var f = $('bookFilter').value;
      startQuiz(shuffle(items.map(itemToQuestion)), '錯題本' + (f ? '－' + f : ''),
        (keys.length ? '勾選 ' : '') + items.length + ' 題');
    });

    // 測驗紀錄
    $('sessionSelect').addEventListener('change', renderSessionDetail);
    $('sessionRetest').addEventListener('click', function () {
      var s = Sessions.get($('sessionSelect').value);
      if (s && s.wrongs.length) retestWrongs(s.wrongs, s.label + '（重測 ' + fmtDate(s.at) + '）');
    });
    $('sessionDelete').addEventListener('click', function () {
      var s = Sessions.get($('sessionSelect').value);
      if (s && confirm('確定刪除「' + fmtDate(s.at) + '｜' + s.label + '」這筆紀錄？\n（不影響錯題本）')) {
        Sessions.remove(s.id);
        renderSessions();
      }
    });
    $('sessionClear').addEventListener('click', function () {
      if (confirm('確定清空全部 ' + Sessions.all().length + ' 筆測驗紀錄？\n（不影響錯題本）此動作無法復原。')) {
        Sessions.clear();
        renderSessions();
      }
    });

    // 備份
    $('exportBtn').addEventListener('click', exportBackup);
    $('importBtn').addEventListener('click', importBackup);

    // 鍵盤操作（只在測驗畫面）
    document.addEventListener('keydown', function (e) {
      if ($('screen-quiz').classList.contains('hidden')) return;
      if (/^[1-4]$/.test(e.key)) {
        e.preventDefault();
        answer(parseInt(e.key, 10) - 1);
      } else if (e.key === 'Enter') {
        e.preventDefault();   // 避免焦點在按鈕上時重複觸發
        nextQuestion();
      }
    });

    // 同時開了兩個分頁時，同步另一個分頁寫入的資料
    window.addEventListener('storage', function (e) {
      if (e.key !== STORE_KEY) return;
      Store.load();
      if (!$('screen-setup').classList.contains('hidden')) { refreshSheetSelect(); renderBanners(); }
    });
  }

  // ===================== 初始化 =====================
  function init() {
    Store.load();
    document.title = QUIZ.title;
    $('titleText').textContent = QUIZ.title;

    fontSize = parseInt(Store.state.prefs.fontSize, 10) || 18;
    applyFont();
    if (Store.state.prefs.timeMin && $('timeSelect').querySelector('option[value="' + Store.state.prefs.timeMin + '"]')) {
      $('timeSelect').value = Store.state.prefs.timeMin;
    }

    bindEvents();
    refreshSheetSelect();
    renderBanners();
    requestPersist();
  }

  init();
})();
</script>
</body>
</html>
