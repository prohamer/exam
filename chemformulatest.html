<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
 <title>化學式測驗</title>
 <style>
body { 
  font-family: 'Noto Sans TC', Arial, sans-serif; 
  margin: 10px;
  background-color: #f0f0f0;
  color: #2c3e50;
  font-weight: bold;
  font-size: 18px;
}
.hidden { display: none; }
#quizContainer { 
  max-width: 800px; 
  margin: 0 auto;
  background-color: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}
.option { 
  display: block; 
  width: 80%; 
  max-width: 500px;
  padding: 8px; 
  margin: 10px auto; 
  background-color: #3498db; 
  color: white;
  border: none; 
  border-radius: 5px; 
  cursor: pointer; 
  /*font-size: 16px;*/
  font-weight: bold;
  transition: all 0.3s ease;
  text-align: center;
}
.option:hover { 
  background-color: #2980b9;
  transform: translateY(-1px);
}
.time-display {
  color: #2c3e50;
  font-weight: bold;
  flex-grow: 1;
  text-align: center;
}
.question-info {
  color: #2c3e50;
  font-weight: bold;
  text-align: center;
  padding: 0 15px;
}
.result { 
  margin: 15px 0; 
  padding: 15px;
  border-radius: 8px;
  background-color: #f8f9fa;
  text-align: center;
}
.font-controls {
  display: flex;
  gap: 4px;
}

.font-controls button {
  padding: 4px 12px;
  min-width: 36px;
}
.status-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #f8f9fa;
  padding: 8px;
  border-radius: 6px;
  margin-bottom: 10px;
}
.control-panel { 
  margin-bottom: 15px;
  padding: 15px;
  background-color: #f8f9fa;
  border-radius: 8px;
}
.next-btn {

  max-width: 300px;
  margin: 15px auto;
  padding: 12px;
  background-color: #2ecc71;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  /*font-size: 16px;*/
  font-weight: bold;
}
.next-btn:disabled {
  background-color: #bdbdbd;
  cursor: not-allowed;
}
.feedback { 
  margin: 10px 0;
  padding: 12px;
  border-radius: 8px;
  /*font-size: 16px;*/
  text-align: center;
}
.correct { 
  background-color: #FFFFFF;
  color: green;
  font-weight: bold;
}
.incorrect { 
  background-color: #FFDC35;
  color: red;
  font-weight: bold;
}
#timer {
  font-size: 18px;
  font-weight: bold;
  margin: 8px 0;
  padding: 8px;
  background-color: #f8f9fa;
  border-radius: 6px;
  text-align: center;
  color: #2c3e50;
}
#progress {
  font-size: 16px;
  font-weight: bold;
  margin: 8px 0;
  padding: 8px;
  background-color: #f8f9fa;
  border-radius: 6px;
  text-align: center;
  color: #2c3e50;
}
#questionText {
  /*size: 18px;*/
  font-weight: bold;
  margin: 12px 0;
  padding: 12px;
  text-align: center;
  background-color: #f8f9fa;
  border-radius: 8px;
  color: #2c3e50;
}
button {
  padding: 8px 15px;
  background-color: #3498db;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
  margin: 0 5px;
  font-size: 14px;
}
button:hover {
  background-color: #2980b9;
}
select, input {
  padding: 8px;
  border: 1px solid #ddd;
  border-radius: 4px;
  margin: 0 5px;
  font-size: 14px;
}
h1 {
  color: #2c3e50;
  margin: 15px 0;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
}
h2 {
  color: #2c3e50;
  margin: 15px 0;
  font-size: 20px;
  font-weight: bold;
}
.result p {
  margin: 8px 0;
  color: #2c3e50;
  font-size: 16px;
  text-align: left;
}
label {
  color: #2c3e50;
  margin-right: 8px;
  font-weight: bold;
}
/* 更新結果和回顧區塊的樣式 */

.review-item {
  padding: 15px;
  margin: 10px 0;
  border-radius: 8px;
  text-align: left;  /* 確保靠左對齊 */
}

/* 奇數項目用淡黃色 */
.review-item:nth-child(odd) {
  background-color: #fff3e0;  /* 淡黃色 */
}

/* 偶數項目用淡藍色 */
.review-item:nth-child(even) {
  background-color: #e3f2fd;  /* 淡藍色 */
}

/* 保持標題置中 */
.result h2, .result h3 {
  text-align: center;
}

/* 保持測驗結果摘要置中 */
.result-summary {
  text-align: center;
}

.control-panel label {
  display: inline-block;
  min-width: 80px;
}
/* 狀態列容器 */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #f0f7ff;
  padding: 8px 12px;
  margin-bottom: 12px;
  border-radius: 8px;
  gap: 8px;
}

/* 各項資訊的樣式 */
.status-item {
  padding: 4px 8px;
  border-radius: 4px;
  font-weight: bold;
  white-space: nowrap;
}


.status-row-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  padding-bottom: 6px;
  border-bottom: 1px solid #e0e0e0;
}

/* 工作表名稱 */
.sheet-name {
  color: #1565c0;
  background-color: #e3f2fd;
  flex-grow: 0;
}

.status-row-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 16px;
}

/* 時間顯示 */
.timer {
  color: #e53935;
  background-color: #ffebee;
}

/* 進度顯示 */
.progress {
  color: #2e7d32;
  background-color: #e8f5e9;
}

/* 字體控制按鈕組 */
.font-controls {
  display: flex;
  gap: 4px;
  margin-left: auto;
}

.font-controls button {
  padding: 4px 12px;
  min-width: 36px;
  background-color: #64b5f6;
  border-radius: 4px;
}

/* 添加這些 CSS 樣式給答案回顧 */
.review-question, .review-explanation {
  color: #1a237e;  /* 深藍色 */
  font-weight: bold;
}

.review-wrong {
  color: #d32f2f;  /* 紅色 */
  font-weight: bold;
}

.review-correct {
  color: #2e7d32;  /* 綠色 */
  font-weight: bold;
}

   let questions = allSheetData[Object.keys(allSheetData)[0]];
   let currentQuestions = [];
   let currentIndex = 0;
   let correctCount = 0;
   let wrongCount = 0;
   let timeLeft = 0;
   let timer;
   let fontSize = 20;
   let wrongAnswers = [];
   let startTime;
   let canProceed = false;
   let endTime; // 新增變數記錄結束時間
   
   function init() {
	  const sheetSelect = document.getElementById('sheetSelect');
	  ["常見化學式","常見離子"].forEach(name => {
		const option = document.createElement('option');
		option.value = option.text = name;
		sheetSelect.add(option);
	  });
	  
	  sheetSelect.value = Object.keys(allSheetData)[0];
		questions = allSheetData[sheetSelect.value];
		document.getElementById('startRow').value = 1;
		// 扣除標題列
		document.getElementById('endRow').value = questions.length - 1;
		
		sheetSelect.addEventListener('change', function() {
			questions = allSheetData[this.value];
			document.getElementById('endRow').value = questions.length - 1;
		});
	}
   
   function startQuiz() {
    const timeLimit = document.getElementById('timeSelect').value * 60;
    const startRow = parseInt(document.getElementById('startRow').value);
    const endRow = parseInt(document.getElementById('endRow').value);
    
    if (isNaN(startRow) || isNaN(endRow) || startRow > endRow || endRow > questions.length) {
      alert('請輸入有效的題目範圍');
      return;
    }
    
    currentQuestions = prepareQuestions(startRow-1, endRow-1);
    if (currentQuestions.length === 0) {
      alert('無法取得題目');
      return;
    }
    
    currentIndex = 0;
    correctCount = wrongCount = 0;
    wrongAnswers = [];
    startTime = new Date();
    endTime = new Date(startTime.getTime() + timeLimit * 1000);
    canProceed = false;
    
    document.getElementById('setup').classList.add('hidden');
    document.getElementById('quiz').classList.remove('hidden');
    document.getElementById('result').classList.add('hidden');
    document.getElementById('feedback').innerHTML = '';
    document.getElementById('nextBtn').disabled = true;
    
    updateTimer();
    timer = setInterval(updateTimer, 1000);
    
    showQuestion();
  }
   
   function updateTimer() {
	  const now = new Date();
	  const remainingTime = Math.floor((endTime - now) / 1000);
	  
	  if (remainingTime <= 0) {
		endQuiz();
		return;
	  }
	  
	  const minutes = Math.floor(remainingTime / 60);
	  const seconds = remainingTime % 60;
	  document.getElementById('timer').textContent = 
		'剩餘時間: ' + minutes + ':' + String(seconds).padStart(2, '0');
	}
   
   function prepareQuestions(start, end) {
    // 確保排除標題列
		const startIndex = start + 1;  // +1 是因為要從第二列開始
		const endIndex = end + 2;      // +2 是因為要包含結束列，且 slice 是 exclusive
		const rangeQuestions = questions.slice(startIndex, endIndex);
		return rangeQuestions.sort(() => Math.random() - 0.5);
	}
   
   function adjustFontSize(change) {
	  fontSize = Math.max(14, Math.min(24, fontSize + change));

	  // 調整問題文字大小
	  const questionText = document.getElementById('questionText');
	  if (questionText) {
		questionText.style.fontSize = (fontSize + 4) + 'px';
	  }

	  // 調整所有選項文字大小
	  const options = document.getElementsByClassName('option');
	  for (let option of options) {
		option.style.fontSize = (fontSize + 2) + 'px';
	  }

	  // 調整其他元素
	  const timer = document.getElementById('timer');
	  if (timer) {
		timer.style.fontSize = (fontSize + 2) + 'px';
	  }

	  const progress = document.getElementById('progress');
	  if (progress) {
		progress.style.fontSize = fontSize + 'px';
	  }

	  // 調整工作表名稱
	  const sheetTitle = document.getElementById('sheetTitle');
	  if (sheetTitle) {
		sheetTitle.style.fontSize = fontSize + 'px';
	  }

	  // 調整答案回饋
	  const feedback = document.getElementById('feedback');
	  if (feedback) {
		feedback.style.fontSize = fontSize + 'px';
	  }
	}
   
   function showQuestion() {
    if (currentIndex >= currentQuestions.length) {
      endQuiz();
      return;
    }

    const question = currentQuestions[currentIndex];
    document.getElementById('questionText').innerHTML = 
      '<span style="color: #0066CC;">Which is：</span>' + question[1]; // 改用 question[1] (B欄)
    document.getElementById('sheetTitle').textContent = document.getElementById('sheetSelect').value;

	 const correctAnswer = question[0];// 改用 question[0] (A欄)
	 const explanation = question[2] || '';
	 
	 // 修改這部分，從第二列開始抓取答案選項
    let wrongOptions = questions
      .slice(1)  // 從第二列開始
      .filter(q => q[0] !== correctAnswer && q[0])  // 過濾掉正確答案和空值
      .map(q => q[0])  
      .sort(() => Math.random() - 0.5)
      .slice(0, 3);
	 
	 const options = [correctAnswer, ...wrongOptions].sort(() => Math.random() - 0.5);
	 
	 const optionsContainer = document.getElementById('options');
	 optionsContainer.innerHTML = '';
	 options.forEach((option, index) => {
	   const div = document.createElement('div');
	   div.className = 'option';
	   div.textContent = option;
	   div.onclick = () => checkAnswer(option, correctAnswer, explanation);
	   optionsContainer.appendChild(div);
	 });
	 
	 document.getElementById('progress').textContent = 
	   (currentIndex + 1) + '/' + currentQuestions.length + '題 | 答對:' + correctCount + ' | 答錯:' + wrongCount;
	 
	 document.getElementById('feedback').innerHTML = '';
	 document.getElementById('nextBtn').disabled = true;
	 canProceed = false;
	}
   
   function checkAnswer(selected, correct, explanation) {
     if (canProceed) return;
     
     const isCorrect = selected === correct;
     if (isCorrect) {
       correctCount++;
     } else {
       wrongCount++;
       wrongAnswers.push({
         question: currentQuestions[currentIndex][1],// 改用 [1] (B欄)
         selected: selected,
         correct: correct,
         explanation: explanation
       });
     }
     
     document.getElementById('feedback').innerHTML = 
       '<div class="' + (isCorrect ? 'correct' : 'incorrect') + '">' +
       (isCorrect ? '答對了！' : '答錯了！') +
       '<br>正確答案：' + correct +
       (explanation ? '<br>解釋：' + explanation : '') +
       '</div>';
     
     document.getElementById('nextBtn').disabled = false;
     canProceed = true;
     
     document.getElementById('progress').textContent = 
       '題目 ' + (currentIndex + 1) + '/' + currentQuestions.length + ' | 答對: ' + correctCount + ' | 答錯: ' + wrongCount;
   }
   
   function nextQuestion() {
     if (!canProceed) return;
     currentIndex++;
     showQuestion();
   }
   
   
   function endQuiz() {
    clearInterval(timer);
    const endTime = new Date();
    const duration = Math.floor((endTime - startTime) / 1000);
    
    // 計算答對率百分比
    const finalScore = Math.round((correctCount / currentQuestions.length) * 100) || 0;
    
    document.getElementById('quiz').classList.add('hidden');
    document.getElementById('result').classList.remove('hidden');
    
    let resultHTML = 
        '<h2>' + document.getElementById('sheetSelect').value + ' 測驗結果</h2>' +
        '<p>測驗日期時間: ' + endTime.toLocaleString() + '</p>' +
        '<p>測驗時間: ' + Math.floor(duration/60) + '分' + duration%60 + '秒</p>' +
        '<p>總題數: ' + currentQuestions.length + '</p>' +
        '<p>答對題數: ' + correctCount + '</p>' +
        '<p>答錯題數: ' + wrongCount + '</p>' +
        '<p>得分: ' + finalScore + ' 分</p>';  // 顯示百分比分數
     
     if (wrongAnswers.length > 0) {
       resultHTML += '<h3>答錯題目回顧：</h3>';
		  wrongAnswers.forEach((item, index) => {
			resultHTML += 
			  '<div class="review-item">' +
			  '<p class="review-question">題目 ' + (index + 1) + ': ' + item.question + '</p>' +
			  '<p class="review-wrong">您的答案: ' + item.selected + '</p>' +
			  '<p class="review-correct">正確答案: ' + item.correct + '</p>' +
			  (item.explanation ? '<p class="review-explanation">解釋: ' + item.explanation + '</p>' : '') +
			  '</div>';
		  });
     }
     
     document.getElementById('result').innerHTML = resultHTML;
   }
   
   function adjustFontSize(change) {
     fontSize = Math.max(14, Math.min(24, fontSize + change));
     document.body.style.fontSize = fontSize + 'px';
   }
 </script>
</head>
<body onload="init()">
 <div id="quizContainer">
   <div id="setup">
     <h1>化學式測驗</h1>
     <div class="control-panel">
       <label>選擇工作表：</label>
       <select id="sheetSelect"></select>
     </div>
     <div class="control-panel">
       <label>起始題號：</label>
       <input type="number" id="startRow" min="1">
       <label>結束題號：</label>
	   <input type="number" id="endRow" min="1">
     </div>
     <div class="control-panel">
       <label>測驗時間：</label>
       <select id="timeSelect">
         <option value="5">5分鐘</option>
         <option value="8">8分鐘</option>
       </select>
     </div>
     <div class="control-panel">
       <label>字體大小：</label>
       <button onclick="adjustFontSize(-2)">A-</button>
       <button onclick="adjustFontSize(2)">A+</button>
     </div>
     <button onclick="startQuiz()">開始測驗</button>
   </div>
   
   <div id="quiz" class="hidden">
    <div class="status-bar">
	  <div class="status-item sheet-name" id="sheetTitle"></div>
	  <div class="status-item timer" id="timer"></div>
	  <div class="status-item progress" id="progress"></div>
	  <div class="font-controls">
		<button onclick="adjustFontSize(-2)">A-</button>
		<button onclick="adjustFontSize(2)">A+</button>
	  </div>
	</div>
    
    <div id="questionText"></div>
    <div id="options"></div>
    <div id="feedback"></div>
    <button id="nextBtn" onclick="nextQuestion()" class="next-btn" disabled>下一題</button>
  </div>
  
  <div id="result" class="hidden"></div>
</div>
</body>
</html>
