<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1200typing</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        html { font-size: 16px; }
        body {
            font-family: Arial, "Microsoft JhengHei", sans-serif;
            background-color: #f0f4f8;
            color: #2d3748;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 1rem; }
        .card {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
        }
        #currentWord {
            font-size: 2.25rem;
            color: #2b6cb0;
            word-break: break-word;
        }
        #currentMeaning {
            font-size: 1.125rem;
            color: #6C3365;
            font-weight: bold;
        }
        .btn {
            transition: all 0.3s ease;
            border-radius: 0.375rem;
            font-weight: bold;
            padding: 0.5rem 1rem;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        input, select {
            border: 2px solid #e2e8f0;
            border-radius: 0.375rem;
            padding: 0.5rem;
            width: 100%;
            transition: all 0.3s ease;
        }
        input:focus, select:focus {
            border-color: #4299e1;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5);
            outline: none;
        }
        .no-select {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        input { user-select: text; -webkit-user-select: text; }
    </style>
</head>
<body class="no-select">
    <!-- 設定畫面 -->
    <div id="settingsScreen" class="container py-8">
        <div class="card">
            <h1 class="text-3xl font-bold text-center text-blue-600 mb-6">1200英文與符號打字練習</h1>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">選擇練習類型</label>
                    <select id="sheetSelect"></select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">設定字母範圍</label>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">起始字母</label>
                            <select id="startLetter"></select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">結束字母</label>
                            <select id="endLetter"></select>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">題數（從範圍內隨機抽出）</label>
                    <div class="flex space-x-2">
                        <input id="questionCount" type="number" min="1" step="1" inputmode="numeric">
                        <button id="allQuestions" type="button" class="btn bg-gray-200 hover:bg-gray-300 whitespace-nowrap">全部</button>
                    </div>
                    <p id="availableHint" class="text-xs text-gray-500 mt-1"></p>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">測驗時間</label>
                    <select id="testDuration">
                        <option value="300">5分鐘</option>
                        <option value="600">10分鐘</option>
                        <option value="900">15分鐘</option>
                        <option value="1200">20分鐘</option>
                    </select>
                </div>
            </div>

            <button id="startTest" class="btn w-full bg-blue-500 hover:bg-blue-600 text-white">開始測驗</button>
        </div>
    </div>

    <!-- 測驗畫面 -->
    <div id="testScreen" class="container py-8 hidden">
        <div class="card">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-blue-600">單字與符號打字練習</h2>
                <div class="space-x-2">
                    <button id="decreaseFont" class="btn bg-gray-200 hover:bg-gray-300 px-2 py-1">A-</button>
                    <button id="increaseFont" class="btn bg-gray-200 hover:bg-gray-300 px-2 py-1">A+</button>
                </div>
            </div>

            <div class="bg-blue-100 p-3 rounded-md mb-4 flex justify-between items-center">
                <span>剩餘時間：<span id="timer" class="font-bold"></span></span>
                <span>進度：<span id="progress" class="font-bold">0/0</span></span>
            </div>

            <div class="text-center mb-6">
                <p id="currentWord" class="mb-2"></p>
                <p id="currentMeaning"></p>
            </div>

            <div class="mb-4">
                <input id="userInput" type="text" autocomplete="off" autocorrect="off"
                       autocapitalize="off" spellcheck="false"
                       placeholder="請輸入單字並按 Enter 鍵提交">
            </div>

            <div class="flex space-x-4">
                <button id="speakWord" class="btn flex-1 bg-blue-500 hover:bg-blue-600 text-white">朗讀</button>
            </div>

            <div id="result" class="mt-4 text-center font-bold" style="min-height: 1.5em;"></div>
        </div>
    </div>

    <!-- 結果畫面 -->
    <div id="resultScreen" class="container py-8 hidden">
        <div class="card">
            <h2 class="text-2xl font-bold text-center text-blue-600 mb-2">測驗結果</h2>
            <p id="endReason" class="text-center text-gray-500 mb-6"></p>
            <div class="space-y-2 mb-6">
                <p>測驗日期時間：<span id="testDateTime" class="font-bold"></span></p>
                <p>完成題數：<span id="correctCount" class="font-bold text-green-600"></span></p>
                <p>一次就答對：<span id="firstTryCount" class="font-bold text-green-600"></span></p>
                <p>錯誤次數：<span id="incorrectCount" class="font-bold text-red-600"></span></p>
                <p>測驗總時間：<span id="totalTime" class="font-bold"></span></p>
            </div>
            <div class="mb-6">
                <h3 class="font-bold text-gray-700 mb-2">需要加強的單字</h3>
                <ul id="mistakeList" class="space-y-1"></ul>
            </div>
            <button id="restartTest" class="btn w-full bg-blue-500 hover:bg-blue-600 text-white">重新開始</button>
        </div>
    </div>

            timerId: null,
            busy: false,
            ended: true,
            fontSize: 16,
            countTouched: false
        };

        function el(id) { return document.getElementById(id); }

        function init() {
            populateSheets();
            populateLetters();
            addEventListeners();
            preventCopyAndDrag();
            updateAvailable();
            if (!('speechSynthesis' in window)) {
                el('speakWord').classList.add('hidden');
            }
        }

        function populateSheets() {
            var select = el('sheetSelect');
            sheetsData.forEach(function (sheet, i) {
                var option = document.createElement('option');
                option.value = String(i);
                option.textContent = sheet.name + '（' + sheet.data.length + ' 字）';
                select.appendChild(option);
            });
        }

        function populateLetters() {
            var letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
            ['startLetter', 'endLetter'].forEach(function (id) {
                var select = el(id);
                letters.forEach(function (letter) {
                    var option = document.createElement('option');
                    option.value = letter;
                    option.textContent = letter;
                    select.appendChild(option);
                });
            });
            el('startLetter').value = 'A';
            el('endLetter').value = 'Z';
        }

        function preventCopyAndDrag() {
            document.body.addEventListener('dragstart', function (e) { e.preventDefault(); });
            document.body.addEventListener('selectstart', function (e) {
                var target = e.target.nodeType === 1 ? e.target : e.target.parentElement;
                if (target && target.closest && target.closest('input, select')) return;
                e.preventDefault();
            });
        }

        function addEventListeners() {
            el('sheetSelect').addEventListener('change', updateAvailable);
            el('startLetter').addEventListener('change', updateAvailable);
            el('endLetter').addEventListener('change', updateAvailable);
            el('questionCount').addEventListener('input', function () { state.countTouched = true; });
            el('allQuestions').addEventListener('click', function () {
                state.countTouched = false;
                updateAvailable();
            });
            el('startTest').addEventListener('click', startTest);
            el('speakWord').addEventListener('click', function () {
                speakWord();
                el('userInput').focus();
            });
            el('decreaseFont').addEventListener('click', function () { adjustFontSize(-1); });
            el('increaseFont').addEventListener('click', function () { adjustFontSize(1); });
            el('userInput').addEventListener('keydown', handleKeydown);
            el('restartTest').addEventListener('click', backToSettings);
        }

        // 依目前的工作表與字母範圍取得可用單字
        function getFilteredWords() {
            var sheet = sheetsData[Number(el('sheetSelect').value)];
            if (!sheet) return [];
            var start = el('startLetter').value;
            var end = el('endLetter').value;
            if (start > end) { var t = start; start = end; end = t; }
            var fullRange = (start === 'A' && end === 'Z');
            return sheet.data.filter(function (item) {
                var c = item.word.charAt(0).toUpperCase();
                return fullRange || (c >= start && c <= end);
            });
        }

        // 更新可用單字數提示與題數上限
        function updateAvailable() {
            var n = getFilteredWords().length;
            var input = el('questionCount');
            el('availableHint').textContent = n > 0
                ? '此範圍共有 ' + n + ' 個單字，可設定 1～' + n + ' 題'
                : '此範圍沒有單字，請調整工作表或字母範圍';
            input.max = String(Math.max(n, 1));
            if (!state.countTouched || Number(input.value) > n) {
                input.value = n > 0 ? String(n) : '';
            }
            input.disabled = (n === 0);
            el('startTest').disabled = (n === 0);
        }

        function startTest() {
            var pool = getFilteredWords();
            if (pool.length === 0) {
                alert('在選定範圍內沒有找到單字，請調整範圍。');
                return;
            }
            var count = parseInt(el('questionCount').value, 10);
            if (!count || count < 1) {
                alert('請輸入有效的題數（至少 1 題）。');
                return;
            }
            count = Math.min(count, pool.length);

            state.queue = shuffleArray(pool.slice()).slice(0, count);
            state.index = 0;
            state.correct = 0;
            state.firstTry = 0;
            state.errors = 0;
            state.mistakes = {};
            state.busy = false;
            state.ended = false;

            var duration = parseInt(el('testDuration').value, 10);
            state.startTime = Date.now();
            state.deadline = state.startTime + duration * 1000;

            showScreen('testScreen');
            updateProgress();
            renderTimer(duration);
            state.timerId = setInterval(tick, 250);
            showCurrentWord();
        }

        function shuffleArray(array) {
            for (var i = array.length - 1; i > 0; i--) {
                var j = Math.floor(Math.random() * (i + 1));
                var tmp = array[i]; array[i] = array[j]; array[j] = tmp;
            }
            return array;
        }

        function showScreen(id) {
            ['settingsScreen', 'testScreen', 'resultScreen'].forEach(function (s) {
                el(s).classList.toggle('hidden', s !== id);
            });
        }

        function showCurrentWord() {
            var item = state.queue[state.index];
            el('currentWord').textContent = item.word;
            el('currentMeaning').textContent = item.meaning;
            el('userInput').value = '';
            setResult('', '');
            state.wrongThisWord = false;
            el('userInput').focus();
            speakWord();
        }

        function setResult(text, colorClass) {
            var div = el('result');
            div.textContent = text;
            div.className = 'mt-4 text-center font-bold ' + colorClass;
        }

        // 比對前統一大小寫、空白與彎引號
        function normalize(s) {
            return s.trim().toLowerCase()
                .replace(/\s+/g, ' ')
                .replace(/[’‘]/g, "'");
        }

        function handleKeydown(e) {
            if (e.key !== 'Enter') return;
            // 修正：注音／中文輸入法選字時的 Enter 不算送出
            if (e.isComposing || e.keyCode === 229) return;
            e.preventDefault();
            if (state.busy || state.ended) return;

            var input = normalize(el('userInput').value);
            var item = state.queue[state.index];

            if (!input) {
                setResult('請輸入答案後按 Enter 鍵。', 'text-yellow-600');
                return;
            }

            if (input === normalize(item.word)) {
                state.busy = true;
                state.correct++;
                if (!state.wrongThisWord) state.firstTry++;
                setResult('Bravo！', 'text-green-600');
                setTimeout(function () {
                    if (state.ended) return;  // 修正：等待期間時間已到就不再出題
                    state.index++;
                    state.busy = false;
                    if (state.index < state.queue.length) {
                        updateProgress();
                        showCurrentWord();
                    } else {
                        endTest(false);
                    }
                }, 1000);
            } else {
                state.errors++;
                state.wrongThisWord = true;
                if (!state.mistakes[item.word]) {
                    state.mistakes[item.word] = { word: item.word, meaning: item.meaning, count: 0 };
                }
                state.mistakes[item.word].count++;
                setResult('Try again！你可以的！', 'text-red-600');
                el('userInput').value = '';
            }
        }

        // 字體大小：調整根字級，整個畫面（含 Tailwind 的 rem）一起縮放
        function adjustFontSize(delta) {
            state.fontSize = Math.max(12, Math.min(24, state.fontSize + delta));
            document.documentElement.style.fontSize = state.fontSize + 'px';
            el('userInput').focus();
        }

        function speakWord() {
            if (!('speechSynthesis' in window) || state.ended) return;
            var item = state.queue[state.index];
            if (!item) return;
            speechSynthesis.cancel();  // 修正：避免連按造成語音排隊
            var utterance = new SpeechSynthesisUtterance(item.word);
            utterance.lang = 'en-US';
            speechSynthesis.speak(utterance);
        }

        // 修正：以截止時間計算剩餘秒數，分頁切到背景也不會變慢
        function tick() {
            var remaining = Math.max(0, Math.ceil((state.deadline - Date.now()) / 1000));
            renderTimer(remaining);
            if (remaining <= 0) endTest(true);
        }

        function renderTimer(seconds) {
            var m = Math.floor(seconds / 60);
            var s = seconds % 60;
            el('timer').textContent = m + ':' + (s < 10 ? '0' : '') + s;
        }

        function updateProgress() {
            el('progress').textContent = (state.index + 1) + '/' + state.queue.length;
        }

        function endTest(timeUp) {
            if (state.ended) return;  // 修正：避免重複結束
            state.ended = true;
            clearInterval(state.timerId);
            if ('speechSynthesis' in window) speechSynthesis.cancel();

            var endTime = new Date();
            var used = Math.round((endTime.getTime() - state.startTime) / 1000);
            used = Math.min(used, Math.round((state.deadline - state.startTime) / 1000));

            el('endReason').textContent = timeUp
                ? '時間到！共 ' + state.queue.length + ' 題，完成 ' + state.correct + ' 題'
                : '全部 ' + state.queue.length + ' 題完成！';
            el('testDateTime').textContent = endTime.toLocaleString('zh-TW');
            el('correctCount').textContent = state.correct + ' / ' + state.queue.length;
            el('firstTryCount').textContent = String(state.firstTry);
            el('incorrectCount').textContent = String(state.errors);
            el('totalTime').textContent = formatTime(used);
            renderMistakes();
            showScreen('resultScreen');
        }

        function renderMistakes() {
            var list = el('mistakeList');
            list.innerHTML = '';
            var items = Object.keys(state.mistakes).map(function (k) { return state.mistakes[k]; });
            items.sort(function (a, b) { return b.count - a.count; });
            if (items.length === 0) {
                var li = document.createElement('li');
                li.className = 'text-green-600';
                li.textContent = '沒有打錯的單字，太棒了！';
                list.appendChild(li);
                return;
            }
            items.forEach(function (m) {
                var li = document.createElement('li');
                li.className = 'flex justify-between border-b border-gray-100 py-1';
                var left = document.createElement('span');
                left.textContent = m.word + '　' + m.meaning;
                var right = document.createElement('span');
                right.className = 'text-red-600 font-bold whitespace-nowrap ml-2';
                right.textContent = '錯 ' + m.count + ' 次';
                li.appendChild(left);
                li.appendChild(right);
                list.appendChild(li);
            });
        }

        function formatTime(seconds) {
            var m = Math.floor(seconds / 60);
            var s = seconds % 60;
            return m + '分' + s + '秒';
        }

        // 重新開始：回到設定畫面並保留上次的選擇
        function backToSettings() {
            state.ended = true;
            setResult('', '');
            updateAvailable();
            showScreen('settingsScreen');
        }

        window.onload = init;
    </script>
</body>
</html>
