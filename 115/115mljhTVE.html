    function loadSheets() {
      const sheets = Object.values(questionsData);
      
      if (sheets.length === 0) {
        alert('找不到可用的工作表！');
        return;
      }

      const select = document.getElementById('sheet-select');
      select.innerHTML = '';
      
      sheets.forEach(sheet => {
        const option = document.createElement('option');
        option.value = sheet.name;
        option.textContent = sheet.name;
        option.dataset.total = sheet.totalQuestions;
        select.appendChild(option);
      });

      select.selectedIndex = 0;
      updateQuestionRange();
    }

    function updateQuestionRange() {
      const select = document.getElementById('sheet-select');
      const selectedOption = select.options[select.selectedIndex];
      const total = parseInt(selectedOption.dataset.total) || 0;
      
      const startRow = document.getElementById('start-row');
      const endRow = document.getElementById('end-row');
      
      startRow.max = total;
      endRow.max = total;
      
      let currentStart = parseInt(startRow.value);
      if (currentStart > total) {
        currentStart = 1;
      }
      
      startRow.value = currentStart;
      endRow.value = total;
    }

    function shuffleArray(array) {
      const newArray = [...array];
      for (let i = newArray.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
      }
      return newArray;
    }

    function initQuiz(quizQuestions) {
      questions = quizQuestions;
      document.getElementById('setup-view').style.display = 'none';
      document.getElementById('quiz-view').style.display = 'block';
      document.getElementById('total-questions').textContent = questions.length;
      startTime = new Date();
      startTimer();
      showQuestion();
    }

    function showQuestion() {
	  const question = questions[currentQuestionIndex];
	  document.getElementById('current-question').textContent = currentQuestionIndex + 1;
	  
	  document.getElementById('question-text').innerHTML = '		<span class="question-label">第' + (currentQuestionIndex + 1) + '題</span>		<div class="question-content">' + question.question + '</div>	  ';
	  
	  document.getElementById('progress-bar').style.width = ((currentQuestionIndex + 1) / questions.length * 100) + '%';

	  	  // 媒體處理：有圖片網址就顯示圖片
	  const mediaContainer = document.getElementById('media-container');
	  mediaContainer.innerHTML = '';
	  const url = (question.mediaUrl || '').toString().trim();
	  if (url) {
		const lowerUrl = url.toLowerCase().split('?')[0];
		if (lowerUrl.endsWith('.mp4') || lowerUrl.endsWith('.webm')) {
		  const video = document.createElement('video');
		  video.src = url;
		  video.controls = true;
		  video.style.maxWidth = '100%';
		  mediaContainer.appendChild(video);
		} else {
		  const img = document.createElement('img');
		  img.src = url;
		  img.alt = '題目附圖';
		  img.onerror = function() {
			mediaContainer.innerHTML = '<p style="color:#dc3545;">圖片載入失敗：' + url + '</p>';
		  };
		  mediaContainer.appendChild(img);
		}
	  }

	  // 創建選項的複製並打亂順序
	  const options = [...question.options];
	  const correctAnswer = question.correctAnswer;
	  
	  // 選項洗牌
	  for (let i = options.length - 1; i > 0; i--) {
		const j = Math.floor(Math.random() * (i + 1));
		[options[i], options[j]] = [options[j], options[i]];
	  }
	  
	  const optionsContainer = document.getElementById('options-container');
	  optionsContainer.innerHTML = '';
	  options.forEach((option, index) => {
		const button = document.createElement('div');
		button.className = 'option';
		button.textContent = option;
		button.onclick = () => selectOption(option); // 注意這裡傳入的是選項文字而非索引
		optionsContainer.appendChild(button);
	  });

	  document.getElementById('feedback').style.display = 'none';
	}

    // 修改 selectOption 函數以接受選項文字
	function selectOption(selectedOption) {
	  const question = questions[currentQuestionIndex];
	  const options = document.querySelectorAll('.option');
	  
	  // 找出所選選項在當前顯示選項中的索引
	  const selectedIndex = Array.from(options).findIndex(option => option.textContent === selectedOption);
	  
	  options.forEach(option => option.classList.remove('selected'));
	  options[selectedIndex].classList.add('selected');

	  const result = {
		isCorrect: selectedOption === question.correctAnswer,
		correctAnswer: question.correctAnswer,
		explanation: question.explanation
	  };
	  
	  showFeedback(result);
	}

    function showFeedback(result) {
      const feedback = document.getElementById('feedback');
      const options = document.querySelectorAll('.option');
      
      feedback.style.display = 'block';
      feedback.className = 'feedback ' + (result.isCorrect ? 'correct' : 'incorrect');
      
      if (result.isCorrect) {
          feedback.innerHTML = '<h3>太棒了！答對了！</h3>' +
            '<div class="explanation">' + result.explanation + '</div>' +
            '<button onclick="nextQuestion()" style="margin-top: 15px;">下一題</button>';
          score++;
        } else {
          feedback.innerHTML = '<h3>答錯了...</h3>' +
            '<p>正確答案是：' + result.correctAnswer + '</p>' +
            '<div class="explanation">' + result.explanation + '</div>' +
            '<button onclick="nextQuestion()" style="margin-top: 15px;">下一題</button>';
        wrongQuestions.push({
          question: questions[currentQuestionIndex].question,
          userAnswer: questions[currentQuestionIndex].options[Array.from(options)
            .findIndex(opt => opt.classList.contains('selected'))],
          correctAnswer: result.correctAnswer
        });
      }

      options.forEach(option => {
        option.onclick = null;
        if (option.textContent === result.correctAnswer) {
          option.classList.add('correct');
        } else if (option.classList.contains('selected')) {
          option.classList.add('incorrect');
        }
      });
    }

    function nextQuestion() {
      currentQuestionIndex++;
      if (currentQuestionIndex < questions.length) {
        showQuestion();
      } else {
        showResults();
      }
    }

    function showResults() {
	  clearInterval(timerInterval);
	  const endTime = new Date();
	  const duration = Math.floor((endTime - startTime) / 1000);
	  const minutes = Math.floor(duration / 60);
	  const seconds = duration % 60;

	  // 加入變數宣告
	  const sheetName = document.getElementById('sheet-select').value;
	  const startRow = document.getElementById('start-row').value;
	  const endRow = document.getElementById('end-row').value;

	  const dateOptions = { year: 'numeric', month: '2-digit', day: '2-digit', weekday: 'long' };
	  const timeOptions = { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
	  const formattedDate = endTime.toLocaleDateString('zh-TW', dateOptions);
	  const formattedTime = endTime.toLocaleTimeString('zh-TW', timeOptions);

	  document.getElementById('quiz-view').style.display = 'none';
	  document.getElementById('results-view').style.display = 'block';

	  const scorePercentage = Math.round((score / questions.length) * 100);
	  document.getElementById('final-score').textContent = scorePercentage + '%';

	  document.getElementById('summary').innerHTML = 
		'<div class="result-section">' +
		  '<h3>測驗資訊</h3>' +
		  '<p>題組：' + sheetName + '</p>' +
		  '<p>測驗範圍：第 ' + startRow + ' 題 至 第 ' + endRow + ' 題</p>' +
		  '<p>完成時間：' + formattedDate + ' ' + formattedTime + '</p>' +
		'</div>' +
		'<div class="result-section">' +
		  '<h3>測驗成績</h3>' +
		  '<p>測驗時間：' + minutes + '分' + seconds + '秒</p>' +
		  '<p>總題數：' + questions.length + '</p>' +
		  '<p>答對題數：' + score + '</p>' +
		  '<p>答錯題數：' + (questions.length - score) + '</p>' +
		'</div>';

	  if (wrongQuestions.length > 0) {
		const wrongQuestionsHtml = wrongQuestions.map(function(q, index) {
		  return '<div class="wrong-question">' +
			'<h4>題目 ' + (index + 1) + '</h4>' +
			'<p>' + q.question + '</p>' +
			'<p>你的答案：' + q.userAnswer + '</p>' +
			'<p>正確答案：' + q.correctAnswer + '</p>' +
		  '</div>';
		}).join('');

		document.getElementById('wrong-questions').innerHTML = 
		  '<div class="result-section">' +
			'<h3>錯題複習</h3>' +
			wrongQuestionsHtml +
		  '</div>';
	  }
	}
	
	function startTimer() {
      timerInterval = setInterval(function() {
        const now = new Date();
        const diff = Math.floor((now - startTime) / 1000);
        const minutes = Math.floor(diff / 60);
        const seconds = diff % 60;
        document.getElementById('timer').textContent = 
          String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
      }, 1000);
    }

    function changeFontSize(change) {
	  fontSize += change;
	  // 修改題目文字大小
	  const questionText = document.getElementById('question-text');
	  const label = questionText.querySelector('.question-label');
	  const content = questionText.querySelector('.question-content');
	  
	  if (label) label.style.fontSize = (fontSize * 0.9) + 'px';
	  if (content) content.style.fontSize = fontSize + 'px';
	  
	  // 修改選項文字大小
	  const options = document.querySelectorAll('.option');
	  options.forEach(option => {
		option.style.fontSize = fontSize + 'px';
	  });
	}

    function handleError(error) {
      console.error('Error:', error);
      alert('發生錯誤：' + error);
    }
  </script>
</body>
</html>
