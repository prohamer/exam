/* ============================================================================
 * 10. 事件綁定
 * ============================================================================ */
function bindGlobalEvents() {
  const byId = id => document.getElementById(id);

  if (byId('nav-home-brand')) {
    byId('nav-home-brand').onclick = () => { clearAllQuizTimers(); quizState = null; currentView = { name: 'map' }; renderApp(); };
  }
  if (byId('btn-open-player')) {
    byId('btn-open-player').onclick = () => { activeModal = { kind: 'player' }; renderApp(); };
  }
  if (byId('btn-open-menu')) {
    byId('btn-open-menu').onclick = () => { activeModal = { kind: 'menu' }; renderApp(); };
  }
  if (byId('btn-font-dec')) {
    byId('btn-font-dec').onclick = () => { prog.font = Math.max(70, prog.font - 10); renderApp(); };
  }
  if (byId('btn-font-inc')) {
    byId('btn-font-inc').onclick = () => { prog.font = Math.min(140, prog.font + 10); renderApp(); };
  }

  // 地圖模式切換
  document.querySelectorAll('[data-switch-mode]').forEach(btn => {
    btn.onclick = () => {
      prog.mode = btn.getAttribute('data-switch-mode');
      renderApp();
    };
  });

  // 打開城堡
  document.querySelectorAll('[data-open-castle]').forEach(btn => {
    btn.onclick = () => {
      const cid = btn.getAttribute('data-open-castle');
      let target = null;
      if (cid === WORLD.centerCastle.id) target = WORLD.centerCastle;
      else {
        const all = [...WORLD.modes.theme.castles, ...WORLD.modes.alpha.castles];
        target = all.find(c => c.id === cid);
      }
      if (target) {
        currentView = { name: 'chapter', ch: target };
        window.scrollTo(0, 0);
        renderApp();
      }
    };
  });

  // 城堡內事件
  if (byId('btn-back-map')) {
    byId('btn-back-map').onclick = () => { currentView = { name: 'map' }; renderApp(); };
  }
  if (byId('btn-open-chcert')) {
    byId('btn-open-chcert').onclick = () => { activeModal = { kind: 'chcert', ch: currentView.ch }; renderApp(); };
  }
  if (byId('cfg-play-mode')) {
    byId('cfg-play-mode').onchange = e => { prog.quizCfg.playMode = e.target.value; saveProg(); };
  }
  if (byId('cfg-thinking-time')) {
    byId('cfg-thinking-time').onchange = e => { prog.quizCfg.thinkingTime = Number(e.target.value); saveProg(); };
  }
  if (byId('cfg-show-meaning')) {
    byId('cfg-show-meaning').onchange = e => { prog.quizCfg.showMeaning = e.target.checked; saveProg(); };
  }
  document.querySelectorAll('[data-play-sec]').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.getAttribute('data-play-sec'));
      startSectionQuiz(currentView.ch, idx);
    };
  });

  // 結算畫面按鈕
  if (byId('btn-retry-wrong')) {
    byId('btn-retry-wrong').onclick = () => {
      const wrongRaw = currentView.summary.results.filter(r => r.status !== 'correct').map(r => r.q.raw);
      startSectionQuiz(currentView.ch, currentView.secIdx, wrongRaw);
    };
  }
  if (byId('btn-retry-all')) {
    byId('btn-retry-all').onclick = () => startSectionQuiz(currentView.ch, currentView.secIdx);
  }
  if (byId('btn-back-chapter')) {
    byId('btn-back-chapter').onclick = () => { currentView = { name: 'chapter', ch: currentView.ch }; renderApp(); };
  }
  if (byId('btn-go-next-sec')) {
    byId('btn-go-next-sec').onclick = () => startSectionQuiz(currentView.ch, currentView.nextIdx);
  }

  // 彈窗事件
  if (byId('modal-backdrop')) {
    byId('modal-backdrop').onclick = e => {
      if (e.target.id === 'modal-backdrop') { activeModal = null; renderApp(); }
    };
  }
  if (byId('btn-close-modal')) {
    byId('btn-close-modal').onclick = () => { activeModal = null; renderApp(); };
  }

  // 登入彈窗內切換闖關模式
  document.querySelectorAll('[data-pick-login-mode]').forEach(card => {
    card.onclick = () => {
      prog.mode = card.getAttribute('data-pick-login-mode');
      document.querySelectorAll('[data-pick-login-mode]').forEach(c => c.classList.remove('active'));
      card.classList.add('active');
    };
  });

  if (byId('btn-save-player')) {
    byId('btn-save-player').onclick = () => {
      const pl = {
        name: (byId('inp-pname').value || '').trim().slice(0, 20),
        cls: (byId('inp-pcls').value || '').trim().slice(0, 10),
        seat: (byId('inp-pseat').value || '').trim().slice(0, 10)
      };
      if (pl.name && !samePlayer(pl, prog.player)) {
        const registered = (prog.history || []).some(h => h.t === 'register');
        const ev = registered || prog.player.name
          ? { t: 'rename', at: new Date().toISOString(), from: prog.player, to: pl }
          : { t: 'register', at: new Date().toISOString(), to: pl };
        prog.player = pl;
        prog.history = [...(prog.history || []), ev];
      }
      activeModal = null;
      renderApp();
    };
  }

  document.querySelectorAll('[data-menu-pick]').forEach(btn => {
    btn.onclick = () => {
      const k = btn.getAttribute('data-menu-pick');
      activeModal = { kind: k };
      renderApp();
    };
  });

  if (byId('btn-copy-code')) {
    byId('btn-copy-code').onclick = () => {
      const ta = byId('ta-code-out');
      const msg = byId('copy-code-msg');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(ta.value).then(() => { msg.textContent = '✓ 已複製進度碼！'; });
      } else {
        ta.select();
        document.execCommand('copy');
        msg.textContent = '✓ 已選取並複製進度碼！';
      }
    };
  }

  if (byId('btn-import-code')) {
    byId('btn-import-code').onclick = () => {
      const raw = byId('ta-code-in').value;
      const errEl = byId('import-code-err');
      try {
        const imported = ensureId(decodeCode(raw, Store.key));
        const ev = {
          t: 'import',
          at: new Date().toISOString(),
          to: imported.player,
          replaced: prog.id !== imported.id ? fmtPlayer(prog.player) : ''
        };
        clearAllQuizTimers();
        quizState = null;
        prog = { ...imported, font: prog.font, history: [...(imported.history || []), ev] };
        currentView = { name: 'map' };
        activeModal = null;
        renderApp();
      } catch (err) {
        errEl.textContent = err.message;
      }
    };
  }

  if (byId('btn-confirm-reset')) {
    byId('btn-confirm-reset').onclick = () => {
      clearAllQuizTimers();
      quizState = null;
      Store.clear();
      prog = ensureId(blankProgress());
      currentView = { name: 'map' };
      activeModal = { kind: 'player' };
      renderApp();
    };
  }

  if (byId('btn-celebrate-cert')) {
    byId('btn-celebrate-cert').onclick = () => {
      activeModal = { kind: 'chcert', ch: activeModal.ch };
      renderApp();
    };
  }

  if (byId('btn-download-cert')) {
    byId('btn-download-cert').onclick = async () => {
      const btn = byId('btn-download-cert');
      const target = byId('cert-capture-target');
      if (!target || !window.html2canvas) return;
      const fn = btn.getAttribute('data-fn') || 'certificate.png';
      btn.disabled = true;
      btn.textContent = '⏳ 正在產生高畫質圖片…';
      try {
        const canvas = await window.html2canvas(target, { scale: 2, backgroundColor: '#fffaf0', useCORS: true });
        const dataUrl = canvas.toDataURL('image/png');
        const area = byId('cert-preview-area');
        area.innerHTML = `<img class="cert-img" src="${dataUrl}" alt="認證書圖片">`;
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = fn;
        a.click();
        btn.textContent = '✓ 已下載（可長按上方圖片另存）';
      } catch (e) {
        btn.disabled = false;
        btn.textContent = '產生失敗，請重試';
      }
    };
  }
}

function bindPlayEvents() {
  const byId = id => document.getElementById(id);

  if (byId('btn-quit-quiz')) {
    byId('btn-quit-quiz').onclick = () => {
      clearAllQuizTimers();
      const ch = quizState.ch;
      quizState = null;
      currentView = { name: 'chapter', ch };
      renderApp();
    };
  }

  const updateRate = newRate => {
    const r = Math.max(0.5, Math.min(1.5, Math.round(newRate * 10) / 10));
    quizState.speechRate = r;
    prog.quizCfg.speechRate = r;
    saveProg();
    if (byId('speech-rate-slider')) byId('speech-rate-slider').value = r;
    if (byId('speed-val-label')) byId('speed-val-label').textContent = r.toFixed(1) + 'x';
  };

  if (byId('speed-dec')) byId('speed-dec').onclick = () => updateRate(quizState.speechRate - 0.1);
  if (byId('speed-inc')) byId('speed-inc').onclick = () => updateRate(quizState.speechRate + 0.1);
  if (byId('speech-rate-slider')) {
    byId('speech-rate-slider').oninput = e => updateRate( parseFloat(e.target.value) );
  }

  if (byId('btn-repeat-word')) {
    byId('btn-repeat-word').onclick = () => {
      const q = quizState.questions[quizState.qIdx];
      if (q) speakText(q.word, quizState.speechRate, () => { if (quizState && !quizState.questionResolved) startThinkingCountdown(); });
    };
  }
  if (byId('btn-repeat-sentence')) {
    byId('btn-repeat-sentence').onclick = () => {
      const q = quizState.questions[quizState.qIdx];
      if (q) speakText(q.sentence, quizState.speechRate, () => { if (quizState && !quizState.questionResolved) startThinkingCountdown(); });
    };
  }

  if (byId('btn-show-example')) {
    byId('btn-show-example').onclick = () => {
      quizState.ui.showEx = !quizState.ui.showEx;
      const el = byId('example-sentence');
      if (el) el.classList.toggle('hidden', !quizState.ui.showEx);
    };
  }
  if (byId('btn-show-trans')) {
    byId('btn-show-trans').onclick = () => {
      quizState.ui.showTrans = !quizState.ui.showTrans;
      const el = byId('example-translation');
      if (el) el.classList.toggle('hidden', !quizState.ui.showTrans);
    };
  }

  if (byId('btn-submit-ans')) {
    byId('btn-submit-ans').onclick = () => submitCurrentAnswer();
  }
  if (byId('btn-reveal-ans')) {
    byId('btn-reveal-ans').onclick = () => resolveQuestion('skipped', '');
  }
  if (byId('btn-next-q')) {
    byId('btn-next-q').onclick = () => goNextQuestion();
  }

  if (byId('answer-input')) {
    byId('answer-input').onkeydown = e => {
      if (e.isComposing || e.keyCode === 229) return; // 注音/中文輸入法選字中
      if (e.key === 'Enter') {
        e.preventDefault(); // 也讓下方全域 Enter 處理器略過這次按鍵，避免答完立刻被跳到下一題
        if (!quizState.questionResolved) submitCurrentAnswer();
        else if (!e.repeat) goNextQuestion();
      }
    };
    byId('answer-input').oninput = e => { if (quizState && quizState.ui) quizState.ui.inputVal = e.target.value; };
  }
}

// 支援在揭曉答案狀態下直接按 Enter 跳下一題
window.addEventListener('keydown', e => {
  if (e.defaultPrevented || e.repeat || e.isComposing || activeModal) return;
  if (currentView.name === 'play' && quizState && quizState.questionResolved && e.key === 'Enter') {
    e.preventDefault();
    goNextQuestion();
  }
});

// 啟動應用
document.title = WORLD.title + (WORLD.subtitle ? '：' + WORLD.subtitle : '');
renderApp();
</script>
</body>
