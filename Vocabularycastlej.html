<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英語單字王國：國中英語聽力與例句打字闖關</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root {
  --sea: #2b5876;
  --sea-deep: #1a364a;
  --sea-light: #6e99b4;
  --foam: #e2eef4;
  --sand: #f4e6c3;
  --sand-dark: #d8c08c;
  --paper: #fbf7ec;
  --card: #fffdf8;
  --ink: #22343a;
  --ink-soft: #5a6b70;
  --line: #d8d0bb;
  --coral: #e8603e;
  --gold: #e4b03a;
  --ok: #2e8b57;
  --ok-bg: #e6f5ea;
  --bad: #cf4636;
  --bad-bg: #fbe3df;
  --lock: #9aa7a8;
  --f-display: "LXGW WenKai TC", "Kaiti TC", "DFKai-SB", "Noto Sans TC", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --r-sm: 8px;
  --r-md: 14px;
  --shadow-card: 0 2px 0 rgba(34, 52, 58, .12), 0 6px 14px rgba(34, 52, 58, .08);
}

html, body { height: 100%; margin: 0; }
body {
  font-family: var(--f-body);
  font-size: 1rem;
  color: var(--ink);
  background: var(--sea);
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
input, textarea, select { user-select: text; -webkit-user-select: text; font: inherit; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 700; margin: 0; }
.hidden { display: none !important; }
.qw-app { min-height: 100%; display: flex; flex-direction: column; }
.qw-gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-variant-numeric: tabular-nums; }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4em;
  min-height: 42px; padding: 0 1.1em; border-radius: 999px; border: 2px solid transparent;
  font-weight: 700; font-size: .95rem; cursor: pointer; white-space: nowrap;
  transition: transform .12s ease, background-color .12s ease; text-decoration: none;
}
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn[disabled] { cursor: not-allowed; opacity: .55; }
.btn-primary { background: var(--coral); color: #fff; box-shadow: 0 3px 0 #b7452a; }
.btn-primary[disabled] { background: var(--line); color: var(--ink-soft); box-shadow: none; }
.btn-success { background: var(--ok); color: #fff; box-shadow: 0 3px 0 #1f633d; }
.btn-warning { background: var(--gold); color: var(--ink); box-shadow: 0 3px 0 #b98a1d; }
.btn-danger { background: var(--bad); color: #fff; }
.btn-soft { background: var(--card); color: var(--ink); border-color: var(--line); }
.btn-icon { width: 42px; padding: 0; }
.btn svg { width: 1.2em; height: 1.2em; flex: none; }

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: 0; z-index: 25;
  background: var(--sea-deep); color: var(--paper);
  padding-block: 10px;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  box-shadow: 0 2px 10px rgba(0,0,0,.22);
}
.topbar .brand { display: flex; flex-direction: column; min-width: 0; flex: 1 1 auto; cursor: pointer; }
.topbar .brand h1 { font-size: 1.4rem; line-height: 1.15; }
.topbar .brand small { opacity: .8; font-size: .78rem; letter-spacing: .06em; }
.topbar .tools { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.topbar .btn-soft { background: rgba(255,255,255,.12); color: var(--paper); border-color: rgba(255,255,255,.25); }
.fontctl { display: inline-flex; border: 2px solid rgba(255,255,255,.25); border-radius: 999px; overflow: hidden; }
.fontctl button { background: transparent; border: 0; color: var(--paper); min-width: 40px; min-height: 38px; font-weight: 700; cursor: pointer; }
.fontctl button[disabled] { opacity: .35; cursor: not-allowed; }
.player-chip { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; min-height: 38px; border-radius: 999px; background: rgba(255,255,255,.12); color: var(--paper); border: 1px solid rgba(255,255,255,.2); cursor: pointer; font-weight: 700; }

/* ---------- map ---------- */
.map-wrap { flex: 1; padding-block: 16px 36px; max-width: 1260px; width: 100%; margin: 0 auto; }
.map-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--paper); margin-bottom: 14px; }
.book-tabs { display: inline-flex; background: rgba(0,0,0,.22); border-radius: 999px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.book-tabs button { border: 0; background: transparent; color: var(--paper); min-height: 38px; padding: 0 16px; border-radius: 999px; font-family: var(--f-display); font-size: 1.08rem; font-weight: 700; cursor: pointer; transition: .15s; }
.book-tabs button[aria-pressed="true"] { background: var(--sand); color: var(--ink); box-shadow: 0 2px 6px rgba(0,0,0,.2); }
.voyage { display: flex; align-items: center; gap: 10px; font-size: .9rem; }
.voyage .bar { width: 150px; max-width: 38vw; height: 10px; border-radius: 99px; background: rgba(0,0,0,.3); overflow: hidden; }
.voyage .bar i { display: block; height: 100%; background: var(--gold); border-radius: 99px; transition: width .4s ease; }

.kingdom-map {
  position: relative; border-radius: 24px; padding: 24px 18px 32px;
  background:
    radial-gradient(circle at 20% 20%, rgba(255,255,255,.08) 0 2px, transparent 3px) 0 0 / 48px 48px,
    radial-gradient(ellipse at center, #3b6978 0%, #204051 75%, #172e3b 100%);
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.14), 0 12px 32px rgba(0,0,0,.25);
}

/* 中心城堡亮點區 */
.center-castle-stage {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  margin-bottom: 24px; padding-bottom: 22px;
  border-bottom: 2px dashed rgba(255, 255, 255, 0.22);
  position: relative;
}
.center-castle-btn {
  background: radial-gradient(circle at 50% 35%, #fff8dc 0%, #f5d77f 65%, #d4a238 100%);
  border: 4px solid #fff;
  outline: 4px solid var(--gold);
  border-radius: 26px;
  padding: 16px 28px;
  cursor: pointer;
  display: flex; align-items: center; gap: 18px;
  max-width: 560px; width: 100%;
  box-shadow: 0 8px 0 #8c6214, 0 14px 30px rgba(0,0,0,.38);
  transition: transform .18s ease, box-shadow .18s ease;
  text-align: left;
  position: relative;
}
.center-castle-btn:hover { transform: translateY(-4px); box-shadow: 0 12px 0 #8c6214, 0 18px 36px rgba(0,0,0,.45); }
.center-castle-icon {
  width: 84px; height: 84px; border-radius: 20px;
  background: linear-gradient(145deg, #8b2635, #d1495b);
  border: 3px solid #fff;
  display: grid; place-items: center; font-size: 2.8rem; flex: none;
  box-shadow: inset 0 0 10px rgba(0,0,0,.25);
}
.center-castle-info { flex: 1; min-width: 0; color: #2b1d03; }
.center-castle-info .kicker { font-size: .78rem; font-weight: 800; color: #8b2635; letter-spacing: .08em; display: inline-block; background: rgba(255,255,255,.7); padding: 2px 8px; border-radius: 99px; margin-bottom: 4px; }
.center-castle-info h2 { font-size: 1.5rem; color: #2b1d03; margin-bottom: 3px; }
.center-castle-info p { margin: 0; font-size: .86rem; color: #4a3712; }
.center-castle-info .prog-pill { margin-top: 6px; display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: .85rem; background: #2b1d03; color: #f9d976; padding: 3px 12px; border-radius: 99px; }

/* 周圍城堡網格 */
.castles-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
  gap: 18px;
}
.castle-card {
  position: relative;
  background: var(--card);
  border: 3px solid var(--sand-dark);
  border-radius: 18px;
  padding: 14px 12px 12px;
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; text-align: center;
  box-shadow: 0 5px 0 rgba(0,0,0,.22), 0 8px 16px rgba(0,0,0,.15);
  transition: transform .16s ease, border-color .16s ease;
}
.castle-card:hover { transform: translateY(-4px); border-color: var(--gold); }
.castle-card.is-done { border-color: var(--gold); outline: 3px solid var(--gold); background: #fffdf2; }
.castle-turret {
  width: 72px; height: 72px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 2rem; margin-bottom: 8px;
  border: 3px solid #fff;
  box-shadow: 0 4px 10px rgba(0,0,0,.15);
  position: relative;
}
.castle-card .flag-badge {
  position: absolute; top: -8px; right: 10px;
  background: var(--gold); color: var(--ink);
  font-size: .72rem; font-weight: 800; padding: 2px 8px; border-radius: 99px;
  border: 2px solid #fff; box-shadow: 0 2px 4px rgba(0,0,0,.2);
}
.castle-card .sub-no { font-size: .75rem; color: var(--ink-soft); font-weight: 700; }
.castle-card b { font-family: var(--f-display); font-size: 1.12rem; line-height: 1.25; margin: 2px 0 4px; color: var(--ink); }
.castle-card .meta { font-size: .78rem; color: var(--ink-soft); margin-top: auto; }
.castle-card .tag-pill {
  margin-top: 6px; display: inline-block; font-size: .76rem; font-weight: 700;
  padding: 2px 10px; border-radius: 99px; background: var(--foam); color: var(--sea-deep);
}
.castle-card.is-done .tag-pill { background: var(--gold); color: var(--ink); }

.map-legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--paper); font-size: .85rem; margin-top: 14px; opacity: .92; justify-content: center; }
.map-legend span { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }

/* ---------- paper pages ---------- */
.page { flex: 1; background: var(--paper); }
.page-inner { max-width: 1000px; margin: 0 auto; padding-block: 20px 44px; }
.crumb { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }

.island-hero { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; margin-bottom: 20px; background: var(--card); padding: 16px 20px; border-radius: 18px; border: 2px solid var(--line); box-shadow: var(--shadow-card); }
.island-hero h2 { font-size: 1.8rem; }
.island-hero p { margin: 4px 0 0; color: var(--ink-soft); font-size: .92rem; }
.island-hero .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

/* 闖關設定橫幅（於城堡內選擇練習或測驗與語音設定） */
.quiz-config-bar {
  background: #f3ede0; border: 2px solid var(--sand-dark); border-radius: 14px;
  padding: 12px 16px; margin-bottom: 18px;
  display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center;
}
.quiz-config-bar .cfg-item { display: flex; align-items: center; gap: 6px; font-size: .88rem; font-weight: 700; }
.quiz-config-bar select, .quiz-config-bar input[type="number"] {
  padding: 5px 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font-weight: 700;
}

.trail { position: relative; display: flex; flex-direction: column; gap: 14px; padding: 6px 0; max-width: 780px; margin: 0 auto; }
.trail::before { content: ""; position: absolute; left: 31px; top: 28px; bottom: 28px; border-left: 4px dashed var(--sand-dark); }
.node { position: relative; display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; background: var(--card); border: 2px solid var(--line); border-radius: var(--r-md); padding: 12px 16px 12px 0; text-align: left; cursor: pointer; width: 100%; transition: transform .12s; }
.node:hover:not(:disabled) { transform: translateX(3px); }
.node:nth-child(even) { margin-left: 22px; width: calc(100% - 22px); }
.node .pin { justify-self: center; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 1.05rem; background: var(--sea); color: #fff; box-shadow: 0 0 0 4px var(--paper); }
.node .pin svg { width: 22px; height: 22px; }
.node h3 { font-size: 1.15rem; }
.node p { margin: 3px 0 0; font-size: .83rem; color: var(--ink-soft); }
.node.is-locked { cursor: not-allowed; background: #f1eee5; opacity: .8; }
.node.is-locked .pin { background: var(--lock); }
.node.is-locked h3 { color: var(--ink-soft); }
.node.is-next { border-color: var(--coral); box-shadow: 0 4px 12px rgba(232,96,62,.15); }
.node.is-next .pin { background: var(--coral); animation: pulse 1.8s ease-in-out infinite; }
.node.is-done .pin { background: var(--ok); }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 4px var(--paper), 0 0 0 4px rgba(232,96,62,.5); } 50% { box-shadow: 0 0 0 4px var(--paper), 0 0 0 11px rgba(232,96,62,0); } }
.stars { display: inline-flex; gap: 2px; }
.stars svg { width: 20px; height: 20px; }

/* ---------- 打字測驗畫面 ---------- */
.play { flex: 1; display: flex; flex-direction: column; background: var(--paper); }
.playbar { background: var(--card); border-bottom: 2px solid var(--line); padding-block: 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; position: sticky; top: var(--topbar-h, 58px); z-index: 15; }
.playbar .where { flex: 1 1 180px; min-width: 0; }
.playbar .where small { color: var(--ink-soft); font-size: .78rem; }
.playbar .where b { display: block; font-family: var(--f-display); font-size: 1.18rem; }
.meter { display: flex; gap: 12px; font-size: .92rem; color: var(--ink-soft); align-items: center; }
.meter b { color: var(--ink); }
.meter .low { color: var(--bad); font-weight: 800; }

.typing-card {
  max-width: 680px; width: 95%; margin: 22px auto 40px;
  background: var(--card); border: 2px solid var(--line); border-radius: 18px;
  padding: 20px; box-shadow: var(--shadow-card); text-align: center;
}
.voice-controls { margin: 0 0 14px; padding: 10px 12px; background-color: #f3ede0; border-radius: 12px; }
.ctrl-row { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.ctrl-row span.lbl { font-size: .85rem; font-weight: 700; }
.ctrl-row input[type="range"] { width: 120px; margin: 0; }
.sq-btn {
  width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
  background: #fff; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
}
.voice-buttons { display: flex; gap: 8px; margin-top: 8px; }
.voice-buttons button { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--sea); background: var(--sea); color: #fff; font-weight: 700; cursor: pointer; }
.voice-buttons button:disabled { background: var(--lock); border-color: var(--lock); cursor: not-allowed; }

#question-no { font-size: .95rem; color: var(--ink-soft); font-weight: 700; margin: 6px 0; }
#meaning-hint { font-size: 1.35rem; color: var(--sea-deep); font-weight: 800; margin: 8px 0; min-height: 1.4em; }
#status-line { font-size: .9rem; color: var(--coral); font-weight: 700; min-height: 1.3em; margin-bottom: 6px; }
#answer-input {
  width: 100%; padding: 12px; font-size: 1.25rem; text-align: center;
  border-radius: 12px; border: 2px solid var(--sea-light); background: #fff;
  font-weight: 700; margin-bottom: 8px;
}
#answer-input:focus { outline: none; border-color: var(--coral); box-shadow: 0 0 0 3px rgba(232,96,62,.2); }
#answer-input:disabled { background: #e9ecef; color: #6c757d; }

.feedback { padding: 8px 12px; border-radius: 10px; font-weight: 700; margin: 8px 0; font-size: .95rem; color: #fff; }
.feedback.ok { background-color: var(--ok); }
.feedback.bad { background-color: var(--bad); }
.feedback.info { background-color: var(--ink-soft); }

.practice-helpers { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.example-text { color: var(--ink); font-style: italic; margin: 4px 0; font-size: .96rem; background: #f8f4ea; padding: 8px; border-radius: 8px; }

.answer-panel {
  margin-top: 12px; padding: 12px 14px; border: 2px solid var(--ok); background: var(--ok-bg);
  border-radius: 12px; text-align: left;
}
.answer-panel p { margin: 4px 0; font-size: .95rem; }
.answer-panel .ans-word { color: var(--ok); font-size: 1.3rem; font-weight: 800; }
.countdown { color: var(--coral); font-weight: 800; margin: 8px 0; text-align: center; }

/* ---------- results ---------- */
.result-box { max-width: 760px; margin: 0 auto; background: var(--card); padding: 22px; border-radius: 18px; border: 2px solid var(--line); box-shadow: var(--shadow-card); }
.result-head { text-align: center; padding: 6px 0 16px; }
.result-head h2 { font-size: 2rem; margin-top: 6px; }
.result-head .stars svg { width: 42px; height: 42px; }
.stat-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
@media (max-width: 560px) { .stat-row { grid-template-columns: repeat(2, 1fr); } }
.stat { background: var(--paper); border: 2px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
.stat small { display: block; color: var(--ink-soft); font-size: .78rem; }
.stat b { font-size: 1.4rem; font-variant-numeric: tabular-nums; }

.word-list-result { list-style: none; padding: 0; margin: 14px 0; max-height: 380px; overflow-y: auto; }
.word-item {
  padding: 10px 12px; margin-bottom: 8px; background-color: var(--paper);
  border-radius: 10px; text-align: left; border-left: 5px solid var(--ink-soft);
}
.word-item.correct { border-left-color: var(--ok); }
.word-item.incorrect { border-left-color: var(--bad); background: #fff5f5; }
.word-item.skipped { border-left-color: var(--gold); }
.word-item.corrected { border-left-color: var(--sea-light); background: #f3f8fb; }
.word-item-header { font-weight: 700; font-size: .95rem; margin-bottom: 3px; }
.word-item-header .w { font-size: 1.08rem; color: var(--ink); }
.word-item-header .s { color: var(--ink-soft); font-size: .85rem; font-weight: normal; }
.word-item-line { margin: 2px 0; color: var(--ink-soft); font-size: .85rem; }

/* ---------- modal & cert ---------- */
.modal-back { position: fixed; inset: 0; z-index: 60; background: rgba(20, 40, 46, .6); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { background: var(--paper); border-radius: 18px; width: min(560px, 100%); max-height: calc(100% - 32px); overflow: auto; padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
.modal.wide { width: min(980px, 100%); }
.modal h2 { font-size: 1.5rem; margin-bottom: 10px; }
.modal p { margin: 0 0 12px; line-height: 1.6; }
.modal .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; margin-top: 14px; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 10px; text-align: left; }
.field label { font-size: .85rem; font-weight: 700; }
.field input, .field textarea, .field select { padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: #fff; color: var(--ink); width: 100%; }
.field textarea { min-height: 100px; font-family: monospace; font-size: .82rem; word-break: break-all; }
.field-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
@media (max-width: 480px) { .field-row { grid-template-columns: 1fr 1fr; } .field-row .field:first-child { grid-column: 1 / -1; } }
.note { font-size: .84rem; color: var(--ink-soft); }
.danger { color: var(--bad); }
.menu-list { display: flex; flex-direction: column; gap: 8px; }
.menu-list .btn { justify-content: flex-start; border-radius: 12px; }

/* 模式選擇卡片（登入彈窗內） */
.mode-pick-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0 14px; }
.mode-pick-card {
  border: 3px solid var(--line); background: var(--card); border-radius: 14px;
  padding: 12px; text-align: center; cursor: pointer; transition: .15s;
}
.mode-pick-card.active { border-color: var(--coral); background: #fff5f0; box-shadow: 0 0 0 3px rgba(232,96,62,.2); }
.mode-pick-card .ic { font-size: 2rem; display: block; margin-bottom: 4px; }
.mode-pick-card b { display: block; font-size: 1rem; margin-bottom: 2px; }
.mode-pick-card span { font-size: .76rem; color: var(--ink-soft); }

/* certificate */
.cert-scroll { overflow-x: auto; }
.cert {
  width: 880px; margin: 0 auto; background: #fffaf0; color: #22343a; padding: 40px 48px; position: relative;
  border: 10px solid #1a364a; outline: 3px solid #e4b03a; outline-offset: -18px; font-family: var(--f-body); text-align: left;
}
.cert .c-top { display: flex; align-items: center; gap: 20px; border-bottom: 2px solid #d8d0bb; padding-bottom: 16px; margin-bottom: 18px; }
.cert .c-kicker { font-size: 14px; letter-spacing: .25em; color: #5a6b70; }
.cert h1 { font-family: var(--f-display); font-size: 36px; margin: 4px 0; }
.cert .c-who { font-size: 19px; }
.cert .c-who b { font-family: var(--f-display); font-size: 28px; border-bottom: 2px solid #22343a; padding: 0 10px; }

ord":"what time","meaning":"幾點","category":"Wh-words","image":""},{"word":"how many","meaning":"多少","category":"Wh-words","image":""},{"word":"how much","meaning":"多少錢","category":"Wh-words","image":""},{"word":"how long","meaning":"多久","category":"Wh-words","image":""},{"word":"how far","meaning":"多遠","category":"Wh-words","image":""},{"word":"how often","meaning":"多常","category":"Wh-words","image":""},{"word":"what kind","meaning":"什麼種類","category":"Wh-words","image":""}],"examples":{"Dr.":[["Dr. Smith helped my sore tooth.","史密斯醫生幫我治療痛牙。"],["We visited Dr. Chen yesterday.","我們昨天拜訪了陳醫生。"],["Dr. Lee gave me some medicine.","李醫生給了我一些藥。"],["Is Dr. Wang in the hospital today?","王醫生今天在醫院嗎？"],["The kind Dr. Lin saved the dog.","親切的林醫生救了這隻狗。"],["Dr. Smith helped my grandpa a lot.","史密斯醫生幫了我爺爺很多忙。"],["You should go to see Dr. Wang today.","你今天應該去看王醫生。"],["Dr. Lee is a very kind dentist.","李醫生是一位非常親切的牙醫。"],["I want to talk to Dr. Chen tomorrow.","我明天想跟陳醫生談談。"],["The sick dog needs Dr. Brown now.","那隻生病的狗現在需要布朗醫生。"]],"Mr.":[["Mr. Smith is our English teacher.","史密斯先生是我們的英語老師。"],["Please give this book to Mr. Wang.","請把這本書給王先生。"],["Mr. Brown drives a red car.","布朗先生開一台紅色的車。"],["I saw Mr. Chen at the park.","我在公園看到了陳先生。"],["Mr. Lee is a very nice doctor.","李先生是一位非常好的醫生。"],["Mr. Smith is our math teacher.","史密斯先生是我們的數學老師。"],["I gave this letter to Mr. Wang.","我把這封信交給王先生了。"],["Do you know Mr. Brown?","你認識布朗先生嗎？"],["Mr. Green helped me with my bag.","格林先生幫我拿我的袋子。"],["We are waiting for Mr. Davis.","我們正在等戴維斯先生。"]],"Mrs.":[["Mrs. White makes delicious cookies.","懷特太太做很好吃的餅乾。"],["Do you know Mrs. Green?","妳認識格林太太嗎？"],["Mrs. Lin helps us a lot.","林太太幫了我們很多忙。"],["I spoke with Mrs. Davis yesterday.","我昨天跟戴維斯太太說話了。"],["Mrs. Wu has two cute cats.","吳太太有兩隻可愛的貓。"],["Mrs. Lee teaches us English.","李太太教我們英文。"],["I saw Mrs. White at the store.","我在店裡看到了懷特太太。"],["Mrs. Chen is a kind woman.","陳太太是一位親切的女士。"],["Please give this flower to Mrs. Liu.","請把這朵花送給劉太太。"],["Is Mrs. Wang your homeroom teacher?","王太太是你的班導師嗎？"]],"Miss":[["Miss Lin is our English teacher.","林小姐是我們的英文老師。"],["We love Miss Wang's class.","我們喜歡王老師的課。"],["Please ask Miss Chen for help.","請向陳小姐尋求協助。"],["Miss Green teaches us math.","格林小姐教我們數學。"],["Is Miss Smith in the office?","史密斯小姐在辦公室嗎？"],["Miss Lin is our new English teacher.","林小姐是我們的新英文老師。"],["We gave a gift to Miss Chen.","我們送了一份禮物給陳小姐。"],["Miss Wang teaches us science on Tuesdays.","王小姐星期二教我們自然課。"],["Is Miss Lee in the classroom now?","李小姐現在在教室裡嗎？"],["We all like Miss Wu very much.","我們大家都非常喜歡吳小姐。"]],"Ms.":[["Ms. Chang teaches us math.","張女士教我們數學。"],["Is Ms. Huang in the office?","黃女士在辦公室嗎？"],["We bought a gift for Ms. Lee.","我們買了一個禮物送給李女士。"],["Ms. Taylor smiles at the students.","泰勒女士對學生微笑。"],["I asked Ms. Wang a question.","我問了王女士一個問題。"],["Ms. Lin is our art teacher.","林女士是我們的美術老師。"],["I asked Ms. Chang a question.","我問了張女士一個問題。"],["Ms. Wu has a cute dog.","吳女士有一隻可愛的狗。"],["Do you like Ms. Huang's class?","你喜歡黃女士的課嗎？"],["We are going to visit Ms. Pan.","我們將要去拜訪潘女士。"]],"sir":[["Can I help you, sir?","先生，我能幫你嗎？"],["Yes, sir, I understand.","是的，先生，我明白了。"],["The waiter smiled at the sir.","服務生向那位先生微笑。"],["Thank you, sir, for your help.","謝謝你的幫助，先生。"],["Have a nice day, sir.","祝你有個美好的一天，先生。"],["Yes, sir, I am ready.","是的，先生，我準備好了。"],["The old man is a kind sir.","那位老人是一位親切的先生。"],["Thank you very much, sir.","非常謝謝你，先生。"],["Please follow me, sir.","請跟著我，先生。"]],"ma'am":[["Can I help you, ma'am?","女士，我能幫您嗎？"],["The student said thank you to ma'am.","那個學生向女老師說謝謝。"],["Excuse me, ma'am, this seat is empty.","不好意思，女士，這個座位是空的。"],["Yes, ma'am, I finished my homework.","是的，女士，我寫完作業了。"],["The polite boy helped the old ma'am.","那個有禮貌的男孩幫忙了那位老女士。"],["Excuse me, ma'am, you dropped your bag.","不好意思，女士，您的包包掉了。"],["The boy said yes to the teacher, ma'am.","那個男孩對女老師說了是的，女士。"],["Thank you very much for your help, ma'am.","非常感謝您的幫忙，女士。"],["Is this seat taken, ma'am?","請問這個位子有人坐嗎，女士？"]],"name":[["What is your dog's name?","你狗的名字是什麼？"],["I forget his name.","我忘記他的名字了。"],["Write your name on the paper.","把你的名字寫在紙上。"],["My name is Amy.","我的名字是艾美。"],["Do you know her name?","你知道她的名字嗎？"],["I forget his name very often.","我經常忘記他的名字。"],["Write your name on the book.","把你的名字寫在書上。"],["Her name is Mary in school.","她在學校的名字是瑪麗。"],["Can you remember my Chinese name?","你記得我的中文名字嗎？"]],"Professor":[["Professor Smith teaches history class.","史密斯教授教歷史課。"],["The professor answered my hard question.","教授回答了我困難的問題。"],["We met a nice science professor.","我們遇到了一位親切的自然科學教授。"],["Professor Wang wrote a big book.","王教授寫了一本大書。"],["The professor smiled at the students.","教授向學生們微笑了。"],["Professor Smith teaches math class.","史密斯教授教數學課。"],["The professor answered my question well.","這位教授很好地回答了我的問題。"],["We listened to the old professor.","我們聆聽了這位老教授的講話。"],["Professor Wang wrote a great book.","王教授寫了一本很棒的書。"],["She wants to be a college professor.","她想要成為一名大學教授。"]],"Principal":[["Our principal is a kind man.","我們的校長是一位親切的人。"],["The principal gave a short speech.","校長發表了一場簡短的演講。"],["I saw the principal this morning.","我今天早上看到了校長。"],["The principal walked into our classroom.","校長走進了我們的教室。"],["Listen to the principal carefully now.","現在請仔細聽校長說話。"],["Our principal gave a speech today.","我們的校長今天發表演講了。"],["The principal smiled at the kids.","校長向孩子們微笑了。"],["She went to see the school principal.","她去見了學校的校長。"],["The principal welcomed all new students.","校長歡迎所有的新學生。"],["Mr. Lee is our new principal.","李先生是我們的新校長。"]],"Director":[["The school director gave a speech today.","學校主任今天發表了演講。"],["Mr. Lin is our new grade director.","林先生是我們的新年段主任。"],["We went to see the director's office.","我們去看了主任的辦公室。"],["The director helped me solve my problem.","主任幫我解決了我的問題。"],["She talked to the art director yesterday.","她昨天跟美術主任談話了。"],["We talked to the director about the trip.","我們跟主任談了關於這次旅行的事。"],["Mr. Wang is our new grade director.","王先生是我們的新年段主任。"],["The director helped the students a lot.","這位主任幫了學生們很多忙。"],["She wants to be a movie director later.","她以後想成為一名電影導演。"]],"Teacher":[["My English teacher is very kind.","我的英文老師非常親切。"],["Our math teacher helps us a lot.","我們的數學老師幫了我們很多。"],["The music teacher can play the piano.","音樂老師會彈鋼琴。"],["She wants to be a science teacher.","她想成為一名自然老師。"],["Listen to your teacher in class.","在課堂上要聽老師的話。"],["Our math teacher gives us no homework.","我們的數學老師沒有給我們作業。"],["The art teacher has a blue bag.","美術老師有一個藍色的包包。"],["That young teacher likes playing basketball.","那個年輕的老師喜歡打籃球。"],["Our history teacher is from Canada.","我們的歷史老師來自加拿大。"]],"Coach":[["Our coach is very nice.","我們的教練人很好。"],["He is a basketball coach.","他是一位籃球教練。"],["The coach gave us some advice.","教練給了我們一些建議。"],["She thanks her coach today.","她今天感謝她的教練。"],["The team listens to the coach.","球隊聽從教練的指示。"],["Our basketball coach is very strict today.","我們的籃球教練今天很嚴格。"],["He wants to be a soccer coach.","他想要成為一名足球教練。"],["The coach gave us some useful advice.","教練給了我們一些有用的建議。"],["She thanked her coach after the game.","她在比賽結束後感謝了她的教練。"],["Our coach taught us how to swim.","我們的教練教我們如何游泳。"]],"Student":[["Tom is a good student.","湯姆是個好學生。"],["I am a new student here.","我是這裡的新學生。"],["Every student has a book.","每個學生都有一本書。"],["She is a hard-working student.","她是個用功的學生。"],["The student asks a question.","那個學生問了一個問題。"],["John is a new student here.","約翰這裡是個新學生。"],["Every student likes this fun teacher.","每個學生都喜歡這位有趣的老師。"],["The student asked a good question.","那個學生問了一個好問題。"],["Ten students went to the library.","十個學生去了圖書館。"]],"Classmate":[["He is my good junior classmate.","他是我的好學弟。"],["I share my lunch with classmates.","我和同學們分享我的午餐。"],["My classmate helps me with homework.","我的同學幫我寫功課。"],["We study with our new classmate.","我們和新同學一起讀書。"],["All classmates played basketball together.","全班同學一起打籃球。"],["He is my best classmate at school.","他在學校是我最好的同學。"],["I shared my lunch with a classmate.","我跟一位同學分享我的午餐。"],["All my classmates are very friendly.","我所有的同學都非常友善。"],["She plays basketball with her classmates.","她和同學一起打籃球。"],["My classmate helps me with my homework.","我的同學幫我寫功課。"]],"animal":[["The dog is my favorite animal.","狗是我最喜歡的動物。"],["We saw many wild animals today.","我們今天看到了許多野生動物。"],["Every animal needs water to live.","每種動物都需要水才能生存。"],["The zoo has a big animal hospital.","動物園有一間大型動物醫院。"],["Is a whale a sea animal?","鯨魚是海洋動物嗎？"],["The dog is a smart animal.","狗是一種聰明的動物。"],["We saw many wild animals at the zoo.","我們在動物園看到許多野生動物。"],["What is your favorite animal?","你最喜歡的動物是什麼？"],["The panda is a cute animal from China.","貓熊是來自中國的可愛動物。"],["Every animal needs food and water.","每種動物都需要食物和水。"]],"bear":[["A big brown bear lives in the forest.","一隻大棕熊住在森林裡。"],["The cute koala looks like a small bear.","那隻可愛的無尾熊看起來像一隻小熊。"],["She sleeps with her favorite toy bear.","她抱著她最愛的玩具熊睡覺。"],["Wild bears love to eat sweet honey.","野生熊很喜歡吃甜甜的蜂蜜。"],["We saw a panda bear at the zoo.","我們在動物園看到了貓熊。"],["The child is holding a cute toy bear.","那個小孩拿著一隻可愛的玩具熊。"],["We saw a wild bear on the mountain.","我們在山上看到了一隻野熊。"],["Polar bear eats fish to stay alive.","北極熊吃魚來維持生命。"],["Zoo keepers feed the hungry bear every day.","動物園管理員每天餵食飢餓的熊。"]],"cat":[["The black cat is very cute.","那隻黑貓非常可愛。"],["My pet cat likes sleeping much.","我的寵物貓很喜歡睡覺。"],["I saw a stray cat outside.","我在外面看到一隻流浪貓。"],["The smart cat caught a mouse.","那隻聰明的貓抓了一隻老鼠。"],["Do you want to raise cats?","你想養貓嗎？"],["A cute cat sleeps on the sofa.","一隻可愛的貓睡在沙發上。"],["My aunt has two fat brown cats.","我阿姨養了兩隻胖胖的棕色貓。"],["The black cat runs very fast outside.","那隻黑貓在外面跑得很快。"],["Do you like dogs or cats more?","你比較喜歡狗還是貓？"],["That cat drinks milk from a bowl.","那隻貓從碗裡喝牛奶。"]],"chicken":[["I like to eat fried chicken.","我喜歡吃炸雞。"],["The farmer raises many chickens.","那位農夫養了很多雞。"],["She orders chicken for dinner.","她晚餐點了雞肉。"],["The little chicken is very cute.","那隻小雞非常可愛。"],["We had chicken soup yesterday.","我們昨天喝了雞湯。"],["We had fried chicken for dinner last night.","我們昨晚晚餐吃炸雞。"],["My mother raises some cute chickens at home.","我媽媽在家裡養了一些可愛的雞。"],["Do you like chicken soup on cold days?","你喜歡在冷天喝雞湯嗎？"],["The little chicken ran across the farm yard.","小雞跑過了農場院子。"],["He ordered a chicken sandwich for lunch.","他午餐點了一個雞肉三明治。"]],"cow":[["The black and white cow eats grass.","那隻黑白相間的乳牛在吃草。"],["We saw a cow on the green farm.","我們在綠色的農場看到一頭牛。"],["Cows give us fresh milk every day.","乳牛每天給我們新鮮的牛奶。"],["The farmer is milking the cow now.","農夫現在正在幫乳牛擠奶。"],["That big cow looks very cute.","那頭大牛看起來非常可愛。"],["A black and white cow is eating grass.","一隻黑白相間的乳牛正在吃草。"],["We saw a big cow on the farm.","我們在農場看到了一隻大牛。"],["The farmer feeds the cows in the morning.","農夫在早晨餵乳牛。"],["That cow is sleeping under a big tree.","那隻牛正在大樹下睡覺。"]],"dog":[["I have a cute little dog.","我有一隻可愛的小狗。"],["The dog is sleeping on the floor.","那隻狗正在地板上睡覺。"],["That dog barks at night.","那隻狗會在晚上吠叫。"],["She walks her dog every morning.","她每天早上遛狗。"],["Give the hungry dog some food.","給這隻飢餓的狗一些食物。"],["The cute dog runs in the park.","那隻可愛的狗在公園裡跑。"],["My big dog loves to eat bones.","我的大狗很喜歡吃骨頭。"],["She walks her dog after school.","她在放學後遛狗。"],["The brown dog barked at the cat.","那隻棕色的狗對著貓吠叫。"],["We have a smart dog at home.","我們家有一隻聰明的狗。"]],"elephant":[["The elephant has a very long nose.","大象有一隻很長的鼻子。"],["We saw a big elephant at the zoo.","我們在動物園看到一隻大象。"],["Elephants like to play in the water.","大象喜歡在水裡玩耍。"],["That gray elephant is very heavy.","那隻灰色的大象非常重。"],["An elephant can eat a lot of grass.","大象可以吃很多草。"],["The big elephant has a long nose.","大象有長鼻子。"],["We saw a cute baby elephant today.","我們今天看到一隻可愛的小象。"],["Elephants like to eat fresh green grass.","大象喜歡吃新鮮的綠草。"],["Look at the elephant at the zoo.","看動物園裡的大象。"]],"fish":[["There are many fish in the pond.","池塘裡有許多魚。"],["My cat likes to eat fresh fish.","我的貓喜歡吃鮮魚。"],["Can you keep a pet fish?","你可以養寵物魚嗎？"],["We saw a big fish in the sea.","我們在海裡看到一隻大魚。"],["He bought some fish for dinner.","他買了一些魚當晚餐。"],["There are many colorful fish in the tank.","水族箱裡有很多彩色的小魚。"],["My cat likes to eat fish for dinner.","我的貓喜歡晚餐吃魚。"],["We saw a big fish in the river." h our family.","我們和家人一起慶祝聖誕節。"],["They celebrate her birthday at school.","他們在學校幫她慶祝生日。"],["Students celebrate the end of exams.","學生們慶祝考試結束。"],["People celebrate the New Year tonight.","人們今晚慶祝新年。"],["We celebrate our team winning the game.","我們慶祝我們的隊伍贏得比賽。"],["We celebrate my birthday with a cake.","我們吃蛋糕慶祝我的生日。"],["People celebrate the new year with fireworks.","人們用煙火慶祝新年。"],["They celebrate winning the game tonight.","他們今晚慶祝贏得比賽。"],["How do you celebrate Mother's Day?","你們都怎麼慶祝母親節？"],["Let us celebrate our graduation this weekend.","我們這週末來慶祝畢業吧。"]],"party":[["We will have a fun birthday party.","我們將舉辦一個有趣的生日派對。"],["Many friends came to my party.","許多朋友來參加我的派對。"],["She wears a pretty dress to the party.","她穿著漂亮的洋裝去派對。"],["They danced happily at the party.","他們在派對上開心地跳舞。"],["Thank you for inviting me to the party.","謝謝你邀請我參加派對。"],["We had a great birthday party yesterday.","我們昨天舉辦了一個很棒的生日派對。"],["She invited twenty friends to her party.","她邀請了二十位朋友參加她的派對。"],["Everyone wore funny masks at the party.","大家在派對上都戴著有趣的面具。"],["The dance party started at seven p.m.","舞會派對在晚上七點開始。"],["Did you enjoy the Christmas party?","你喜歡這個聖誕派對嗎？"]],"gift":[["Thank you for the nice gift.","謝謝你送的漂亮禮物。"],["I bought a gift for Mom.","我買了一份禮物給媽媽。"],["She opened her birthday gift.","她打開了她的生日禮物。"],["He got a big gift today.","他今天得到了的大禮物。"],["This book is a special gift.","這本書是一份特別的禮物。"],["I got a nice gift for my birthday.","我生日收到了一個好禮物。"],["She bought a small gift for her mom.","她幫媽媽買了一個小禮物。"],["Opening every gift is so much fun.","打開每一個禮物都好好玩。"],["He gave me a birthday gift yesterday.","他昨天給了我一個生日禮物。"],["We put the big gift on the table.","我們把大禮物放在桌子上。"]],"card":[["She made a birthday card for me.","她為我製作了一張生日卡片。"],["I wrote a nice card to mom.","我寫了一張漂亮的卡片給媽媽。"],["He gave me a Christmas card.","他給了我一張聖誕卡片。"],["Do you need a library card?","你需要一張借書卡片嗎？"],["They exchanged greeting cards in class.","他們在班上交換問候卡片。"],["I made a birthday card for my friend.","我為我的朋友做了一張生日卡片。"],["She wrote a sweet n ocal judge.","我們遇到了一位著名的當地法官。"]],"reporter":[["The reporter asked the mayor a question.","記者問了市長一個問題。"],["A reporter is taking pictures there.","一個記者正在那裡拍照。"],["She wants to be a famous reporter.","她想成為一個有名的記者。"],["The reporter wrote a good story.","記者寫了一篇好報導。"],["Many reporters waited outside the hotel.","許多記者在飯店外面等待。"],["A reporter took photos of the singer.","一位記者拍了這位歌手的照片。"],["That reporter writes stories for our newspaper.","那個記者為我們的報紙寫故事。"],["The young reporter looked very busy.","那個年輕的記者看起來非常忙碌。"],["Many reporters waited outside the big hotel.","許多記者在大飯店外面等待。"]],"actor":[["Tom Cruise is a famous actor.","湯姆克魯斯是一位著名的演員。"],["He wants to be a movie actor.","他想要成為一個電影演員。"],["That young actor did a great job.","那個年輕演員表現得很棒。"],["We saw our favorite actor downtown.","我們在市中心看到了我們最愛的演員。"],["The actor smiled at the fans.","那個演員向粉絲們微笑了。"],["Tom Cruise is a famous movie actor.","湯姆克魯斯是著名的電影演員。"],["He wants to be a great actor.","他想要成為一個偉大的演員。"],["The actor smiled at his fans.","那個演員向他的粉絲微笑。"],["I know this handsome young actor.","我認識這個帥氣的年輕演員。"],["That actor can sing and dance well.","那個演員歌唱和舞蹈都很棒。"]],"secretary":[["The secretary is answering the phone.","秘書正在接電話。"],["My mother works as a secretary.","我媽媽的工作是秘書。"],["He talked to the boss's secretary.","他跟老闆的秘書談話。"],["She is a busy secretary.","她是一位忙碌的秘書。"],["The secretary typed a long letter.","秘書打了一封長信。"],["The secretary answers phone calls all day.","秘書整天都在接電話。"],["Our new secretary is very kind.","我們的新秘書非常親切。"],["The boss talks to his secretary now.","老闆現在正在和他的秘書談話。"],["She works hard as a school secretary.","她身為學校秘書工作很努力。"],["The secretary helped me find the room.","秘書幫我找到了那個房間。"]],"manager":[["The manager helps us solve the problem.","經理幫助我們解決了這個問題。"],["Our store manager is a tall man.","我們的店經理是一位高個子男人。"],["The manager talks to the new staff.","經理正在和新員工談話。"],["He wants to be a hotel manager.","他想要成為一名飯店經理。"],["The manager checks the work every day.","經理每天都檢查工作進度。"],["The store manager helped us find the shoes.","店經理  in a year.","一年有四季。"],["Winter is a cold season.","冬天是一個寒冷的季節。"],["What is your favorite season?","你最喜歡哪個季節？"],["Fruit is cheap in this season.","這個季節的水果很便宜。"],["Spring is my favorite season of all.","春天是我最喜歡的季節。"],["Each season brings different kinds of flowers.","每個季節都會帶來不同種類的花。"],["Winter is a cold season in Japan.","冬天在日本是一個寒冷的季節。"],["The baseball season starts in the spring.","棒球賽季在春天開始。"],["Farmers work hard in every season.","農夫們在每一個季節都辛苦工作。"]],"summer":[["Summer is a hot season.","夏天是個熱的季節。"],["We love summer vacation.","我們喜歡暑假。"],["I go swimming in summer.","我在夏天去游泳。"],["This summer is very long.","這個夏天非常長。"],["Flowers bloom in the summer.","花朵在夏天盛開。"],["Summer vacation is coming very soon.","暑假很快就要到了。"],["We love eating ice cream in summer.","我們喜歡在夏天吃冰淇淋。"],["It is very hot this summer.","今年夏天非常熱。"],["They went to Kenting last summer.","他們去年夏天去了墾丁。"],["Summer days are long and sunny.","夏天的白天又長又晴朗。"]],"autumn":[["Autumn is a cool season.","秋天是一個涼爽的季節。"],["Leaves turn red in autumn.","樹葉在秋天變紅。"],["We like autumn very much.","我們非常喜歡秋天。"],["The weather changes in autumn.","天氣在秋天會改變。"],["Autumn brings a lot of fruit.","秋天帶來了許多水果。"],["Leaves turn red and yellow in autumn.","樹葉在秋天變成紅色與黃色。"],["Autumn is my favorite season of all.","秋天是我最喜歡的季節。"],["The weather gets cool during autumn.","秋天期間的天氣變得涼爽。"],["We often go camping every autumn.","我們經常在每年秋天去露營。"],["Farmers harvest crops in late autumn.","農夫在深秋時節收割農作物。"]],"winter":[["Winter is coming soon.","冬天快要來了。"],["I like to drink hot cocoa in winter.","我喜歡在冬天喝熱可可。"],["It is cold during winter.","冬天期間天氣很冷。"],["We wear coats in winter.","我們在冬天穿大衣。"],["Trees lose leaves in winter.","樹木在冬天會落葉。"],["I like winter because it is cold.","我喜歡冬天因為天氣很冷。"],["We usually go skiing in winter.","我們通常在冬天去滑雪。"],["Winter is coming very soon.","冬天很快就要來了。"],["The days are short in winter.","冬天的白天很短。"],["Birds fly south for the winter.","鳥類在冬天往南飛。"]],"clock":[["The clock on the wall is new.","牆上的時鐘是新的。"],["Please look at the clock.","請看一下時鐘 ng.","她開會遲到了。"],["Don't be late for school.","上學不要遲到。"],["He arrived home very late.","他很晚才回到家。"],["Why are you so late today?","你今天為什麼這麼晚？"],["I stayed up late last night.","我昨晚熬夜很晚。"],["The bus was ten minutes late.","公車遲到了十分鐘。"]],"soon":[["We will see each other soon.","我們很快就會見面。"],["The rain will stop soon.","雨很快就會停了。"],["Please come back home soon.","請趕快回家。"],["Dinner will be ready soon.","晚餐很快就會準備好。"],["He will finish his homework soon.","他很快就會寫完作業。"],["Summer vacation will start very soon.","暑假很快就要開始了。"],["Please come back home soon, my dear.","親愛的，請很快回家。"],["I hope I will see you again soon.","我希望很快能再見到你。"],["The rain will stop soon, so don't worry.","雨很快就會停，所以不用擔心。"]],"today":[["We have no class today.","我們今天沒有上課。"],["What is the weather like today?","今天的天氣怎麼樣？"],["I am very busy today.","我今天非常忙碌。"],["She will visit her grandma today.","她今天要去看她的外婆。"],["Today is a great day for a picnic.","今天是野餐的好日子。"],["We do not have any tests today.","我們今天沒有任何考試。"],["What are you going to do today?","你今天打算做什麼？"],["The weather is nice and cool today.","今天的天氣很涼爽宜人。"],["I need to finish my homework today.","我今天必須寫完我的作業。"]],"tomorrow":[["We will have an English test tomorrow.","我們明天有一場英文考試。"],["Will it rain tomorrow afternoon?","明天下午會下雨嗎？"],["See you tomorrow at the library.","我們明天圖書館見。"],["Tomorrow is a holiday for us.","明天對我們來說是個假日。"],["She must finish her project by tomorrow.","她必須在明天前完成她的專題。"],["Tomorrow is Saturday so I can sleep late.","明天是星期六所以我可以睡晚一點。"],["What will the weather be like tomorrow?","明天天氣會是什麼樣子？"],["I am going to the zoo tomorrow morning.","我明天早上要去動物園。"],["Please bring your notebook back tomorrow.","請明天把你的筆記本帶回來。"]],"yesterday":[["I was very happy yesterday.","我昨天非常快樂。"],["She visited her grandma yesterday.","她昨天去探望她奶奶。"],["It rained a lot yesterday.","昨天下了很多雨。"],["We played basketball yesterday.","我們昨天打籃球了。"],["He did not study yesterday.","他昨天沒有讀書。"],["It rained a lot yesterday afternoon.","昨天下午下了很多雨。"],["I stayed at home all day yesterday.","我昨天一整天都待在家  last year.","我去年去日本玩。"],["There are twelve months in a year.","一年有十二個月。"],["She will go to high school next year.","她明年要上高中了。"],["We study English every year.","我們每年都學英文。"],["My baby brother is one year old.","我的弟弟一歲了。"]],"daily":[["Reading books is part of my daily routine.","讀書是我日常作息的一部分。"],["We have a daily English test at school.","我們在學校有每天的英文考試。"],["She writes down her daily thoughts in a diary.","她把她每天的想法寫在日記裡。"],["Fresh milk is delivered to our house daily.","鮮奶每天都被送到我們家。"],["Walking the dog is his daily job.","遛狗是他的日常工作。"],["Reading books is my daily good habit.","讀書是我每天的好習慣。"],["She writes her daily diary before going to bed.","她在上床睡覺前寫每天的日記。"],["Walking the dog is his daily chore.","遛狗是他每天的家事。"],["Check your daily schedule on the board.","檢查黑板上的每天行程表。"]],"airplane":[["I see an airplane in the sky.","我看到天空中有一架飛機。"],["This is my first time on an airplane.","這是我第一次搭飛機。"],["The airplane flies above the clouds.","飛機在雲層上方飛行。"],["We will take an airplane to Japan.","我們要搭飛機去日本。"],["The airplane is landing right now.","飛機現在正在降落。"],["I saw a big airplane in the sky.","我在天空中看到一架大飛機。"],["He took an airplane to America yesterday.","他昨天搭飛機去美國。"],["The airplane is landing on the ground.","那架飛機正在地面上降落。"],["She drew a cool airplane on paper.","她在紙上畫了一架酷酷的飛機。"],["We waited for the airplane for hours.","我們等那架飛機等了好幾個小時。"]],"bicycle":[["My father bought me a new bicycle.","我爸爸買給我一台新腳踏車。"],["He rides his bicycle to school daily.","他每天騎腳踏車上學。"],["The bicycle is parked near the door.","那台腳踏車停在門口附近。"],["She can ride a bicycle very fast.","她腳踏車騎得非常快。"],["We cleaned our old bicycle yesterday.","我們昨天清理了我們的舊腳踏車。"],["I ride my bicycle to school every day.","我每天騎腳踏車去學校。"],["He bought a new bicycle last week.","他上星期買了一輛新腳踏車。"],["My sister's bicycle is blue and white.","我姊姊的腳踏車是藍白色的。"],["We can park our bicycles near the library.","我們可以把腳踏車停在圖書館附近。"],["She fell off her bicycle and hurt her knee.","她從腳踏車上摔下來並且傷了膝蓋。"]],"bike":[["I ride my bike on weekends.","我週末會騎我的單車。"],["His bike is red ion is very busy.","鐵道車站非常忙碌。"],["The railway connects two big cities together.","這條鐵道把兩個大城市連接在一起。"],["Workers are fixing the railway this week.","工人們這週正在修理鐵道。"],["My father works on the local railway.","我父親在當地鐵道工作。"],["The railway trip took about two hours.","這趟鐵道之旅花了大約兩個小時。"],["Animals cannot cross the railway safely.","動物無法安全地穿越鐵道。"]],"sidewalk":[["Walk safely on the wide sidewalk.","在寬闊的人行道上安全地走。"],["Children are playing on the sidewalk.","孩子們正在人行道上玩耍。"],["A dog ran across the sidewalk quickly.","一隻狗迅速跑過人行道。"],["We parked our bikes near the sidewalk.","我們把腳踏車停在人行道附近。"],["Leaves fall all over the sidewalk.","樹葉落滿了整個人行道。"],["Walk safely on the city sidewalk.","在城市人行道上安全地走。"],["Children play on the wide sidewalk.","孩子們在寬敞的人行道上玩耍。"],["He rode his bike on sidewalks.","他騎腳踏車在人行道上。"],["Leaves fell all over the sidewalk.","樹葉落滿了整個人行道。"],["We met an old friend on sidewalks.","我們在人行道上遇到老朋友。"]],"subway":[["We take the subway to school.","我們搭地鐵去學校。"],["The subway is fast and clean.","地鐵又快又乾淨。"],["She misses her subway train.","她錯過了她的地鐵列車。"],["Subway stations are very big.","地鐵站非常大。"],["Let us go by subway.","我們坐地鐵去吧。"],["The subway station is very clean.","地鐵站非常乾淨。"],["He lost his bag on subway.","他把包包弄丟在地鐵上了。"],["Subway trains are fast and safe.","地鐵列車又快又安全。"],["Let us meet near subway exit.","我們在地鐵出口附近碰面吧。"]],"traffic":[["The traffic is heavy right now.","現在交通非常擁擠。"],["I was late because of traffic.","我因為交通狀況而遲到了。"],["Be careful of traffic on streets.","在街上要小心交通安全。"],["Traffic moves slowly this morning.","今天早上的車流移動得很慢。"],["We must stop for traffic lights.","我們遇到交通號誌必須停下來。"],["There is heavy traffic on the bridge.","橋上的交通非常擁擠。"],["I was late because of bad traffic.","我因為交通狀況不好而遲到了。"],["Always watch the traffic before crossing roads.","過馬路之前一定要注意交通情況。"],["The traffic moves slowly during rush hour.","上下班尖峰時刻的交通移動得很慢。"],["We waited in traffic for two hours.","我們在車陣中塞了兩個小時。"]],"underpass":[["We walked through the dark underpass.","我們走過黑暗的地下道。"],["The underpass is safe at night ","請保持這張重要紙張安全且乾燥。"],["The ground became dry after the hot sun.","在大太陽照射後地面變乾了。"]],"foggy":[["It is very foggy this morning.","今天早上霧很大。"],["Drive slowly on foggy mountain roads.","在有霧的山路上開慢一點。"],["The foggy weather canceled our flight.","有霧的天氣取消了我們的航班。"],["I cannot see the tall building when foggy.","起霧時我看不到那棟高樓。"],["Winter mornings here are often foggy.","這裡的冬日早晨經常是有霧的。"],["It was foggy this morning on the road.","今天早上的道路上霧很濃。"],["We could not see the mountains because it was foggy.","因為起霧了，我們看不到山。"],["Be careful when driving on a foggy day.","在大霧天開車要小心。"],["The weather became foggy after the rain.","雨後天氣變得很霧。"],["Is it still foggy outside right now?","現在外面還起霧嗎？"]],"hot":[["Today is a hot day.","今天是炎熱的一天。*"],["The soup is very hot.","湯非常燙。"],["I do not like hot weather.","我不喜歡炎熱的天氣。"],["Wear a hat on a hot day.","在大熱天要戴帽子。"],["It is too hot to play outside.","外面太熱了不能玩。"],["Today is very hot in the afternoon.","今天下午非常炎熱。"],["I do not like this hot weather.","我不喜歡這炎熱的天氣。"],["The soup is too hot for me.","這湯對我來說太燙了。"],["Please do not touch the hot water.","請不要碰熱水。"],["We eat ice cream on hot days.","我們在炎熱的日子吃冰淇淋。"]],"humid":[["Summer in Taiwan is very hot and humid.","台灣的夏天非常炎熱又潮濕。"],["The weather is humid after the rain.","雨後的天氣很潮濕。"],["My clothes are wet in this humid air.","在這種潮濕的空氣中我的衣服都濕了。"],["Plants grow well in humid places.","植物在潮濕的地方長得很好。"],["I do not like this humid morning.","我不喜歡這個潮濕的早晨。"],["The weather is humid after the heavy rain.","大雨過後的天氣很潮濕。"],["Plants grow fast in this humid greenhouse.","植物在這個潮濕的溫室裡長得很快。"],["I do not like this humid morning air.","我不喜歡這種潮濕的早晨空氣。"],["Keep your books dry in humid weather.","在潮濕的天氣裡要保持書本乾燥。"]],"rainy":[["I like reading on rainy days.","我喜歡在下雨天閱讀。"],["It is a cold and rainy afternoon.","這是一個寒冷又下雨的下午。"],["We stayed home because it was rainy.","因為下雨我們待在家裡。"],["Do you have a rainy day plan?","你有雨天備案計畫嗎？"],["The weather will be rainy tomorrow.","明天天氣將會是下雨的。"],["Today is a cold and rainy day.","今天是個寒冷又下雨的日子。"],["I like to stay home on rainy afternoons.","我喜歡在下雨的下午待在家裡。"],["It was rainy so we played board games.","因為在下雨，所以我們玩了桌遊。"],["Plants grow well in the rainy season.","植物在雨季裡長得很好。"]],"snowy":[["We stayed home on a snowy day.","我們在下雪天待在家裡。"],["The snowy road is very dangerous.","下雪的路非常危險。"],["I like the snowy winter season.","我喜歡下雪的冬天的季節。"],["They took pictures of the snowy trees.","他們拍了下雪的樹木的照片。"],["Driving is hard in snowy weather.","在下雪的天氣開車很困難。"],["It is a snowy day today.","今天是個下雪的日子。"],["We stayed home on a snowy morning.","我們在下雪的早晨待在家裡。"],["The snowy road is very slippery now.","下雪的道路現在非常滑。"],["I like looking at snowy mountain views.","我喜歡看下雪的山景。"],["They drove slowly on snowy streets.","他們在下雪的街道上開得很慢。"]],"sunny":[["Today is a sunny day.","今天是個晴朗的日子。"],["We like sunny weather.","我們喜歡晴朗的天氣。"],["It was very sunny yesterday.","昨天非常晴朗。"],["Let us go out on a sunny afternoon.","我們在晴朗的下午出去吧。"],["The park looks nice in sunny weather.","公園在晴朗的天氣裡看起來很漂亮。"],["It is sunny today.","今天天氣晴朗。"],["We had a sunny morning.","我們度過了一個陽光普照的早晨。"],["The weather will be sunny tomorrow.","明天天氣將會是晴朗的。"],["I like sunny days.","我喜歡晴朗的日子。"]],"warm":[["The sun gives us warm light today.","太陽今天帶給我們溫暖的光。"],["I like to drink warm milk tonight.","我今晚喜歡喝溫暖的牛奶。"],["She wears a warm coat in winter.","她在冬天穿著一件溫暖的外套。"],["This room feels very nice and warm.","這個房間感覺非常舒適又溫暖。"],["Thank you for your warm words today.","謝謝你今天對我說的溫暖話語。"],["I like to drink warm milk before bed.","我喜歡在睡前喝溫暖的牛奶。"],["Please wear a jacket to stay warm.","請穿外套來保持溫暖。"],["Taiwan has warm weather in the spring.","台灣在春天有溫暖的天氣。"],["The little cat sleeps in a warm box.","小貓咪睡在一個溫暖的箱子裡。"]],"wet":[["My shoes are wet in the rain.","我的鞋子在雨中淋濕了。"],["Do not sit on the wet bench.","不要坐在那張潮濕的長椅上。"],["The puppy has wet fur today.","這隻小狗今天有濕濕的毛。"],["His hair was wet after swimming.","他游完泳後頭髮是濕的。"],["The grass is wet this morning.","今天早上的草地是濕的。"],["The dog is wet and dirty.","這隻狗又濕又髒。"],["Don't sit on the wet bench.","不要坐在潮濕的長凳上。"],["Her hair was wet after swimming.","她游泳後的頭髮是濕的。"]],"windy":[["It is a windy day today.","今天是個有風的日子。"],["Do not go out on windy days.","有風的日子不要出門。"],["The weather is cold and windy.","天氣又冷又多風。"],["We can fly kites in windy weather.","我們可以在有風的天氣放風箏。"],["It became very windy this afternoon.","今天下午變得風很大。"],["It is too windy to fly kites.","風太大而不適合放風箏。"],["Today is cold and very windy.","今天很冷而且風很大。"],["We stayed home on a windy afternoon.","在一個風很大的下午我們待在家裡。"],["The weather will be windy tomorrow.","明天天氣將會有風。"],["Why is it so windy outside?","為什麼外面風這麼大？"]],"nature":[["I love to study nature.","我喜歡研究大自然。"],["We should protect nature.","我們應該保護大自然。"],["Birds live in nature.","鳥類生活在大自然中。"],["Nature is full of surprises.","大自然充滿了驚奇。"],["Let us go back to nature.","讓我們回歸大自然吧。"],["I love walking in big nature.","我喜歡在大自然中散步。"],["Nature gives us fresh air daily.","大自然每天給我們新鮮空氣。"],["Students learn about nature on Friday.","學生們在星期五學習大自然。"],["Pictures of nature look very beautiful.","大自然的圖片看起來非常漂亮。"],["We must save animals and nature.","我們必須拯救動物和大自然。"]],"cloud":[["I see a big cloud.","我看到一朵大雲。"],["A dark cloud is coming.","烏雲正在接近。"],["Look at that white cloud.","看那朵白雲。"],["The plane flew above the cloud.","飛機飛越了雲層。"],["Every cloud has a silver lining.","天無絕人之路。"],["I saw a bird in the cloud.","我看到雲裡有一隻鳥。"],["A dark cloud is in the sky.","天空中有一朵烏雲。"],["That white cloud looks like a rabbit.","那朵白雲看起來像一隻兔子。"],["The airplane flew right into the cloud.","飛機直接飛進了雲層裡。"],["Every cloud hides the bright sun today.","今天每朵雲都遮住了燦爛的太陽。"]],"moon":[["The moon is very bright tonight.","今晚的月亮非常明亮。"],["Can you see the moon in the sky?","你能在天空中看到月亮嗎？"],["The moon goes around the earth.","月亮繞著地球運行。"],["We looked at the moon through a telescope.","我們透過望遠鏡看月亮。"],["The full moon looks like a big plate.","滿月看起來像一個大盤子。"],["The moon looks very bright tonight.","今晚的月亮看起來非常亮。"],["We can see the moon in the night sky.","我們可以在夜空中看到月亮。"],["The moon goes around the Earth.","月亮繞著地球轉。"],["He likes to look at the moon.","他喜歡看月亮。"],["The stars and the moon shine together.","星星和月亮一同閃耀。"]],"sky":[["The sky is blue and clear.","天空是藍色且晴朗的。"],["Look at the stars in the sky.","看天空中的星星。"],["Dark clouds fill the evening sky.","烏雲佈滿了黃昏的天空。"],["Birds fly high in the sky.","鳥兒在天空中高飛。"],["The sky turns red at sunset.","日落時天空變紅了。"],["I saw many stars in the sky.","我在天空中看到了許多星星。"],["Dark clouds covered the whole sky.","烏雲遮住了整個天空。"],["Birds are flying high in the sky.","鳥兒在天空中高飛。"],["The sunset paints the sky pink.","日落把天空染成粉紅色。"]],"sun":[["The sun is very bright.","太陽非常亮。"],["We see the sun today.","我們今天看到了太陽。"],["The sun rises in morning.","太陽在早上升起。"],["Hide from the hot sun.","躲開炎熱的太陽。"],["Plants need water and sun.","植物需要水和太陽。"],["The sun shines brightly outside today.","今天外面陽光普照。"],["Do not look at the sun.","不要直視太陽。"],["Plants need water and the sun.","植物需要水和太陽。"],["The sun goes down at night.","太陽在夜晚西下。"],["We sat under the warm sun.","我們坐在溫暖的太陽底下。"]],"star":[["I can see a bright star tonight.","我今晚可以看到一顆明亮的星星。"],["The little boy looked up at a star.","那個小男孩抬頭看著一顆星星。"],["Many stars are shining in the dark sky.","許多星星在黑暗的天空中閃爍。"],["She wished upon a falling star.","她對著一顆流星許願。"],["Every star in the sky is far away.","天空中的每一顆星星都很遙遠。"],["Look at the bright star in the sky.","看天空中那顆明亮的星星。"],["We can see many star tonight easily.","我們今晚可以輕易看到許多星星。"],["She drew a pretty yellow star on paper.","她在紙上畫了一顆漂亮的黃色星星。"],["The little girl wishes upon a shooting star.","小女孩對著流星許願。"],["Stars shine brightly in the dark night sky.","星星在黑暗的夜空中閃爍著光芒。"]],"temperature":[["The temperature is very high today.","今天的溫度非常高。"],["Check your temperature before going out.","出門前量一下你的溫度。"],["The water temperature is quite cold.","水溫相當冷。"],["Winter temperature drops down very fast.","冬天的溫度下降得非常快。"],["The temperature is twenty degrees now.","現在的溫度是二十度。"],["The temperature drops down at night.","氣溫在晚上會下降。"],["Today's temperature is thirty degrees Celsius.","今天的溫度是攝氏三十度。"],["The doctor checked my body temperature.","醫生幫我量了體溫。"],["Winter temperature is });
// 比對前統一格式：忽略大小寫、多餘空白、句點（a.m. = am）、彎引號
function normalizeAns(s) {
  return String(s == null ? '' : s).trim().toLowerCase()
    .replace(/[\u2018\u2019`]/g, "'").replace(/\./g, '').replace(/\s+/g, ' ');
}
function isHomophoneMatch(input, target) {
  const a = normalizeAns(input), b = normalizeAns(target);
  if (a === b) return true;
  const g = HOMOPHONE_MAP.get(b);
  return !!(g && g.includes(a));
}

/* ============================================================================
 * 3. 自動將單字庫轉換為「主題城堡」、「字母城堡」與「中心城堡」
 * ============================================================================ */
function chunkWordsToSections(words, chId, chTitle) {
  // 20 字以內不分節；超過時平均切成每節約 15 字（各節字數最多相差 1）
  const TARGET = 15;
  const n = words.length;
  if (n === 0) return [];
  if (n <= 20) {
    return [{
      id: `${chId}-s1`,
      title: `第 1 節：${words[0].word} ～ ${words[n - 1].word}（共 ${n} 字）`,
      words: words.slice()
    }];
  }
  const numSecs = Math.max(1, Math.round(n / TARGET));
  const baseSize = Math.floor(n / numSecs);
  const rem = n % numSecs;
  const sections = [];
  let start = 0;
  for (let i = 0; i < numSecs; i++) {
    const size = baseSize + (i < rem ? 1 : 0);
    const slice = words.slice(start, start + size);
    sections.push({
      id: `${chId}-s${i + 1}`,
      title: `第 ${i + 1} 節：${slice[0].word} ～ ${slice[slice.length - 1].word}（${slice.length} 字）`,
      words: slice
    });
    start += size;
  }
  return sections;
}

// 把資料轉成 [{ word, meaning, category, image, examples:[{en,zh}] }]（也相容舊版 sheets 格式）
function normalizeData(app) {
  if (app && Array.isArray(app.words)) {
    const exMap = app.examples || {};
    return app.words.map(w => ({
      word: String(w.word || '').trim(),
      meaning: String(w.meaning || '').trim(),
      category: String(w.category || '').trim(),
      image: w.image || '',
      examples: (exMap[w.word] || []).map(p => Array.isArray(p) ? { en: p[0] || '', zh: p[1] || '' } : p)
    }));
  }
  const sheets = (app && app.sheets) || {};
  return Object.keys(sheets).flatMap(k => sheets[k] || []);
}

// 合併同一個字的多筆資料：字義去重後以「；」串接，例句去重聯集
function mergeWordList(list) {
  const map = new Map();
  list.forEach(w => {
    const key = w.word.toLowerCase();
    if (!map.has(key)) {
      map.set(key, { ...w, examples: (w.examples || []).slice(), _m: [w.meaning].filter(Boolean) });
      return;
    }
    const t = map.get(key);
    if (w.meaning && !t._m.includes(w.meaning)) t._m.push(w.meaning);
    const seen = new Set(t.examples.map(e => e.en));
    (w.examples || []).forEach(e => { if (!seen.has(e.en)) { seen.add(e.en); t.examples.push(e); } });
    if (!t.image && w.image) t.image = w.image;
  });
  return Array.from(map.values()).map(t => { const { _m, ...rest } = t; return { ...rest, meaning: _m.join('；') }; });
}

function buildKingdomWorld() {
  const rawWords = normalizeData(APP).filter(w => w && w.word);
  // 字母城堡與中心城堡：同一個字只出現一次，依字母排序
  const allWords = mergeWordList(rawWords).sort((a, b) => a.word.localeCompare(b.word, 'en', { sensitivity: 'base' }));

  // 1) 中心城堡（全範圍綜合試煉：共 8 階試煉，每階 20 題隨機抽題）
  const centerSections = Array.from({ length: 8 }, (_, i) => ({
    id: `center-s${i + 1}`,
    title: `第 ${i + 1} 階皇家試煉（全範圍隨機 ${Math.min(20, allWords.length)} 題）`,
    isRandomPool: true,
    poolSize: Math.min(20, allWords.length),
    words: allWords
  }));
  const centerCastle = {
    id: 'center_castle',
    no: '中心城堡',
    title: '王國中心城堡（全範圍）',
    subtitle: `涵蓋全部 ${allWords.length} 個單字・8 階皇家綜合試煉`,
    icon: '👑',
    color: '#d4a238',
    isCenter: true,
    totalWords: allWords.length,
    sections: allWords.length ? centerSections : []
  };

  // 2) 主題分類城堡：分類順序與分類內單字順序都照題庫原本的順序；同分類重複的字會合併
  const catMap = new Map();
  rawWords.forEach(w => {
    const cat = (w.category || 'Uncategorized').trim();
    if (!catMap.has(cat)) catMap.set(cat, []);
    catMap.get(cat).push(w);
  });
  const themeCastles = Array.from(catMap.entries()).map(([cat, rawList], idx) => {
    const list = mergeWordList(rawList);
    const meta = CATEGORY_META[cat] || { zh: `${cat} 城堡`, icon: '🏰', color: PALETTE[idx % PALETTE.length] };
    const id = 'cat_' + cat.toLowerCase().replace(/[^a-z0-9]+/g, '_');
    return {
      id,
      no: `主題 ${idx + 1}`,
      title: meta.zh,
      enSub: cat,
      icon: meta.icon,
      color: meta.color,
      totalWords: list.length,
      sections: chunkWordsToSections(list, id, meta.zh)
    };
  });

  // 3) 字母分類城堡 (A-Z)
  const alphaMap = new Map();
  allWords.forEach(w => {
    const first = (w.word || '').trim().charAt(0).toUpperCase();
    const key = /^[A-Z]$/.test(first) ? first : '#';
    if (!alphaMap.has(key)) alphaMap.set(key, []);
    alphaMap.get(key).push(w);
  });
  const alphaKeys = Array.from(alphaMap.keys()).sort();
  const alphaCastles = alphaKeys.map((letter, idx) => {
    const list = alphaMap.get(letter);
    const id = 'alpha_' + (letter === '#' ? 'other' : letter.toLowerCase());
    return {
      id,
      no: `字母 ${letter}`,
      title: `${letter} 字母城堡`,
      enSub: `Letter ${letter}`,
      icon: letter,
      color: PALETTE[idx % PALETTE.length],
      totalWords: list.length,
      sections: chunkWordsToSections(list, id, `${letter} 字母城堡`)
    };
  });

  return {
    title: SITE.title || '英語單字王國',
    subtitle: SITE.subtitle || '',
    storageKey: SITE.storageKey || 'english_castle_typing_v1',
    totalWords: allWords.length,
    centerCastle,
    modes: {
      theme: { id: 'theme', title: '🏰 主題分類城堡', castles: themeCastles },
      alpha: { id: 'alpha', title: '🔤 字母分類城堡', castles: alphaCastles }
    }
  };
}

// 進度碼編解碼
const sumHash = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h.toString(36); };
const toB64 = str => { const bytes = new TextEncoder().encode(str); let bin = ''; bytes.forEach(b => { bin += String.fromCharCode(b); }); return btoa(bin); };
const fromB64 = b64 => { const bin = atob(b64); const bytes = Uint8Array.from(bin, c => c.charCodeAt(0)); return new TextDecoder().decode(bytes); };
const encodeCode = (prog, key) => { const body = toB64(JSON.stringify({ k: key, p: prog })); return `QW1.${sumHash(body)}.${body}`; };
const decodeCode = (code, key) => {
  const c = (code || '').replace(/\s+/g, '');
  const m = c.match(/^QW1\.([a-z0-9]+)\.(.+)$/);
  if (!m) throw new Error('格式不對，請確認是從「匯出進度碼」複製的完整內容。');
  if (sumHash(m[2]) !== m[1]) throw new Error('進度碼不完整，可能少複製了一段，請重新複製。');
  const obj = JSON.parse(fromB64(m[2]));
  if (obj.k !== key) throw new Error('這是其他地圖的進度碼，無法匯入這張地圖。');
  if (!obj.p || !obj.p.sec) throw new Error('進度碼內容損壞。');
  return Object.assign(blankProgress(), obj.p);
};

function castleStatus(ch, prog) {
  const secs = ch.sections || [];
  const done = secs.filter(s => prog.sec[s.id] && prog.sec[s.id].done).length;
  const stars = secs.reduce((a, s) => a + ((prog.sec[s.id] && prog.sec[s.id].best) || 0), 0);
  const time = secs.reduce((a, s) => a + ((prog.sec[s.id] && prog.sec[s.id].time) || 0), 0);
  const last = secs.map(s => prog.sec[s.id] && prog.sec[s.id].at).filter(Boolean).sort().pop();
  return {
    total: secs.length,
    done,
    complete: secs.length > 0 && done === secs.length,
    stars,
    maxStars: secs.length * 3,
    time,
    last
  };
}

function sectionState(ch, idx, prog) {
  const s = ch.sections[idx];
  if (!s) return 'empty';
  if (prog.sec[s.id] && prog.sec[s.id].done) return 'done';
  for (let i = 0; i < idx; i++) {
    const prev = ch.sections[i];
    if (!(prog.sec[prev.id] && prog.sec[prev.id].done)) return 'locked';
  }
  return 'next';
}

function calcStars(rate) {
  if (rate === 100) return 3;
  if (rate >= 80) return 2;
  if (rate >= 60) return 1;
  return 0;
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderStarsSvg(n, max = 3) {

// 語音與測驗執行期狀態
const synth = window.speechSynthesis || null;
let voices = [];
let preferredVoice = null;
function loadVoices() {
  if (!synth) return;
  voices = synth.getVoices();
  preferredVoice =
    voices.find(v => /en[-_]US/i.test(v.lang) && /Google|Samantha|Microsoft|Natural/i.test(v.name)) ||
    voices.find(v => /en[-_]US/i.test(v.lang)) ||
    voices.find(v => /^en/i.test(v.lang)) ||
    null;
}
if (synth) {
  loadVoices();
  if (typeof synth.onvoiceschanged !== 'undefined') synth.onvoiceschanged = loadVoices;
}

let speakToken = 0;
function cancelSpeech() {
  speakToken++;
  if (synth) { try { synth.cancel(); } catch (e) {} }
}
function speakText(text, rate, onEnd) {
  const myToken = ++speakToken;
  if (!synth || !text) {
    if (onEnd) setTimeout(() => { if (myToken === speakToken) onEnd(); }, 300);
    return;
  }
  try { synth.cancel(); } catch (e) {}
  const u = new SpeechSynthesisUtterance(text);
  if (preferredVoice) u.voice = preferredVoice;
  u.lang = (preferredVoice && preferredVoice.lang) || 'en-US';
  u.rate = rate || prog.quizCfg.speechRate || 0.8;
  let done = false;
  const finish = () => {
    if (done) return;
    done = true;
    if (myToken === speakToken && onEnd) onEnd();
  };
  u.onend = finish;
  u.onerror = finish;
  // 安全保護避免部分行動瀏覽器未觸發 onend
  const estMs = Math.max(2500, Math.min(25000, Math.round(text.length * 140 / (u.rate || 1)) + 800));
  setTimeout(finish, estMs);
  synth.speak(u);
}

    const oldInp = document.getElementById('answer-input');
    if (oldInp) quizState.ui.inputVal = oldInp.value;
  }

  root.innerHTML = topbarHtml + bodyHtml + modalHtml;
  bindGlobalEvents();
  if (currentView.name === 'play') {
    bindPlayEvents();
    syncPlayUI();
    if (!activeModal && quizState && !quizState.questionResolved) {
      const inp = document.getElementById('answer-input');
      if (inp) inp.focus();
    }
  }
  updateTopbarHeight();
}

/* ============================================================================
 * 8. 語音聽力＋例句打字測驗 核心流程
 * ============================================================================ */
function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startSectionQuiz(ch, secIdx, customWordList = null) {
  const sec = ch.sections[secIdx];
  if (!sec) return;
  // 防止跳關：正式闖關時，未解鎖的小節不能開始
  if (!customWordList && sectionState(ch, secIdx, prog) === 'locked') return;
  clearAllQuizTimers();
  let pool = customWordList
    ? customWordList.slice()
    : sec.isRandomPool
    ? shuffleArr(sec.words).slice(0, sec.poolSize || 20)
    : shuffleArr(sec.words);

  const questions = pool.map(item => {
    const exList = Array.isArray(item.examples) && item.examples.length
      ? item.examples
      : [{ en: `Please spell the word ${item.word}.`, zh: `請拼出 ${item.meaning || item.word}。` }];
    const pick = exList[Math.floor(Math.random() * exList.length)];
    return {
      word: item.word,
      meaning: item.meaning || '',
      category: item.category || '',
      sentence: pick.en || '',
      translation: pick.zh || '',
      raw: item
    };
  });

  quizState = {
    ch,
    secIdx,
    sec,
    isRetryWrong: !!customWordList,
    playMode: prog.quizCfg.playMode || 'practice',
    thinkingTime: Number(prog.quizCfg.thinkingTime) || 8,
    showMeaning: !!prog.quizCfg.showMeaning,
    speechRate: Number(prog.quizCfg.speechRate) || 0.8,
    questions,
    qIdx: 0,
    startTime: Date.now(),
    elapsedSec: 0,
    results: [], // { q, status: 'correct'|'incorrect'|'skipped', userInput, attempts }
    curAttempts: 0,
    questionResolved: false,
    countdownStarted: false,
    ui: { status: '準備播放語音…', fbClass: '', fbText: '', inputVal: '', showEx: false, showTrans: false, countdown: '' }
  };

  currentView = { name: 'play' };
  renderApp();

  quizInterval = setInterval(() => {
    if (!quizState) return;
    quizState.elapsedSec = Math.round((Date.now() - quizState.startTime) / 1000);
    const tEl = document.getElementById('quiz-timer-val');
    if (tEl) tEl.textContent = fmtTime(quizState.elapsedSec);
  }, 1000);

  loadCurrentQuestion();
}

// 練習模式「顯示例句」時遮住答案單字（含 -s/-ed/-ing 等變化），避免直接看到拼法
function maskWord(sentence, word) {
  const w = String(word || '').trim();
  if (!sentence || !w) return sentence || '';
  const esc = w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
  const tail = w.length <= 2 ? '(?![A-Za-z])' : '[A-Za-z]*';
  const re = new RegExp('(^|[^A-Za-z])(' + esc + tail + ')', 'gi');
  return sentence.replace(re, (m, pre) => pre + '＿＿＿');
}

function setStatus(text) {
  if (!quizState) return;
  quizState.ui.status = text;
  const el = document.getElementById('status-line');
  if (el) el.textContent = text;

function setFeedback(cls, text) {
  if (!quizState) return;
  quizState.ui.fbClass = cls;
  quizState.ui.fbText = text;
  const el = document.getElementById('answer-feedback');
  if (el) { el.className = cls; el.textContent = text; }
}
function setCountdown(text) {
  if (!quizState) return;
  quizState.ui.countdown = text;
  const el = document.getElementById('next-question-countdown');
  if (el) { el.textContent = text; el.classList.toggle('hidden', !text); }
}

// 依 quizState 把整個作答畫面填回去（換題、揭曉答案、或畫面被重畫時都呼叫）
function syncPlayUI() {
  const qSt = quizState;
  if (!qSt || !qSt.ui || qSt.qIdx >= qSt.questions.length) return;
  const q = qSt.questions[qSt.qIdx];
  const ui = qSt.ui;
  const byId = id => document.getElementById(id);
  const setText = (id, t) => { const el = byId(id); if (el) el.textContent = t; };

  setText('quiz-progress-val', `${qSt.qIdx + 1} / ${qSt.questions.length}`);
  setText('quiz-timer-val', fmtTime(qSt.elapsedSec));
  setText('question-no', `第 ${qSt.qIdx + 1} 題（共 ${qSt.questions.length} 題）`);
  setText('meaning-hint', qSt.showMeaning ? `💡 字義提示：${q.meaning}` : '（無字義提示・同音字皆算對）');
  setText('status-line', ui.status);

  const fb = byId('answer-feedback');
  if (fb) { fb.className = ui.fbClass; fb.textContent = ui.fbText; }

  const exS = byId('example-sentence');
  const exT = byId('example-translation');
  if (exS) { exS.textContent = maskWord(q.sentence, q.word); exS.classList.toggle('hidden', !ui.showEx); }
  if (exT) { exT.textContent = q.translation; exT.classList.toggle('hidden', !ui.showTrans); }

  const inp = byId('answer-input');
  if (inp) { inp.value = ui.inputVal || ''; inp.disabled = qSt.questionResolved; }

  const ansPanel = byId('answer-panel');
  if (ansPanel) {
    if (qSt.questionResolved) {
      setText('ans-word', q.word);
      setText('ans-meaning', q.meaning);
      setText('ans-example', q.sentence);
      setText('ans-translation', q.translation);
    }
    ansPanel.classList.toggle('hidden', !qSt.questionResolved);
  }

  const cdEl = byId('next-question-countdown');
  if (cdEl) { cdEl.textContent = ui.countdown; cdEl.classList.toggle('hidden', !(qSt.questionResolved && ui.countdown)); }

  const btnSubmit = byId('btn-submit-ans');
  const btnReveal = byId('btn-reveal-ans');
  const btnNext = byId('btn-next-q');
  if (btnSubmit) btnSubmit.classList.toggle('hidden', qSt.questionResolved);
  if (btnReveal) btnReveal.classList.toggle('hidden', qSt.questionResolved || qSt.playMode !== 'practice');
  if (btnNext) {
    btnNext.textContent = qSt.qIdx >= qSt.questions.length - 1 ? '查看成績結算 →' : '下一題 →';
    btnNext.classList.toggle('hidden', !qSt.questionResolved);
  }
}

function loadCurrentQuestion() {
  if (!quizState) return;
  if (thinkingTimer) { clearInterval(thinkingTimer); thinkingTimer = null; }
  if (nextCountdownTimer) { clearInterval(nextCountdownTimer); nextCountdownTimer = null; }

  const qSt = quizState;
  if (qSt.qIdx >= qSt.questions.length) {
    finishQuizSection();
    return;
  }

  const q = qSt.questions[qSt.qIdx];
  qSt.curAttempts = 0;
  qSt.questionResolved = false;
  qSt.countdownStarted = false;
  qSt.ui = { status: '🔊 正在播放單字與例句語音…', fbClass: '', fbText: '', inputVal: '', showEx: false, showTrans: false, countdown: '' };
  syncPlayUI();

  const inp = document.getElementById('answer-input');
  if (inp && !activeModal) inp.focus();

  // 播放語音：先念單字 -> 例句 -> 再念一次單字，播完開始思考倒數
  const myIdx = qSt.qIdx;
  const alive = () => quizState === qSt && qSt.qIdx === myIdx && !qSt.questionResolved;
  speakText(q.word, qSt.speechRate, () => {
    if (!alive()) return;
    speakText(q.sentence, qSt.speechRate, () => {
      if (!alive()) return;
      speakText(q.word, qSt.speechRate, () => {
        if (!alive()) return;
        startThinkingCountdown();
      });
    });
  });
}

function startThinkingCountdown() {
  const qSt = quizState;
  if (!qSt || qSt.questionResolved || qSt.countdownStarted) return;
  qSt.countdownStarted = true;
  const myIdx = qSt.qIdx;
  let left = qSt.thinkingTime;
  setStatus(`⏳ 請作答（思考時間剩餘 ${left} 秒）`);

  if (thinkingTimer) clearInterval(thinkingTimer);
  thinkingTimer = setInterval(() => {
    if (quizState !== qSt || qSt.qIdx !== myIdx || qSt.questionResolved) {
      clearInterval(thinkingTimer);
      thinkingTimer = null;
      return;
    }
    left--;
    if (left > 0) {
      setStatus(`⏳ 請作答（思考時間剩餘 ${left} 秒）`);
    } else {
      clearInterval(thinkingTimer);
      thinkingTimer = null;
      if (qSt.playMode === 'test') {
        // 測驗模式時間到：有輸入就判定，沒輸入算未作答
        const inp = document.getElementById('answer-input');
        const val = inp ? inp.value.trim() : '';
        if (val) submitCurrentAnswer();
        else resolveQuestion('skipped', '');
      } else {
        setStatus('💡 思考時間到，可繼續輸入或點選「顯示答案」');
      }
    }
  }, 1000);
}

function submitCurrentAnswer() {
  if (!quizState || quizState.questionResolved) return;
  const inp = document.getElementById('answer-input');
  if (!inp) return;
  const userVal = inp.value.trim();
  if (!userVal) return;
  quizState.ui.inputVal = inp.value;

  const q = quizState.questions[quizState.qIdx];
  quizState.curAttempts++;

  const isExact = normalizeAns(userVal) === normalizeAns(q.word);
  const isHomo = !quizState.showMeaning && isHomophoneMatch(userVal, q.word);

  if (isExact || isHomo) {
    // 練習模式：第一次就答對才算「答對」；訂正後才答對另外標示，不計入答對率
    const status = quizState.curAttempts > 1 ? 'corrected' : 'correct';
    resolveQuestion(status, userVal, isHomo && !isExact);
  } else if (quizState.playMode === 'test') {
    resolveQuestion('incorrect', userVal);
  } else {
    setFeedback('feedback bad', `✗ 拼字不正確（你輸入：${userVal}），請再試一次或點「顯示答案」！`);
    inp.select();
  }
}

function resolveQuestion(status, userInput, isHomoNote = false) {
  if (!quizState || quizState.questionResolved) return;
  const qSt = quizState;
  qSt.questionResolved = true;
  if (thinkingTimer) { clearInterval(thinkingTimer); thinkingTimer = null; }
  cancelSpeech();

  const q = qSt.questions[qSt.qIdx];
  qSt.results.push({
    q,
    status,
    userInput: userInput || '',
    attempts: qSt.curAttempts
  });

  qSt.ui.status = '';
  if (status === 'correct') {
    qSt.ui.fbClass = 'feedback ok';
    qSt.ui.fbText = isHomoNote ? `✓ 答對了！（同音字認可：${q.word}）` : '✓ 答對了！太棒了！';
  } else if (status === 'corrected') {
    qSt.ui.fbClass = 'feedback info';
    qSt.ui.fbText = `✓ 訂正後答對（第 ${qSt.curAttempts} 次嘗試，不計入答對率）`;
  } else if (status === 'incorrect') {
    qSt.ui.fbClass = 'feedback bad';
    qSt.ui.fbText = `✗ 答錯了（你的答案：${userInput || '未作答'}）`;
  } else {
    qSt.ui.fbClass = 'feedback info';
    qSt.ui.fbText = '💡 已顯示正確答案';
  }

  // 答對 2 秒後自動下一題；其他情況留 4 秒看正解
  let waitSec = status === 'correct' ? 2 : 4;
  const cdText = n => `${n} 秒後自動進入下一題（也可直接按 Enter 或點擊按鈕）`;
  qSt.ui.countdown = cdText(waitSec);
  syncPlayUI();

  const btnNext = document.getElementById('btn-next-q');
  if (btnNext && !activeModal) btnNext.focus();

  const myIdx = qSt.qIdx;
  if (nextCountdownTimer) clearInterval(nextCountdownTimer);
  nextCountdownTimer = setInterval(() => {
    if (quizState !== qSt || qSt.qIdx !== myIdx) {
      clearInterval(nextCountdownTimer);
      nextCountdownTimer = null;
      return;
    }
    waitSec--;
    if (waitSec > 0) {
      setCountdown(cdText(waitSec));
    } else {
      clearInterval(nextCountdownTimer);
      nextCountdownTimer = null;
      goNextQuestion();
    }
  }, 1000);
}

function goNextQuestion() {
  if (!quizState || !quizState.questionResolved) return;
  quizState.qIdx++;
  loadCurrentQuestion();
}

function finishQuizSection() {
  clearAllQuizTimers();
  const qSt = quizState;
  const total = qSt.results.length;
  const correctCount = qSt.results.filter(r => r.status === 'correct').length;
  const wrongCount = total - correctCount;
  const rate = total > 0 ? Math.round((correctCount / total) * 100) : 0;
  const stars = calcStars(rate);
  const passed = rate >= 60;
  const elapsed = Math.max(1, Math.round((Date.now() - qSt.startTime) / 1000));

  // 非「僅重練錯題」時才寫入正式闖關小節進度（或重練錯題全對也可更新）
  const ch = qSt.ch;
  const sec = qSt.sec;
  const beforeComplete = castleStatus(ch, prog).complete;

  if (!qSt.isRetryWrong && passed) {
    const old = prog.sec[sec.id] || {};
    prog.sec[sec.id] = {
      done: true,
      at: new Date().toISOString(),
      firstAt: old.firstAt || new Date().toISOString(),
      time: old.time ? Math.min(old.time, elapsed) : elapsed,
      stars,
      best: Math.max(old.best || 0, stars),
      bestRate: Math.max(old.bestRate || 0, rate),
      wrong: wrongCount,
      plays: (old.plays || 0) + 1,
      wrongWords: qSt.results.filter(r => r.status !== 'correct').map(r => ({
        word: r.q.word,
        meaning: r.q.meaning,
        yours: r.userInput || '（未作答）'
      }))
    };
  }

  const afterComplete = castleStatus(ch, prog).complete;
  let nextIdx = null;
  if (passed && !qSt.isRetryWrong && qSt.secIdx + 1 < ch.sections.length) {
    nextIdx = qSt.secIdx + 1;
  }

  currentView = {
    name: 'result',
    ch,
    secIdx: qSt.secIdx,
    sec,
    summary: { total, correctCount, wrongCount, rate, stars, passed, elapsed, results: qSt.results, isRetryWrong: qSt.isRetryWrong },
    nextIdx
  };

  if (!beforeComplete && afterComplete) {
    activeModal = { kind: 'celebrate', ch };
  }
  renderApp();
}

    return `<div>${timeStr} 匯入進度碼（碼內姓名：${escapeHtml(fmtPlayer(e.to))}）${e.replaced ? `，取代了原本的 ${escapeHtml(e.replaced)}` : ''}</div>`;
