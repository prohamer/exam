<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>等加速運動測驗</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* 隱藏元素的 class，用來切換畫面 */
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-white text-gray-900">

    <!-- 開始畫面 -->
    <div id="start-screen" class="flex items-center justify-center h-screen px-4">
        <button onclick="startGame()" class="text-xl sm:text-2xl px-6 py-3 sm:px-8 sm:py-4 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded-lg shadow-lg transition duration-300 ease-in-out transform hover:scale-105">
            開始遊戲
        </button>
    </div>

    <!-- 遊戲畫面 -->
    <div id="game-screen" class="hidden p-2 sm:p-4 max-w-4xl mx-auto mt-4">
        <h1 class="text-xl sm:text-2xl font-bold mb-2 sm:mb-3 text-center text-blue-600">等加速運動測驗</h1>
        
        <!-- 計分板 -->
        <div class="mb-2 sm:mb-3 flex justify-between items-center bg-gray-100 p-2 sm:p-3 rounded-lg shadow text-xs sm:text-sm">
            <p><span class="font-bold text-blue-600">分數:</span> <span id="score-display">0</span></p>
            <p><span class="font-bold text-blue-600">題數:</span> <span id="question-count-display">0</span></p>
            <p><span class="font-bold text-blue-600">時間:</span> <span id="time-display">0.0</span>秒</p>
        </div>

        <!-- 圖表區塊 -->
        <div class="mb-2 sm:mb-3 h-48 sm:h-64 relative w-full">
            <canvas id="velocityChart"></canvas>
        </div>

        <!-- 方向選擇 -->
        <div class="mb-2 sm:mb-3">
            <p class="mb-1 font-semibold text-sm sm:text-base">請選擇運動方向：</p>
            <div class="flex gap-2">
                <button onclick="handleDirectionSelect('向前', this)" class="dir-btn flex-1 text-xs sm:text-sm py-2 bg-gray-200 text-gray-800 rounded font-semibold transition-colors">向前</button>
                <button onclick="handleDirectionSelect('向後', this)" class="dir-btn flex-1 text-xs sm:text-sm py-2 bg-gray-200 text-gray-800 rounded font-semibold transition-colors">向後</button>
            </div>
        </div>

        <!-- 加速度選擇 -->
        <div class="mb-2 sm:mb-3">
            <p class="mb-1 font-semibold text-sm sm:text-base">請選擇加速度：</p>
            <div class="flex gap-2">
                <button onclick="handleAccelerationSelect('大於0', this)" class="acc-btn flex-1 text-xs sm:text-sm py-2 bg-gray-200 text-gray-800 rounded font-semibold transition-colors">大於 0</button>
                <button onclick="handleAccelerationSelect('等於0', this)" class="acc-btn flex-1 text-xs sm:text-sm py-2 bg-gray-200 text-gray-800 rounded font-semibold transition-colors">等於 0</button>
                <button onclick="handleAccelerationSelect('小於0', this)" class="acc-btn flex-1 text-xs sm:text-sm py-2 bg-gray-200 text-gray-800 rounded font-semibold transition-colors">小於 0</button>
            </div>
        </div>

        <!-- 正確提示 -->
        <div id="alert-correct" class="hidden bg-green-100 border border-green-400 text-green-700 rounded mb-2 sm:mb-3 p-2 sm:p-3 shadow-sm">
            <div class="flex justify-between items-center text-xs sm:text-sm">
                <span class="font-bold">答案正確！得到10分</span>
                <button onclick="handleNextQuestion()" class="bg-green-500 hover:bg-green-600 text-white rounded font-bold text-xs sm:text-sm py-1 px-3 transition-colors">下一題</button>
            </div>
        </div>

        <!-- 錯誤提示 -->
        <div id="alert-error" class="hidden bg-red-100 border border-red-400 text-red-700 rounded mb-2 sm:mb-3 p-2 sm:p-3 shadow-sm">
            <div class="flex flex-col text-xs sm:text-sm">
                <div class="flex justify-between items-center mb-1">
                    <span class="font-bold">答案錯誤，扣5分。</span>
                    <button onclick="handleNextQuestion()" class="bg-red-500 hover:bg-red-600 text-white rounded font-bold text-xs sm:text-sm py-1 px-3 transition-colors">下一題</button>
                </div>
                <span id="error-ans-name"></span>
                <span id="error-ans-detail"></span>
            </div>
        </div>
    </div>

    <!-- 結算畫面 -->
    <div id="game-over-screen" class="hidden text-center p-4 flex flex-col items-center justify-center h-screen">
        <h1 class="text-xl sm:text-2xl font-bold mb-3">恭喜你通過測驗!</h1>
        <p class="mb-1 text-lg">你總共回答了 <span id="final-question-count" class="font-bold text-blue-600"></span> 題，獲得了 100 分。</p>
        <p class="mb-4 text-lg">總用時：<span id="final-time" class="font-bold text-blue-600"></span> 秒</p>
        <button onclick="window.location.reload()" class="px-6 py-2 bg-blue-500 hover:bg-blue-600 text-white font-bold rounded shadow transition-colors">
            重新開始
        </button>
    </div>

    <!-- 遊戲邏輯腳本 -->
    <script>
        const MOTION_TYPES = [
            { name: '向前加速', direction: '向前', acceleration: '大於0' },
            { name: '向前等速', direction: '向前', acceleration: '等於0' },
            { name: '向前減速', direction: '向前', acceleration: '小於0' },
            { name: '向後加速', direction: '向後', acceleration: '小於0' },
            { name: '向後等速', direction: '向後', acceleration: '等於0' },
            { name: '向後減速', direction: '向後', acceleration: '大於0' },
        ];

        // 狀態變數
        let currentMotion = null;
        let score = 0;
        let questionCount = 0;
        let timer = 0;
        let timerInterval = null;
        let selectedDirection = null;
        let selectedAcceleration = null;
        let isAnswerSubmitted = false;
        let chartInstance = null;

        const generateData = (motionType) => {
            const data = [];
            const isForward = motionType.direction === '向前';
            let acceleration, initialVelocity;

            switch (motionType.acceleration) {
                case '大於0':
                    acceleration = 2;
                    initialVelocity = isForward ? 5 : -15;
                    break;
                case '小於0':
                    acceleration = -2;
                    initialVelocity = isForward ? 15 : -5;
                    break;
                case '等於0':
                    acceleration = 0;
                    initialVelocity = isForward ? 10 : -10;
                    break;
            }

            for (let i = 0; i <= 10; i += 0.1) {
                const time = Number(i.toFixed(1));
                const velocity = initialVelocity + acceleration * time;
                
                if ((isForward && velocity <= 0) || (!isForward && velocity >= 0)) {
                    if (velocity === 0) data.push({ time, velocity: 0 });
                    break;
                }
                data.push({ time, velocity });
            }
            return data;
        };

        const updateChart = (data) => {
            const labels = data.map(d => d.time);
            const velocities = data.map(d => d.velocity);

            if (chartInstance) {
                chartInstance.data.labels = labels;
                chartInstance.data.datasets[0].data = velocities;
                chartInstance.update();
            } else {
                const ctx = document.getElementById('velocityChart').getContext('2d');
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '速度',
                            data: velocities,
                            borderColor: '#3b82f6',
                            borderWidth: 2,
                            pointRadius: 0,
                            fill: false,
                            tension: 0.4 // 呈現曲線效果
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: {
                                title: { display: true, text: '時間' },
                                grid: { borderDash: [3, 3] },
                                ticks: { font: { size: 10 } }
                            },
                            y: {
                                title: { display: true, text: '速度' },
                                grid: { borderDash: [3, 3] },
                                ticks: { font: { size: 10 } }
                            }
                        }
                    }
                });
            }
        };

        const resetUI = () => {
            // 重置按鈕樣式
            document.querySelectorAll('.dir-btn, .acc-btn').forEach(btn => {
                btn.className = btn.className.replace('bg-blue-600 text-white', 'bg-gray-200 text-gray-800');
                btn.classList.add('bg-gray-200', 'text-gray-800');
            });
            // 隱藏提示
            document.getElementById('alert-correct').classList.add('hidden');
            document.getElementById('alert-error').classList.add('hidden');
            
            selectedDirection = null;
            selectedAcceleration = null;
            isAnswerSubmitted = false;
        };

        const generateNewQuestion = () => {
            const newMotion = MOTION_TYPES[Math.floor(Math.random() * MOTION_TYPES.length)];
            currentMotion = newMotion;
            questionCount++;
            
            document.getElementById('question-count-display').innerText = questionCount;
            resetUI();
            
            const data = generateData(currentMotion);
            updateChart(data);
        };

        const startGame = () => {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            // 啟動計時器
            timerInterval = setInterval(() => {
                timer += 0.1;
                document.getElementById('time-display').innerText = timer.toFixed(1);
            }, 100);

            generateNewQuestion();
        };

        const handleDirectionSelect = (direction, btnElement) => {
            if (isAnswerSubmitted) return;
            selectedDirection = direction;
            
            // 更新 UI 狀態
            document.querySelectorAll('.dir-btn').forEach(btn => {
                btn.className = btn.className.replace('bg-blue-600 text-white', 'bg-gray-200 text-gray-800');
            });
            btnElement.className = btnElement.className.replace('bg-gray-200 text-gray-800', 'bg-blue-600 text-white');
            
            checkSubmit();
        };

        const handleAccelerationSelect = (acceleration, btnElement) => {
            if (isAnswerSubmitted) return;
            selectedAcceleration = acceleration;
            
            // 更新 UI 狀態
            document.querySelectorAll('.acc-btn').forEach(btn => {
                btn.className = btn.className.replace('bg-blue-600 text-white', 'bg-gray-200 text-gray-800');
            });
            btnElement.className = btnElement.className.replace('bg-gray-200 text-gray-800', 'bg-blue-600 text-white');
            
            checkSubmit();
        };

        const checkSubmit = () => {
            if (selectedDirection && selectedAcceleration && !isAnswerSubmitted) {
                isAnswerSubmitted = true;
                
                if (selectedDirection === currentMotion.direction && selectedAcceleration === currentMotion.acceleration) {
                    score = Math.min(score + 10, 100);
                    document.getElementById('score-display').innerText = score;
                    document.getElementById('alert-correct').classList.remove('hidden');
                    
                    if (score >= 100) clearInterval(timerInterval);
                } else {
                    score = Math.max(score - 5, 0);
                    document.getElementById('score-display').innerText = score;
                    
                    document.getElementById('error-ans-name').innerText = `正確答案是：${currentMotion.name}。`;
                    document.getElementById('error-ans-detail').innerText = `方向是${currentMotion.direction}，加速度${currentMotion.acceleration}。`;
                    document.getElementById('alert-error').classList.remove('hidden');
                }
            }
        };

        const handleNextQuestion = () => {
            if (score >= 100) {
                document.getElementById('game-screen').classList.add('hidden');
                document.getElementById('game-over-screen').classList.remove('hidden');
                
                document.getElementById('final-question-count').innerText = questionCount;
                document.getElementById('final-time').innerText = timer.toFixed(1);
            } else {
                generateNewQuestion();
            }
        };
    </script>
</body>
</html>
