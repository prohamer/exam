<!DOCTYPE html>
<html>
<head>
 <meta charset="UTF-8">
 <title>大英單字測驗</title>
 <style>
body { 
  font-family: 'Noto Sans TC', Arial, sans-serif; 
  margin: 10px;
  background-color: #f0f0f0;
  color: #2c3e50;
  font-weight: bold;
  font-size: 18px;
}
.hidden { display: none; }
#quizContainer { 
  max-width: 800px; 
  margin: 0 auto;
  background-color: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}
.option { 
  display: block; 
  width: 80%; 
  max-width: 500px;
  padding: 8px; 
  margin: 10px auto; 
  background-color: #3498db; 
  color: white;
  border: none; 
  border-radius: 5px; 
  cursor: pointer; 
  /*font-size: 16px;*/
  font-weight: bold;
  transition: all 0.3s ease;
  text-align: center;
}
.option:hover { 
  background-color: #2980b9;
  transform: translateY(-1px);
}
.time-display {
  color: #2c3e50;
  font-weight: bold;
  flex-grow: 1;
  text-align: center;
}
.question-info {
  color: #2c3e50;
  font-weight: bold;
  text-align: center;
  padding: 0 15px;
}
.result { 
  margin: 15px 0; 
  padding: 15px;
  border-radius: 8px;
  background-color: #f8f9fa;
  text-align: center;
}
.font-controls {
  display: flex;
  gap: 4px;
}

.font-controls button {
  padding: 4px 12px;
  min-width: 36px;
}
.status-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #f8f9fa;
  padding: 8px;
  border-radius: 6px;
  margin-bottom: 10px;
}
.control-panel { 
  margin-bottom: 15px;
  padding: 15px;
  background-color: #f8f9fa;
  border-radius: 8px;
}
.next-btn { 
  display: block;
  width: 80%;
  max-width: 300px;
  margin: 15px auto;
  padding: 12px;
  background-color: #2ecc71;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  /*font-size: 16px;*/
  font-weight: bold;
}
.next-btn:disabled {
  background-color: #bdbdbd;
  cursor: not-allowed;
}
.feedback { 
  margin: 10px 0;
  padding: 12px;
  border-radius: 8px;
  /*font-size: 16px;*/
  text-align: center;
}
.correct { 
  background-color: #FFFFFF;
  color: green;
  font-weight: bold;
}
.incorrect { 
  background-color: #FFDC35;
  color: red;
  font-weight: bold;
}
#timer {
  font-size: 18px;
  font-weight: bold;
  margin: 8px 0;
  padding: 8px;
  background-color: #f8f9fa;
  border-radius: 6px;
  text-align: center;
  color: #2c3e50;
}
#progress {
  font-size: 16px;
  font-weight: bold;
  margin: 8px 0;
  padding: 8px;
  background-color: #f8f9fa;
  border-radius: 6px;
  text-align: center;
  color: #2c3e50;
}
#questionText {
  /*size: 18px;*/
  font-weight: bold;
  margin: 12px 0;
  padding: 12px;
  text-align: center;
  background-color: #f8f9fa;
  border-radius: 8px;
  color: #2c3e50;
}
button {
  padding: 8px 15px;
  background-color: #3498db;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
  margin: 0 5px;
  font-size: 14px;
}
button:hover {
  background-color: #2980b9;
}
select, input {
  padding: 8px;
  border: 1px solid #ddd;
  border-radius: 4px;
  margin: 0 5px;
  font-size: 14px;
}
h1 {
  color: #2c3e50;
  margin: 15px 0;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
}
h2 {
  color: #2c3e50;
  margin: 15px 0;
  font-size: 20px;
  font-weight: bold;
}
.result p {
  margin: 8px 0;
  color: #2c3e50;
  font-size: 16px;
  text-align: left;
}
label {
  color: #2c3e50;
  margin-right: 8px;
  font-weight: bold;
}
/* 更新結果和回顧區塊的樣式 */

.review-item {
  padding: 15px;
  margin: 10px 0;
  border-radius: 8px;
  text-align: left;  /* 確保靠左對齊 */
}

/* 奇數項目用淡黃色 */
.review-item:nth-child(odd) {
  background-color: #fff3e0;  /* 淡黃色 */
}

/* 偶數項目用淡藍色 */
.review-item:nth-child(even) {
  background-color: #e3f2fd;  /* 淡藍色 */
}

/* 保持標題置中 */
.result h2, .result h3 {
  text-align: center;
}

/* 保持測驗結果摘要置中 */
.result-summary {
  text-align: center;
}

.control-panel label {
  display: inline-block;
  min-width: 80px;
}
/* 狀態列容器 */
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #f0f7ff;
  padding: 8px 12px;
  margin-bottom: 12px;
  border-radius: 8px;
  gap: 8px;
}

/* 各項資訊的樣式 */
.status-item {
  padding: 4px 8px;
  border-radius: 4px;
  font-weight: bold;
  white-space: nowrap;
}


.status-row-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  padding-bottom: 6px;
  border-bottom: 1px solid #e0e0e0;
}

/* 工作表名稱 */
.sheet-name {
  color: #1565c0;
  background-color: #e3f2fd;
  flex-grow: 0;
}

.status-row-bottom {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 16px;
}

/* 時間顯示 */
.timer {
  color: #e53935;
  background-color: #ffebee;
}

/* 進度顯示 */
.progress {
  color: #2e7d32;
  background-color: #e8f5e9;
}

/* 字體控制按鈕組 */
.font-controls {
  display: flex;
  gap: 4px;
  margin-left: auto;
}

.font-controls button {
  padding: 4px 12px;
  min-width: 36px;
  background-color: #64b5f6;
  border-radius: 4px;
}

/* 添加這些 CSS 樣式給答案回顧 */
.review-question, .review-explanation {
  color: #1a237e;  /* 深藍色 */
  font-weight: bold;
}

.review-wrong {
  color: #d32f2f;  /* 紅色 */
  font-weight: bold;
}

.review-correct {
  color: #2e7d32;  /* 綠色 */
  font-weight: bold;
}

 always on time.","Anna 總是很準時。"],["hurry","加快，趕緊","","Hurry! I don't want to be late.","快點！我不想遲到。"],["king","國王","","The king rules the country.","國王統治這個國家。"],["straw","稻草","","The animals slept on the straw.","動物們睡在稻草上。"],["gold","黃金","","The gold is worth a lot of money.","這些黃金很值錢。"],["cry","哭泣；喊叫","","The sad little girl started to cry.","傷心的小女孩哭了起來。"],["surprised","驚訝的","","He was very surprised by the gift.","他對這份禮物感到非常驚訝。"],["ring","戒指；指環","","She wears several rings on her hand.","她手上戴著好幾枚戒指。"],["promise","承諾；保證","","We promise to be on time.","我們保證會準時。"],["queen","皇后；女王","","The queen is talking to the king.","皇后正在和國王說話。"],["beg","懇求；乞求","","He begged her not to go.","他懇求她不要走。"],["succeed","實現目標；成功","","We can succeed if we work together.","只要我們合作就能成功。"],["scream","尖叫","","She screamed when she saw the rat.","她看到老鼠時尖叫起來。"],["museum","博物館","","What did you see in the museum?","你在博物館看到了什麼？"],["painting","畫；油畫","","Look at the beautiful painting!","你看這幅美麗的畫！"],["paint","（用顏料）畫","","Sharon often paints pictures of flowers.","Sharon 常常畫花。"],["draw","畫，繪畫","","Are you drawing a picture of me?","你在畫我嗎？"],["bridge","橋；橋梁","","The bridge goes over the river.","這座橋橫跨河面。"],["painter","畫家","","The painter just finished his painting.","畫家剛完成他的畫作。"],["drawing","繪畫；圖畫","","This is a drawing of my old home.","這是一張我老家的畫。"],["moment","時刻；此刻","","She is reading a book at the moment.","她此刻正在看書。"],["style","風格","","I don't like that style of art.","我不喜歡那種藝術風格。"],["pond","池塘","","Look at the fish swimming in the pond.","你看池塘裡游來游去的魚。"],["especially","尤其，特別","","I like flowers, especially roses.","我喜歡花，尤其是玫瑰。"],["hungry","飢餓的","","What's for dinner? I'm hungry.","晚餐吃什麼？我餓了。"],["quick","快的；迅速的","","Let's take a quick break.","我們稍微休息一下吧。"],["snack","點心；零食","","He's eating an apple for a snack.","他正在吃一顆蘋果當點心。"],["national","全國的","","Today is a national holiday.","今天是國定假日。"],["Coke","可口可樂","","She's drinking a Coke.","她正在喝一瓶可樂。"],["eye","眼睛","","My sister has big eyes.","我妹妹有一雙大眼睛。"],[ ed some imaging to check his lungs.","醫生安排了一些影像檢查來檢查他的肺部。"],["clinician","臨床醫師","","The study was carried out by a team of experienced clinicians.","這項研究由一群經驗豐富的臨床醫師進行。"],["elevated","（數值、溫度等）偏高的，高於正常水準的","","Tests showed he had elevated blood pressure.","檢查顯示他的血壓偏高。"],["ripple effect","漣漪效應；連鎖反應","","The factory closure had a ripple effect on local businesses.","工廠關閉對當地商家產生了連鎖反應。"],["gem","精品；珍品；瑰寶","","This little café is a real gem.","這家小咖啡館真是個寶藏。"],["-esque","有…式樣、風格的","","The film has a dreamy, Kafkaesque atmosphere.","這部電影帶有夢幻、卡夫卡式的氛圍。"],["glacial","冰的，冰河的；冰川形成的","","The lake was formed by glacial activity thousands of years ago.","這座湖是數千年前由冰川活動形成的。"],["fare","食物，（尤指餐廳或特殊場合吃的）飯菜","","The restaurant serves traditional Taiwanese fare.","這家餐廳供應傳統台灣料理。"],["fluffy","蓬鬆的；絨毛般的","","These pancakes are light and fluffy.","這些鬆餅又輕又蓬鬆。"],["savor","品嚐，細細品味","","Take your time and savor every bite.","慢慢來，細細品嚐每一口。"],["latitude","緯度","","The city lies at a latitude of 25 degrees north.","這座城市位於北緯 25 度。"],["off the beaten track/path","（地方）偏遠的；人跡罕至的","","We stayed in a small village off the beaten track.","我們住在一個人跡罕至的小村莊。"],["inclusive","全包式的","","The price is inclusive of meals and transportation.","這個價格包含餐點和交通。"],["compelling","引人入勝的；極為有趣的","","The novel tells a compelling story about family and loss.","這部小說講述了一個關於家庭與失去的動人故事。"],["unparalleled","無與倫比的；空前的","","The hotel offers unparalleled views of the ocean.","這家飯店擁有無與倫比的海景。"],["destabilize","使…不穩定；破壞…的穩定","","Rising prices could destabilize the economy.","物價上漲可能會破壞經濟穩定。"],["linear","線性的","","Learning is not always a linear process.","學習不一定是線性的過程。"],["rigidity","死板；一成不變","","The rigidity of the rules frustrated many employees.","規定的死板讓許多員工感到挫折。"],["hybrid","混合的；包含不同來源的","","Many companies now use a hybrid work model.","許多公司現在採用混合式的工作模式。"],["mediate","調停，調解，斡旋","","A neutral party was asked to mediate the dispute.","一位中立人士受邀調解這場紛爭。"],["pragmatic","務實的，講求實際的","","We need a pragmatic solution to this problem.","我們需要一個務實的方法來解決這個問題。"],["upheaval","（往往會帶來問題的）激變，劇變；動亂","","The war caused great social upheaval.","戰爭造成了巨大的社會動盪。"],["lucid","神智清醒的；頭腦清楚的","","Despite her illness, she remained lucid until the end.","儘管生病，她到最後都保持神智清醒。"],["optimize","使最優化；使盡可能完善","","We need to optimize our website for mobile users.","我們需要針對手機用戶優化網站。"],["causation","起因；因果關係","","Correlation does not always imply causation.","相關性不一定代表因果關係。"],["reap","獲得，取得（成果）","","If you study hard now, you'll reap the rewards later.","如果你現在努力讀書，日後就會得到回報。"],["ruminate","沉思；長時間思考","","He spent the evening ruminating on what she had said.","他整晚都在反覆思索她說的話。"],["proactive","主動的，積極的；預先採取行動的","","Take a proactive approach to your health.","對自己的健康要採取主動積極的態度。"],["burnout","（因拚命工作導致的）筋疲力竭；長期疲憊","","Working long hours without breaks can lead to burnout.","長時間工作不休息可能導致身心俱疲。"],["keep/hold","阻止某事發生；使…不能接近","","Regular exercise helps keep stress at bay.","規律運動有助於擺脫壓力。"],["take the edge off","使…減弱；緩和；減輕某事物","","A cup of tea took the edge off my headache.","一杯茶讓我的頭痛緩和了一些。"],["splinter","（使）四分五裂","","The party splintered into several small groups.","這個政黨分裂成好幾個小派系。"],["strike a chord","引起共鳴","","Her speech struck a chord with many young people.","她的演講引起許多年輕人的共鳴。"],["saga","長篇故事；家世小說","","The novel is a family saga spanning three generations.","這部小說是橫跨三代的家族史詩。"],["be steeped in history/tradition/politics, etc.","有豐富的歷史／傳統／政治等","","The old town is steeped in history.","這座古城有著豐富的歷史。"],["unravel","（系統、計畫、組織等）瓦解，崩潰","","Their plans began to unravel when the funding was cut.","資金被刪減後，他們的計畫開始瓦解。"],["aftermath","（戰爭，風暴或事故的）後果，餘波，餘殃","","Many people lost their homes in the aftermath of the typhoon.","颱風過後，許多人失去了家園。"],["resonate","引起共鳴","","The film's message resonated with audiences around the world.","這部電影的訊息引起全球觀眾的共鳴。"],["poignant","令人心酸的，傷心的；令人充滿同情、惋惜的","","The letter was a poignant reminder of his late father.","這封信令人心酸地想起他已故的父親。"],["resounding","響亮的；迴盪的","","The event was a resounding success.","這場活動大獲成功。"],["consolidate","合併，整合；統一","","The company plans to consolidate its two offices into one.","公司計劃將兩間辦公室合併成一間。"],["unseemly","（行為）不體面的，不得體的","","It would be unseemly to laugh at a funeral.","在葬禮上大笑是很不得體的。"],["imbibe","喝，飲（尤指酒，有時為幽默用法）","","He imbibed a little too much wine at the party.","他在派對上喝了太多酒。"],["cheeky","俏皮的；冒失的，無理的，厚臉皮的","","The boy gave his teacher a cheeky grin.","男孩對老師露出調皮的笑容。"],["mural","壁畫","","Local artists painted a colorful mural on the school wall.","當地藝術家在學校牆上畫了一幅色彩繽紛的壁畫。"],["plush","昂貴而舒服的；高檔的","","They stayed in a plush hotel downtown.","他們住在市中心一家高檔的飯店。"],["cohort","具有共同特點的一群人","","This year's cohort of students is especially talented.","今年這一屆的學生特別有才華。"],["jingle","廣告短歌","","I can't get that catchy jingle out of my head.","那首洗腦的廣告歌一直在我腦中揮之不去。"],["verve","熱情；精力，活力","","She performed the song with great verve.","她充滿活力地演唱這首歌。"],["contend with","必須處理，不得不應付（困難，窘境）","","Farmers have to contend with unpredictable weather.","農民必須應付難以預測的天氣。"],["be apt to do","傾向、易於做某事","","Young children are apt to lose things.","年幼的孩子容易弄丟東西。"],["pharmaceutical","製藥的","","She works for a large pharmaceutical company.","她在一家大型製藥公司工作。"],["ballyhoo","大吹大擂，大肆宣傳（含貶義）","","The product was ballyhooed as a revolution, but it soon failed.","這項產品被大肆吹捧為革命性產品，但很快就失敗了。"],["warrant","需要，值得","","The situation warrants further investigation.","這個情況值得進一步調查。"],["scramble","匆忙地移動","","Everyone scrambled for the exit when the alarm went off.","警報一響，大家都急忙衝向出口。"],["cocky","驕傲自大的，趾高氣揚的","","He was so cocky that he didn't bother to practice.","他太自大了，連練習都懶得練。"],["self-assured","自信的，胸有成竹的","","She spoke in a calm, self-assured voice.","她以冷靜而自信的語氣說話。"],["impaired","受損的；變差的","","Drinking alcohol leads to impaired judgment.","喝酒會導致判斷力變差。"],["interim","臨時的，暫代的","","He was appointed as the interim manager.","他被任命為代理經理。"],["per se","本身，就其本身而言","","The idea isn't bad per se, but it's too expensive.","這個主意本身不差，只是太貴了。"],["dissenter","反對者，持異議者","","The plan was approved, with only two dissenters.","這項計畫獲得通過，只有兩人反對。"],["obstinate","固執的，頑固的","","My grandfathe 很多樹。"],["feather","羽毛","","That bird has colorful feathers.","那隻鳥有色彩繽紛的羽毛。"],["lovely","美妙的","","What a lovely smile!","多美好的笑容啊！"],["trust","相信","","Don't trust him!","別相信他！"],["mile","英里","","How many miles did you walk today?","你今天走了幾英里？"],["path","小路，小道","","He walked down the path by the river.","他沿著河邊的小路走。"],["market","市場","","What did you buy at the market?","你在市場買了什麼？"],["roll","潛艇堡麵包；麵包捲","","These rolls are very fresh.","這些麵包捲非常新鮮。"],["turtle","海龜；龜","","Did you see the turtles on the beach?","你有看到海灘上的海龜嗎？"],["real","真實的","","Are those flowers real?","那些花是真的嗎？"],["through","穿越；通過","","Let's walk home through the park.","我們穿過公園走路回家吧。"],["mountain","山","","Colorado has beautiful mountains.","科羅拉多州有美麗的山脈。"],["ocean","大海；海洋","","Do you ever swim in the ocean?","你曾在海裡游泳嗎？"],["climb","爬；攀升","","Alex climbed to the top of the cliff.","艾力克斯爬到了懸崖頂端。"],["music","音樂","","Let's play some music!","我們來放點音樂吧！"],["fashion","時尚","","Kelly knows a lot about fashion.","凱莉對時尚很了解。"],["into","對…感興趣","","Josh is really into comic books.","喬許真的很迷漫畫書。"],["shop","購物，逛街","","I like to shop and read.","我喜歡逛街和閱讀。"],["around","圍繞；周圍","","Becca likes to be around kids.","貝卡喜歡和孩子們在一起。"],["not care for (something)","不喜歡","","My brother doesn't care for seafood.","我哥哥不喜歡海鮮。"],["anyway","（用於談話中改變話題）對了，總之","","Anyway, what do you want for lunch?","對了，你午餐想吃什麼？"],["sports","運動","","Sports is a great way to exercise.","運動是很好的健身方式。"],["basketball","籃球","","Caleb plays basketball after school.","凱勒伯放學後打籃球。"],["neighbor","鄰居","","My neighbors are very friendly.","我的鄰居們非常友善。"],["air conditioner [AC]","冷氣機，空調","","Turn on the air conditioner. I'm hot.","把冷氣打開，我好熱。"],["scarf","圍巾","","Alex wears a scarf when it's windy.","起風時艾力克斯會戴圍巾。"],["lend","借出，借給","","Can you lend me a pencil?","你可以借我一支鉛筆嗎？"],["point","指，指向","","Bob pointed to the door.","鮑伯指向門口。"],["spill","灑出","","Philip spilled juice on the table.","菲利浦把果汁灑在桌上。"],["track","記錄…的進展；追蹤","","We usually track the weather.","我們通常會追蹤天氣。"],["choice"," es lemons to get lemon juice.","這個用來壓榨檸檬取汁。"],["nothing","沒有東西；沒有事情","","I could do nothing to help.","我什麼忙都幫不上。"],["fairly","相當地","","She is fairly tall for her age.","以她的年紀來說她相當高。"]],"10月空英":[["單字","字義","圖片","例句","句義"],["enthusiasm","熱情；熱忱","","In the meeting, the boss didn't show much enthusiasm for our proposed project.","在會議中，老闆對我們提出的專案沒有表現出太多熱忱。"],["reward","報償；獎賞","","The first child to finish the race will receive a reward.","第一個完成比賽的孩子會得到獎賞。"],["championship","錦標賽，冠軍賽","","The championship soccer game drew TV viewers from around the world.","這場足球冠軍賽吸引了全世界的電視觀眾。"],["rigid","僵硬的；嚴苛的","","The rigid school rules said we couldn't chew gum.","嚴苛的校規規定我們不能嚼口香糖。"],["competition","比賽，競賽","","My friends and I all entered the speech competition.","我和朋友們都報名了演講比賽。"],["pursue","追求，從事","","Emma wants to pursue her dream of becoming an actress.","艾瑪想追求成為女演員的夢想。"],["retirement","退休；退役","","Abby is excited about her retirement because she plans to travel.","艾比對退休感到興奮，因為她打算去旅行。"],["obligation","義務；責任","","I have an obligation to take care of my pets.","我有責任照顧我的寵物。"],["anniversary","週年紀念日","","The young couple celebrated their wedding anniversary at a restaurant.","這對年輕夫妻在餐廳慶祝結婚週年紀念日。"],["phenomenon","現象","","A beautiful natural phenomenon that occurs every morning is sunrise.","每天早晨都會出現的美麗自然現象就是日出。"],["locate","確定…的位置","","Emma used her phone to locate the nearest train station.","艾瑪用手機找出最近的火車站位置。"],["champion","冠軍","","Leo became the champion after winning the final match.","里歐贏得決賽後成為了冠軍。"],["parade","遊行","","The city held a parade to celebrate the team's victory.","市政府舉辦遊行來慶祝球隊的勝利。"],["entertain","使快樂","","The magician entertained the children with fun tricks.","魔術師用有趣的戲法逗孩子們開心。"],["earnest","熱心的；誠摯的","","Hallie was earnest in her apology to her mom and promised she wouldn't do it again.","哈莉誠摯地向媽媽道歉，並保證不會再犯。"],["comprehend","領悟；理解","","Thomas took only a minute to comprehend how the puzzle worked.","湯瑪斯只花了一分鐘就理解這個拼圖怎麼玩。"],["faithful","忠實的；忠誠的","","Benji was Kyle's faithful dog, never leaving his side.","班吉是凱爾忠實的狗，從不離開他身邊。"],["sober","使冷靜；使嚴肅","","The sobering news of a classmate's accident shocked the entire class.","同學出意外的消息讓全班冷靜下來，也震驚了大家。"],["abstract","抽象的","","Tina checks the explanation tags under abstract art that she doesn't understand.","蒂娜會看她看不懂的抽象藝術品下方的說明牌。"],["memorize","熟記；記住","","Penelope tried to memorize her speech for her company talk.","潘妮洛普努力背熟她在公司演講的講稿。"],["automatically","自動地","","Mila's Tesla automatically stopped charging when the battery was full.","電池充滿時，米拉的特斯拉會自動停止充電。"],["relevant","相關的；切題的","","Patrick's article was relevant to the company's problem, so we invited him to speak at our meeting.","派翠克的文章與公司的問題相關，所以我們邀請他在會議上發言。"],["grip","對…產生強烈影響；緊握","","Jemma gripped her friend's arm as they explored the haunted house.","探索鬼屋時，潔瑪緊緊抓住朋友的手臂。"],["quiver","顫動，發抖","","Did you hear that? Jackson asked, his voice quivering.","「你有聽到嗎？」傑克森問道，聲音在顫抖。"],["attribute","將…歸因於","","The band attributes its success to their close bond as friends.","這個樂團將成功歸功於他們身為朋友的緊密情誼。"],["terrify","使恐懼，使害怕","","The only thing that terrifies Grace more than snakes is spiders.","唯一比蛇更讓葛蕾絲害怕的就是蜘蛛。"],["symptom","症狀；徵兆","","Headaches are often a symptom of needing more water.","頭痛常常是需要多喝水的徵兆。"],["trigger","引發，觸發","","Fear can sometimes trigger panic attacks.","恐懼有時會引發恐慌發作。"],["disrupt","擾亂，打斷","","Liam's sleep was often disrupted by disturbing nightmares.","連恩的睡眠常被令人不安的噩夢打斷。"],["participant","參與者","","The experiment involved over 100 participants.","這項實驗有超過一百名參與者。"],["citizen","公民；居民","","What country are you a citizen of?","你是哪一個國家的公民？"],["issue","議題","","What issues did you discuss at the meeting?","你們在會議上討論了哪些議題？"],["economy","經濟","","The economy is not doing well right now.","現在的經濟狀況不太好。"],["adequate","足夠的；適當的","","Sheila didn't have an adequate amount of time to finish her project.","希拉沒有足夠的時間完成她的專案。"],["anxious","焦慮的","","The whole class is anxious about tomorrow's test.","全班都對明天的考試感到焦慮。"],["candidate","候選人","","Pauline is a candidate for class president.","寶琳是班長的候選人。"],["echo","附和，重複","","Sandra never gives her own opinion; she only echoes what her friends say.","珊卓從不表達自己的意見，只會附和朋友說的話。"],["political","政治的","","The students discussed different political ideas in history class.","學生們在歷史課上討論了不同的政治思想。"],["clueless","一竅不通的；一無所知的","","The student looked clueless when the teacher asked her a question.","老師問她問題時，那名學生看起來一頭霧水。"],["accidental","偶然的；意外的","","The mistake was accidental, so no one got in trouble.","這個錯誤是無心之過，所以沒有人惹上麻煩。"],["transfer","轉移","","He tried to transfer the task to his coworker.","他試圖把這項任務轉交給同事。"],["interaction","交流；相互作用","","The interaction between the two friends was friendly and fun.","這兩位朋友之間的互動友善又有趣。"],["communication","溝通","","Good communication helps teams work better together.","良好的溝通能幫助團隊合作得更好。"],["confront","對抗；面對","","Emily confronted Jason about not finishing his part of the group project.","艾蜜莉當面質問傑森為什麼沒完成小組報告中他負責的部分。"],["legendary","傳奇的，傳說的","","The book contains pictures of dragons and other legendary creatures.","這本書裡有龍和其他傳說生物的圖片。"],["scam","騙局；詐騙","","He sent money to people who said they needed help, but it turned out to be a scam.","他把錢寄給說自己需要幫助的人，結果是一場騙局。"],["sophisticated","精密的，複雜的","","The palace was built using sophisticated technology for its time.","這座宮殿是用當時精密的技術建造的。"],["uncover","揭開；揭露","","The detective eventually uncovered the identity of the killer.","偵探最後揭露了兇手的身分。"],["pirate","海盜","","Leo told his mom he wanted to be a pirate when he grew up.","里歐告訴媽媽他長大後想當海盜。"],["manuscript","手稿；原稿","","The ancient manuscript is breaking apart, but we can still read some of it.","這份古老的手稿正在破損，但我們還是能讀懂一部分。"],["penetrate","穿透；滲入","","The bullet penetrated the soldier's heart and killed him.","子彈穿透了那名士兵的心臟，使他喪命。"],["narrative","敘事；故事","","Technology plays a central role in the narrative of how modern culture developed.","在敘述現代文化如何發展的故事中，科技扮演核心角色。"],["fashionable","流行的；時髦的","","Dylan must spend a lot of money on his fashionable clothes.","狄倫一定花了很多錢買他那些時髦的衣服。"],["consultant","顧問","","We'll meet with a wedding consultant this Friday to start making plans.","我們這週五會和婚禮顧問見面，開始規劃。"],["appointment","預約；約會","","My hair appointment has been changed from this week to next week.","我的美髮預約從這週改到下週了。"],["accuracy","準確性；精確","","Our team checks each article for accuracy.","我們團隊會檢查每篇文章的準確性。"],["generally","通常","","We generally have a meal before the meeting, but this month everyone decided against it.","我們通常會在會議前先吃飯，但這個月大家決定不這麼做。"],["reveal","揭露；顯示","","The judges will reveal the winner of the singing challenge in two days.","評審將在兩天後揭曉歌唱挑戰賽的優勝者。"],["frost","為（玻璃）製毛面","","We drank out of beautiful frosted glasses at the fancy dinner.","在那場高級晚宴上，我們用漂亮的霧面玻璃杯喝飲料。"],["explanation","解釋，說明","","The teacher gave a clear explanation of the math problem.","老師對這道數學題做了清楚的說明。"],["storage","儲藏；儲存","","We rented storage space for our furniture when we lived in Europe for two years.","我們住在歐洲的兩年間，租了儲藏空間放家具。"],["rhythm","節奏，韻律","","The rhythm of moving traffic put the baby to sleep.","車流移動的節奏讓寶寶睡著了。"],["knob","球形把手，旋鈕","","The knob on the stove felt hot when she touched it.","她碰到爐子的旋鈕時覺得很燙。"],["panel","（漫畫的）一格；鑲板","","The panels on her living room walls were decorated with flowers.","她客廳牆上的鑲板用花裝飾著。"],["illustrate","為…畫插圖；說明","","Kathy illustrates children's books.","凱西為兒童書畫插圖。"],["yelp","尖叫","","The little boy yelped when the dog's cold nose touched his leg.","狗冰冷的鼻子碰到小男孩的腿時，他尖叫了一聲。"],["diverse","多種多樣的","","The college has a diverse student population from many countries.","這所大學的學生來自許多國家，非常多元。"],["landscape","陸上風景，景色","","We took many pictures of the area's beautiful landscapes.","我們拍了很多這個地區美麗風景的照片。"],["spine","脊柱；脊椎","","The mountain's spine runs through the region.","山脈的主脊貫穿整個地區。"],["conquer","征服；克服","","She worked hard to conquer her fear of public speaking.","她努力克服對公開演講的恐懼。"],["ranch","經營牧場","","The owners ranch more than 1,000 head of cattle.","這些主人經營的牧場養了超過一千頭牛。"],["rural","農村的，鄉村的","","They moved to a rural area far from the city.","他們搬到了離城市很遠的鄉村地區。"],["vibrant","活躍的；鮮豔的","","The festival was filled with vibrant colors and music.","慶典充滿了鮮豔的色彩與音樂。"],["elegant","優雅的；高雅的","","The hotel lobby was decorated in an elegant style.","飯店大廳以優雅的風格裝潢。"],["product","產品","","What products does this store sell?","這家店賣哪些產品？"],["dense","濃密的，密集的","","The dense forest was hard to walk in.","茂密的森林很難行走。"],["weed","雜草","","Maureen pulled a lot of weeds out of her garden this afternoon.","茉琳今天下午從花園裡拔了很多雜草。"],["harvest","收割，收穫","","The farmers harvested their grain last month.","農夫們上個月收割了穀物。"],["plastic","塑膠的","","How many plastic water bottles did you find in the lake?","你在湖裡找到了多少個塑膠水瓶？"],["community","社區；群體","","Many communities in this area were damaged by the typhoon.","這個地區的許多社區受到颱風破壞。"],["code","代碼；密碼","","The student checked the code carefully to find the mistake in the program.","那名學生仔細檢查程式碼，找出程式中的錯誤。"],["laboratory","實驗室","","The classroom became a laboratory where students tested new ideas through group activities.","教室變成了實驗室，學生透過小組活動測試新想法。"],["imitate","模仿","","Young children often imitate their parents when they speak or solve problems.","小孩在說話或解決問題時常會模仿父母。"],["ritual","儀式；例行公事","","Drinking tea every morning became a calming ritual she enjoyed.","每天早上喝茶成了她享受的、讓人平靜的例行儀式。"],["researcher","研究人員","","The researcher studied how people learn new languages over time.","這位研究人員研究人們如何隨著時間學會新語言。"],["dynamics","動態；動力","","The dynamics of the team changed after a new leader joined the group.","新領導者加入後，團隊的互動態勢改變了。"],["productivity","生產力","","Listening to music can improve productivity for some people while they work.","對某些人來說，工作時聽音樂可以提高生產力。"],["emerge","露出，浮現","","Several new ideas emerged from the group discussion.","小組討論中浮現出好幾個新點子。"],["descend","降下；下降","","He carefully descended into the basement.","他小心翼翼地走下地下室。"],["skeptical","持懷疑態度的","","Many people are skeptical of the idea that there is life on other planets.","許多人對其他星球有生命的說法持懷疑態度。"],["rational","合理的；理性的","","Can you make a rational argument for your beliefs on this issue?","對於這個議題，你能為自己的信念提出合理的論點嗎？"],["hence","因此，所以","","I forgot that the test was today; hence, I did not study for it.","我忘了考試是今天，因此沒有準備。"],["tornado","龍捲風","","The tornado destroyed several houses in the small town.","龍捲風摧毀了小鎮上的好幾間房子。"],["substantial","大的；可觀的","","There is substantial evidence that these chemicals can cause cancer.","有大量證據顯示這些化學物質會致癌。"],["thereby","從而；由此","","The company raised its prices, thereby leading consumers to buy the products elsewhere.","公司提高價格，因而導致消費者轉去別處購買產品。"],["extraordinary","令人驚奇的；非凡的","","His journey from poverty to running a successful company is an extraordinary story.","他從貧窮到經營成功企業的歷程是個非凡的故事。"]],"10月Advanced":[["單字","字義","圖片","例句","句義"],["lethal","致命的，致死的","","The snake's venom is lethal to small animals.","這種蛇的毒液對小動物是致命的。"],["conversely","相反地；另一方面","","Some people love spicy food; conversely, others can't handle any heat at all.","有些人愛吃辣；相反地，有些人完全吃不了辣。"],["prestigious","有威望的，有聲望的，聲譽卓著的","","She graduated from a prestigious university in Boston.","她畢業於波士頓一所聲譽卓著的大學。"],["far-flung","遙遠的","","Our relatives live in far-flung corners of the world.","我們的親戚住在世界各個遙遠的角落。"],["flagship","（公司的）旗艦產品，旗艦店","","This phone is the company's flagship product.","這支手機是公司的旗艦產品。"],["influx","大量湧入的人群、金錢或貨物","","The city saw a huge influx of tourists during the festival.","慶典期間，這座城市湧入了大批遊客。"],["cater to/for (somebody/something)","迎合，滿足（某群人的需求）","","The restaurant caters to customers who don't eat meat.","這家餐廳滿足不吃肉的顧客的需求。"],["elite","出類拔萃的，精英的，精銳的","","Only elite athletes can qualify for this competition.","只有頂尖運動員才能取得這場比賽的參賽資格。"],["ideological","思想立場上的；意識形態上的（尤指政治或經濟方面的思想）","","The two parties have deep ideological differences.","這兩個政黨在意識形態上有很深的分歧。"],["substantive","實質的；真實的；重要的","","We need substantive changes, not just small adjustments.","我們需要實質的改變，而不只是小幅調整。"],["affirmative action","平權法案，積極平權措施（指聘用或錄取因種族或性別等常受不公平待遇的人）","","The university's affirmative action policy aims to increase diversity.","這所大學的平權措施旨在提高多元性。"],["linger","（因不想離開而）逗留，徘徊，流連","","A few guests lingered after the party ended.","派對結束後，有幾位客人還逗留不走。"],["discrete","分開的，各自獨立的","","The project is divided into three discrete stages.","這個專案被分成三個各自獨立的階段。"],["proxy","用來衡量某物的指標","","Test scores are not always a good proxy for ability.","考試成績不見得是衡量能力的好指標。"],["unprecedented","空前的，前所未有的","","The storm caused unprecedented damage to the coast.","這場風暴對海岸造成了前所未有的破壞。"],["replicate","複製","","Scientists tried to replicate the results of the experiment.","科學家試圖複製這項實驗的結果。"],["formative","（對人或某事物發展）具有重大影響的","","His formative years were spent in a small village.","他人格形成的重要時期是在一個小村莊度過的。"],["coherent","（文章、觀點）連貫的，有條理的，一致的","","She gave a clear and coherent explanation of the plan.","她對這項計畫做了清楚又條理分明的說明。"],["hinder","阻礙，妨礙","","Heavy rain hindered the rescue efforts.","大雨阻礙了救援行動。"],["peripheral","次要的；邊緣的","","That issue is peripheral to our main goal.","那個問題對我們的主要目標而言只是次要的。"],["lob","高吊球","","She hit a perfect lob over her opponent's head.","她打出一記完美的高吊球，越過對手的頭頂。"],["traction","（點子或事物）逐漸被接受，流行起來","","The idea began to gain traction on social media.","這個想法開始在社群媒體上逐漸流行起來。"],["ricochet","（子彈、石塊等運動物體）回跳，反彈","","The bullet ricocheted off the wall.","子彈從牆上反彈開來。"],["misfire","（計畫或笑話）出差錯，未達預期效果","","His joke misfired and no one laughed.","他的笑話沒有達到預期效果，沒有人笑。"],["in tandem","協力合作","","The two teams worked in tandem to finish the project.","兩個團隊協力合作完成了這個專案。"],["squash","壁球","","My father plays squash every Saturday.","我爸爸每週六都打壁球。"],["tony","時髦高檔的","","They live in a tony neighborhood downtown.","他們住在市中心一個時髦高檔的社區。"],["learning curve","學習曲線","","There's a steep learning curve when you start a new job.","剛開始新工作時，學習曲線會很陡。"],["trafficking","（尤指毒品的）走私，非法買賣，非法交易","","The police arrested several men for drug trafficking.","警方因毒品走私逮捕了數名男子。"],["money laundering","洗錢","","The bank was fined for failing to stop money laundering.","這家銀行因未能阻止洗錢而被罰款。"],["impersonation","假冒他人身分（行騙）","","He was arrested for impersonation of a police officer.","他因假冒警察而被逮捕。"],["fizzle out","逐漸停止；無結而終","","The excitement began to fizzle out after a few days.","幾天後，熱度就逐漸消退了。"],["mortifying","令人極度難堪或羞愧的","","It was mortifying to forget my own speech in front of everyone.","在大家面前忘記自己的演講稿真是令人羞愧萬分。"],["heighten","（使）加強；（使）增加","","The news heightened our concerns about safety.","這個消息加深了我們對安全的擔憂。"],["red flag","示警紅旗","","His refusal to answer questions was a red flag.","他拒絕回答問題是個警訊。"],["intervene","介入；干涉","","The teacher had to intervene when the students started arguing.","學生們開始爭吵時，老師必須介入。"],["embody","體現","","The athlete embodies the spirit of never giving up.","這位運動員體現了永不放棄的精神。"],["every nook and cranny","每個部分，每個角落","","We searched every nook and cranny for the missing keys.","我們把每個角落都找遍了，想找到遺失的鑰匙。"],["emit","排放","","Factories emit harmful gases into the air.","工廠向空氣中排放有害氣體。"],["benchmark","基準，規範，標竿","","This test result sets a new benchmark for the industry.","這項測試結果為業界樹立了新的標竿。"],["epidemiologist","流行病學家","","An epidemiologist studies how diseases spread.","流行病學家研究疾病如何傳播。"],["hijack","控制，操縱","","Hackers tried to hijack the company's website.","駭客企圖控制這家公司的網站。"],["go into overdrive/be in overdrive","過度活躍；過度運作","","My brain goes into overdrive before an important exam.","重要考試前，我的大腦會過度運轉。"],["pathway","神經通路","","Learning a new skill creates new pathways in the brain.","學習新技能會在大腦中形成新的神經通路。"],["inflatable","充氣式的","","The kids played in an inflatable pool all afternoon.","孩子們整個下午都在充氣泳池裡玩。"],["accessory","配件","","This bag is the perfect accessory for your outfit.","這個包包是搭配你這身服裝的完美配件。"],["hot spot","熱點；人氣聚集地","","The beach is a popular hot spot for tourists in summer.","這片海灘是夏天遊客聚集的熱門地點。"],["vertiginous","高得令人眩暈的","","We looked down from the vertiginous cliff.","我們從高得令人眩暈的懸崖往下看。"],["briny","很鹹的，多鹽的","","The soup was too briny for my taste.","這碗湯對我的口味來說太鹹了。"],["replete","充滿的，充足的","","The garden is replete with colorful flowers.","花園裡開滿了色彩繽紛的花。"],["laden","裝滿的，滿載的","","The trees were laden with ripe apples.","樹上結滿了熟透的蘋果。"],["dazzle","使（某人）傾倒，使讚嘆","","The fireworks dazzled the crowd.","煙火讓群眾讚嘆不已。"],["invariably","總是，毫無例外地","","He r.","工廠向空氣中釋放有毒的煙霧。"],["asceticism","禁慾主義","","The monks lived a life of asceticism.","這些僧侶過著禁慾的生活。"],["earworm","縈繞於腦中揮之不去的旋律","","That catchy song became an earworm I couldn't forget.","那首洗腦的歌成了我揮之不去的耳蟲。"],["immersive","沉浸式的","","The museum offers an immersive virtual reality experience.","這間博物館提供沉浸式的虛擬實境體驗。"],["gondola","（航行威尼斯運河的）貢多拉平底船","","We rode a gondola along the canals of Venice.","我們搭貢多拉遊威尼斯的運河。"],["parody","（文章、音樂等）滑稽的模仿作品","","The comedy show is a parody of a famous movie.","這個喜劇節目是對一部知名電影的滑稽模仿。"],["glitzy","盛大的，華麗的，光鮮亮麗的","","They attended a glitzy party in Hollywood.","他們參加了一場在好萊塢舉辦的華麗派對。"],["climax","高潮","","The movie reaches its climax in the final scene.","這部電影在最後一幕達到高潮。"],["villainous","邪惡的；犯罪的","","The villainous plan was to rob the bank.","那個邪惡的計畫是要搶銀行。"],["sinister","不祥的，凶兆的，陰險的","","There was something sinister about his smile.","他的笑容有種陰險的感覺。"],["grove","小樹林；樹叢","","We had a picnic in a grove of oak trees.","我們在一小片橡樹林裡野餐。"],["bleak","沒有希望的；（情況）慘淡的","","The future looked bleak after the company lost its biggest client.","公司失去最大客戶後，前景看起來一片慘淡。"],["dwindle","逐漸減少、變小","","Our savings began to dwindle after he lost his job.","他失業後，我們的存款開始逐漸減少。"],["deplete","減少，損耗","","Long trips can deplete your energy.","長途旅行會耗損你的體力。"],["canopy","樹冠，天篷狀的樹蔭","","Sunlight filtered through the canopy of the rainforest.","陽光穿透雨林的樹冠灑落下來。"],["rebuttal","反駁；駁斥","","The lawyer prepared a strong rebuttal to the claim.","律師針對這項指控準備了有力的反駁。"],["incinerate","焚毀，燒成灰燼","","The factory incinerates its waste at high temperatures.","工廠以高溫焚毀廢棄物。"],["regeneration","再生；重生","","The area is undergoing urban regeneration.","這個地區正在進行都市再生。"],["sustained","持續的，持久的","","The team made a sustained effort to improve sales.","團隊持續努力提升銷售。"],["give (somebody) the go-ahead/get the go-ahead","給予（某人）許可；得到准許","","The boss gave us the go-ahead to start the project.","老闆批准我們開始進行這個專案。"],["cut corners","走捷徑；為省時、省力、省錢而馬虎行事","","Don't cut corners when you're building a house.","蓋房子時不要偷工減料。"],["outfit","提供全套 e meeting.","她在進入會議前使自己冷靜下來。"],["obligate","使負有義務;強制要求","","The contract obligates him to complete the work within three months.","合同要求他在三個月內完成工作。"],["severance pay/package","遣散費;解僱金;離職補償","","The employee received a generous severance package when the company downsized.","當公司裁員時,該員工獲得了慷慨的遣散費。"],["euphemism","委婉說法;婉轉說法","","\"Letting go\" is a euphemism for firing someone.","\"放手\"是解僱某人的委婉說法。"],["soften/cushion the blow","減輕打擊;緩和影響","","She tried to soften the blow by delivering the bad news gently.","她試圖通過溫和地傳達壞消息來減輕打擊。"],["detrimental","有害的;造成損傷的","","Lack of sleep has a detrimental effect on your health.","缺乏睡眠對你的健康有害。"],["validate","證實;確認;使者的觀念或感覺得到認可","","The study helped validate the theory researchers had proposed.","該研究幫助證實了研究人員提出的理論。"],["exude","散發出;充滿著","","She exudes confidence when she talks.","她說話時散發出自信。"],["starboard","(從後望船的)右舷;右側","","The ship listed to starboard after hitting the reef.","船觸礁後向右舷傾斜。"],["sentry","衛兵;哨兵","","A sentry stood guard at the entrance to the base.","一名哨兵在基地入口守衛。"],["cosmopolitan","(體驗多國)國際化的;世界性的","","The city has a cosmopolitan atmosphere with people from all over the world.","這個城市具有國際化的氛圍,匯聚了來自世界各地的人。"],["pitch","音高(聲音);調高;投擲","","The singer pitched her voice higher for the high notes.","歌手為高音提高了音高。"],["rite of passage","人生轉折點;成人儀式","","Graduation is an important rite of passage for many young people.","畢業對許多年輕人來說是重要的人生轉折點。"],["mangled","受到嚴重傷害的;粉碎的","","The metal was mangled beyond recognition after the accident.","事故後金屬被摧毀得面目全非。"],["espionage","間諜活動;刺探情報","","The novel was about a spy who engaged in industrial espionage.","這部小說講的是一個從事工業間諜活動的特務。"],["banter","玩笑;打趣;開玩笑的談話","","The friends engaged in friendly banter throughout the evening.","朋友們整個晚上都在進行友好的打趣。"],["inmate","受囚人;因犯;住客","","The inmates at the prison participated in a rehabilitation program.","監獄中的囚犯參加了一個改造計劃。"],["navigate","導航;理解;計劃路線","","The captain had to navigate through the storm carefully.","船長必須小心地導航穿過風暴。"],["subside","(暴風雨等)趨緩;減弱;沉降","","The swelling in ead","帶頭;成為先鋒;引領;矛尖","","She spearheaded the campaign to reform the education system.","她帶頭發起了教育制度改革活動。"],["camcorder","便攜式攝像機;攝影機","","He used a camcorder to record his daughter's school performance.","他用攝像機錄下了女兒的學校表演。"],["supplant","取代;代替;排擠","","The new technology will supplant the old system.","新技術將取代舊系統。"],["churn","香戶;使感到不安","","The constant changes churned up anxiety among the employees.","不斷的變化讓員工們感到焦慮不安。"],["relentlessly","無情地;不留情地;不間斷地","","He pursued his goals relentlessly.","他無情地追求他的目標。"],["catch (somebody) flat-footed","使(人)措手不及;出其不意","","The surprise announcement caught everyone flat-footed.","突然的宣布讓每個人都措手不及。"],["lure","引誘;誘惑;吸引","","The bait was used to lure the fish.","誘餌被用來吸引魚。"],["canopy","天篷;樹頂部;華蓋","","The forest canopy blocked out most of the sunlight.","森林樹冠遮擋了大部分陽光。"],["cylinder","圓柱;圓筒;汽缸","","The engine has four cylinders.","發動機有四個氣缸。"],["go haywire","亂套;出毛病;發瘋","","When the power went out, the entire system went haywire.","停電時,整個系統亂套了。"],["mishapen","形狀怪異的;畸形的","","The misshapen fruit was still edible.","畸形的水果仍然可以食用。"],["full-fledged","完全成熟的;名副其實的;全部具備的","","He became a full-fledged member of the organization.","他成為了該組織的正式成員。"],["attrition","自然減員;人員流失;逐漸損耗","","The company faced high attrition rates among its staff.","公司面臨著員工流失率高的問題。"],["abatement","減少;緩解;阻止不徹底","","The abatement of the noise pollution was noticed by residents.","噪音污染的減少被居民注意到了。"],["deter","阻止;制止;使不敢","","The high prices deter many customers from buying the product.","高價格阻止了許多客戶購買該產品。"],["lumber","木材;緩慢沉重地移動","","He had to lumber through the snow to reach the cabin.","他不得不緩慢地穿過雪地才能到達小屋。"],["whiff","輕微的氣息;一吹法","","I caught a whiff of perfume as she walked past.","當她走過時,我聞到了香水的淡淡氣息。"],["confiscate","沒收;把...充公","","The authorities confiscated the counterfeit goods.","當局沒收了假貨。"],["ostracize","放逐;排擠;驅逐出社會","","The group ostracized the member who violated their rules.","該小組排擠了違反規則的成員。"],["stint","(固定的事業期間內的)時間;期限","","He served a two-year stint in the military.","他在軍隊服役了兩年。"],["primate","靈長類動物;最高統治者","","The scientist studied the behavior of primates.","科學家研究了靈長類動物的行為。"],["contingency","(可能發生的)意外事件;突發情況","","We need to have a contingency plan in case of emergencies.","我們需要有應對緊急情況的應急計劃。"],["inbreeding","近親繁殖;同族交配","","Inbreeding can lead to genetic problems in animal populations.","近親繁殖可能導致動物種群的遺傳問題。"],["aesthetic","美學的;審美的;藝術上","","The aesthetic appeal of the building attracted many visitors.","這座建築的美學吸引力吸引了許多遊客。"],["crooked","彎曲的;虛偽的;不正直的","","The road was crooked and difficult to follow.","這條路彎曲而難以跟隨。"],["pervasiveness","普遍性;無所不在;廣泛存在","","The pervasiveness of social media in daily life cannot be ignored.","社交媒體在日常生活中的普遍存在不容忽視。"],["morph","(使)變形;(使)逐漸演變","","The caterpillar will morph into a butterfly.","毛毛蟲會變成蝴蝶。"],["gainful employment/work/activity","有酬勞的;有收入的;獲利的工作活動","","She sought gainful employment after completing her studies.","完成學業後,她尋求有酬勞的工作。"],["fixated","固著於;著迷於;痴迷於","","He became fixated on the idea of starting his own business.","他對創辦自己的企業的想法著了迷。"],["game","勇敢的;敢冒險的;願意嘗試","","She's game for any adventure.","她對任何冒險都很有膽量。"],["complement","補充;補全;相配","","The red wine complements the steak perfectly.","紅酒與牛排完美搭配。"],["animated","生動活潑的;充滿活力的;製作動畫的","","The animated movie was a hit with children.","這部動畫電影在兒童中大受歡迎。"],["take (somewhere) by storm","在某地大獲成功;引起轟動","","The young singer took the music industry by storm.","這位年輕歌手在音樂界掀起了轟動。"],["the masses","群眾;大眾;普通百姓","","The government's policies should benefit the masses.","政府政策應該惠及廣大群眾。"],["synthesize","合成;綜合;做出綜合","","The body synthesizes vitamin D when exposed to sunlight.","身體在陽光照射下合成維生素D。"],["biodegradable","可生物分解的;能自然分解的","","The company uses biodegradable packaging for its products.","該公司為其產品使用可生物分解的包裝。"],["pliable","柔軟的;易變的;易被說服的","","The pliable material was easy to shape.","這種柔軟的材料易於成形。"],["pulp","紙漿;果肉;軟組織","","The paper was made from wood pulp.","紙是用木漿製成的。"],["ridicule","嘲笑;嘲弄;嘲笑的評論","","The students ridiculed his unusual fashion choices.","學生嘲笑了他不尋常的時尚選擇。"],["espouse","支持;擁護; try is rising.","這個國家的人均收入在上升。"],["flash flood/fire","驟然的洪水;災難","","A flash flood destroyed the village overnight.","驟然的洪水在一夜間摧毀了村莊。"],["mitigate","減輕;減緩;緩解","","Planting trees can mitigate the effects of pollution.","種植樹木可以減輕污染的影響。"],["sustainability","永續性;可持續性","","The company focuses on sustainability and environmental protection.","公司專注於可持續性和環保。"],["amenity","生活設施;便利設施","","The hotel offers many amenities including a gym and pool.","酒店提供許多設施,包括健身房和游泳池。"],["prowess","(戰爭事的)高超技能;能力","","The team's defensive prowess impressed everyone.","球隊的防守能力給每個人留下深刻印象。"],["on the spot","立即;馬上;當場","","The judge made a decision on the spot.","法官當場做出了決定。"],["frenzy","狂亂;狂熱;瘋狂","","The crowd was in a frenzy when the band appeared.","當樂隊出現時,人群陷入狂熱。"],["verbatim","逐字地;一字不改地","","She repeated the speech verbatim from memory.","她從記憶中逐字重複了演講。"],["mock","嘲笑的;模擬的;仿造的","","The students held a mock trial to learn about the legal system.","學生們舉行了模擬審判以了解法律制度。"],["screen","放映;篩查;檢查","","The hospital will screen patients for the disease.","醫院將為患者篩查該疾病。"],["rub (somebody) the wrong way","激怒某人;惹惱某人","","His attitude rubs me the wrong way.","他的態度讓我感到不適。"],["breach of trust","背信;背信行為;非法使用委託的資產","","The accountant's actions constituted a breach of trust.","會計師的行為構成了背信。"],["opus","藝術作品;書籍;音樂完全的作品","","His latest opus has received critical acclaim.","他最新的作品獲得了評論家的讚揚。"],["truncate","截短;截斷;縮短","","The conversation was truncated when the phone died.","當電話沒電時,對話被中斷了。"],["rash","魯莽的;輕率的;匆忙的","","Making a rash decision may lead to regrets.","做出匆忙的決定可能會導致後悔。"],["glaring","非常明顯且十分顯眼的;刺眼的","","The glaring omission in the report was noted by everyone.","報告中明顯的遺漏被每個人都注意到了。"],["amnesia","記憶喪失;遺忘;健忘","","After the accident, he suffered from amnesia.","事故後,他患上了失憶症。"],["plucky","(非正式)勇敢的;勇氣的;有膽識的","","The plucky hero refused to give up despite the odds.","這位勇敢的英雄儘管困難仍然拒絕放棄。"],["homegrown","(自產的;本土的;製造的;國產的)","","They prefer to eat homegrown vegetables.","他們喜歡吃自己種植的蔬菜。"],["face (somebody) down","用勇敢來對付(某人);威脅;嚇嚇","", omething new was \"We'll see.\"","Isabella的自動反應是她的孩子們要求她做新事情時說\"我們會看。\""],["habitual","習慣性的","","Bob lost all of his friends because of his habitual lying.","Bob因為習慣性說謊而失去了所有的朋友。"],["anchor","定著的","","They are used to represent countries during international sporting events.","它們被用來代表國際體育賽事期間的國家。"],["disguise","偽裝;隱瞞","","Hunter disguises his true feelings toward their family and friends.","Hunter隱瞞他對他們的家人和朋友的真實感受。"],["confidence","自信","","Rachel has the confidence to play the lead role in the play.","Rachel有信心在話劇中擔任主角。"],["determine","抉擇;下定心","","The teacher could not determine how much homework to give her class over the break.","老師無法確定要在休息期間給班級多少家庭作業。"],["potential","潛在的;可能的","","The students were warned of the potential results of missing the test.","警告學生可能會缺考帶來的後果。"],["nutrient","營養物;營分","","The nutrients in this food will give you energy for the race.","這種食物中的營養物質會為你的比賽提供能量。"],["gene","基因","","Everyone in the family was an excellent athlete, so they joked about having the sports gene.","家裡的每個人都是出色的運動員,所以他們開玩笑說有運動基因。"],["procedure","程序;步驟","","What is the procedure for applying for a passport?","申請護照的程序是什麼?"],["demand","需求;請求","","As interest in healthy eating has increased, so has the demand for fresh fruits and vegetables at grocery stores.","隨著對健康飲食的興趣增加,雜貨店對新鮮水果和蔬菜的需求也增加了。"],["emission","排放","","The goal of the new law is to lower carbon dioxide emissions.","新法律的目標是降低二氧化碳排放量。"],["disconnect","使脫離;切斷","","A school decided to ban phone use during school hours.","學校決定禁止在上課時間使用手機。"],["ban","禁止","","It is a good policy to ban phone use during school hours.","在上課時間禁止使用手機是一項好政策。"],["decade","十年","","Over the past decade, online learning has changed how students study.","在過去的十年裡,線上學習改變了學生的學習方式。"],["creature","生物;動物","","Every living creature needs food, water and shelter to live.","每個生物都需要食物、水和庇護所才能生存。"],["designer","設計者","","Many famous designers create different kinds of materials to improve everyday objects.","許多著名設計師創造了不同類型的材料來改善日常用品。"],["represent","代表","","Flags are used to represent countries during international sporting events.","旗幟被用來代表國際體育賽事期間的國家。"],["naturally","自然地","","People naturally improve their skills through regular practice.","人們通過定期練習自然地改進他們的技能。"],["zone","地區;地帶","","This area is marked as a no-parking zone for safety reasons.","由於安全原因,此區域被標記為禁止停車區。"],["proof","證明;證據","","The scientist presented her proof to support the results of the experiment.","科學家提供了證明來支持實驗的結果。"],["iceberg","冰山","","People in most parts of the world are too far south to see icebergs in person.","世界上大多數地方的人離冰山太遠,看不到冰山。"],["spectacle","奇觀;壯觀景象","","The fireworks show was an impressive spectacle.","煙火表演是一場令人印象深刻的奇觀。"],["offshore","離岸;在海上","","If you look carefully and wait long enough, you may be able to see whales offshore.","如果你仔細看並等夠長時間,你也許能看到離岸的鯨魚。"],["intriguing","引人入勝的;有趣的","","His theory is intriguing, but I am not fully convinced yet.","他的理論很吸引人,但我還沒有完全信服。"],["conceal","隱藏;隱瞞","","The cat crouched down in the bushes to jump out and catch the bird.","貓蹲在灌木叢中跳出來抓住鳥。"],["glacier","冰川","","Many creatures have adapted to the cold and visit or even live on glaciers.","許多生物已適應寒冷並訪問或甚至住在冰川上。"],["patrol","巡邏隊","","The police patrol was looking for criminal activity in the area.","警察巡邏隊在該地區尋找犯罪活動。"],["via","途經;經由","","Please send the pictures via email so I can access them on my computer.","請通過電子郵件發送圖片,以便我可以在計算機上訪問它們。"],["collide","碰撞;相撞","","The car collided with a tree, but fortunately no one was hurt.","汽車與樹相撞,但幸好沒有人受傷。"],["venture","冒險;冒險事業","","The journey will be a risky venture into a region we aren't familiar with.","這次旅程將是一次冒險,進入我們不熟悉的地區。"],["helicopter","直升機","","At this point, you can pay to take a ride for 15 minutes in a helicopter.","此時,你可以支付15分鐘乘坐直升機的費用。"],["overcome","克服;戰勝","","Kathy has worked hard to overcome her fear of heights.","Kathy努力克服了她對高度的恐懼。"],["parachute","降落傘","","Supplies were dropped by parachute into a village where roads were destroyed by the earthquake.","補給品通過降落傘被投放到一個被地震摧毀道路的村莊。"],["improvise","臨時拼湊;即興創作","","When he realized he had lost his notes, Caleb had to improvise his speech.","當他意識到他丟失了筆記時,Caleb不得不即興發表演講。"],["series","系列;連續","","Sesame Street, the popular kids' TV series, has been on TV for over 54 years!","著名的兒童電視連續劇《芝麻街》已在電視上播放了超過54年!"],["versus (vs.)","對比;以...對抗...","","The increase in gas prices versus the cuts you make has increased in government spending.","汽油價格上漲與政府支出削減之間的對比增加。"],["feat","功績;技藝","","The magician performed many remarkable feats.","魔術師表演了許多了不起的技藝。"],["privilege","特權;特殊權利","","It was a real privilege to meet my favorite author.","見到我最喜歡的作者是一種真正的榮幸。"],["comparable","相似的;可比較的","","These two brands are comparable in terms of quality.","這兩個品牌在品質上是可比較的。"],["component","組成部份;零件","","To fix the computer, we need to replace several components.","要修理計算機,我們需要更換幾個組件。"],["derive","獲得;得出","","Now parents would derive great benefit from reading this book.","現在父母會從閱讀這本書中獲得很大的好處。"],["exceptional","不尋常的","","His ability to explain complicated ideas simply is exceptional.","他簡潔地解釋複雜想法的能力是不尋常的。"],["induce","誘導;導致","","This medication is intended to induce sleep.","這種藥物旨在誘導睡眠。"],["trigger","引發;引起","","This decision triggered a series of events that ended in disaster.","這一決定引發了一系列最終以災難告終的事件。"],["refrain","避免;迴避","","Please refrain from using your phone in the movie theater.","請在電影院避免使用你的手機。"],["overall","整體;工作服","","Overall, the point of the story is that hard work will pay off.","總的來說,故事的要點是努力工作會得到回報。"],["handwrite","手寫","","She chose to send handwritten notes to her friends instead of typing them.","她選擇向朋友發送手寫便條,而不是打字。"],["wisdom","智慧","","Life experiences often bring wisdom that cannot be learned from books alone.","生活經驗往往會帶來無法單從書籍中學到的智慧。"],["retire","退休","","Kimberly plans to retire at 65 and spend more time traveling.","Kimberly計劃在65歲時退休,並花更多時間旅行。"],["volunteer","自願(做)","","Many students volunteer to help at community events during the weekend.","許多學生自願在週末幫助社區活動。"],["operation","行動;運作","","Benny and Nolan were both involved in the daily operation of the family business.","Benny和Nolan都參與了家族企業的日常運營。"],["thoughtful","體貼的;有想周到的","","A thoughtful plan can prevent problems later.","一個周全的計畫可以防止後來出現問題。"],["gracious","親切的;有禮貌的","","The host gave us a gracious welcome at the door.","主人在門口給了我們親切的歡迎。"],["monument","紀念碑","","The monument honors the founders of the city.","紀念碑表彰了城市的創始人。"],["specialty","特色;專科","","Seafood is this restaurant's specialty.","海鮮是這家餐廳的特色。"],["mansion","豪宅;大樓","","This beautiful mansion has 15 bedrooms.","這座漂亮的豪宅有15間臥室。"],["colonial","殖民地時的","","The museum displays furniture from the colonial period.","博物館展示了殖民地時期的家具。"],["sustain","維持;支撐","","The river sustains life in this region.","河流維持著這個地區的生命。"],["estate","莊園;不動產","","Her family owns a large estate near the lake.","她的家族在湖邊擁有一大片莊園。"],["horizon","地平線","","If you look carefully, you can see a ship on the horizon.","如果你仔細看,你可以在地平線上看到一艘船。"],["steam","蒸汽;蒸","","I enjoy a hot, steaming cup of coffee every morning.","我每天早上都喜歡一杯熱的、冒著蒸汽的咖啡。"],["toss","扔;引起","","The emperor tossed it all together.","皇帝把它都扔在一起。"],["emperor","皇帝","","The emperor's castle walls were covered in gold.","皇帝的城堡牆壁被金色覆蓋。"],["rosewater","玫瑰水","","Leah's favorite perfume is made from rosewater.","Leah最喜歡的香水是由玫瑰水製成的。"],["shrimp","蝦","","This seafood restaurant is known for its fresh shrimp.","這家海鮮餐廳以新鮮蝦聞名。"],["humidity","濕度;濕氣","","This city has high humidity for most of the year.","這個城市在大部分時間濕度很高。"],["stroll","散步;閒逛","","We decided to stroll through the park after dinner.","我們決定在晚餐後在公園散步。"],["spectacular","壯觀的;令人嘆為觀止的","","The view of the sunset from her balcony is spectacular.","從她陽台上看日落的景色令人嘆為觀止。"],["architect","建築師","","The architect designed a new building for the school.","建築師為學校設計了一棟新建築。"],["ceramic","陶瓷的","","Do you want to buy one of these colorful ceramic bowls?","你想買一個這些彩色陶瓷碗中的一個嗎?"],["residential","住宅的;居住的","","Our friends live on a quiet residential street not far from downtown.","我們的朋友住在離市中心不遠的安靜住宅區。"],["vine","藤蔓;藤爬植物","","Long vines climb up the walls of the old house.","長藤蔓爬上了老房子的牆壁。"],["sculpted","雕刻的;雕塑的","","The sculpted stone looks like a face.","雕刻的石頭看起來像一張臉。"],["legacy","遺產;遺留","","The artist's legacy lives on through his work.","藝術家的遺產通過他的作品活著。"],["idiot","白癡;笨蛋","","John felt like an idiot after forgetting his own birthday.","John在忘記自己生日後感到像個白癡。"],["imaginative","想像力豐盈的","","James created a very imaginative story about dragons and flying cars.","James創造了一個關於龍和飛行汽車的非常有想像力的故事。"],["clash","衝突;爭執","","There was a clash between the two teams over the final goal.","兩隊在最終目標上發生了衝突。"],["intention","意圖;打算","","Her intention was to help, not to criticize.","她的意圖是幫助,而不是批評。"],["adjustment","調整;小改動","","The new glasses needed a slight adjustment to fit properly.","新眼鏡需要進行輕微調整才能正確配合。"],["constructive","建設性的;有益的","","The teacher gave constructive feedback to improve the student's essay.","老師給了建設性的反饋來改進學生的論文。"],["compatible","相容的;可共存的","","Their personalities are compatible, so they work well together.","他們的性格相容,所以他們配合得很好。"],["abrupt","突然的;意外的","","His abrupt reply surprised everyone at the meeting.","他突然的回答讓會議上的每個人都感到驚訝。"]],"6月Advanced":[["單字","字義","圖片","例句","句義"],["bellicose","好戰的;好鬥的;挑釁的","","The region is marked as a bellicose area for safety reasons.","該地區因安全原因被標記為好戰的地區。"],["stow","放置;放好;整齊放置","","Everyone in the family was an excellent athlete, so they joked about having the sports gene.","家裡的每個人都是出色的運動員,所以他們開玩笑說有運動基因。"],["crackdown","打擊;鎮壓;嚴厲的措施","","The school took a hard line, using strict and sudden crackdowns on misconduct.","學校採取了強硬立場,對不當行為進行嚴厲鎮壓。"],["anecdotal","軼聞的;傳聞的;根據個人故事的","","Anecdotal evidence is often used for storytelling and discussions.","軼聞證據常被用於講述故事和討論。"],["unfettered","不受約束的;自由的","","The students were warned of the unfettered use of technology in class.","警告學生不要在課堂上不受限制地使用技術。"],["surreptitious","偷偷摸摸的;秘密的","","The surreptitious nature of the plan meant only a few people knew about it.","計劃的秘密性質意味著只有少數人知道。"],["brute force/strength","蠻力;野蠻力量","","Solving the problem requires brute force rather than elegant strategies.","解決這個問題需要蠻力,而不是優雅的策略。"],["root (something) out","挖出;根除;檢驗","","The government needs to root out corruption in its systems.","政府需要根除其系統中的腐敗。"],["scourge","災害;禍害;鞭打","","The scourge of poverty affects many countries worldwide.","貧困的禍害影響世界許多國家。"],["competence/competency","(做某職位工作所必要的)能力","","Competence in communication is essential for any leadership role.","溝通能力對任何領導職位都至關重要。"],["charisma","領人魅力;個人魅力","","His charisma made him a popular leader among his peers.","他的個人魅力使他成為同齡人中受歡迎的領導者。"],["consensus","共識;一致同意","","The team reached a consensus on the best way forward.","團隊對最佳前進方式達成了共識。"],["pull (something) off","成功完成;成功(做困難的事)","","The team managed to pull off an incredible victory despite all odds.","儘管困難重重,團隊還是成功實現了不可思議的勝利。"],["align","使一致;排成一列","","The company's values should align with their business practices.","公司的價值觀應該與他們的商業實踐相符。"],["pillar","支柱;柱子","","Education is a pillar of a strong society.","教育是強大社會的支柱。"],["cultivate","培養;養成;種植","","Teachers should cultivate critical thinking skills in their students.","教師應該在學生中培養批判性思維能力。"],["fortress","堡壘;堡壘城市;防禦工事","","The old fortress stands as a testament to the region's military history.","古老的堡壘見證了該地區的軍事歷史。"],["antiquity","古代;古物;古董","","The museum houses artifacts from ancient antiquity.","博物館收藏了古代的文物。"],["the crown jewels","王冠上的珠寶;最寶貴的東西","","The painting is considered one of the crown jewels of the museum's collection.","這幅畫被認為是博物館收藏中最寶貴的珍品之一。"],["glisten","閃亮;閃閃發光","","The water glistens in the morning sun.","水在晨光中閃閃發光。"],["snarky","嘲諷的;出言不遜的","","His snarky comments about the project were not appreciated.","他關於項目的嘲諷評論不受歡迎。"],["caste","社會階級;等級制度","","The caste system has influenced Indian society for centuries.","種姓制度幾個世紀以來一直影響著印度社會。"],["exorcism","驅魔;驅鬼;驅鬼儀式","","The priest performed an exorcism to rid the house of evil spirits.","神父進行了驅魔儀式來驅走邪靈。"],["caricature","漫畫;諷刺畫;夸張的描寫","","The artist created a caricature of the politician that was quite humorous.","藝術家創造了政治家的漫畫,相當有趣。"],["vintage","老式的;古色古香的;佳釀","","The vintage car show attracted many enthusiasts.","經典老爺車展覽吸引了許多愛好者。"],["rigorous","嚴厲的;嚴格的","","The rigorous training program prepared the athletes for competition.","嚴格的訓練計劃為運動員準備比賽。"],["sweltering","悶熱的;炎熱的","","The sweltering heat made it difficult to work outdoors.","悶熱的天氣使在戶外工作變得困難。"],["be accustomed to (doing) something","習慣於(做某事)","","She is accustomed to working long hours at the office.","她習慣了在辦公室工作長時間。"],["elation","欣喜;興高采烈;歡欣鼓舞","","The team felt elation after winning the championship.","球隊贏得冠軍後感到欣喜若狂。"],["oscillation","(電壓的)振盪;擺動","","The oscillation of the pendulum was steady and predictable.","鐘擺的擺動是穩定和可預測的。"],["rebuff","冷淡對待;拒絕;冷遇","","She felt hurt by his rebuff when she tried to befriend him.","當她試圖與他交朋友時,他的冷遇讓她感到受傷。"],["precipitous","急速的;陡峭的;冒失的","","The stock market experienced a precipitous drop in value.","股市經歷了急劇下跌。"],["alteration","改變;改動;修改","","The tailor made several alterations to the dress to fit better.","裁縫對裙子進行了多次改動以更好地貼身。"],["plateau","高原;高地;停滯期;達到平面","","After months of steady progress, the student's grades plateaued.","經過幾個月的穩定進展,學生的成績停滯不前。"],["frailty","脆弱;虛弱;易損性","","The frailty of human life reminds us to cherish our relationships.","人生的脆弱提醒我們珍惜我們的關係。"],["negligible","微不足道的;可忽視的","","The difference between the two options was negligible.","兩個選項之間的差異微乎其微。"],["inflection point","臨界點;轉折點;拐點","","The invention of the internet was an inflection point in human history.","互聯網的發明是人類歷史上的轉折點。"],["serendipity","幸運遇見;意外的驚喜","","Finding that old photograph was pure serendipity.","找到那張舊照片純粹是意外的驚喜。"],["deride","嘲笑;嘲弄;譏誚","","The critics derided the film as poorly made and unoriginal.","評論家嘲笑這部電影製作不良且毫無創意。"],["exacerbate","使惡化;使加劇;加重","","Poor diet and lack of exercise exacerbate health problems.","不良飲食和缺乏運動會加重健康問題。"],["complacency","自滿;自得;自得其樂","","The team's complacency after their first win led to their eventual loss.","球隊在首場勝利後的自滿導致了他們最終的失敗。"],["inexpurt","不熟練的;外行的;缺乏專業能力的","","As an inexpurt in cooking, I often follow recipes closely.","作為一個不熟練的廚師,我經常嚴格遵循食譜。"],["gross","違法的;粗暴的;總的;總計","","The gross misconduct resulted in immediate dismissal.","嚴重不當行為導致立即解僱。"],["nominally","名義上;表面上","","He is nominally in charge, but his assistant makes all the decisions.","他名義上負責,但他的助手做出所有決定。"],["puberty","青春期;青年期","","Many teenagers experience mood swings during puberty.","許多青少年在青春期經歷情緒波動。"],["nurture","養護;培育;養育","","Parents should nurture their children's talents and interests.","父母應該培養孩子的才能和興趣。"],["misguided","誤導的;錯誤的","","His misguided attempts to help only made the situation worse.","他誤導性的幫助嘗試只是讓情況更糟。"],["prickly","多刺的;易怒的;不友好的","","The prickly plant had sharp thorns that could injure unwary hikers.","這種多刺植物有尖銳的刺,可能傷害不小心的登山者。"],["leaning","傾向;偏好;偏見","","Her leaning toward classical music was evident from her collection.","她對古典音樂的偏好從她的收藏中顯而易見。"],["speech impediment","語音障礙;說話障礙","","He overcame his speech impediment through dedicated speech therapy.","他通過專門的語言治療克服了他的語音障礙。"],["multiplicity","多重;多樣性;眾多","","The multiplicity of options made it difficult to choose.","眾多選擇使選擇變得困難。"],["meddle","干涉;攙和;亂碰","","Don't meddle in other people's affairs.","不要干涉他人的事務。"],["deflect","(使)轉向;(使)偏斜","","The shield deflected the incoming blow.","盾牌擋住了來臨的一擊。"],["stave (something) off","延遲;延期;推遲","","Regular exercise helps stave off illness and disease.","經常鍛煉有助於預防疾病。"],["signatory","(正式簽署的)簽署方;簽署國","","The treaty required all signatory nations to comply with its terms.","該條約要求所有簽署國遵守其條款。"],["suppress","抑制;壓抑;制止","","The government tried to suppress the rebellion by force.","政府試圖用武力鎮壓叛亂。"],["unforeseen","未預料到的;意料之外的","","Unforeseen circumstances forced us to change our plans.","意外情況迫使我們改變計劃。"],["aspiring","有志當...的;立志的","","The aspiring actor worked hard to land a major role.","這位有志成為演員的人努力工作以獲得重要角色。"],["ironclad","無法更改的;牢固的;鐵律的","","The company has ironclad policies that all employees must follow.","公司有所有員工必須遵守的鐵律政策。"],["ambiguity","含糊不清;模棱兩可","","The ambiguity in the instructions led to confusion among the workers.","說明中的含糊不清導致工人困惑。"], arket.","CEO決定帶頭進入新市場。"],["harness","馬具;馬缚繩;約束力;利用","","The engineer designed a system to harness solar energy.","工程師設計了一個系統來利用太陽能。"],["molten","熔化的;熔融的;液態的","","The molten lava flowed down the volcano slowly.","熔融的熔岩緩慢地從火山流下來。"],["trench","壕溝;濠溝;溝渠;深溝","","Soldiers dug trenches for protection during the war.","士兵們在戰爭中挖壕溝進行防禦。"],["feasibility","可行性;做得到性;實現的可能性","","The engineer assessed the feasibility of the construction project.","工程師評估了施工項目的可行性。"],["supersonic","超音速的;高於音速的","","The supersonic jet broke the sound barrier.","超音速噴氣式飛機突破了音障。"],["invert","倒轉;上下顛倒;反轉","","The engineer needed to invert the image to see it correctly.","工程師需要反轉圖像才能正確看到它。"],["bulge","隆起;鼓出;突出;鼓出","","The overcrowded box began to bulge at the seams.","擁擠的盒子開始在接縫處鼓出。"],["meticulous","謹慎的;細心的;細緻的","","The meticulous researcher kept detailed records of every experiment.","細心的研究人員詳細記錄了每項實驗。"],["automation","自動化;自動操作","","The factory implemented automation to increase efficiency.","工廠實施自動化以提高效率。"],["debug","排除程式中的錯誤;除去蟲子","","The programmer spent hours trying to debug the software.","程序員花了幾個小時試圖除錯軟件。"],["paradox","自相矛盾的說法;悖論","","It's a paradox that he's friendly yet distant at the same time.","他既友好又疏遠,這是一個悖論。"],["sanitize","消毒;清潔;冒充好感","","The hospital sanitizes all equipment between patient visits.","醫院在患者就診之間對所有設備進行消毒。"],["vigilance","警戒;警成;警惕","","The security guard maintained vigilance throughout the night shift.","保安整個夜班都保持警惕。"],["audit","審查;稽查;旁聽","","The company underwent a financial audit to ensure compliance.","公司進行了財務審計以確保合規性。"],["transparency","透明度;透明;清晰度","","The organization values transparency in all its operations.","該組織重視其所有業務的透明度。"],["customize","(為某份雜誌或設施的)客製;訂製","","You can customize your phone with various themes and applications.","你可以用各種主題和應用程序自定義你的手機。"],["deliberately","故意地;蓄意地;有意地","","She deliberately avoided the crowded areas of the mall.","她故意避開購物中心擁擠的地方。"],["avid","熱心的;熱誠的;渴望的","","He's an avid reader who goes through books very quickly.","他是一個熱心讀者,閱讀速度很快。"],["enthus lf-esteem","自尊","","Barb has very low self-esteem and never feels she does anything right.","Barb自尊心很低,從不覺得自己做任何事是對的。"],["otherwise","以另外的方式","","Mary joined a club and made connections she wouldn't have made otherwise.","Mary加入了一個俱樂部,結交了她原本不會結交的朋友。"],["addict","使成癮","","Brian became addicted to smoking when he was a teenager.","Brian在青少年時期沉迷於吸菸。"],["suffer","受損害;受苦","","Anna's work suffered after her boss yelled at her for making one little mistake.","老闆因為一個小錯誤對Anna大吼後,她的工作受到了影響。"],["intense","強烈的;激烈的","","Ben is very intense and feels deeply about everything.","Ben非常激烈,對一切都有深刻的感受。"],["deserve","值得;應得","","Everyone deserves to be treated with kindness and respect.","每個人都應該受到善意和尊重的對待。"],["delight","樂事;欣喜","","The children shouted with delight when they saw the birthday cake.","孩子們看到生日蛋糕時高興地大叫。"],["strain","過濾;濾掉","","After boiling the pasta, strain the water before adding the sauce.","煮完義大利麵後,加醬汁前先把水濾掉。"],["bacteria","細菌","","Some kinds of bacteria help your body stay healthy.","某些細菌有助於保持身體健康。"],["immune system","免疫系統","","Sleep and exercise are important for keeping your immune system strong.","睡眠和運動對保持免疫系統強健很重要。"],["composition","成分;構成","","The composition of the cake includes flour, sugar and eggs.","蛋糕的成分包括麵粉、糖和雞蛋。"],["corrupt","腐敗的;貪汙的","","The corrupt organization was finally brought to justice.","腐敗的組織終於被繩之以法。"],["enrich","使富裕","","Fair trade programs help farmers make sure that natural resources enrich communities.","公平貿易計劃幫助農民確保自然資源豐富社區。"],["devastate","毀滅;摧毀","","The city experienced devastating loss from the super typhoon.","這座城市因超級颱風遭受了毀滅性的損失。"],["compel","強迫;逼迫","","The father compelled his kids to work on the farm instead of attending school.","父親強迫孩子們在農場工作而不是上學。"],["accountable","應負責任的","","People need to be held accountable for their actions.","人們需要為自己的行為負責。"],["transparent","透明的;清楚易懂的","","The organization's financial records are transparent, so the public can see how donations are spent.","該組織的財務記錄是透明的,因此公眾可以看到捐款是如何使用的。"],["certificate","證書;證明","","She received a certificate of completion when she finished her sailing course.","她完成航海課程後獲得了結業證書。"],["jeweler","珠寶商","","That jeweler only sells top quality jewelry.","那個珠寶商只賣頂級珠寶。"],["corruption","腐敗;貪汙","","The corruption in this town is very high, so be careful.","這個城鎮的腐敗程度很高,所以要小心。"],["efficiency","效率","","Even though this is Alayna's first job, she works with speed and efficiency.","儘管這是Alayna的第一份工作,但她工作速度快且效率高。"],["corresponding","對應的;相應的","","Rooms in the home and corresponding paint colors are on the list.","房間和對應的油漆顏色都在清單上。"],["log","日誌;記錄","","Turn in your time log at the end of every month.","每個月底交上你的時間記錄。"],["collection","收藏品;收集物","","Paul's many collections include stamps, comic books and old records.","Paul的眾多收藏品包括郵票、漫畫書和舊唱片。"],["entry","記錄;條目","","I just realized every entry was recorded wrong.","我剛意識到每個條目都記錄錯了。"],["craft","手藝;工藝","","We'll need some craft supplies for your school project.","我們需要一些手工藝品材料來做你的學校專案。"],["tortoise","陸龜;烏龜","","Many different tortoises are protected by governments around the world.","世界各地的政府保護許多不同的陸龜。"],["luxurious","奢華的","","This hotel is the most luxurious place we have ever stayed.","這家酒店是我們住過的最豪華的地方。"],["curve","曲線","","The curved wall made the room interesting to decorate.","弧形牆使房間裝飾起來很有趣。"],["marine","海洋的","","There is a large variety of marine life in the waters off the coast of the world.","世界沿海水域有各種各樣的海洋生物。"],["cuisine","烹飪;菜餚","","What's your favorite cuisine?","你最喜歡的菜系是什麼?"],["frontline","前線;第一線","","During the pandemic, healthcare workers on the frontline took risks with their health.","在疫情期間,前線的醫護人員冒著健康風險。"],["fragile","脆弱的;易碎的","","The fragile African desert suffers when there is no rain.","脆弱的非洲沙漠在沒有雨水時會受苦。"],["despite","儘管;雖然","","Despite his dislike of the subject matter, Frank enjoyed the performer very much.","儘管Frank不喜歡主題,但他非常喜歡表演者。"],["phony","假冒的;虛偽的","","Amber gave the strange man a phony name so he wouldn't be able to find out her real one.","Amber給陌生人一個假名,這樣他就無法知道她的真名。"],["evacuate","撤離;疏散","","Everyone had to evacuate the building because of the earthquake.","由於地震,每個人都必須撤離建築物。"],["competence","能力;才能","","This test will show your competence in math.","這個測試將顯示你在數學方面的能力。"],["inquire","詢問;打聽","","Rose decided to inquire further about the job opening.","Rose決定進一步詢問職位空缺的情況。"],["browser","瀏覽器","","When Julian got to work, he opened his browser to check his email.","當Julian上班時,他打開瀏覽器查看電子郵件。"],["administration","管理人員;行政部門","","When applying to universities, it is common to pay an administration fee.","申請大學時,通常要支付管理費。"],["grumble","抱怨;發牢騷","","Sebastian grumbled about the cold weather when he was asked to go to the store.","當被要求去商店時,Sebastian抱怨天氣寒冷。"],["frantic","緊張忙亂的","","Francie was frantic when she couldn't find her passport.","Francie找不到護照時非常緊張。"]],"5月Advanced":[["單字","字義","圖片","例句","句義"],["gimmick","引人注意的花招;噱頭","","The marketing campaign used several gimmicks to attract customers.","這次行銷活動使用了幾個花招來吸引顧客。"],["diesel","柴油","","Most trucks run on diesel fuel.","大多數卡車使用柴油燃料。"],["pharmaceuticals","藥物;藥品","","The pharmaceutical industry is highly regulated.","製藥業受到嚴格監管。"],["bottleneck","(妨礙進度的)瓶頸;阻礙","","Traffic congestion created a bottleneck on the highway.","交通擁堵在高速公路上造成了瓶頸。"],["pallet","托盤;墊盤(貨物的)鐵框;裝貨架","","The goods were stacked on wooden pallets.","貨物堆放在木製托盤上。"],["plaster","灰泥","","The walls need a fresh coat of plaster.","牆壁需要重新塗一層灰泥。"],["propulsion","推進力","","The rocket uses jet propulsion.","火箭使用噴射推進。"],["climactic","高潮的;最激烈的","","The movie's climactic scene was breathtaking.","電影的高潮場景令人屏息。"],["visceral","發自內心的;出自體會的","","She had a visceral reaction to the news.","她對這個消息有發自內心的反應。"],["crave","渴求;熱望","","I'm craving chocolate right now.","我現在很想吃巧克力。"],["amplify","增強;放大","","The microphone amplifies the speaker's voice.","麥克風放大說話者的聲音。"],["ebb and flow","有規律的;起伏;消長","","The ebb and flow of the tide is predictable.","潮汐的起落是可預測的。"],["imperative","緊急的事;必要的事","","It is imperative that we act quickly.","我們必須迅速行動,這是當務之急。"],["proliferate","激增;擴散","","Rumors began to proliferate on social media.","謠言開始在社交媒體上擴散。"],["tempo","(事情進展的)節奏;步調","","The tempo of the project has increased.","專案的節奏加快了。"],["inflamed","發炎的;(因受傷或感染而)紅腫的","","The wound became inflamed and swollen.","傷口發炎腫脹了。"],["veterinary","獸醫的","","She studied veterinary medicine at university.","她在大學學習獸醫學。"],["vibration","震動;振動","","The vibrations from the machine were strong.","機器產生的震動很強。"],["treadmill","跑步機","","I exercise on the treadmill every morning.","我每天早上在跑步機上鍛煉。"],["flop","(電影、戲劇或產品等)失敗之作","","The movie was a commercial flop.","這部電影在商業上失敗了。"],["turmoil","混亂;騷亂;動亂","","The country is in political turmoil.","這個國家處於政治動盪中。"],["denigrate","貶低;詆毀","","Don't denigrate other people's achievements.","不要貶低別人的成就。"],["akin (to something)","與某物相似的;類似的","","His behavior is akin to that of a child.","他的行為類似於孩子。"],["volatile","易變的;動盪不定的","","The stock market has been very volatile lately.","股市最近非常動盪。"],["cement","加強;鞏固(關係)","","The alliance cemented their relationship.","這個聯盟鞏固了他們的關係。"],["simplicity","簡樸;簡單","","The design's simplicity is its greatest strength.","設計的簡潔是其最大的優勢。"],["bureaucratic","官僚的","","The process is too bureaucratic and slow.","這個過程太官僚化且緩慢。"],["agile","敏捷的;靈活的","","The company needs to be more agile in responding to change.","公司需要更靈活地應對變化。"],["dividend","股息;紅利","","Shareholders will receive their annual dividend.","股東將獲得年度股息。"],["tariff","關稅","","The government raised tariffs on imported goods.","政府提高了進口商品的關稅。"],["spam","發送垃圾;垃圾郵件","","My inbox is full of spam emails.","我的收件箱充滿了垃圾郵件。"],["track","專輯裡的;歌曲","","This is my favorite track on the album.","這是我在這張專輯中最喜歡的歌曲。"],["grapple with (something)","努力因應;盡力解決;設法應對","","The team is grappling with budget constraints.","團隊正在努力應對預算限制。"],["precursor","先兆;前兆;前身","","Dark clouds are a precursor to rain.","烏雲是下雨的前兆。"],["secrete","分泌","","The glands secrete hormones into the bloodstream.","腺體將激素分泌到血液中。"],["radiologist","放射師","","The radiologist examined the X-rays carefully.","放射科醫師仔細檢查X光片。"],["vascular","血管的;循環的","","He has vascular disease.","他患有血管疾病。"],["biomarker","生物標記","","Scientists identified a new biomarker for the disease.","科學家發現了該疾病的新生物標記。"],["reputed","據說的;據稱的;聲稱的","","He is reputed to be the best chef in town.","據說他是鎮上最好的廚師。"],["outstrip","跨越上太快","","Demand outstrips supply.","需求超過供應。"],["prefecture","(某些國家的)省;縣","","He was elected governor of the prefecture.","他被選為該縣的縣長。"],["stagnant","不流動的;停滯不前的","","The economy has been stagnant for years.","經濟多年來一直停滯不前。"],["bellow","咆哮;低聲吼叫","","The angry man bellowed at the crowd.","憤怒的男人對著人群咆哮。"],["choke (somebody) up","使某人哽咽;說不出話","","The sad movie choked me up.","這部悲傷的電影讓我哽咽。"],["verdant","草木蒼翠的","","The valley is lush and verdant.","山谷鬱鬱蔥蔥。"],["state-of-the-art","最先進的","","The hospital has state-of-the-art equipment.","醫院配備了最先進的設備。"],["fusion","融合","","The restaurant serves fusion cuisine.","這家餐廳供應融合菜。"],["underscore","強調","","The incident underscores the need for better security.","這起事件強調了加強安全的必要性。"],["hew","砍;劈","","They hewed logs to build the cabin.","他們砍伐木頭建造小屋。"],["labyrinth","迷宮;錯綜複雜的路徑","","The old city is a labyrinth of narrow streets.","舊城是狹窄街道的迷宮。"],["replenish","補充;補足","","We need to replenish our water supply.","我們需要補充水供應。"],["invigorating","使精力充沛的","","The morning jog was invigorating.","晨跑令人精神振奮。"],["safeguard","保障;防護","","New laws safeguard consumer rights.","新法律保障消費者權益。"],["rote","死記硬背的","","Learning by rote is not always effective.","死記硬背並不總是有效。"],["smear","污跡;污漬","","There's a smear of paint on the wall.","牆上有一道油漆污跡。"],["dethrone","廢(某人)下台;使(某人)失去頭銜","","The champion was dethroned by a newcomer.","冠軍被新人擊敗而失去頭銜。"],["budding","萌芽的;成長中的","","She's a budding artist with great potential.","她是一位有巨大潛力的新興藝術家。"],["free-for-all","自由放任;人人皆可為所欲為的情形","","The debate turned into a free-for-all.","辯論變成了混戰。"],["indie","獨立小公司","","He works for an indie film production company.","他為一家獨立電影製作公司工作。"],["reputable","聲譽好的;有信譽的;有聲望的","","Always buy from reputable dealers.","總是從信譽良好的經銷商購買。"],["knack","(天生的)技巧;本領","","She has a knack for l m agreed on a set of clear objectives.","在開始專案之前,團隊就一組明確的目標達成了一致。"],["ultimately","最終;最終","","Ultimately, the choice to give up control gave Myra a deep sense of peace.","最終,放棄控制的選擇給了Myra深深的平靜感。"],["sheer","純粹的;徹底無遮擋的","","There was no way to climb the sheer cliff without ropes.","沒有繩索就無法爬上陡峭的懸崖。"],["rugged","崎嶇的","","Mountain goats live high in rugged hills where few people go.","山羊生活在人跡罕至的崎嶇山丘上。"],["thrill","激動;興奮","","She felt a thrill of excitement as she stepped onto the narrow bridge.","當她踏上狹窄的橋時,她感到一陣興奮。"],["ledge","岩架;岩石突出處","","Sharon sat on the building's narrow ledge and looked down to the street below.","Sharon坐在建築物狹窄的壁架上,俯瞰下面的街道。"],["endurance","耐力;持久力","","Long distance running requires a lot of endurance.","長跑需要很大的耐力。"],["vertical","垂直的","","He drew a straight vertical line down the page.","他在頁面上畫了一條垂直線。"],["intimidate","使畏縮;恐嚇","","The height of the tower didn't intimidate her; she was ready for the climb.","塔的高度沒有嚇到她;她準備好攀登了。"],["recreational","休閒娛樂的","","Many people enjoy recreational activities like hiking, biking and swimming.","許多人喜歡健行、騎自行車和游泳等休閒活動。"],["well-being","幸福;安康","","The well-being of their children is of great concern to parents.","孩子的幸福是父母非常關心的問題。"],["advantage","優點;好處","","There are many advantages to learning a second language.","學習第二語言有很多好處。"],["additionally","此外;另外","","Bill speaks English well. Additionally, he is learning Japanese and French.","Bill英語說得很好。此外,他還在學習日語和法語。"],["background","背景;出身","","Do you know anything about the new boy's background?","你知道那個新男孩的背景嗎?"],["expand","擴大;擴展","","Doreen is expanding her garden to grow more vegetables.","Doreen正在擴大她的花園以種植更多蔬菜。"],["troublesome","麻煩的;令人困擾的","","The times we live in are very troublesome.","我們生活的時代很麻煩。"],["pretend","假裝","","I don't have to pretend around my friends.","我在朋友面前不用假裝。"],["necessity","必需品;需要","","During the winter, heat is a necessity in the northern part of the world.","在冬天,暖氣在世界北部是必需品。"],["recycle","回收;再利用","","We should recycle plastic bottles to protect the e s day eating and digesting grass.","牛花很多時間吃草和消化草。"],["theory","理論","","Researchers often test a theory to see if it's true.","研究人員經常測試理論以確定其是否正確。"],["alternative","備選方案;替代品","","An interesting alternative to labels is placing stickers on the topic.","標籤的有趣替代方案是在主題上貼貼紙。"],["flexibility","靈活性;彈性","","Doreen's job doesn't provide any flexibility regarding people's roles in the new project.","Doreen的工作對新專案中人們的角色沒有任何靈活性。"],["characterize","是...的特徵","","Bright colors and bold lines characterize Picasso's paintings.","明亮的顏色和粗線條是畢加索畫作的特徵。"],["shift","轉移;改變","","Paula's new position has meant a huge shift in her responsibilities.","Paula的新職位意味著她的職責發生了巨大轉變。"],["convert","轉變;變換","","Elizabeth converted her backyard into a vegetable garden.","Elizabeth把後院改造成菜園。"],["protection","預測","","The company's projections for next year look promising.","公司對明年的預測看起來很有希望。"],["tidal","潮汐的","","The tidal current is strongest in that part of the beach.","海灘的那部分潮流最強。"],["quest","尋求;探尋","","Doctors are hard at work in their quest to find a cure for the disease.","醫生們正努力尋找治療這種疾病的方法。"],["gravity","引力;重力","","Babies tend to drop food on the floor to try to figure out how gravity works.","嬰兒傾向於把食物掉在地板上,試圖弄清楚重力是如何運作的。"],["generator","發電機","","When the power went down, we used a generator to power our house.","停電時,我們用發電機為房子供電。"],["renewable","可再生的;可更新的","","The more we use renewable energy sources, the better.","我們使用的可再生能源越多越好。"],["coastline","海岸線","","This country's coastline has beautiful beaches every few miles.","這個國家的海岸線每隔幾英里就有美麗的海灘。"],["rotate","轉動;旋轉","","The rotating Earth gives us day and night.","旋轉的地球給我們帶來晝夜。"],["constraint","限制;約束","","Since I took on the new role, I have more constraints on my time.","自從我擔任新角色以來,我的時間受到更多限制。"]],"4月Advanced":[["單字","字義","圖片","例句","句義"],["temperate climate/zone/region, etc.","溫帶氣候","","The region has a temperate climate suitable for agriculture.","這個地區有適合農業的溫帶氣候。"],["niche","針對特定小群體的;小眾的","","The company targets a niche market.","該公司針對小眾市場。"],["surge","急遽上漲;
