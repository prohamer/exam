ummy.","這家餐廳的食物很美味。"],["fresh","新鮮的","","Is the cake fresh?","蛋糕新鮮嗎?"],["lemon","檸檬","","Did you try this lemon chicken?","你試過這個檸檬雞了嗎?"],["blow up","爆炸如嚴;勃然大怒","","Our boss blew up when we were late.","我們遲到時老闆勃然大怒。"],["blow (someone) away","使(某人)驚讚;令(某人)印象深刻","","Her very kind words blew me away.","她非常親切的話讓我印象深刻。"],["blow in","突然來到","","Yuki blew in from Japan last night.","Yuki昨晚從日本突然來了。"],["blow out","吹熄;吹滅;(被)吹滅;大獲全勝","","Our team blew out all the other teams.","我們的隊伍大勝所有其他隊伍。"],["blow over","(暴雨)過去;平息;平復","","Don't worry. The problem will blow over.","別擔心。問題會過去的。"],["scared","害怕的;恐懼的","","The children are scared of the big dog.","孩子們害怕那隻大狗。"],["bug","小蟲子","","Not very many people like bugs.","不是很多人喜歡蟲子。"],["leaf","葉子","","Many leaves fell from the tree.","許多葉子從樹上掉下來。"],["beetle","甲蟲","","Beetles are beautiful insects.","甲蟲是美麗的昆蟲。"],["besides","除...之外","","Besides sports, she enjoys music.","除了運動,她還喜歡音樂。"],["wonderful","奇妙的;極好的;了不起的","","You can go? That's wonderful news!","你可以去?那真是好消息!"],["part","部分;局部","","I only like part of the book.","我只喜歡這本書的一部分。"],["grow","(植物)生長","","Many plants are growing in my garden.","我的花園裡有很多植物在生長。"],["bloom","開花","","All the flowers are blooming now.","所有的花現在都在開放。"],["rose","玫瑰","","Her husband gave her roses.","她丈夫送她玫瑰花。"],["stop in","順便拜訪","","Stop in for coffee sometime.","有空順便來喝咖啡。"],["suppose","認為;想(表示勉強)","","I suppose you can come.","我想你可以來。"],["look forward to","期待;盼望","","Bob is looking forward to his vacation.","Bob期待著他的假期。"],["cheerful","高興的;興高采烈的;情緒好的","","Maria is always happy and cheerful.","Maria總是快樂又開朗。"],["true","真的;真實的","","Is the story about the dog true?","關於那隻狗的故事是真的嗎?"]],"3月空英":[["單字","字義","圖片","例句","句義"],["receiver","接受者","","The receiver of the package took it inside before it started raining.","包裹的接收者在開始下雨前把它拿進去了。"],["neighborhood","社區","","Our neighborhood has a community garden where everyone grows vegetables and flowers.","我們社區有一個社區花園,每個人都種蔬菜和花。"],["engage","從事;參與","","The teacher engaged in several activities with her students to keep them interested in learning.","老師與學生進行了幾項活動,讓他們對學習保持興趣。"],["sincere","真誠的","","She gave a sincere apology for being late to the chats.","她為聊天遲到真誠地道歉。"],["shallow","膚淺的","","People who are only interested in how someone looks are usually quite shallow.","只對某人外表感興趣的人通常很膚淺。"],["connected","有連結的;有聯繫的","","After moving away, Miriam stayed connected with Paula through phone calls and video chats.","搬走後,Miriam透過電話和視訊聊天與Paula保持聯繫。"],["contemporary","當代的;現代的","","She likes contemporary music more than classical.","她喜歡當代音樂勝過古典音樂。"],["cathedral","大教堂","","We listened to organ music in the cathedral.","我們在大教堂裡聽管風琴音樂。"],["performer","表演者","","We enjoyed watching the performers on stage.","我們喜歡看舞台上的表演者。"],["comedy","喜劇","","The comedy show made all of us laugh.","喜劇表演讓我們都笑了。"],["district","區;區域","","It's very expensive to live in the lake district.","住在湖區非常昂貴。"],["tin","錫製的","","Put all the tin cans in this box.","把所有錫罐都放進這個盒子裡。"],["stew","燉肉;燉菜","","Mom made a delicious beef stew for dinner.","媽媽晚餐做了美味的燉牛肉。"],["witty","風趣的;機智的","","She made many witty comments throughout the evening.","她整個晚上發表了許多機智的評論。"],["atmosphere","氣圍;氣氛","","I love the casual atmosphere of this restaurant.","我喜歡這家餐廳輕鬆的氛圍。"],["simplify","使簡化","","Since this project is complicated, I'd like to simplify it into a number of smaller tasks.","由於這個專案很複雜,我想把它簡化成幾個較小的任務。"],["framework","框架;架構","","Computer programmers use this framework to connect different online tools.","電腦程式設計師使用這個框架連接不同的線上工具。"],["representative","代表...的","","The idea is representative of the latest trends in our business.","這個想法代表了我們行業的最新趨勢。"],["milestone","里程碑","","Sandra's promotion marks a major milestone in the development of our community.","Sandra的晉升標誌著我們社區發展的重要里程碑。"],["inventory","存貨","","We need to check our inventory every day to make sure we have enough supplies.","我們需要每天檢查庫存以確保有足夠的供應品。"],["institution","機構","","The banks and other financial institutions only on interest rates to make money.","銀行和其他金融機構只靠利率賺錢。"],["reminder","提醒","","My phone sends me reminders about upcoming appointments.","我的手機會提醒我即將到來的約會。"],["errand","跑腿;差事","","I need to finish a few quick errands before I go to class today.","我今天上課前需要完成一些簡單的差事。"],["diversity","多樣性;多樣化","","This city is known for its cultural diversity because it attracts immigrants from all over the world.","這個城市以文化多樣性聞名,因為它吸引了來自世界各地的移民。"],["exposure","接觸;曝露","","Exposure to people with different beliefs can help you learn to evaluate reasons for different views.","接觸持不同信念的人可以幫助你學會評估不同觀點的原因。"],["immigrant","移民","","In New York City, the immigrants from Italy all live in the same neighborhood.","在紐約市,來自義大利的移民都住在同一個社區。"],["blend","交融;混合","","The ingredients blend together to make this dish interesting and delicious.","這些食材混合在一起使這道菜既有趣又美味。"],["behavior","行為;舉止","","The children's good behavior shows that their parents taught them well.","孩子們良好的行為表明他們的父母教育得很好。"],["tension","緊張關係;張力","","There is some tension in his relationship with his parents because they don't approve of his career.","他與父母的關係有些緊張,因為他們不認同他的職業。"],["interact","互動;交流","","It's good for children to practice interacting with new people regularly.","孩子們定期練習與新朋友互動是很好的。"],["humility","謙遜;謙遜","","He showed humility by admitting that he was wrong.","他承認自己錯了,表現出謙遜。"],["tunnel","隧道","","We drove through a long tunnel when we were in Switzerland.","我們在瑞士時開車穿過一條長隧道。"],["thus","因此;從而","","It rained all night. Thus, the ground was wet in the morning.","下了整夜的雨。因此,早上地面是濕的。"],["dodge","躲閃;避開","","Maryann dodged Seth because she knew he wanted her to help him study for the test.","Maryann躲避Seth,因為她知道他想要她幫他準備考試。"],["relatively","相對地","","Joann felt the history test was relatively easy.","Joann覺得歷史考試相對容易。"],["violence","暴力","","There is so much violence on TV that we hardly ever watch it anymore.","電視上有太多暴力,我們幾乎不再看了。"],["intend","打算;計畫","","Pennie intended to invite Eve to her party, but she forgot.","Pennie打算邀請Eve參加她的派對,但她忘了。"],["guideline","指導準則","","The teacher reviewed the guidelines before his students began the project.","老師在學生開始專案前審查了指導方針。"],["mortality","死亡率","","The new health care measures have already reduced the rate of mortality by 5 percent.","新的醫療保健措施已經將死亡率降低了5%。"],["particle","顆粒;微粒","","He used water to wash out the particle of dust in his eye.","他用水沖洗掉眼睛裡的灰塵顆粒。"],["chronic","慢性的;長期的","","Going on daily walks can help relieve chronic back pain.","每天散步可以幫助緩解慢性背痛。"],["awareness","意識;覺認","","Social media is a powerful tool for raising awareness about human rights issues.","社交媒體是提高人權問題意識的強大工具。"],["utilize","使用;利用","","The teacher asked me to utilize his French-speaking skills daily.","老師要求我每天運用他的法語技能。"],["purify","淨化","","The local environmental group worked to purify the polluted river.","當地環保組織致力於淨化受污染的河流。"],["safeguard","保衛;護護","","By changing your password regularly, you can safeguard your online accounts.","通過定期更改密碼,你可以保護你的線上帳戶。"],["straw","草編的","","I bought a cute straw bag at the night market last week.","我上週在夜市買了一個可愛的草編包。"],["circulation","流通","","A Chinese version and an English version of the newspaper are now in circulation.","中文版和英文版的報紙現在都在流通。"],["magical","魔法的;神奇的","","The restaurant on the river, with its brightly-colored lights, has a magical appearance.","河邊的餐廳有明亮多彩的燈光,呈現出神奇的外觀。"],["crew","船員;機組人員","","The crew on my last flight was very helpful.","我上次航班上的機組人員非常有幫助。"],["imagination","想像力","","The children used their imagination to build a house out of boxes.","孩子們用想像力用盒子建了一間房子。"],["significant","重要的;重大的","","The typhoon caused significant damage to the mountain areas.","颱風對山區造成了重大破壞。"],["locker","置物櫃","","Aria put her bookbag in her locker when she got to school.","Aria到學校時把書包放進置物櫃。"],["confession","告解;坦白","","The art thief made a full confession when he was caught with a stolen painting.","藝術竊賊在被抓到偷畫時全部坦白了。"],["dangle","懸掛;垂下","","She had two large silver earrings dangling from her ears.","她耳朵上掛著兩個大銀耳環。"],["grim","嚴厲的;凄慘的","","The teacher looked grim when she found out the two girls had been cheating.","當老師發現兩個女孩一直 y because I was late.","他生氣是因為我遲到了。"],["sea","海","","He lives across the sea.","他住在海的另一邊。"],["ship","船","","There are 500 people on the ship.","船上有500人。"],["wave","浪;波浪","","The ocean waves are very big!","海浪很大!"],["fashion","時尚","","Claire is really into fashion.","Claire真的很喜歡時尚。"],["window","窗戶","","He looked out the window at the snow.","他透過窗戶看外面的雪。"],["world","世界","","Sam wants to travel the world.","Sam想環遊世界。"],["among","在...之間","","They walked among the trees in the park.","他們在公園的樹林間散步。"],["artist","藝術家","","This artist paints colorful pictures.","這位藝術家畫色彩豐富的畫。"],["chat","聊天","","Let's have coffee and chat soon.","我們找時間喝咖啡聊天吧。"],["afford","負擔得起","","I can't afford to eat out often.","我負擔不起經常外食。"],["rather","而不是","","Let's stay home rather than go out.","我們待在家裡而不要出去。"],["serve","提供;供應","","What are they serving for dinner?","他們晚餐提供什麼?"],["all year round","一年到頭","","These stores are open all year round.","這些商店全年開放。"],["chocolate","巧克力","","My whole family loves chocolate.","我全家人都喜歡巧克力。"],["treat","點心","","Ice cream is my favorite summer treat.","冰淇淋是我最喜歡的夏日點心。"],["bitter","苦的","","This drink is very bitter!","這飲料很苦!"],["nut","堅果","","Do you want some nuts for a snack?","你想要一些堅果當點心嗎?"],["bar","條狀物","","You can use this bar of soap.","你可以用這塊肥皂。"],["plain","不複雜的;簡單的","","He likes plain bread.","他喜歡原味麵包。"],["yum","好吃","","Yum! I can't wait to try your dish.","好吃!我等不及要試你的菜了。"],["slice","薄片","","Jim ate three slices of pie.","Jim吃了三片派。"],["kitchen","廚房","","Mom is cooking in the kitchen.","媽媽在廚房做飯。"],["perhaps","或許;可能","","Perhaps they'll come tomorrow.","他們或許明天會來。"],["manager","經理","","Rick is the manager of a toy store.","Rick是玩具店的經理。"],["progress","進展;進步","","She made good progress on her report.","她的報告有很好的進展。"],["arm","手臂","","She lifted the box with both arms.","她用雙手舉起箱子。"],["do (one's) part","盡本分;盡職責","","Everyone should do their part on a team.","每個人都應該在團隊中盡自己的本分。"],["fair","公平的","","Everyone got a fair chance to speak.","每個人都有公平的機會發言。"],["happen","發生","","What 有用。"],["glove","手套","","She's wearing gloves because it's cold.","她戴手套因為天氣冷。"],["burn","(使)燃燒;(使)燙傷","","The hot water burned my skin.","熱水燙傷了我的皮膚。"],["oil","油;油類","","She cooked the eggs in oil.","她用油煎蛋。"],["pour","倒;注","","The girl poured juice into the glasses.","女孩把果汁倒進杯子裡。"]],"2月空英":[["單字","字義","圖片","例句","句義"],["anxiety","焦慮;不安","","Her anxiety kept her awake the night before the interview.","面試前一晚,她的焦慮讓她無法入睡。"],["misunderstood","被誤解的","","The movie explores the struggles of a deeply misunderstood man.","這部電影探討了一個被深深誤解的男人的掙扎。"],["ancestor","祖先","","Our ancestors relied on fire to survive the long, cold winters.","我們的祖先依靠火來度過漫長寒冷的冬天。"],["overwhelm","壓倒;使難以承受","","Her endless emails are overwhelming my focus today.","她沒完沒了的郵件今天壓倒了我的專注力。"],["crush","壓榨;擠壓","","Fear can easily crush your dreams if you let it.","如果你讓恐懼控制,它很容易粉碎你的夢想。"],["reframe","重新建構;重新框架","","She learned to reframe failure as a chance to grow.","她學會將失敗重新定義為成長的機會。"],["invest","投入;耗費","","He decided to invest more time in his friendships.","他決定在友誼上投入更多時間。"],["confess","坦白;承認","","She had to confess that being shy made it hard for her to speak in public.","她不得不承認害羞讓她很難在公開場合發言。"],["transform","轉化;改變","","Exercise can transform stress into positive energy.","運動可以將壓力轉化為正能量。"],["surpass","超越;勝過","","This athlete's skill surpasses even the best players of previous years.","這位運動員的技能超越了往年最優秀的選手。"],["emit","發出;射出","","The smoke detector emits a high-pitched noise when smoke is present.","當有煙霧時,煙霧偵測器會發出高音。"],["precision","精確(性);準確(性)","","When arguing for your view, it is important to define your terms with precision.","在論證你的觀點時,精確定義你的術語很重要。"],["presumably","據推測","","The police found a weapon, which presumably was used in the crime.","警方發現了一件武器,據推測是用於犯罪的。"],["generate","產生","","A variety of power sources can be used to generate electricity.","可以使用各種電源來發電。"],["weird","怪異的","","Some kids call him weird, but he is proud of his unique style.","有些孩子說他很怪,但他為自己獨特的風格感到驕傲。"],["foul","惡臭的","","The foul smell in the refrigerator indicates that some of the food is rotten.","冰箱裡的臭味表明有些食物腐爛了。"],["thaw","解凍;融化","","I moved the frozen meat to the refrigerator so it could thaw.","我把冷凍肉移到冰箱讓它解凍。"],["athlete","運動員","","Flynn has many talented athletes in his family who all enjoy playing basketball.","Flynn家裡有許多有才華的運動員,都喜歡打籃球。"],["site","地點;地點","","The company's international offices are located at several different sites.","該公司的國際辦公室位於幾個不同的地點。"],["urban","都市的","","Kyle was born to live in an urban setting, but her husband prefers a rural area.","Kyle天生適合住在城市,但她丈夫更喜歡農村地區。"],["temporary","臨時的;暫時的","","Our team has come up with a temporary solution to the problem.","我們的團隊為這個問題想出了臨時解決方案。"],["competitor","參賽者;競爭者","","Last week's singing contest had many talented competitors.","上週的歌唱比賽有許多才華橫溢的參賽者。"],["compete","競爭","","The skier will compete in the next event to break her own record.","這位滑雪運動員將參加下一場比賽以打破自己的紀錄。"],["option","選項;選擇","","The two options we had to choose from for dinner were steak and fish.","我們晚餐可以選擇的兩個選項是牛排和魚。"],["towering","高聳的","","The tourists noticed the towering building in the middle of the city.","遊客們注意到市中心那座高聳的建築。"],["fort","堡壘;堡寨","","The soldiers built a fort to live in during the winter.","士兵們建造了一座堡壘在冬天居住。"],["architecture","建築","","European visitors spend a lot of time looking at the architecture of older buildings in various cities.","歐洲遊客花很多時間欣賞各個城市的老建築。"],["prosperity","繁榮;昌盛","","The future prosperity of the company depends on what is decided in today's meeting.","公司未來的繁榮取決於今天會議的決定。"],["plunge","跳入;落下","","The boys took a quick plunge into the lake before they had to go home.","男孩們在回家前快速跳入湖中。"],["permanent","永久的","","The damage done to the car isn't permanent and can be easily fixed.","車子的損壞不是永久的,可以輕易修復。"],["sustainable","可持續的","","The coffee growers in Brazil use sustainable methods that are good for the land.","巴西的咖啡種植者使用對土地有益的可持續方法。"],["rush","向...衝刺","","Chad rushed into his office to answer the phone.","Chad衝進辦公室接電話。"],["routine","例行公事","","Part of my morning othly","流暢地","","Marigold danced smoothly across the stage.","Marigold在舞台上流暢地跳舞。"],["technique","技巧;技術","","She learned a new painting technique in art class today.","她今天在美術課上學到了新的繪畫技巧。"],["ledge","壁架;懸崖","","You can't walk on that narrow ledge!","你不能走在那個狹窄的壁架上!"],["extreme","極端的","","Skydiving is an extreme activity that not everyone wants to try.","跳傘是一項極限運動,不是每個人都想嘗試。"],["navy","海軍","","All those sailors are in the navy.","所有那些水手都在海軍服役。"],["advertiser","廣告商","","Many retailers runs on ads during the Super Bowl football championship.","許多零售商在超級盃橄欖球錦標賽期間投放廣告。"],["tempt","誘惑;引誘","","Please remove that chocolate before I am tempted to eat it all.","請在我忍不住全部吃掉之前把那巧克力拿走。"],["naive","天真的","","She had the naive belief that wealth would bring her happiness.","她天真地相信財富會帶給她幸福。"],["innovative","創新的;新穎的","","The teacher's innovative teaching methods made learning fun for the students.","老師創新的教學方法讓學生學習變得有趣。"],["endorsement","名人代言;支持","","The company received endorsements from several celebrities.","該公司獲得了幾位名人的代言。"],["impulse","衝動的","","She regretted buying the shirt, realizing that it had been an impulse buy.","她後悔買了那件襯衫,意識到那是衝動購買。"],["intervention","干預;介入","","Without intervention, this stream will become too polluted.","如果不介入,這條溪流會變得太污染。"],["dictate","決定;影響","","As the oldest of the children, she often dictated what games they played.","作為孩子中最大的,她經常決定他們玩什麼遊戲。"],["competitive","具競爭力的;好勝的","","Kayleigh is competitive in sports, while her sister is more laid-back in contests.","Kayleigh在運動中很有競爭力,而她妹妹在比賽中比較隨和。"],["athletic","擅長運動的","","From an early age, Brad displayed strong athletic abilities.","Brad從小就展現出強大的運動能力。"],["resort","度假村","","Next fall, we have plans to stay at a beautiful mountain resort.","明年秋天,我們計劃住在一個美麗的山區度假村。"],["triumph","勝利;巨大成功","","The basketball team celebrated its triumph with a team party.","籃球隊用團隊派對慶祝勝利。"],["inspire","激勵;啟發","","The piano concert that Allie attended inspired her to increase her daily piano practice.","Allie參加的鋼琴音樂會激勵她增加每日的鋼琴練習。"],["ackno g her heels in and refused to compromise.","她堅持己見,拒絕妥協。"],["traverse","跨越;穿過;橫越","","They traversed the mountain range on foot.","他們徒步穿越山脈。"],["just another (something/somebody/something or v)","(對其光榮事物的)尋常;無奇","","To him, it was just another day at work.","對他來說,這只是平常的一個工作日。"],["enervating","使疲力的;令人疲累的","","The heat was enervating.","炎熱讓人疲憊不堪。"],["harrowing","使慘的;令人痛苦的","","She recounted her harrowing experience.","她敘述了她痛苦的經歷。"],["garner","獲得;得到","","The film garnered critical acclaim.","這部電影獲得了好評。"],["rebate","(稅金)退款;返款","","Customers can claim a rebate on this purchase.","顧客可以就這次購買申請退款。"],["court","奉承;討好;爭取...的青睞","","Politicians court voters before elections.","政治人物在選舉前爭取選民支持。"],["stiffen","加強;變得更嚴肅","","His resolve stiffened after hearing the news.","聽到消息後,他的決心更加堅定。"],["butler","男管家","","The butler served dinner to the guests.","管家為客人上菜。"],["logistical","後勤的;物流的","","They faced many logistical challenges.","他們面臨許多後勤挑戰。"],["premiere","首映","","The movie will premiere at the film festival.","這部電影將在電影節首映。"],["be out of touch","不清醒對;不了解最新訊息","","He is out of touch with current trends.","他與當前潮流脫節。"],["fault","斷層;裂縫","","The earthquake occurred along a fault line.","地震發生在斷層線上。"],["aftershock","餘震;後續影響","","Several aftershocks followed the main earthquake.","主震之後發生了幾次餘震。"],["obsolete","過時的;淘汰的","","The technology has become obsolete.","這項技術已經過時了。"],["upheaval","劇變;劇變","","The country went through political upheaval.","這個國家經歷了政治劇變。"],["cognition","認知;認識","","The study focuses on human cognition.","這項研究專注於人類認知。"],["scenic","風景優美的;景色秀麗的","","They took the scenic route through the mountains.","他們走風景優美的山路。"],["transplant","移居者;移植者","","Many transplants have moved to the city.","許多移居者搬到了這個城市。"],["influx","大批湧入;大量流入","","There was a sudden influx of tourists.","遊客突然大量湧入。"],["tram","(市區街道上的)有軌電車","","We took the tram to the city center.","我們搭電車到市中心。"],["squeal","發出尖叫聲的聲響","","The children squealed with delight.","孩子們高興地尖叫。"],["cathedral","大教堂;主教座堂","","The cathedral is a magnificent building.","這座大教堂是一座宏偉的建築。"],["reminisce","懷舊往事;回憶","","They reminisced about their school days.","他們回憶起學生時代。"],["proprietor","業主;老闆","","The proprietor welcomed us warmly.","老闆熱情地歡迎我們。"],["celestial","天空的;天上的","","We observed celestial bodies through the telescope.","我們透過望遠鏡觀察天體。"],["appropriation","挪為己有;撥用;私佔","","The appropriation of funds was controversial.","資金撥用引起爭議。"],["wiggle room","迴旋空間;轉圜餘地","","There is little wiggle room in the budget.","預算沒有什麼迴旋空間。"],["unilateral","單方的;單邊的","","The country took unilateral action.","這個國家採取了單方面行動。"],["buffer","緩衝(人或物)","","The buffer zone separates the two areas.","緩衝區隔開了兩個區域。"],["the intervening years/months/period, etc.","(兩事件)其間的數年","","Much had changed in the intervening years.","在這期間的幾年裡發生了很多變化。"],["protocol","國際禮儀;公約","","Diplomats must follow proper protocol.","外交官必須遵守適當的禮儀。"],["template","範本;模板","","Use this document as a template.","使用這份文件作為範本。"],["empathy","同理;同理心","","She showed great empathy for others.","她對他人表現出極大的同理心。"],["skepticism","懷疑主義","","His claims were met with skepticism.","他的說法受到質疑。"],["millennium","千年","","We celebrated the new millennium in 2000.","我們在2000年慶祝新千年。"],["experiential","體驗的;來自經驗的","","The program offers experiential learning.","這個計劃提供體驗式學習。"],["distressed","苦惱的;焦慮的","","She was distressed by the news.","她為這個消息感到苦惱。"],["simulation","模擬;模仿","","The flight simulator provides realistic training.","飛行模擬器提供真實的訓練。"],["at stake","有風險;處於危急關頭","","Our reputation is at stake.","我們的聲譽岌岌可危。"],["propitious","吉利的;有利的;適合的","","The conditions were propitious for success.","條件有利於成功。"],["hunch","弓著身子;彎腰","","He hunched over his desk.","他弓著背趴在桌上。"],["harassment","騷擾","","The company has a zero-tolerance policy on harassment.","公司對騷擾採取零容忍政策。"],["ironic","諷刺的;令人啼笑皆非的","","It's ironic that he failed his own test.","他在自己的測驗中失敗真是諷刺。"],["hybrid","混合種;雜交品種","","This car is a hybrid of electric and gas power.","這輛車是電力和汽油的混合動力車。"],["captive","被俘的;受監禁的","","The captive animals were released into the wild.","被囚禁的動物被放歸野外。"],["robust","強壯的;強健的","","The economy showed robust growth.","經濟顯示出強勁增長。"],["hospitable","(環境)適合生長的;適宜的","","The climate is hospitable to plant growth.","這種氣候適合植物生長。"]]};
   let questions = allSheetData[Object.keys(allSheetData)[0]];
   let currentQuestions = [];
   let currentIndex = 0;
   let correctCount = 0;
   let wrongCount = 0;
   let timeLeft = 0;
   let timer;
   let fontSize = 20;
   let wrongAnswers = [];
   let startTime;
   let canProceed = false;
   let endTime; // 新增變數記錄結束時間
   let quizRangeText = ''; // 新增：記錄測驗範圍文字
   
   function init() {
	  const sheetSelect = document.getElementById('sheetSelect');
	  ["11月大英","11月空英","11月Advanced","10月大英","10月空英","10月Advanced","9月大英","9月空英","9月Advanced","8月大英","8月空英","8月Advanced","7月大英","7月空英","7月Advanced","6月大英","6月空英","6月Advanced","5月大英","5月空英","5月Advanced","4月大英","4月空英","4月Advanced","3月大英","3月空英","3月Advanced","2月大英","2月空英","2月Advanced"].forEach(name => {
		const option = document.createElement('option');
		option.value = option.text = name;
		sheetSelect.add(option);
	  });
	  
	  sheetSelect.value = Object.keys(allSheetData)[0];
		questions = allSheetData[sheetSelect.value];
		document.getElementById('startRow').value = 1;
		// 扣除標題列
		document.getElementById('endRow').value = questions.length - 1;
		
		sheetSelect.addEventListener('change', function() {
			questions = allSheetData[this.value];
			document.getElementById('endRow').value = questions.length - 1;
		});
	}
   
   function startQuiz() {
    const timeLimit = document.getElementById('timeSelect').value * 60;
    const startRow = parseInt(document.getElementById('startRow').value);
    const endRow = parseInt(document.getElementById('endRow').value);
    
    if (isNaN(startRow) || isNaN(endRow) || startRow > endRow || endRow > questions.length) {
      alert('請輸入有效的題目範圍');
      return;
    }
    
    currentQuestions = prepareQuestions(startRow-1, endRow-1);

    // 讀取隨機題數（可留空）。因為 prepareQuestions 已經打亂順序，
    // 取前 N 筆即等於隨機抽 N 題
    const randomCount = parseInt(document.getElementById('randomCount').value);
    if (!isNaN(randomCount) && randomCount > 0) {
      currentQuestions = currentQuestions.slice(0, randomCount);
      quizRangeText = '隨機 ' + currentQuestions.length + ' 題（取自第 ' + startRow + '～' + endRow + ' 題）';
    } else {
      quizRangeText = '第 ' + startRow + '～' + endRow + ' 題';
    }

    if (currentQuestions.length === 0) {
      alert('無法取得題目');
      return;
    }
    
    currentIndex = 0;
    correctCount = wrongCount = 0;
    wrongAnswers = [];
    startTime = new Date();
    endTime = new Date(startTime.getTime() + timeLimit * 1000);
    canProceed = false;
    
    document.getElementById('setup').classList.add('hidden');
    document.getElementById('quiz').classList.remove('hidden');
    document.getElementById('result').classList.add('hidden');
    document.getElementById('feedback').innerHTML = '';
    document.getElementById('nextBtn').disabled = true;
    
    updateTimer();
    timer = setInterval(updateTimer, 1000);
    
    showQuestion();
  }
   
   function updateTimer() {
	  const now = new Date();
	  const remainingTime = Math.floor((endTime - now) / 1000);
	  
	  if (remainingTime <= 0) {
		endQuiz();
		return;
	  }
	  
	  const minutes = Math.floor(remainingTime / 60);
	  const seconds = remainingTime % 60;
	  document.getElementById('timer').textContent = 
		'剩餘時間: ' + minutes + ':' + String(seconds).padStart(2, '0');
	}
   
   function prepareQuestions(start, end) {
    // 確保排除標題列
		const startIndex = start + 1;  // +1 是因為要從第二列開始
		const endIndex = end + 2;      // +2 是因為要包含結束列，且 slice 是 exclusive
		const rangeQuestions = questions.slice(startIndex, endIndex);
		return rangeQuestions.sort(() => Math.random() - 0.5);
	}
   
   function adjustFontSize(change) {
	  fontSize = Math.max(14, Math.min(24, fontSize + change));

	  // 調整問題文字大小
	  const questionText = document.getElementById('questionText');
	  if (questionText) {
		questionText.style.fontSize = (fontSize + 4) + 'px';
	  }

	  // 調整所有選項文字大小
	  const options = document.getElementsByClassName('option');
	  for (let option of options) {
		option.style.fontSize = (fontSize + 2) + 'px';
	  }

	  // 調整其他元素
	  const timer = document.getElementById('timer');
	  if (timer) {
		timer.style.fontSize = (fontSize + 2) + 'px';
	  }

	  const progress = document.getElementById('progress');
	  if (progress) {
		progress.style.fontSize = fontSize + 'px';
	  }

	  // 調整工作表名稱
	  const sheetTitle = document.getElementById('sheetTitle');
	  if (sheetTitle) {
		sheetTitle.style.fontSize = fontSize + 'px';
	  }

	  // 調整答案回饋
	  const feedback = document.getElementById('feedback');
	  if (feedback) {
		feedback.style.fontSize = fontSize + 'px';
	  }
	}
   
   function showQuestion() {
    if (currentIndex >= currentQuestions.length) {
      endQuiz();
      return;
    }

    const question = currentQuestions[currentIndex];
    document.getElementById('questionText').innerHTML = 
      '<span style="color: #0066CC;">Which is：</span>' + question[1]; // 改用 question[1] (B欄)
    document.getElementById('sheetTitle').textContent = document.getElementById('sheetSelect').value;

	 const correctAnswer = question[0];// 改用 question[0] (A欄)
	 const explanation = question[2] || '';
	 
	 // 修改這部分，從第二列開始抓取答案選項
    let wrongOptions = questions
      .slice(1)  // 從第二列開始
      .filter(q => q[0] !== correctAnswer && q[0])  // 過濾掉正確答案和空值
      .map(q => q[0])  
      .sort(() => Math.random() - 0.5)
      .slice(0, 3);
	 
	 const options = [correctAnswer, ...wrongOptions].sort(() => Math.random() - 0.5);
	 
	 const optionsContainer = document.getElementById('options');
	 optionsContainer.innerHTML = '';
	 options.forEach((option, index) => {
	   const div = document.createElement('div');
	   div.className = 'option';
	   div.textContent = option;
	   div.onclick = () => checkAnswer(option, correctAnswer, explanation);
	   optionsContainer.appendChild(div);
	 });
	 
	 document.getElementById('progress').textContent = 
	   (currentIndex + 1) + '/' + currentQuestions.length + '題 | 答對:' + correctCount + ' | 答錯:' + wrongCount;
	 
	 document.getElementById('feedback').innerHTML = '';
	 document.getElementById('nextBtn').disabled = true;
	 canProceed = false;
	}
   
   function checkAnswer(selected, correct, explanation) {
     if (canProceed) return;
     
     const isCorrect = selected === correct;
     if (isCorrect) {
       correctCount++;
     } else {
       wrongCount++;
       wrongAnswers.push({
         question: currentQuestions[currentIndex][1],// 改用 [1] (B欄)
         selected: selected,
         correct: correct,
         explanation: explanation
       });
     }
     
     document.getElementById('feedback').innerHTML = 
       '<div class="' + (isCorrect ? 'correct' : 'incorrect') + '">' +
       (isCorrect ? '答對了！' : '答錯了！') +
       '<br>正確答案：' + correct +
       (explanation ? '<br>解釋：' + explanation : '') +
       '</div>';
     
     document.getElementById('nextBtn').disabled = false;
     canProceed = true;
     
     document.getElementById('progress').textContent = 
       '題目 ' + (currentIndex + 1) + '/' + currentQuestions.length + ' | 答對: ' + correctCount + ' | 答錯: ' + wrongCount;
   }
   
   function nextQuestion() {
     if (!canProceed) return;
     currentIndex++;
     showQuestion();
   }
   
   
   function endQuiz() {
    clearInterval(timer);
    const endTime = new Date();
    const duration = Math.floor((endTime - startTime) / 1000);
    
    // 計算答對率百分比
    const finalScore = Math.round((correctCount / currentQuestions.length) * 100) || 0;
    
    document.getElementById('quiz').classList.add('hidden');
    document.getElementById('result').classList.remove('hidden');
    
    let resultHTML = 
        '<h2>' + document.getElementById('sheetSelect').value + ' 測驗結果</h2>' +
        '<p>測驗日期時間: ' + endTime.toLocaleString() + '</p>' +
        '<p>測驗範圍: ' + quizRangeText + '</p>' +
        '<p>測驗時間: ' + Math.floor(duration/60) + '分' + duration%60 + '秒</p>' +
        '<p>總題數: ' + currentQuestions.length + '</p>' +
        '<p>答對題數: ' + correctCount + '</p>' +
        '<p>答錯題數: ' + wrongCount + '</p>' +
        '<p>得分: ' + finalScore + ' 分</p>';  // 顯示百分比分數
     
     if (wrongAnswers.length > 0) {
       resultHTML += '<h3>答錯題目回顧：</h3>';
		  wrongAnswers.forEach((item, index) => {
			resultHTML += 
			  '<div class="review-item">' +
			  '<p class="review-question">題目 ' + (index + 1) + ': ' + item.question + '</p>' +
			  '<p class="review-wrong">您的答案: ' + item.selected + '</p>' +
			  '<p class="review-correct">正確答案: ' + item.correct + '</p>' +
			  (item.explanation ? '<p class="review-explanation">解釋: ' + item.explanation + '</p>' : '') +
			  '</div>';
		  });
     }
     
     document.getElementById('result').innerHTML = resultHTML;
   }
   
   function adjustFontSize(change) {
     fontSize = Math.max(14, Math.min(24, fontSize + change));
     document.body.style.fontSize = fontSize + 'px';
   }
 </script>
</head>
<body onload="init()">
 <div id="quizContainer">
   <div id="setup">
     <h1>大英單字測驗</h1>
     <div class="control-panel">
       <label>選擇測驗範圍：</label>
       <select id="sheetSelect"></select>
     </div>
     <div class="control-panel">
       <label>起始題號：</label>
       <input type="number" id="startRow" min="1">
       <label>結束題號：</label>
	   <input type="number" id="endRow" min="1">
     </div>
     <div class="control-panel">
       <label>隨機題數：</label>
       <input type="number" id="randomCount" min="1" placeholder="留空＝依範圍出題">
     </div>
     <div class="control-panel">
       <label>測驗時間：</label>
       <select id="timeSelect">
         <option value="5">5分鐘</option>
         <option value="10">10分鐘</option>
		 <option value="15">15分鐘</option>
       </select>
     </div>
     <div class="control-panel">
       <label>字體大小：</label>
       <button onclick="adjustFontSize(-2)">A-</button>
       <button onclick="adjustFontSize(2)">A+</button>
     </div>
     <button onclick="startQuiz()">開始測驗</button>
   </div>
   
   <div id="quiz" class="hidden">
    <div class="status-bar">
	  <div class="status-item sheet-name" id="sheetTitle"></div>
	  <div class="status-item timer" id="timer"></div>
	  <div class="status-item progress" id="progress"></div>
	  <div class="font-controls">
		<button onclick="adjustFontSize(-2)">A-</button>
		<button onclick="adjustFontSize(2)">A+</button>
	  </div>
	</div>
    
    <div id="questionText"></div>
    <div id="options"></div>
    <div id="feedback"></div>
    <button id="nextBtn" onclick="nextQuestion()" class="next-btn" disabled>下一題</button>
  </div>
  
  <div id="result" class="hidden"></div>
</div>
</body>
</html>
