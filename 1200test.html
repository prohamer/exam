  <style>
body {
  font-family: 'Noto Sans TC', Arial, sans-serif;
  margin: 10px;
  background-color: #f0f0f0;
  color: #2c3e50;
  font-weight: bold;
  font-size: 18px;
}
.hidden { display: none; }
#quizContainer {
  max-width: 800px;
  margin: 0 auto;
  background-color: white;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.1);
}
.option {
  display: block;
  width: 80%;
  max-width: 500px;
  padding: 8px;
  margin: 10px auto;
  background-color: #3498db;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
  transition: all 0.3s ease;
  text-align: center;
}
.option:hover {
  background-color: #2980b9;
  transform: translateY(-1px);
}
.result {
  margin: 15px 0;
  padding: 15px;
  border-radius: 8px;
  background-color: #f8f9fa;
  text-align: center;
}
.control-panel {
  margin-bottom: 15px;
  padding: 15px;
  background-color: #f8f9fa;
  border-radius: 8px;
}
.next-btn {
  display: block;
  width: 80%;
  max-width: 300px;
  margin: 15px auto;
  padding: 12px;
  background-color: #2ecc71;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
}
.next-btn:disabled {
  background-color: #bdbdbd;
  cursor: not-allowed;
}
.feedback {
  margin: 10px 0;
  padding: 12px;
  border-radius: 8px;
  text-align: center;
}
.correct {
  background-color: #FFFFFF;
  color: green;
  font-weight: bold;
}
.incorrect {
  background-color: #FFDC35;
  color: red;
  font-weight: bold;
}
.status-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #f0f7ff;
  padding: 8px 12px;
  margin-bottom: 12px;
  border-radius: 8px;
  gap: 8px;
}
.status-item {
  padding: 4px 8px;
  border-radius: 4px;
  font-weight: bold;
  white-space: nowrap;
}
.sheet-name {
  color: #1565c0;
  background-color: #e3f2fd;
  flex-grow: 0;
}
.timer {
  color: #e53935;
  background-color: #ffebee;
}
.progress {
  color: #2e7d32;
  background-color: #e8f5e9;
}
.font-controls {
  display: flex;
  gap: 4px;
  margin-left: auto;
}
.font-controls button {
  padding: 4px 12px;
  min-width: 36px;
  background-color: #64b5f6;
  border-radius: 4px;
}
#questionText {
  font-weight: bold;
  margin: 12px 0;
  padding: 12px;
  text-align: center;
  background-color: #f8f9fa;
  border-radius: 8px;
  color: #2c3e50;
}
button {
  padding: 8px 15px;
  background-color: #3498db;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
  margin: 0 5px;
  font-size: 14px;
}
button:hover { background-color: #2980b9; }
select, input {
  padding: 8px;
  border: 1px solid #ddd;
  border-radius: 4px;
  margin: 0 5px;
  font-size: 14px;
}
h1 {
  color: #2c3e50;
  margin: 15px 0;
  text-align: center;
  font-size: 24px;
  font-weight: bold;
}
h2 {
  color: #2c3e50;
  margin: 15px 0;
  font-size: 20px;
  font-weight: bold;
}
.result p {
  margin: 8px 0;
  color: #2c3e50;
  font-size: 16px;
  text-align: left;
}
label {
  color: #2c3e50;
  margin-right: 8px;
  font-weight: bold;
}
.review-item {
  padding: 15px;
  margin: 10px 0;
  border-radius: 8px;
  text-align: left;
}
.review-item:nth-child(odd)  { background-color: #fff3e0; }
.review-item:nth-child(even) { background-color: #e3f2fd; }
.result h2, .result h3 { text-align: center; }
.review-question, .review-explanation { color: #1a237e; font-weight: bold; }
.review-wrong    { color: #d32f2f; font-weight: bold; }
.review-correct  { color: #2e7d32; font-weight: bold; }
.control-panel label { display: inline-block; min-width: 80px; }

/* ── 自訂時間輸入 ── */
#customTimeWrapper {
  display: inline-block;
  margin-left: 6px;
}
#customTimeInput {
  width: 60px;
}

/* ── 隨機出題區塊 ── */
#randomSection { margin-top: 6px; }
#randomCountInput {
  width: 60px;
}

    let sheetNames    = ["1.人物/2.個性","3.身體/4.健康/5.稱謂/6.家庭","7.數字/8.時間","9.金錢/10.飲食","11.餐具/12.衣物飾品/13顏色/14休閒運動","15.房屋","16.學校","17.位置/18.交通","19.尺寸與測量/20.國家&地區","21.語言/22.節慶/23.職業/24.自然","25.地理名詞/26.動物與昆蟲","27.冠詞/28.代名詞/29.Wh/30.Be與助動詞","31.介系詞/32.連接詞/33.感嘆詞","34.其他名詞","35.其他動詞","36.其他形容詞","37.其他副詞","ALL"];
    let questions     = allSheetData[Object.keys(allSheetData)[0]];
    let currentQuestions = [];
    let currentIndex  = 0;
    let correctCount  = 0;
    let wrongCount    = 0;
    let timerInterval;
    let fontSize      = 20;
    let wrongAnswers  = [];
    let startTime;
    let quizEndTime;   // 計時器用的到期時間（避免與 endQuiz 內區域變數衝突）
    let canProceed    = false;

    /* ────────────────── init ────────────────── */
    function init() {
      const sheetSelect = document.getElementById('sheetSelect');
      sheetNames.forEach(name => {
        const option = document.createElement('option');
        option.value = option.text = name;
        sheetSelect.add(option);
      });

      sheetSelect.value = Object.keys(allSheetData)[0];
      questions = allSheetData[sheetSelect.value];
      updateRowRange();

      sheetSelect.addEventListener('change', function () {
        questions = allSheetData[this.value];
        updateRowRange();
      });

      // 初始化時間選單事件
      document.getElementById('timeSelect').addEventListener('change', onTimeSelectChange);
      onTimeSelectChange();

      // 初始化隨機出題事件
      document.getElementById('randomToggle').addEventListener('change', onRandomToggle);
      onRandomToggle();
    }

    function updateRowRange() {
      // 第一列為標題，題目從第 1 題（資料第 2 列，index 1）開始
      document.getElementById('startRow').value = 1;
      document.getElementById('endRow').value   = questions.length - 1;
      const maxCount = questions.length - 1;
      document.getElementById('randomCountInput').max = maxCount;
      document.getElementById('randomCountInput').value = Math.min(
        parseInt(document.getElementById('randomCountInput').value) || maxCount,
        maxCount
      );
    }

    /* ── 自訂時間 ── */
    function onTimeSelectChange() {
      const val     = document.getElementById('timeSelect').value;
      const wrapper = document.getElementById('customTimeWrapper');
      wrapper.style.display = (val === 'custom') ? 'inline-block' : 'none';
    }

    function getTimeLimitSeconds() {
      const val = document.getElementById('timeSelect').value;
      if (val === 'custom') {
        const mins = parseInt(document.getElementById('customTimeInput').value);
        if (isNaN(mins) || mins <= 0) { alert('請輸入有效的自訂時間（分鐘）'); return null; }
        return mins * 60;
      }
      return parseInt(val) * 60;
    }

    /* ── 隨機出題 ── */
    function onRandomToggle() {
      const checked = document.getElementById('randomToggle').checked;
      document.getElementById('randomSection').style.display = checked ? 'block' : 'none';
      // 固定範圍模式時，起始/結束輸入框才有意義
      document.getElementById('rangeSection').style.display = checked ? 'none' : 'block';
    }

    /* ────────────────── startQuiz ────────────────── */
    function startQuiz() {
      const timeLimit = getTimeLimitSeconds();
      if (timeLimit === null) return;

      const isRandom = document.getElementById('randomToggle').checked;
      let   prepared;

      if (isRandom) {
        const count = parseInt(document.getElementById('randomCountInput').value);
        const max   = questions.length - 1;
        if (isNaN(count) || count <= 0 || count > max) {
          alert('請輸入有效的隨機出題題數（1 ~ ' + max + '）');
          return;
        }
        prepared = prepareRandomQuestions(count);
      } else {
        const startRow = parseInt(document.getElementById('startRow').value);
        const endRow   = parseInt(document.getElementById('endRow').value);
        if (isNaN(startRow) || isNaN(endRow) || startRow > endRow || endRow > questions.length - 1) {
          alert('請輸入有效的題目範圍');
          return;
        }
        prepared = prepareQuestions(startRow - 1, endRow - 1);
      }

      if (!prepared || prepared.length === 0) { alert('無法取得題目'); return; }

      currentQuestions = prepared;
      currentIndex  = 0;
      correctCount  = 0;
      wrongCount    = 0;
      wrongAnswers  = [];
      canProceed    = false;
      startTime     = new Date();
      quizEndTime   = new Date(startTime.getTime() + timeLimit * 1000);

      document.getElementById('setup').classList.add('hidden');
      document.getElementById('quiz').classList.remove('hidden');
      document.getElementById('result').classList.add('hidden');
      document.getElementById('feedback').innerHTML = '';
      document.getElementById('nextBtn').disabled = true;

      updateTimer();
      timerInterval = setInterval(updateTimer, 1000);
      showQuestion();
    }

    /* ────────────────── 題目準備 ────────────────── */
    // 固定範圍（0-based，相對於去掉標題後的陣列）
    function prepareQuestions(start, end) {
      const startIndex = start + 1;   // +1 跳過標題列
      const endIndex   = end   + 2;   // slice 為 exclusive
      return questions.slice(startIndex, endIndex).sort(() => Math.random() - 0.5);
    }

    // 全範圍隨機抽 count 題
    function prepareRandomQuestions(count) {
      const pool = questions.slice(1).filter(q => q[0] && q[1]); // 去標題、去空列
      return pool.sort(() => Math.random() - 0.5).slice(0, count);
    }

    /* ────────────────── 計時器 ────────────────── */
    function updateTimer() {
      const remaining = Math.floor((quizEndTime - new Date()) / 1000);
      if (remaining <= 0) { endQuiz(); return; }
      const m = Math.floor(remaining / 60);
      const s = remaining % 60;
      document.getElementById('timer').textContent =
        '剩餘時間: ' + m + ':' + String(s).padStart(2, '0');
    }

    /* ────────────────── 顯示題目 ────────────────── */
    function showQuestion() {
      if (currentIndex >= currentQuestions.length) { endQuiz(); return; }

      const question      = currentQuestions[currentIndex];
      const correctAnswer = question[0];
      const questionText  = question[1];
      const explanation   = question[2] || '';

      document.getElementById('questionText').innerHTML =
        '<span style="color:#0066CC;">Which is：</span>' + questionText;
      document.getElementById('sheetTitle').textContent =
        document.getElementById('sheetSelect').value;

      // 從整個題庫（排除標題與正確答案）隨機取 3 個錯誤選項
      let wrongOptions = questions
        .slice(1)
        .filter(q => q[0] && q[0] !== correctAnswer)
        .map(q => q[0])
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);

      const options = [correctAnswer, ...wrongOptions].sort(() => Math.random() - 0.5);

      const optionsContainer = document.getElementById('options');
      optionsContainer.innerHTML = '';
      options.forEach(option => {
        const div = document.createElement('div');
        div.className = 'option';
        div.textContent = option;
        div.style.fontSize = (fontSize + 2) + 'px';   // 套用當前字體大小
        div.onclick = () => checkAnswer(option, correctAnswer, explanation);
        optionsContainer.appendChild(div);
      });

      updateProgress();
      document.getElementById('feedback').innerHTML = '';
      document.getElementById('nextBtn').disabled = true;
      canProceed = false;
    }

    function updateProgress() {
      document.getElementById('progress').textContent =
        (currentIndex + 1) + '/' + currentQuestions.length +
        '題 | 答對:' + correctCount + ' | 答錯:' + wrongCount;
    }

    /* ────────────────── 答題判斷 ────────────────── */
    function checkAnswer(selected, correct, explanation) {
      if (canProceed) return;

      const isCorrect = (selected === correct);
      if (isCorrect) { correctCount++; } else {
        wrongCount++;
        wrongAnswers.push({
          question:    currentQuestions[currentIndex][1],
          selected:    selected,
          correct:     correct,
          explanation: explanation
        });
      }

      document.getElementById('feedback').innerHTML =
        '<div class="' + (isCorrect ? 'correct' : 'incorrect') + '">' +
        (isCorrect ? '答對了！' : '答錯了！') +
        '<br>正確答案：' + correct +
        (explanation ? '<br>解釋：' + explanation : '') +
        '</div>';

      document.getElementById('nextBtn').disabled = false;
      canProceed = true;
      updateProgress();
    }

    function nextQuestion() {
      if (!canProceed) return;
      currentIndex++;
      showQuestion();
    }

    /* ────────────────── 結束測驗 ────────────────── */
    function endQuiz() {
      clearInterval(timerInterval);
      const finishTime = new Date();                              // 不再遮蔽 quizEndTime
      const duration   = Math.floor((finishTime - startTime) / 1000);
      const finalScore = Math.round((correctCount / currentQuestions.length) * 100) || 0;

      document.getElementById('quiz').classList.add('hidden');
      document.getElementById('result').classList.remove('hidden');

      let resultHTML =
        '<h2>' + document.getElementById('sheetSelect').value + ' 測驗結果</h2>' +
        '<p>測驗日期時間: ' + finishTime.toLocaleString() + '</p>' +
        '<p>測驗時間: ' + Math.floor(duration / 60) + '分' + (duration % 60) + '秒</p>' +
        '<p>總題數: '    + currentQuestions.length + '</p>' +
        '<p>答對題數: '  + correctCount + '</p>' +
        '<p>答錯題數: '  + wrongCount   + '</p>' +
        '<p>得分: '      + finalScore   + ' 分</p>';

      if (wrongAnswers.length > 0) {
        resultHTML += '<h3>答錯題目回顧：</h3>';
        wrongAnswers.forEach((item, index) => {
          resultHTML +=
            '<div class="review-item">' +
            '<p class="review-question">題目 ' + (index + 1) + ': ' + item.question + '</p>' +
            '<p class="review-wrong">您的答案: '  + item.selected    + '</p>' +
            '<p class="review-correct">正確答案: ' + item.correct    + '</p>' +
            (item.explanation ? '<p class="review-explanation">解釋: ' + item.explanation + '</p>' : '') +
            '</div>';
        });
      }

      document.getElementById('result').innerHTML = resultHTML;
    }

    /* ────────────────── 字體調整（唯一版本） ────────────────── */
    function adjustFontSize(change) {
      fontSize = Math.max(14, Math.min(28, fontSize + change));

      // 題目文字
      const questionText = document.getElementById('questionText');
      if (questionText) questionText.style.fontSize = (fontSize + 4) + 'px';

      // 選項按鈕
      const opts = document.getElementsByClassName('option');
      for (const o of opts) o.style.fontSize = (fontSize + 2) + 'px';

      // 計時器 / 進度
      const timerEl    = document.getElementById('timer');
      const progressEl = document.getElementById('progress');
      const sheetTitle = document.getElementById('sheetTitle');
      const feedback   = document.getElementById('feedback');
      if (timerEl)    timerEl.style.fontSize    = (fontSize + 2) + 'px';
      if (progressEl) progressEl.style.fontSize = fontSize + 'px';
      if (sheetTitle) sheetTitle.style.fontSize  = fontSize + 'px';
      if (feedback)   feedback.style.fontSize    = fontSize + 'px';
    }
  </script>
</head>
<body onload="init()">
  <div id="quizContainer">
    <div id="setup">
      <h1>1200單字測驗</h1>

      <!-- 工作表選擇 -->
      <div class="control-panel">
        <label>選擇測驗範圍：</label>
        <select id="sheetSelect"></select>
      </div>

      <!-- 隨機出題開關 -->
      <div class="control-panel">
        <label>
          <input type="checkbox" id="randomToggle"> 隨機出題
        </label>
        <div id="randomSection" style="display:none; margin-top:8px;">
          <label>隨機題數：</label>
          <input type="number" id="randomCountInput" min="1" value="10" style="width:60px;">
          <span id="randomCountHint" style="font-size:13px; color:#888;"></span>
        </div>
        <div id="rangeSection" style="margin-top:8px;">
          <label>起始題號：</label>
          <input type="number" id="startRow" min="1" style="width:60px;">
          <label>結束題號：</label>
          <input type="number" id="endRow"   min="1" style="width:60px;">
        </div>
      </div>

      <!-- 測驗時間 -->
      <div class="control-panel">
        <label>測驗時間：</label>
        <select id="timeSelect">
          <option value="5">5 分鐘</option>
          <option value="8">8 分鐘</option>
          <option value="10">10 分鐘</option>
          <option value="15">15 分鐘</option>
          <option value="20">20 分鐘</option>
          <option value="30">30 分鐘</option>
          <option value="custom">自訂…</option>
        </select>
        <span id="customTimeWrapper" style="display:none;">
          <input type="number" id="customTimeInput" min="1" max="120" value="12" style="width:60px;"> 分鐘
        </span>
      </div>

      <!-- 字體大小 -->
      <div class="control-panel">
        <label>字體大小：</label>
        <button onclick="adjustFontSize(-2)">A−</button>
        <button onclick="adjustFontSize(2)">A＋</button>
      </div>

      <button onclick="startQuiz()">開始測驗</button>
    </div>

    <!-- 測驗畫面 -->
    <div id="quiz" class="hidden">
      <div class="status-bar">
        <div class="status-item sheet-name" id="sheetTitle"></div>
        <div class="status-item timer"    id="timer"></div>
        <div class="status-item progress" id="progress"></div>
        <div class="font-controls">
          <button onclick="adjustFontSize(-2)">A−</button>
          <button onclick="adjustFontSize(2)">A＋</button>
        </div>
      </div>

      <div id="questionText"></div>
      <div id="options"></div>
      <div id="feedback"></div>
      <button id="nextBtn" onclick="nextQuestion()" class="next-btn" disabled>下一題</button>
    </div>

    <div id="result" class="hidden"></div>
  </div>
</body>
</html>
