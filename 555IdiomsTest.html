/* 更新結果和回顧區塊的樣式 */

}

  background-color: #fff3e0;  /* 淡黃色 */

.status-row-bottom {

.timer {

.progress {

.font-controls {

.font-controls button {

 <script>
   let allSheetData = {"A、U、W":[["單字","字義","圖片","例句","句義","音檔位置","字首"],["about to","即將、正要","","I'm about to head out; do you need anything?","我正要出門,你需要什麼嗎?","",""],["above all","尤其、最重要的是","","Above all, remember to enjoy the process.","最重要的是,記得享受過程。","",""],["according to","依照;根據","","According to the forecast, it will snow tonight.","根據預報,今晚會下雪。","",""],["to account for","說明、解釋;占(比例)","","How do you account for the missing money?","你要怎麼解釋這筆不見的錢?","",""],["all along","自始至終、一直都","","I suspected all along that he was joking.","我一直都懷疑他是在開玩笑。","",""],["all (day, week, month, year) long","一整天/週/月/年之久","","The baby cried all night long.","寶寶哭了一整晚。","",""],["all in all","總的來說、整體而言","","All in all, it was a productive week.","整體來說,這是充實的一週。","",""],["all of a sudden","突如其來、毫無預警","","All of a sudden the lights went dark.","燈突然全暗了下來。","",""],["all right","可以接受的;好、沒問題","","Is it all right if I open the window?","我開窗可以嗎?","",""],["as a matter of fact","事實上、其實","","As a matter of fact, I've already finished it.","事實上,我已經做完了。","",""],["as for","至於、談到","","As for dessert, we'll decide after the meal.","至於甜點,我們吃完飯再決定。","",""],["as soon as","一……就立刻","","Call me as soon as you land.","你一落地就打給我。","",""],["as usual","和平常一樣、照慣例","","As usual, she arrived at the gym before sunrise.","她照例在日出前就到了健身房。","",""],["to ask for","自找、罪有應得","","Skipping practice and then losing? He asked for it.","翹掉練習然後又輸球?這是他自找的。","",""],["at all","(用於否定)絲毫、一點也","","I'm not tired at all; let's keep going.","我一點也不累,我們繼續吧。","",""],["at first","最初、剛開始時","","At first the recipe looked hard, but it was actually simple.","起初這道食譜看起來很難,其實很簡單。","",""],["at heart","本質上、內心裡","","He seems strict, but he's kind at heart.","他看似嚴厲,但骨子裡很善良。","",""],["at last","經過許久之後終於","","After months of waiting, the results are here at last.","等了好幾個月,結果終於出來了。","",""],["at least","最少、不低於","","The repair will take at least three days.","這修理至少要花三天。","",""],["under one's nose","就在眼前(卻沒察覺)","","The keys were under my nose the whole time.","鑰匙一直就在我眼前。","",""],["under the table","檯面下、私底下(常指不合法)","","They paid the workers under the table to avoid taxes.","他們私下付錢給工人以逃稅。","",""],["under the weather","身體微恙、不太舒服","","I'm feeling a bit under the weather today.","我今天覺得有點不舒服。","",""],["up in the air","懸而未決、還沒定案","","Our vacation plans are still up in the air.","我們的度假計畫還沒定案。","",""],["up to date","最新的、合乎時代的","","We keep our software up to date to stay secure.","我們讓軟體保持在最新版本以維持安全。","",""],["upside down","上下顛倒","","The toddler held the book upside down.","那小孩把書拿倒了。","",""],["used to","過去經常(現已不再)","","I used to jog every morning before work.","我以前上班前每天都會慢跑。","","u"],["to wait on","在商店或餐廳提供服務","","A friendly waiter waited on us all evening.","整晚都有位親切的服務生招待我們。","","t"],["to wait up for","熬夜等候","","Don't wait up for me; I'll be home late.","別等我了,我會很晚回家。","","t"],["to wake up","從睡眠中醒來","","I woke up before the alarm went off.","鬧鐘還沒響我就醒了。","","t"],["a walk in the park","輕鬆容易的事","","The exam was no walk in the park.","那場考試可不輕鬆。","","a"],["to waste one's breath","白費口舌","","Arguing with him is just wasting your breath.","跟他爭辯根本是白費口舌。","","t"],["to wear down","逐漸磨損、磨薄","","Years of walking wore down the stone steps.","多年的踩踏把石階磨損了。","","t"],["to wear off","逐漸消失、失效","","The numbness will wear off in an hour.","麻痺感一小時內就會消退。","","t"],["to wear out","用到破損、失去功用","","These sneakers are completely worn out.","這雙運動鞋已經完全穿壞了。","","t"],["when pigs fly","絕不可能(的時候)","","He'll clean his room when pigs fly.","要他整理房間,除非太陽打西邊出來。","","w"],["a white lie","善意的謊言","","She told a white lie to spare his feelings.","她說了個善意的謊,以免傷他的心。","","a"],["to work out","健身;想出(辦法)","","He works out at the gym three times a week.","他每週上健身房三次。","","t"],["would rather","寧可、比較願意","","I'd rather stay home than sit in traffic.","我寧願待在家也不想塞在車陣裡。","","w"],["","","","","","",""],["","","","","","",""]],"B":[["單字","字義","圖片","例句","句義","音檔位置","字首"],["back and forth","來來回回地","","The pendulum swung back and forth.","鐘擺來回擺動著。","",""],["to back down","讓步、退縮","","Neither side would back down in the dispute.","這場爭執中雙方都不肯讓步。","",""],["to back out","把車倒出;打退堂鼓、退出","","He backed out of the deal at the last moment.","他在最後一刻退出了這筆交易。","",""],["to back up","倒車;支持、聲援","","Can you back up a little? You're too close.","你能倒一點嗎?靠得太近了。","",""],["the ball is in your court","該你決定或行動了","","I've made my offer; now the ball is in your court.","我已經提出條件,現在就看你決定了。","",""],["to bank on","指望、仰賴","","Don't bank on the weather staying nice.","別指望天氣會一直這麼好。","",""],["to be a far cry from","與……相差甚遠","","The remake is a far cry from the original.","這部重拍版和原作相差甚遠。","",""],["to be about to","即將、正準備要","","I was about to call you when you texted.","你傳訊息來時,我正要打給你。","",""],["to be better off","處境較好、更划算","","You'd be better off buying a season pass.","你買季票會比較划算。","",""],["to be bound to","勢必、注定會","","With such talent, she's bound to succeed.","以她的才華,注定會成功。","",""],["to be carried away","被強烈情緒沖昏頭、深受感染","","The crowd got carried away with excitement.","群眾興奮得忘乎所以。","",""],["to be cut out for","適合、是……的料","","He's not cut out for office work.","他不是坐辦公室的料。","",""],["to be had","受騙、上當","","The watch was fake — I'd been had.","那隻錶是假的,我被騙了。","","t"],["to be in","流行、當紅;在(家或公司)","","Bright colors are in this season.","亮色系是這一季的流行。","","t"],["to be in charge of","負責、掌管","","She is in charge of the whole marketing team.","整個行銷團隊由她掌管。","","t"],["to be in (someone's) shoes","設身處地、站在……立場","","If I were in your shoes, I'd take the offer.","如果我是你,我會接受這個提議。","","t"],["to be in (the/one's) way","擋路、礙事","","Move the boxes; they're in the way.","把箱子移開,它們擋路了。","","t"],["to be looking up","漸有起色、好轉","","After a slow start, sales are looking up.","在低迷的開頭後,銷售正逐漸好轉。","","t"],["to be out","過時;外出不在","","Sorry, the doctor is out until two o'clock.","抱歉,醫生外出,兩點才回來。","","t"],["to be over","結束、告一段落","","Once the meeting is over, let's grab coffee.","會議一結束,我們去喝杯咖啡吧。","","t"],["to be over one's head","忙得團團轉;超出理解","","I'm over my head with deadlines this week.","這禮拜的截止期限讓我忙得團團轉。","","t"],["to be the matter","出了問題、不對勁","","Something is the matter with the printer.","印表機出了點問題。","","t"],["to be up","(時間)結束、到期","","Your two hours are up; please hand in the exam.","你的兩小時到了,請交卷。","","t"],["to be up for grabs","開放供人爭取","","With the manager gone, the position is up for grabs.","經理離職後,那個職位開放讓大家爭取。","","t"],["to be up to","由某人決定;在忙什麼","","Where we eat tonight is up to you.","今晚在哪吃由你決定。","","t"],["to be up to (something)","在忙什麼;暗中盤算","","You look guilty — what are you up to?","你一臉心虛,在打什麼主意?","","t"],["to be used to","已經習慣(某事物)","","He's used to working late on weekdays.","他習慣了平日加班到很晚。","","t"],["to be well-off","富裕、生活寬裕","","Her family has always been well-off.","她家一向很富裕。","","t"],["to be with it","進入狀況、專注","","Sorry, I'm not really with it this morning.","抱歉,我今天早上有點狀況外。","","t"],["to be with (someone)","支持;聽懂、跟得上","","Are you still with me, or should I explain again?","你還跟得上嗎,還是我再解釋一次?","","t"],["to beat around the bush","拐彎抹角、繞圈子","","Stop beating around the bush and tell me.","別再拐彎抹角了,直接告訴我。","","t"],["to become of","(人或物)下落如何","","Whatever became of your old bandmates?","你以前的樂團夥伴後來都怎麼了?","","t"],["to believe in","相信、信奉","","She believes in treating everyone fairly.","她信奉公平待人。","","t"],["to bite off","攬下(過多的責任)","","By taking three jobs, he bit off more than he could chew.","他一次接三份工作,實在是貪多嚼不爛。","","t"],["to bite the bullet","咬牙撐過、硬著頭皮面對","","I hate dentists, but I'll bite the bullet and go.","我討厭看牙醫,但我會硬著頭皮去。","","t"],["a blessing in disguise","因禍得福、塞翁失馬","","Losing that job was a blessing in disguise.","丟了那份工作反而是因禍得福。","","a"],["to blow out","爆胎;吹熄","","A tire blew out as we drove down the freeway.","我們開在高速公路上時爆了一個胎。","","t"],["to blow up","充氣;炸毀、爆炸","","It took ages to blow up all the party balloons.","把派對氣球全吹好花了好久。","","t"],["the bottom line","最關鍵的一點、底線","","The bottom line is that we need more time.","最關鍵的一點是,我們需要更多時間。","","t"],["to bow out","退出、抽身","","She bowed out of the race for health reasons.","她因健康因素退出了這場競賽。","","t"],["break a leg","祝(演出)順利、祝好運","","Break a leg out there tonight!","祝你今晚演出順利!","","b"],["to break down","(機器)故障、拋錨","","Our car broke down on the highway.","我們的車在高速公路上拋錨了。","","t"],["to break in","把新東西用順、磨合;打斷","","You should break in new hiking boots before a long trek.","長途健行前該先把新登山鞋穿順。","","t"],["to break loose","掙脫、脫困","","The dog broke loose and chased the cat.","那隻狗掙脫繩子去追貓。","","t"],["to break off","中斷、斷絕","","The two sides broke off negotiations.","雙方中斷了談判。","","t"],["to break out","突然爆發、蔓延開來","","A fire broke out in the warehouse overnight.","倉庫在夜裡突然起火。","","t"],["break the ice","打破僵局、緩和初次見面的尷尬","","He told a joke to break the ice with the new team.","他講了個笑話,和新團隊打破僵局。","","b"],["to break the news","(委婉地)宣布消息","","I didn't know how to break the news to her.","我不知道該怎麼把這消息告訴她。","","t"],["to break up","分手;解散","","They broke up after dating for three years.","他們交往三年後分手了。","","t"],["to bring about","引起、促成","","Careful planning brought about the project's success.","周密的規劃促成了這個專案的成功。","","t"],["to bring back","歸還、退回","","Please bring back the umbrella you borrowed.","請把你借的傘還回來。","","t"],["to bring out","推出、發表(產品)","","The brand brought out a new model this fall.","這個品牌今秋推出了新機型。","","t"],["to bring up","養育;提起(話題)","","It's rude to bring up her age at the party.","在派對上提她的年齡很失禮。","","t"],["to brush up on","複習、重拾生疏的技能","","I need to brush up on my French before the trip.","旅行前我得把法文複習一下。","","t"],["to build up","逐漸累積、增強","","She built up her savings over several years.","她花了好幾年慢慢累積存款。","","t"],["to burn down","(蠟燭)燒盡;(建物)燒毀","","The old barn burned down in minutes.","那座舊穀倉幾分鐘內就燒毀了。","","t"],["to burn out","因過度使用而燒壞;使精疲力盡","","The motor burned out after years of heavy use.","那具馬達重度使用多年後燒壞了。","","t"],["to burn the midnight oil","挑燈夜戰、熬夜","","She burned the midnight oil to finish the report.","她熬夜趕完了那份報告。","","t"],["to burn up","燒毀;令人火大","","It burns me up when people cut in line.","有人插隊真讓我火大。","","t"],["to burst out","突然衝出;突然(哭笑等)","","She burst out laughing at his joke.","她被他的笑話逗得突然大笑。","","t"],["to buy out","收購(整家公司或股權)","","A larger ne's breath","喘口氣、稍作休息","","Let me catch my breath before the next climb.","下一段爬升前讓我先喘口氣。","",""],["to catch up","趕上進度","","After being sick, he worked hard to catch up.","生病後,他努力趕上進度。","",""],["to change one's mind","改變原本的決定或想法","","She changed her mind and ordered tea instead.","她改變主意,改點了茶。","",""],["to check in","(旅館)辦理入住;託運","","We checked in at the hotel around noon.","我們中午左右在飯店辦了入住。","",""],["to check out","退房;查看、調查","","Guests must check out before eleven.","住客必須在十一點前退房。","",""],["to check up on","查核、檢查狀況","","The nurse came to check up on the patient.","護理師來查看病人的情況。","",""],["to cheer up","使振作、逗某人開心","","A short walk always cheers me up.","散個步總能讓我心情好起來。","",""],["to clean out","清空;洗劫;掃光","","It's time to clean out the garage.","該把車庫清一清了。","",""],["to clear up","說明白;(天氣)放晴","","The sky cleared up just in time for the picnic.","天空正好在野餐前放晴了。","",""],["clear-cut","明確而清晰","","The instructions were clear-cut and easy to follow.","說明明確清楚,很容易照著做。","",""],["close call","九死一生、驚險脫身","","That was a close call — the ladder nearly fell.","好險,那梯子差點倒下來。","",""],["to come about","發生、出現","","How did this misunderstanding come about?","這場誤會是怎麼發生的?","",""],["to come across","偶然遇見或發現","","I came across an old photo while cleaning.","整理東西時我偶然翻到一張舊照片。","",""],["to come from","來自、源於某地","","The best coffee beans come from that region.","最好的咖啡豆產自那個地區。","",""],["to come to","甦醒;合計為","","The bill came to more than we expected.","帳單金額比我們預期的還多。","",""],["to come to an end","結束、告一段落","","The festival came to an end at midnight.","慶典在午夜落幕。","",""],["to come true","成真、實現","","Her dream of owning a bakery finally came true.","她開麵包店的夢想終於成真了。","",""],["to come up with","想出、提出","","She came up with a brilliant solution.","她想出了一個絕妙的辦法。","",""],["to cop out","推卸責任、臨陣脫逃","","He copped out of the presentation at the last minute.","他在最後關頭逃避了那場簡報。","",""],["to cope with","應付、應對","","He's learning to cope with the stress of work.","他正在學著應付工作的壓力。","",""],["to cost an arm and a leg","所費不貲、非常昂貴","","A house in the city center can cost an arm and a leg.","市中心的房子可能貴得嚇人。","",""],["a couch potato","成天窩沙發看電視的人","","Since the injury, he's become a real couch potato.","受傷後,他成了不折不扣的沙發馬鈴薯。","",""],["to count on","信賴、指望某人","","You can count on me to be there on time.","你可以放心,我一定會準時到。","",""],["to cover for","暫代;替某人打掩護","","Can you cover for me while I take a call?","我去接個電話,你能幫我頂一下嗎?","",""],["to cover ground","涵蓋範圍很廣","","The lecture covered a lot of ground in one hour.","這場講座一小時內涵蓋了很多內容。","",""],["to cover up","掩蓋、隱瞞","","They tried to cover up the accounting errors.","他們試圖掩蓋帳目上的錯誤。","",""],["to cross out","劃掉、刪去","","He crossed out the wrong answer and rewrote it.","他把錯的答案劃掉,重寫了一次。","",""],["cut and dried","早有定論、了無新意;乏味","","The plot of that film felt cut and dried.","那部電影的劇情感覺毫無新意。","",""],["to cut corners","精打細算、省錢","","They cut corners to stay within budget.","他們處處省錢,以控制在預算內。","",""],["to cut down on","減少(用量或次數)","","The doctor told him to cut down on salt.","醫生要他少吃鹽。","",""],["to cut off","剪掉;突然切斷","","The call cut off right in the middle of a sentence.","電話正講到一半就斷了。","",""],["to cut out","剪下;停止(某行為)","","Cut out the noise — I'm trying to concentrate.","別吵了,我正想專心。","",""],["to cut short","縮短、打斷","","We had to cut the trip short due to a storm.","因為暴風雨,我們只好提前結束旅程。","",""],["to cut to the chase","開門見山、直說重點","","We're short on time, so let me cut to the chase.","我們時間不多,我就直說重點了。","",""],["day in and day out","日復一日、天天如此","","Day in and day out, she practices the violin.","她日復一日地練小提琴。","",""],["to deal with","處理、應對","","I'll deal with the complaint first thing tomorrow.","我明天一早就處理這件申訴。","",""],["to die down","減弱、平息","","The wind finally died down by evening.","到了傍晚風勢終於減弱。","",""],["to die out","絕跡、逐漸消失","","Many traditional crafts are dying out.","許多傳統工藝正逐漸失傳。","",""],["to dish out","大量分發;數落人","","He can criticize others but can't take it when it's dished out to him.","他能數落別人,別人一說他就受不了。","",""],["to do over","重做、重寫","","The essay was messy, so she did it over.","那篇作文太亂,她就重寫了 ell through at the last minute.","我們的假期計畫在最後關頭泡湯了。","",""],["to feel like","想要、有意做某事","","I feel like going for a swim.","我想去游個泳。","",""],["to feel sorry for","同情、為……感到難過","","I feel sorry for anyone stuck in this heat.","我很同情困在這種酷熱裡的人。","",""],["few and far between","罕見、不常發生","","Sunny days in this town are few and far between.","這個鎮上晴天很少見。","",""],["fifty-fifty","對半平分","","We split the bill fifty-fifty.","我們把帳單對半分。","",""],["to figure out","想出答案;弄明白","","It took me a while to figure out the puzzle.","我花了一點時間才解開這個謎題。","",""],["to fill in","填入(空格);告知情況","","Please fill in your name and phone number.","請填上你的姓名和電話。","",""],["to fill out","填寫完整份表格","","You need to fill out this form to register.","報名要填好這份表格。","",""],["to fill (someone) in","向某人說明情況","","Can you fill me in on what I missed?","你能跟我說一下我錯過了什麼嗎?","",""],["to find fault with","挑剔、找碴","","It's easy to find fault with others' work.","挑別人工作的毛病很容易。","",""],["to find out","設法得知、查清楚","","Let me find out whether the museum is open on Mondays.","我來查一下博物館週一有沒有開。","",""],["first-rate","一流的、極為出色","","The hotel offers first-rate service.","這家飯店提供一流的服務。","",""],["to fix up","修理、整修;為某人牽線","","We bought an old house and fixed it up.","我們買了棟舊房子,自己整修好。","",""],["to focus on","專注於、把重點放在","","Let's focus on the most urgent tasks first.","我們先專注在最緊急的事情上。","",""],["to fool around","鬼混、瞎搞;開玩笑","","Stop fooling around and finish your homework.","別再混了,把作業寫完。","",""],["for good","永久地、從此不再改變","","He moved abroad for good last year.","他去年永久移居國外了。","",""],["for once","就這麼一次、難得","","For once, everyone agreed without arguing.","難得這一次,大家沒爭執就都同意了。","",""],["for sure","確定無疑","","I don't know for sure when he'll arrive.","我不確定他確切幾點會到。","",""],["for the time being","目前、暫且","","For the time being, we'll share one car.","我們暫時共用一輛車。","",""],["from now on","從現在起、往後","","From now on, I'll double-check my work.","從今以後,我會把工作再檢查一遍。","",""]],"G":[["單字","字義","圖片","例句","句義","音檔位置","字首"],["to get a rise out of","激得某人動怒或反應","","He teased her, hoping to get a rise out of her.","他捉弄她,想惹她動怒。","",""],["to get along","有進展;(健康)過得如何","","How is your grandfather getting along?","你祖父近來過得如何?","",""],["to get along with","與人相處融洽;順利應付","","She gets along with almost everyone at work.","她和公司裡幾乎每個人都處得來。","",""],["to get away","逃脫、脫身","","The thief got away before the police arrived.","小偷在警察趕到前就逃走了。","",""],["to get away with","逃過懲罰、僥倖矇混","","He thinks he can get away with cheating.","他以為作弊可以矇混過去。","",""],["to get back","返回、回到原處","","What time did you get back from the office?","你幾點從辦公室回來的?","",""],["to get better, worse, etc.","變得更好、更糟等","","His handwriting is getting better with practice.","他的字經過練習正在變好。","",""],["to get by","勉強度日、應付得來","","On such a low salary, they can barely get by.","薪水這麼低,他們勉強才能過活。","",""],["to get cold feet","臨陣退縮、打退堂鼓","","He got cold feet just before the interview.","面試前他臨陣退縮了。","",""],["to get even with","報復、扯平","","He vowed to get even with the person who cheated him.","他發誓要向騙他的人報復。","",""],["to get in touch with","與某人取得聯繫","","I'll get in touch with the supplier tomorrow.","我明天會聯絡供應商。","",""],["to get in/to get on","進入或搭上車輛、交通工具","","Hurry and get on the train — it's about to leave.","快上火車,它就要開了。","",""],["to get lost","迷路;走開別煩","","We got lost trying to find the trailhead.","我們找登山口時迷了路。","",""],["to get off one's chest","一吐為快、傾吐心事","","Talking to a friend helped her get it off her chest.","跟朋友聊過後,她把心事一吐為快。","",""],["to get on one's nerves","惹惱、使人心煩","","His constant humming gets on my nerves.","他不停哼歌讓我心煩。","",""],["to get out from under","擺脫財務困境","","After years of saving, they got out from under their loans.","存了多年後,他們終於擺脫了貸款。","",""],["to get out of hand","失控","","The party got out of hand after midnight.","那場派對過了午夜就失控了。","",""],["to get out of line","違規、逾矩","","Any player who gets out of line will be benched.","任何逾矩的球員都會被換下場。","",""],["to get out of/to get off","下車、離開交通工具","","She got off the bus two stops too early by mistake.","她不小心提早兩站就下了公車。","",""],["to get over","從疾病或傷痛中恢復","","It took her weeks to get over the flu.","她花了好幾週才從流感中康復。","",""],["to get rid of","除掉、擺脫","","I finally got rid of that annoying pop-up ad.","我終於擺脫了那個惱人的彈出式廣告。","",""],["to get sick, well, tired, busy, wet, etc.","變得生病、疲累、忙碌等","","I always get sleepy after a big lunch.","我每次吃完豐盛的午餐就想睡。","",""],["to get the better of","勝過、佔上風","","His temper often gets the better of him.","他常被自己的脾氣牽著走。","",""],["to get the hang of","掌握訣竅、上手","","After a week, I got the hang of the new software.","一週後,我就掌握了新軟體的用法。","",""],["to get through","完成、把某事做完","","I finally got through all my emails.","我終於把所有電子郵件都處理完了。","",""],["to get through to","使某人聽懂、把話說進心裡","","I just can't get through to my stubborn uncle.","我就是沒辦法說服我那固執的叔叔。","",""],["to get to","得以做某事;抵達某處","","We finally got to see the northern lights.","我們終於得以看到北極光。","",""],["to get up","起床;把某人叫醒","","I have to get up at five to catch my flight.","我得五點起床趕飛機。","",""],["to get used to","逐漸適應、變得習慣","","It took me a while to get used to the new keyboard.","我花了一段時間才習慣新鍵盤。","",""],["give and take","互相退讓、彼此配合","","A good team needs plenty of give and take.","好的團隊需要大量的互相退讓。","",""],["to give birth to","生下、產下","","Our cat gave birth to four kittens last night.","我們的貓昨晚生下四隻小貓。","",""],["to give in","屈服、讓步","","After hours of debate, he finally gave in.","辯論好幾個小時後,他終於讓步了。","",""],["to give off","散發、放出","","Fresh bread gives off a wonderful smell.","剛出爐的麵包散發著誘人的香味。","",""],["to give out","分發;耗盡","","Volunteers gave out blankets to the flood victims.","志工向水災災民分發毛毯。","",""],["to give (someone) a big hand","給予熱烈掌聲","","Let's give the performers a big hand.","讓我們給表演者熱烈的掌聲。","",""],["to give (someone) a break","給某人機會、通融一下","","Give him a break — it's his first day.","通融他一下,今天是他第一天上班。","",""],["to give (someone) a hand","幫忙、搭把手","","Could you give me a hand with these boxes?","你能幫我搬一下這些箱子嗎?","",""],["to give someone the cold shoulder","冷落、故意不理","","Ever since the argument, he's given me the cold shoulder.","自從那次爭吵後,他就一直冷落我。","",""],["to give up","放棄;戒除;投降","","Don't give up — you're almost there.","別放棄,你就快成功了。","",""],["to go around","夠分配;四處走動流傳","","There weren't enough chairs to go around.","椅子不夠大家坐。","",""],["to go for","以某價格賣出;力求","","This antique clock goes for a small fortune.","這座古董鐘賣得非常貴。","",""],["to go in for","熱衷於(興趣嗜好)","","She goes in for long-distance running.","她熱衷於長跑。","",""],["to go off","爆炸;(警報)響;突然離去","","The alarm went off at midnight for no reason.","警報在半夜無緣無故響了起來。","",""],["to go off the deep end","失控暴怒、衝動行事","","He went off the deep end when he heard the news.","他一聽到消息就情緒失控。","",""],["to go on","發生;持續進行","","What's going on outside? I hear sirens.","外面發生什麼事?我聽到警笛聲。","",""],["to go out","熄滅;停止運作;外出","","The candle went out in the draft.","蠟燭被穿堂風吹熄了。","",""],["to go over","受歡迎、被接受","","His speech went over well with the audience.","他的演說很受聽眾歡迎。","",""],["to go the extra mile","加倍努力、多付出","","Our staff always go the extra mile for customers.","我們的員工總是為顧客多付出一分心力。","",""],["to go through","經歷;耗用","","She went through a tough time after the move.","搬家後她經歷了一段艱難的時期。","",""],["to go through channels","循正規管道辦理","","To get approval, you must go through channels.","要取得核准,你必須循正規管道。","",""],["to go to town","卯足全力、大幹一場","","The decorators really went to town on the ballroom.","布置人員把宴會廳布置得極盡盛大。","",""],["to go up","上漲;興建","","Rents keep going up in this neighborhood.","這一帶的租金一直在漲。","","t"],["to go up to","走近、上前","","A stranger went up to me and asked for directions.","一個陌生人走上前來向我問路。","","t"],["to go with","(顏色款式)相配;與某人交往","","That scarf goes with your coat perfectly.","那條圍巾和你的外套很搭。","","t"],["to go without saying","不言而喻、自不待言","","It goes without saying that safety comes first.","安全第一,這是不言而喻的。","","t"],["to go wrong","出差錯、出岔子","","Something went wrong with the online payment.","線上付款出了點問題。","","t"],["to goof off","打混、偷懶","","The crew tends to goof off when no one's watching.","沒人盯著時,這群人就愛偷懶。","","t"],["to goof up","出錯、搞砸","","I goofed up and sent the email to the wrong person.","我出了差錯,把郵件寄錯了人。","","t"],["to grow out of","(隨年紀)戒掉;由……衍生","","Most children grow out of their fear of the dark.","多數孩子長大就不再怕黑了。","","t"],["","","","","","",""]],"H、I、J":[["單字","字義","圖片","例句","句義","音檔位置","字首"],["had better","最好、應當","","You'd better bring an umbrella just in case.","你最好帶把傘以防萬一。","",""],["to hand in","繳交、呈交","","Please hand in your reports by Friday.","請在週五前繳交報告。","",""],["to hang up","掛起衣物;掛斷電話","","He hung up before I could say goodbye.","我還來不及道別他就掛了電話。","",""],["hard of hearing","重聽、聽力不好","","Speak up — my uncle is hard of hearing.","說大聲點,我叔叔重聽。","",""],["to have a good time","玩得愉快、過得開心","","We had a good time at the beach.","我們在海邊玩得很開心。","",""],["to have a voice in","在……有發言權","","Employees want a voice in company decisions.","員工希望在公司決策上有發言權。","",""],["have got","擁有、有","","I've got two tickets for Saturday's game.","我有兩張週六比賽的票。","",""],["have got to","必須、不得不","","We've got to leave now or we'll miss the bus.","我們得馬上走,不然會錯過公車。","",""],["to have in mind","心裡想著、盤算","","Did you have a particular restaurant in mind?","你心裡有想去的特定餐廳嗎?","",""],["to have it in for","對……懷恨、想報復","","The referee seemed to have it in for our team.","那位裁判似乎對我們隊有成見。","",""],["to have it out with","與某人攤牌、理論","","She decided to have it out with her landlord.","她決定和房東把話講清楚。","",""],["to have on","身上穿戴著","","She had on a bright red coat.","她身上穿著一件鮮紅色外套。","",""],["to have one's heart set on","一心想要、決意","","She has her heart set on studying abroad.","她一心想出國念書。","",""],["to have one's way","隨自己的意、如願","","The toddler always wants to have his way.","那個小孩總想事事順著他的意。","",""],["to have (time) off","有休假、不用上班的時間","","She has Friday off and plans to sleep in.","她週五放假,打算睡到自然醒。","",""],["to have to do with","與某事有關聯","","His job has something to do with software design.","他的工作和軟體設計有關。","",""],["to hear from","得到某人的消息","","Have you heard from Mark since he moved?","馬克搬走後你有他的消息嗎?","",""],["to hear of","聽說過、知道","","I've never heard of that band before.","我從沒聽過那個樂團。","",""],["to hit the nail on the head","一針見血、說中要害","","Your comment hit the nail on the head.","你這句話真是一針見血。","",""],["to hit the road","動身上路、出發","","It's getting late; we should hit the road.","時候不早了,我們該出發了。","",""],["to hit the sack","上床睡覺","","I'm exhausted; I'm going to hit the sack.","我累壞了,要去睡了。","",""],["to hold back","抑制、忍住;隱瞞","","She couldn't hold back her tears.","她忍不住流下淚來。","",""],["to hold off","延緩、拖住","","Let's hold off on the decision until Monday.","這個決定我們拖到週一再說吧。","",""],["to hold on","抓緊;稍等別掛","","Hold on tight; the road gets bumpy here.","抓緊了,這段路很顛。","",""],["to hold out","支撐、夠用;堅持","","Our supplies should hold out for another week.","我們的補給應該還能撐一週。","",""],["to hold over","延長、續留","","The theater held the show over for a second month.","劇院把這場演出加演了一個月。","",""],["to hold still","保持不動","","Hold still while I take the photo.","我拍照時別動。","",""],["to hold up","耽誤;維持水準","","Roadwork held up traffic for an hour.","道路施工把車流堵了一個小時。","",""],["ill at ease","渾身不自在、緊張","","He felt ill at ease among so many strangers.","在那麼多陌生人中他很不自在。","",""],["in a hurry","急急忙忙、趕時間","","She left in a hurry and forgot her umbrella.","她匆忙離開,忘了帶傘。","",""],["in case","以防、萬一","","Take a jacket in case it gets cold.","帶件外套,以防天氣變冷。","",""],["in hand","在掌控之中","","Don't worry — I have everything in hand.","別擔心,一切都在我掌控中。","",""],["in no time","很快、轉眼間","","The mechanic fixed the tire in no time.","技師三兩下就把輪胎補好了。","",""],["in the long run","就長遠而言","","In the long run, saving now will pay off.","就長遠來看,現在儲蓄會有回報。","",""],["in the same boat","處境相同、同病相憐","","Don't worry — we're all in the same boat here.","別擔心,我們大家處境都一樣。","",""],["in the worst way","非常、極度地","","She wanted to win that award in the worst way.","她非常渴望贏得那個獎。","",""],["in time to","及時、趕在期限前","","We arrived just in time to board the ferry.","我們正好及時趕上渡輪。","",""],["in touch","保持聯絡","","Let's stay in touch after the course ends.","課程結束後我們保持聯絡吧。","",""],["in vain","徒勞、白費力氣","","All our efforts to save the tree were in vain.","我們為搶救那棵樹所做的努力全白費了。","",""],["inside out","裡外翻反","","Your sweater is on inside out.","你的毛衣穿反了。","",""],["it figures","果然如此、不意外","","It figures that the bus is late again today.","公車今天又誤點,真是不意外。","",""],["to jump to conclusions","妄下結論","","Don't jump to conclusions before you hear the facts.","在聽到事實前別妄下結論。","",""]],"K、L":[["單字","字義","圖片","例句","句義","音檔位置","字首"],["to keep a low profile","保持低調","","After the scandal, he kept a low profile.","醜聞之後,他保持低調。","",""],["to keep a promise","遵守承諾","","A good leader always keeps a promise.","好的領導者總是信守承諾。","",""],["to keep after","不斷叮嚀、催促","","I have to keep after him to do his chores.","我得不停催他做家事。","",""],["to keep an eye on","看著、留意","","Could you keep an eye on my bag for a minute?","可以幫我看一下包包嗎?","",""],["to keep away (from)","遠離、避開","","Keep away from the wet paint.","別靠近未乾的油漆。","",""],["to keep in mind","牢記在心、別忘記","","Keep in mind that the store closes early today.","記得店家今天提早打烊。","",""],["to keep in touch with","與……保持聯絡","","We keep in touch with our old classmates.","我們和老同學保持著聯絡。","",""],["to keep one's fingers crossed","祈求好運、但願順利","","Keep your fingers crossed that it doesn't rain.","但願別下雨,一起祈求好運吧。","",""],["to keep one's head","臨危不亂、保持冷靜","","She kept her head during the emergency.","緊急時刻她仍保持冷靜。","",""],["to keep one's word","信守諾言、說到做到","","He always keeps his word.","他總是說到做到。","",""],["to keep out","不准進入、禁止進入","","A sign on the gate warned people to keep out.","大門上的告示警告人們不得進入。","",""],["to keep time","(鐘錶)走時準確","","This old clock still keeps perfect time.","這座老鐘走時依然很準。","",""],["to keep track of","記錄、掌握……的狀況","","It's hard to keep track of so many passwords.","要記住這麼多密碼很難。","",""],["to keep up","吵得無法入睡;維持(水準)","","The barking dog kept me up all night.","那隻狂吠的狗害我整晚睡不著。","",""],["to keep up with","跟上(速度或進度)","","She walks so fast I can't keep up with her.","她走得好快,我跟不上。","",""],["to keep up with","掌握最新資訊;跟得上","","It's hard to keep up with the latest tech.","要跟上最新科技很不容易。","",""],["to kick (something) around","非正式地討論、商量","","Let's kick the idea around before the meeting.","開會前我們先隨意討論一下這個想法。","",""],["to kick the habit","戒掉(壞習慣)","","He finally kicked the habit of biting his nails.","他終於戒掉了咬指甲的習慣。","",""],["to knock one self out","拚命努力、賣力去做","","Don't knock yourself out; a rough draft is fine.","別把自己累壞,先寫個草稿就好。","",""],["to knock out","擊昏、擊倒;令人驚豔","","The boxer knocked out his rival in round three.","那名拳擊手在第三回合擊倒對手。","",""],["to know by sight","面熟、認得","","I know her by sight but we've never spoken.","我對她面熟,但我們從沒交談過。","",""],["to land on one's feet","化險為夷、重新站穩","","However hard life gets, she always lands on her feet.","無論日子多難,她總能化險為夷。","",""],["last straw","壓垮的最後一根稻草","","His rudeness was the last straw for her.","他的無禮成了讓她忍無可忍的最後一根稻草。","",""],["to lay off","戒除;裁員","","The company had to lay off dozens of workers.","公司不得不裁掉數十名員工。","",""],["to learn the ropes","熟悉業務、上手","","It took her a month to learn the ropes.","她花了一個月才摸熟工作。","",""],["to leave open","暫不決定、留待日後","","Let's leave the date open for now.","日期我們先暫時保留。","",""],["to leave (someone or something) alone","別打擾、讓某人清靜","","Leave him alone; he needs some quiet.","別煩他,他需要安靜一下。","",""],["let along","更別提、遑論","","He can't afford rent, let alone a new car.","他連房租都付不起,更別說買新車了。","",""],["to let down","使失望、辜負","","I promise I won't let you down.","我保證不會讓你失望。","",""],["to let on","洩漏、透露(祕密)","","Don't let on that we planned a surprise.","別洩漏我們準備了驚喜。","",""],["to let slide","疏於處理、放任不管","","He let the paperwork slide and missed the deadline.","他把文書工作擱著不管,結果錯過了期限。","",""],["to let up","減弱、緩和;鬆懈","","The storm didn't let up until dawn.","暴風雨直到天亮才緩和。","",""],["to lie down","躺下休息","","I felt dizzy, so I went to lie down for a while.","我覺得頭暈,就去躺了一會兒。","",""],["to line up","排隊;張羅、安排到","","Fans lined up overnight for the tickets.","粉絲為了搶票徹夜排隊。","",""],["little by little","緩慢而逐步地","","Little by little, she paid off all her debts.","她一點一點把所有債務都還清了。","",""],["to live it up","盡情享樂、揮霍","","They lived it up on their honeymoon in Italy.","他們在義大利的蜜月旅行中盡情享樂。","",""],["to live up to","達到、不辜負(期望)","","The sequel didn't live up to the hype.","續集沒有達到大家的期待。","",""],["to liven up","炒熱氣氛、使有活力","","A little music will liven up the party.","放點音樂能讓派對熱鬧起來。","",""],["to look after","照顧、看顧","","Could you look after my dog this weekend?","這週末你能幫我照顧狗嗎?","",""],["to look at","把視線投向、注視","","Look at those clouds — it might rain soon.","看那些雲,可能快下雨了。","",""],["to look down on","瞧不起、看輕","","Don't look down on anyone for being new.","別因為誰是新人就看輕他。","",""],["to look for","設法找出、尋找","","I'm looking for my keys; have you seen them?","我在找我的鑰匙,你看到了嗎?","",""],["to look forward to","滿心期待、盼望","","I'm looking forward to the long weekend.","我很期待這個連假。","",""],["to look into","深入調查、仔細研究","","The committee will look into the complaint.","委員會會調查這件申訴。","",""],["to look on","在一旁觀看","","A crowd looked on as the street artist performed.","街頭藝人表演時,一群人在旁圍觀。","",""],["to look out","留神、當心","","Look out — there's a step there!","小心,那裡有個台階!","",""],["to look out on","面向、俯瞰","","Our balcony looks out on the harbor.","我們的陽台面向港口。","",""],["to look over","仔細查看、檢視","","Let me look over the contract before I sign it.","簽名前讓我先把合約看過一遍。","",""],["to look up","在字典或資料中查找","","If you don't know the word, look it up online.","不懂這個字的話,上網查一下。","",""],["to look up to","敬佩、景仰","","Younger players look up to the veteran captain.","年輕球員都很敬佩這位老隊長。","",""],["to lose face","丟臉、失面子","","He apologized privately so as not to lose face.","他私下道歉,以免丟面子。","",""],["to lose one's cool","失去冷靜、慌了神","","The waiter stayed polite and never lost his cool.","那位服務生始終客氣,從沒失去冷靜。","",""],["to lose one's head","慌了手腳、亂了方寸","","Don't lose your head just because of one bad review.","別因為一則負評就亂了方寸。","",""],["to lose one's temper","發脾氣","","Try not to lose your temper with the kids.","盡量別對孩子發脾氣。","",""],["to lose one's touch","失去往日的功力","","The veteran chef insists he hasn't lost his touch.","這位資深主廚堅稱自己寶刀未老。","",""],["to lose track of","忘了、失去(對……的)掌握","","I lost track of time and missed the bus.","我忘了時間,結果錯過了公車。","",""],["a lost cause","毫無希望的人或事","","Teaching him to cook is a lost cause.","教他做菜根本是白費工夫。","",""]],"M、N、O":[["單字","字義","圖片","例句","句義","音檔位置","字首"],["to make a decision","做決定","","You don't have to make a decision right now.","你不必現在就做決定。","",""],["to make a difference (to)","產生影響、造成不同","","A few kind words can make a difference to someone's day.","幾句貼心話能讓某人的一天大不同。","",""],["to make a fuss","大驚小怪、小題大作","","Don't make a fuss over a tiny scratch.","別為了一點小刮痕就大驚小怪。","",""],["to make a living","謀生、維持生計","","She makes a living as a freelance writer.","她靠當自由撰稿人維生。","",""],["to make an effort","努力、盡力","","Please make an effort to arrive on time.","請盡量準時到達。","",""],["to make clear","解釋清楚、講明白","","Let me make clear what I expect from the team.","讓我把我對團隊的期望說清楚。","",""],["to make do","湊合、將就應付","","We had no tent, so we made do with a tarp.","我們沒帳篷,只好用防水布將就。","",""],["to make ends meet","收支打平、勉強度日","","With rising prices, it's hard to make ends meet.","物價上漲,要收支打平很不容易。","",""],["to make friends","結交朋友","","Kids usually make friends quickly at camp.","孩子在營隊通常很快就交到朋友。","",""],["to make fun of","取笑、嘲弄","","It's unkind to make fun of someone's accent.","取笑別人的口音很不厚道。","",""],["to make good","獲得成功、闖出成績","","She made good as a self-taught programmer.","她靠自學當上程式設計師,闖出了名堂。","",""],["to make good time","以合理速度順利趕路","","We made good time and arrived before noon.","我們一路順暢,中午前就到了。","",""],["to make out","應付、進展、看清","","How did you make out on the driving test?","你路考考得怎麼樣?","",""],["to make out","辨認出;開立(文件)","","I could barely make out the faded sign.","那塊褪色的招牌我幾乎看不清楚。","",""],["to make progress","取得進展","","The students are making good progress in English.","學生們的英文正穩定進步。","",""],["to make sense","合乎情理、說得通","","It makes sense to book the tickets early.","早點訂票是合理的做法。","",""],["to make (someone) tick","驅使某人如此行事","","I can't work out what makes him tick.","我搞不懂是什麼在驅使他這麼做。","",""],["to make sure","確認、務必做到","","Make sure the door is locked before you leave.","離開前務必確認門鎖好了。","",""],["to make the best of","在不利處境中盡力而為","","The campsite was muddy, but we made the best of it.","營地泥濘不堪,但我們還是盡量將就。","",""],["to make up","補做;編造;化妝;構成","","You can make up the quiz you missed next week.","你缺考的小考下週可以補考。","",""],["to make up one's mind","拿定主意、作出決定","","Have you made up your mind about the job offer?","那份工作邀約你決定好了嗎?","",""],["to make up with","和好、盡釋前嫌","","The two friends made up after their quarrel.","那兩個朋友吵架後又和好了。","",""],["to make waves","興風作浪、找麻煩(抱怨)","","New employees rarely want to make waves.","新進員工通常不想惹是生非。","",""],["to meet a deadline","趕上截止期限","","We stayed late to meet the deadline.","我們留到很晚以趕上截止期限。","",""],["to meet (someone) halfway","各退一步、折衷","","We couldn't agree, so we met halfway.","我們談不攏,便各退一步。","",""],["to mind the store","看家、留守顧店","","Someone has to mind the store during lunch.","午餐時間得有人留守顧店。","",""],["to miss the boat","錯失良機","","He missed the boat by applying too late.","他申請得太晚,錯失了良機。","",""],["to mix up","攪拌均勻;使混淆","","Mix up the batter until it's smooth.","把麵糊攪拌到滑順為止。","",""],["more or less","差不多、多少有點","","The two proposals are more or less the same.","這兩份提案大同小異。","",""],["to name after","以……的名字命名","","They named their son after his grandfather.","他們用祖父的名字為兒子命名。","",""],["narrow-minded","心胸狹隘、思想偏狹","","A narrow-minded attitude blocks new ideas.","偏狹的心態會阻礙新想法。","",""],["never mind","不必在意、算了","","Never mind the mess; we'll clean it up later.","別管那些亂了,我們晚點再收拾。","",""],["no matter","無論、不管","","No matter what happens, stay calm.","不管發生什麼,保持冷靜。","",""],["no wonder","難怪、不足為奇","","No wonder you're cold — the window's open.","難怪你冷,窗戶開著呢。","",""],["not on your life","絕對不行、想都別想","","Lend him my car? Not on your life.","把車借他?想都別想。","",""],["now and then","偶爾、有時候","","Now and then we treat ourselves to a nice dinner.","我們偶爾會犒賞自己一頓大餐。","",""],["off the top of one's head","一時想到、未經細想","","Off the top of my head, I'd say about fifty people.","我一時想到,大概五十人左右。","",""],["on cloud nine","樂不可支、欣喜若狂","","She was on cloud nine after getting the job.","得到那份工作後,她開心得不得了。","",""],["on edge","緊張不安、易怒","","Everyone was on edge before the results came out.","結果公布前大家都很緊張。","",""],["on hand","現成、在手邊","","Keep a flashlight on hand in case of a blackout.","手邊備支手電筒,以防停電。","",""],["on one's toes","保持警覺、機警","","A good goalkeeper stays on his toes.","好的守門員總是保持警覺。","",""],["on purpose","刻意、蓄意地","","I didn't spill the juice on purpose — it was an accident.","我不是故意打翻果汁的,那是意外。","",""],["on second thought","再想想、轉念一想","","On second thought, let's stay home tonight.","再想想,今晚還是待在家吧。","",""],["on the ball","機靈、反應快","","The new intern is really on the ball.","那位新實習生真的很機靈。","",""],["on the other hand","另一方面、相對地","","The plan is cheap; on the other hand, it's risky.","這計畫便宜,但另一方面也有風險。","",""],["on the same page","有共識、想法一致","","Let's make sure everyone is on the same page.","我們確認一下大家的想法是否一致。","",""],["on the whole","大致上、整體而言","","On the whole, the audience enjoyed the play.","整體而言,觀眾很喜歡這齣戲。","",""],["on time","準時、不遲不早","","The train left exactly on time.","火車準時發車。","",""],["once and for all","一勞永逸、徹底了斷","","Let's settle this argument once and for all.","我們把這場爭執一次徹底解決吧。","",""],["once in a blue moon","非常罕見、難得一次","","We only eat out once in a blue moon.","我們難得才上一次館子。","",""],["out of date","過時的、不再適用","","This map is out of date; several roads have changed.","這張地圖過時了,好幾條路都變了。","",""],["out of order","無法正常運作、故障","","The vending machine is out of order again.","那台販賣機又故障了。","",""],["out of the blue","突如其來、毫無預兆","","She called me out of the blue after ten years.","睽違十年,她突然打電話給我。","",""],["out of the question","不可能、想都別想","","Quitting now is out of the question.","現在放棄是不可能的事。","",""],["out of touch","失去聯絡;不了解狀況","","He's been out of touch since he went traveling.","他去旅行後就一直失聯。","",""],["over and over (again)","再三、反覆地","","She read the letter over and over.","她把那封信讀了一遍又一遍。","",""]],"P、Q、R":[["單字","字義","圖片","例句","句義","音檔位置","字首"],["to pass away","過世、去世","","His grandmother passed away peacefully last night.","他的祖母昨晚安詳地過世了。","","t"],["to pass out","分發;昏倒","","The volunteers passed out water to the runners.","志工向跑者分發飲水。","","t"],["to pay attention (to)","專心注意、留神","","Please pay attention to the safety instructions.","請留意這些安全須知。","","t"],["to pay back","償還;報復","","I'll pay you back as soon as I get paid.","我一領到薪水就還你。","","t"],["to pay off","有回報、奏效","","All her hard work finally paid off.","她的一切努力終於有了回報。","","t"],["to pick out","從中挑選出","","Help me pick out a tie for the interview.","幫我挑一條面試要用的領帶。","","t"],["to pick up","用手把東西從表面拿起","","She bent down to pick up the coin on the sidewalk.","她彎腰撿起人行道上的硬幣。","","t"],["to pick up the tab","買單、付帳","","Don't worry about the bill; I'll pick up the tab.","帳單別擔心,我來買單。","","t"],["a piece of cake","輕而易舉的事","","The final exam was a piece of cake for her.","那場期末考對她來說輕而易舉。","","a"],["to pin on","嫁禍、把罪名安在……頭上","","They tried to pin the blame on the intern.","他們想把過錯推到實習生身上。","","t"],["to play a role in","在……中扮演角色、起作用","","Diet plays a big role in overall health.","飲食對整體健康有很大的影響。","","t"],["to play by ear","憑聽力演奏;隨機應變","","We had no plan and just played it by ear.","我們沒有計畫,只能隨機應變。","","t"],["to play it safe","求穩、不冒險","","Let's play it safe and leave an hour early.","我們保險起見,提早一小時出發吧。","","t"],["to play up to","巴結、討好","","He's always playing up to the boss.","他老是巴結老闆。","","t"],["to point out","指出、使人注意到","","She pointed out a mistake in my calculation.","她指出我計算中的一個錯誤。","","t"],["to pull off","辦成難事;把車駛離公路","","Nobody thought she could pull it off, but she did.","沒人以為她辦得到,結果她做到了。","","t"],["to pull someone's leg","開某人玩笑、逗弄","","Relax, I'm just pulling your leg.","別緊張,我只是跟你開玩笑。","","t"],["to pull together","彙整(資訊);穩住情緒","","She pulled together the data for the report.","她彙整了報告所需的資料。","","t"],["to put an end to","終結、徹底結束","","New rules put an end to the confusion.","新規定終結了這場混亂。","","t"],["to put away","收拾好、放回定位","","Put away your toys before dinner.","晚餐前把你的玩具收好。","","t"],["to put down","平息、鎮壓;貶低","","The security team quickly put down the disturbance.","保安人員迅速平息了騷動。","","t"],["to put off","延後、拖延","","Don't put off the dentist appointment any longer.","別再拖著不去看牙醫了。","","t"],["to put on","把衣物穿戴到身上","","Put on a jacket; it's cold outside.","穿件外套吧,外面很冷。","","t"],["to put on","體重增加;上演","","He's put on a few pounds over the holidays.","他假期裡胖了幾磅。","","t"],["to put one's foot in","說錯話、做錯事出糗","","I really put my foot in it by mentioning her ex.","我提到她的前任,真是說錯話出了糗。","","t"],["to put out","熄滅火焰;使停止運作","","The firefighters quickly put out the small blaze.","消防員很快撲滅了那場小火。","","t"],["to put (someone) on","開玩笑地唬人、逗弄","","You won the lottery? You're putting me on!","你中樂透?你在唬我吧!","","t"],["to put together","組裝、拼裝","","It took an hour to put the shelf together.","組好那個書架花了一小時。","","t"],["to put up","忍受、容忍","","I can't put up with this noise any longer.","我再也受不了這噪音了。","","t"],["quite a few","為數不少、相當多","","Quite a few people showed up despite the rain.","儘管下雨,還是來了不少人。","","q"],["a rain check","改天再約(延後的邀約)","","I can't make dinner tonight — can I take a rain check?","今晚我沒法吃飯,改天再約好嗎?","","a"],["to read between the lines","領會言外之意","","Read between the lines and you'll see he's upset.","讀懂言外之意,你就會發現他不高興。","","t"],["to rely on","依賴、信賴","","You can rely on her to get the job done.","你可以信賴她把事情做好。","","t"],["right away","立刻、不拖延","","The manager promised to fix the problem right away.","經理答應馬上處理這個問題。","","r"],["to ring a bell","聽起來耳熟、有印象","","That name rings a bell, but I can't place it.","那個名字聽起來耳熟,但我想不起來。","","t"],["to rule out","排除、不予考慮","","The doctors ruled out any serious illness.","醫生排除了任何重症的可能。","","t"],["to run away","私自跑走、逃離","","The puppy ran away through the open gate.","小狗從敞開的門跑走了。","","t"],["to run into","巧遇;撞上","","I ran into an old friend at the airport.","我在機場巧遇一位老朋友。","","t"],["to run out of","耗盡、用光","","We ran out of milk this morning.","我們今早牛奶用完了。","","t"]],"S":[["單字","字義","圖片","例句","句義","音檔位置","字首"],["to save face","保住面子","","The deal let both sides save face.","這項協議讓雙方都保住了面子。","","t"],["to screw up","搞亂、弄糊塗;搞砸","","The last-minute changes screwed up our schedule.","臨時的更動把我們的行程搞亂了。","","t"],["search me","我不知道、我哪知道","","Why is the printer beeping? Search me.","印表機為什麼一直嗶?我哪知道。","","s"],["second to non itional crafts are dying out.","許多傳統工藝正逐漸失傳。","","t"],["to dish out","大量分發;數落人","","He can criticize others but can't take it when it's dished out to him.","他能數落別人,別人一說他就受不了。","","t"],["to do over","重做、重寫","","The essay was messy, so she did it over.","那篇作文太亂,她就重寫了一遍。","","t"],["to do without","沒有……也能將就","","We had to do without electricity for a day.","我們得將就過了一天沒電的日子。","","t"],["down to earth","腳踏實地、平易近人","","Despite her fame, she stays down to earth.","儘管出了名,她依然平易近人。","","d"],["to draw the line at","劃清界線、堅決不做","","I help with chores, but I draw the line at ironing.","我會幫忙做家事,但燙衣服我可不幹。","","t"],["to draw up","草擬、繪製(文件地圖)","","The lawyer will draw up the contract tomorrow.","律師明天會擬好合約。","","t"],["to dress up","打扮得體、穿正式服裝","","We dressed up for my sister's wedding.","我們為了姊姊的婚禮盛裝打扮。","","t"],["to drop off","睡著;順道送;減少","","I dropped off during the long lecture.","冗長的講座中我睡著了。","","t"],["to drop out of","中途退出、輟學","","He dropped out of college to start a business.","他大學輟學去創業。","","t"],["to drop (someone) a line","寫封短訊給某人","","Drop me a line when you get settled in.","你安頓好後寫封短訊給我。","","t"],["to dry out","逐漸晾乾;戒酒","","Hang the tent up so it can dry out.","把帳篷掛起來晾乾。","","t"],["dry run","排演、預演","","The crew did a dry run before opening night.","劇組在首演前做了一次彩排。","","d"],["to dry up","乾涸;枯竭","","The pond dried up during the drought.","旱災期間那口池塘乾涸了。","","t"],["to eat in/to eat out","在家吃/外出用餐","","We usually eat in on weeknights.","平日晚上我們通常在家吃。","","t"],["to end up","最後變成、結果落得","","We got lost and ended up at the wrong hotel.","我們迷了路,最後跑到錯的飯店。","","t"],["every other (one)","每隔一個、交替","","The dentist recommends a checkup every other month.","牙醫建議每隔一個月檢查一次。","","e"],["to face the music","承擔後果、面對現實","","He broke the vase and had to face the music.","他打破了花瓶,只好承擔後果。","","t"],["face-to-face","面對面、當面","","Let's discuss this face-to-face rather than by email.","這件事我們當面談,別用電子郵件。","","f"],["to fade away","逐漸消退、遠去","","The applause slowly faded away.","掌聲漸漸消散。","","t"],["to fall for","迅速愛上;受騙上當  we'll share one car.","我們暫時共用一輛車。","","f"],["from now on","從現在起、往後","","From now on, I'll double-check my work.","從今以後,我會把工作再檢查一遍。","","f"],["to get a rise out of","激得某人動怒或反應","","He teased her, hoping to get a rise out of her.","他捉弄她,想惹她動怒。","","t"],["to get along","有進展;(健康)過得如何","","How is your grandfather getting along?","你祖父近來過得如何?","","t"],["to get along with","與人相處融洽;順利應付","","She gets along with almost everyone at work.","她和公司裡幾乎每個人都處得來。","","t"],["to get away","逃脫、脫身","","The thief got away before the police arrived.","小偷在警察趕到前就逃走了。","","t"],["to get away with","逃過懲罰、僥倖矇混","","He thinks he can get away with cheating.","他以為作弊可以矇混過去。","","t"],["to get back","返回、回到原處","","What time did you get back from the office?","你幾點從辦公室回來的?","","t"],["to get better, worse, etc.","變得更好、更糟等","","His handwriting is getting better with practice.","他的字經過練習正在變好。","","t"],["to get by","勉強度日、應付得來","","On such a low salary, they can barely get by.","薪水這麼低,他們勉強才能過活。","","t"],["to get cold feet","臨陣退縮、打退堂鼓","","He got cold feet just before the interview.","面試前他臨陣退縮了。","","t"],["to get even with","報復、扯平","","He vowed to get even with the person who cheated him.","他發誓要向騙他的人報復。","","t"],["to get in touch with","與某人取得聯繫","","I'll get in touch with the supplier tomorrow.","我明天會聯絡供應商。","","t"],["to get in/to get on","進入或搭上車輛、交通工具","","Hurry and get on the train — it's about to leave.","快上火車,它就要開了。","","t"],["to get lost","迷路;走開別煩","","We got lost trying to find the trailhead.","我們找登山口時迷了路。","","t"],["to get off one's chest","一吐為快、傾吐心事","","Talking to a friend helped her get it off her chest.","跟朋友聊過後,她把心事一吐為快。","","t"],["to get on one's nerves","惹惱、使人心煩","","His constant humming gets on my nerves.","他不停哼歌讓我心煩。","","t"],["to get out from under","擺脫財務困境","","After years of saving, they got out from under their loans.","存了多年後,他們終於擺脫了貸款。","","t"],["to get out of hand","失控","","The party got out of hand after midnight.","那場派對過了午夜就失控了。","","t"],["to get out of line","違規、逾矩","","Any player who g s feelings.","她說了個善意的謊,以免傷他的心。","","a"],["to work out","健身;想出(辦法)","","He works out at the gym three times a week.","他每週上健身房三次。","","t"],["would rather","寧可、比較願意","","I'd rather stay home than sit in traffic.","我寧願待在家也不想塞在車陣裡。","","w"]]};
   let questions = allSheetData[Object.keys(allSheetData)[0]];
   let currentQuestions = [];
   let currentIndex = 0;
   let correctCount = 0;
   let wrongCount = 0;
   let timeLeft = 0;
   let timer;
   let fontSize = 20;
   let wrongAnswers = [];
   let startTime;
   let canProceed = false;
   let endTime; // 新增變數記錄結束時間
   let quizRangeText = ''; // 新增：記錄測驗範圍文字
   
   function init() {
	  const sheetSelect = document.getElementById('sheetSelect');
	  ["A、U、W","B","C、D","E、F","G","H、I、J","K、L","M、N、O","P、Q、R","S","T","ALL"].forEach(name => {
		const option = document.createElement('option');
		option.value = option.text = name;
		sheetSelect.add(option);
	  });
	  
	  sheetSelect.value = Object.keys(allSheetData)[0];
		questions = allSheetData[sheetSelect.value];
		document.getElementById('startRow').value = 1;
		// 扣除標題列
		document.getElementById('endRow').value = questions.length - 1;
		
		sheetSelect.addEventListener('change', function() {
			questions = allSheetData[this.value];
			document.getElementById('endRow').value = questions.length - 1;
		});
	}
   
   function startQuiz() {
    const timeLimit = document.getElementById('timeSelect').value * 60;
    const startRow = parseInt(document.getElementById('startRow').value);
    const endRow = parseInt(document.getElementById('endRow').value);
    
    if (isNaN(startRow) || isNaN(endRow) || startRow > endRow || endRow > questions.length) {
      alert('請輸入有效的題目範圍');
      return;
    }
    
    currentQuestions = prepareQuestions(startRow-1, endRow-1);

    // 讀取隨機題數（可留空）。因為 prepareQuestions 已經打亂順序，
    // 取前 N 筆即等於隨機抽 N 題
    const randomCount = parseInt(document.getElementById('randomCount').value);
    if (!isNaN(randomCount) && randomCount > 0) {
      currentQuestions = currentQuestions.slice(0, randomCount);
      quizRangeText = '隨機 ' + currentQuestions.length + ' 題（取自第 ' + startRow + '～' + endRow + ' 題）';
    } else {
      quizRangeText = '第 ' + startRow + '～' + endRow + ' 題';
    }

    if (currentQuestions.length === 0) {
      alert('無法取得題目');
      return;
    }
    
    currentIndex = 0;
    correctCount = wrongCount = 0;
    wrongAnswers = [];
    startTime = new Date();
    endTime = new Date(startTime.getTime() + timeLimit * 1000);
    canProceed = false;
    
    document.getElementById('setup').classList.add('hidden');
    document.getElementById('quiz').classList.remove('hidden');
    document.getElementById('result').classList.add('hidden');
    document.getElementById('feedback').innerHTML = '';
    document.getElementById('nextBtn').disabled = true;
    
    updateTimer();
    timer = setInterval(updateTimer, 1000);
    
    showQuestion();
  }
   
   function updateTimer() {
	  const now = new Date();
	  const remainingTime = Math.floor((endTime - now) / 1000);
	  
	  if (remainingTime <= 0) {
		endQuiz();
		return;
	  }
	  
	  const minutes = Math.floor(remainingTime / 60);
	  const seconds = remainingTime % 60;
	  document.getElementById('timer').textContent = 
		'剩餘時間: ' + minutes + ':' + String(seconds).padStart(2, '0');
	}
   
   function prepareQuestions(start, end) {
    // 確保排除標題列
		const startIndex = start + 1;  // +1 是因為要從第二列開始
		const endIndex = end + 2;      // +2 是因為要包含結束列，且 slice 是 exclusive
		const rangeQuestions = questions.slice(startIndex, endIndex);
		return rangeQuestions.sort(() => Math.random() - 0.5);
	}
   
   function adjustFontSize(change) {
	  fontSize = Math.max(14, Math.min(24, fontSize + change));

	  // 調整問題文字大小
	  const questionText = document.getElementById('questionText');
	  if (questionText) {
		questionText.style.fontSize = (fontSize + 4) + 'px';
	  }

	  // 調整所有選項文字大小
	  const options = document.getElementsByClassName('option');
	  for (let option of options) {
		option.style.fontSize = (fontSize + 2) + 'px';
	  }

	  // 調整其他元素
	  const timer = document.getElementById('timer');
	  if (timer) {
		timer.style.fontSize = (fontSize + 2) + 'px';
	  }

	  const progress = document.getElementById('progress');
	  if (progress) {
		progress.style.fontSize = fontSize + 'px';
	  }

	  // 調整工作表名稱
	  const sheetTitle = document.getElementById('sheetTitle');
	  if (sheetTitle) {
		sheetTitle.style.fontSize = fontSize + 'px';
	  }

	  // 調整答案回饋
	  const feedback = document.getElementById('feedback');
	  if (feedback) {
		feedback.style.fontSize = fontSize + 'px';
	  }
	}
   
   function showQuestion() {
    if (currentIndex >= currentQuestions.length) {
      endQuiz();
      return;
    }

    const question = currentQuestions[currentIndex];
    document.getElementById('questionText').innerHTML = 
      '<span style="color: #0066CC;">Which is：</span>' + question[1]; // 改用 question[1] (B欄)
    document.getElementById('sheetTitle').textContent = document.getElementById('sheetSelect').value;

	 const correctAnswer = question[0];// 改用 question[0] (A欄)
	 const explanation = question[2] || '';
	 
	 // 修改這部分，從第二列開始抓取答案選項
    let wrongOptions = questions
      .slice(1)  // 從第二列開始
      .filter(q => q[0] !== correctAnswer && q[0])  // 過濾掉正確答案和空值
      .map(q => q[0])  
      .sort(() => Math.random() - 0.5)
      .slice(0, 3);
	 
	 const options = [correctAnswer, ...wrongOptions].sort(() => Math.random() - 0.5);
	 
	 const optionsContainer = document.getElementById('options');
	 optionsContainer.innerHTML = '';
	 options.forEach((option, index) => {
	   const div = document.createElement('div');
	   div.className = 'option';
	   div.textContent = option;
	   div.onclick = () => checkAnswer(option, correctAnswer, explanation);
	   optionsContainer.appendChild(div);
	 });
	 
	 document.getElementById('progress').textContent = 
	   (currentIndex + 1) + '/' + currentQuestions.length + '題 | 答對:' + correctCount + ' | 答錯:' + wrongCount;
	 
	 document.getElementById('feedback').innerHTML = '';
	 document.getElementById('nextBtn').disabled = true;
	 canProceed = false;
	}
   
   function checkAnswer(selected, correct, explanation) {
     if (canProceed) return;
     
     const isCorrect = selected === correct;
     if (isCorrect) {
       correctCount++;
     } else {
       wrongCount++;
       wrongAnswers.push({
         question: currentQuestions[currentIndex][1],// 改用 [1] (B欄)
         selected: selected,
         correct: correct,
         explanation: explanation
       });
     }
     
     document.getElementById('feedback').innerHTML = 
       '<div class="' + (isCorrect ? 'correct' : 'incorrect') + '">' +
       (isCorrect ? '答對了！' : '答錯了！') +
       '<br>正確答案：' + correct +
       (explanation ? '<br>解釋：' + explanation : '') +
       '</div>';
     
     document.getElementById('nextBtn').disabled = false;
     canProceed = true;
     
     document.getElementById('progress').textContent = 
       '題目 ' + (currentIndex + 1) + '/' + currentQuestions.length + ' | 答對: ' + correctCount + ' | 答錯: ' + wrongCount;
   }
   
   function nextQuestion() {
     if (!canProceed) return;
     currentIndex++;
     showQuestion();
   }
   
   
   function endQuiz() {
    clearInterval(timer);
    const endTime = new Date();
    const duration = Math.floor((endTime - startTime) / 1000);
    
    // 計算答對率百分比
    const finalScore = Math.round((correctCount / currentQuestions.length) * 100) || 0;
    
    document.getElementById('quiz').classList.add('hidden');
    document.getElementById('result').classList.remove('hidden');
    
    let resultHTML = 
        '<h2>' + document.getElementById('sheetSelect').value + ' 測驗結果</h2>' +
        '<p>測驗日期時間: ' + endTime.toLocaleString() + '</p>' +
        '<p>測驗範圍: ' + quizRangeText + '</p>' +
        '<p>測驗時間: ' + Math.floor(duration/60) + '分' + duration%60 + '秒</p>' +
        '<p>總題數: ' + currentQuestions.length + '</p>' +
        '<p>答對題數: ' + correctCount + '</p>' +
        '<p>答錯題數: ' + wrongCount + '</p>' +
        '<p>得分: ' + finalScore + ' 分</p>';  // 顯示百分比分數
     
     if (wrongAnswers.length > 0) {
       resultHTML += '<h3>答錯題目回顧：</h3>';
		  wrongAnswers.forEach((item, index) => {
			resultHTML += 
			  '<div class="review-item">' +
			  '<p class="review-question">題目 ' + (index + 1) + ': ' + item.question + '</p>' +
			  '<p class="review-wrong">您的答案: ' + item.selected + '</p>' +
			  '<p class="review-correct">正確答案: ' + item.correct + '</p>' +
			  (item.explanation ? '<p class="review-explanation">解釋: ' + item.explanation + '</p>' : '') +
			  '</div>';
		  });
     }
     
     document.getElementById('result').innerHTML = resultHTML;
   }
   
   function adjustFontSize(change) {
     fontSize = Math.max(14, Math.min(24, fontSize + change));
     document.body.style.fontSize = fontSize + 'px';
   }
 </script>

<body onload="init()">
 <div id="quizContainer">
   <div id="setup">
     <h1>555 Idioms Test</h1>
     <div class="control-panel">
       <label>選擇測驗範圍：</label>
       <select id="sheetSelect"></select>
     </div>
     <div class="control-panel">
       <label>起始題號：</label>
       <input type="number" id="startRow" min="1">
       <label>結束題號：</label>
	   <input type="number" id="endRow" min="1">
     </div>
     <div class="control-panel">
       <label>隨機題數：</label>
       <input type="number" id="randomCount" min="1" placeholder="留空＝依範圍出題">
     </div>
     <div class="control-panel">
       <label>測驗時間：</label>
       <select id="timeSelect">
         <option value="5">5分鐘</option>
         <option value="10">10分鐘</option>
		 <option value="15">15分鐘</option>
       </select>
     </div>
     <div class="control-panel">
       <label>字體大小：</label>
       <button onclick="adjustFontSize(-2)">A-</button>
       <button onclick="adjustFontSize(2)">A+</button>
     </div>
     <button onclick="startQuiz()">開始測驗</button>
   </div>
   
   <div id="quiz" class="hidden">
    <div class="status-bar">
	  <div class="status-item sheet-name" id="sheetTitle"></div>
	  <div class="status-item timer" id="timer"></div>
	  <div class="status-item progress" id="progress"></div>
	  <div class="font-controls">
		<button onclick="adjustFontSize(-2)">A-</button>
		<button onclick="adjustFontSize(2)">A+</button>
	  </div>
	</div>
    
    <div id="questionText"></div>
    <div id="options"></div>
    <div id="feedback"></div>
    <button id="nextBtn" onclick="nextQuestion()" class="next-btn" disabled>下一題</button>
  </div>
  
  <div id="result" class="hidden"></div>
</div>
</body>
